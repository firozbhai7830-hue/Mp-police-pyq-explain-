त मस्तान शाह वली (बाबा साहब) की प्रसिद्ध दरगाह है।","प्रतिवर्ष यहाँ लगने वाला उर्स सांप्रदायिक सद्भाव का प्रतीक माना जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश उच्च न्यायालय की स्थायी पीठें इंदौर और ग्वालियर में कब स्थापित की गई थीं?","o":["1 नवम्बर 1956","15 अगस्त 1947","28 नवम्बर 1968","1 नवम्बर 2000"],"a":2,"e":["मध्य प्रदेश उच्च न्यायालय की मुख्य पीठ जबलपरु के इटालियन वास्तकु ला वाल े भवन (गावे फु लदास महल) म ंे स्थित ह।ै","इंदौर एवं ग्वालियर में इसकी स्थायी खंडपीठें 28 नवम्बर, 1968 को स्थापित हुइ±।","इससे मालवा तथा चंबल-ग्वालियर क्षेत्र के वादकारियों को सुविधा मिली।","1 नवम्बर, 1956 को राज्य पुनर्गठन के साथ मध्य प्रदेश का गठन हुआ था।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"1 नवम्बर, 2000 को मध्य प्रदेश उच्च न्यायालय को प्रभावित करने वाला प्रमुख परिवर्तन क्या हुआ?","o":["उच्च न्यायालय को समाप्त कर दिया गया।","छत्तीसगढ़ राज्य का गठन हुआ, और छत्तीसगढ़ उच्च न्यायालय बिलासपुर में स्थापित किया गया।","उच्च न्यायालय को नागपुर स्थानांतरित कर दिया गया।","इंदौर और ग्वालियर की पीठों को बंद कर दिया गया।"],"a":1,"e":["1 नवम्बर, 2000 को मध्य प्रदेश पुनर्गठन अधिनियम, 2000 के तहत छत्तीसगढ़ 26वाँ राज्य बना।","इसके साथ ही छत्तीसगढ़ के लिए पृथक उच्च न्यायालय बिलासपुर में स्थापित हुआ। इसके फलस्व:प मध्य प्रदेश उच्च न्यायालय का क्षेत्राधिकार घटकर शेष मध्य प्रदेश तक सीमित रह गया।","मध्य प्रदेश में जबलपुर मुख्य पीठ तथा इंदौर-ग्वालियर की खंडपीठें यथावत बनी रहीं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"कलगीतुर्रा गीतों में निम्नलिखित में से किस स्रोत की सामग्री शामिल हो सकती है?","o":["केवल वेद","पश्चिमी लोककथाएं","महाभारत, पुराण और समसामयिक घटनाएं","केवल आदिवासी अनुष्ठान"],"a":2,"e":["कलगी-तुर्रा मालवा-निमाड़ क्षेत्र की प्रसिद्ध लोक गायन प्रतिस्पर्धा शैली है।","इसमें कलगी (शक्ति/पार्वती) और तुर्रा (शिव) पक्ष के गायक आमने-सामने गाते हैं।","इनके गीतों में महाभारत, रामायण, पुराणों की कथाओं के साथ समसामयिक विषय भी आते हैं।","यह लोक परंपरा प्रश्नोत्तर शैली में दार्शनिक एवं सामाजिक विषयों को प्रस्तुत करती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में भीमगढ़ बांध किस जिले में स्थित है?","o":["खंडवा","सिवनी","शहडोल","मंदसौर"],"a":1,"e":["भीमगढ़ बांध, जिसे संजय सरोवर भी कहा जाता है, सिवनी जिले (जिसे मध्य प्रदेश का ‘लखनऊ’ भी कहा जाता है) में स्थित है।","यह गोदावरी अपवाह तंत्र की प्रमुख वैनगंगा नदी पर निर्मित एक मृदा (मिट्टी) बांध है।","यह एशिया के सबसे बड़े मिट्टी के बांधों में गिना जाता है।","इससे सिवनी एवं आसपास के क्षेत्रों में सिंचाई सुविधा उपलब्ध होती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में राजघाट बांध आधिकारिक रूप से किस वर्ष में खोला गया था?","o":["1992","2006","1960","2007"],"a":1,"e":["राजघाट बांध मध्य प्रदेश (अशोकनगर/ चंदेरी) एवं उत्तर प्रदेश (ललितपुर) की सीमा पर बेतवा नदी पर स्थित एक महत्वपूर्ण अंतरराज्यीय संयुक्त परियोजना है।","इसका जलाशय रानी लक्ष्मीबाई सागर के नाम से जाना जाता है।","बेतवा नदी बोर्ड के अधीन निर्मित यह बांध वर्ष 2006 में औपचारिक रूप से प्रारंभ हुआ।","इससे सिंचाई के साथ जल विद्युत उत्पादन भी किया जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मौसमी वर्षा के योगदान के संदर्भ में, मध्य प्रदेश में अधिकांश वर्षा किस मौसम में होती है?","o":["ग्रीष्मकाल (मार्च-जून)","दक्षिण-पश्चिम मानसनू (जनू -सितबं र)","शीतकाल (नवंबर-फरवरी)","मानसून के बाद (अक्टूबर)"],"a":1,"e":["मध्य प्रदेश की जलवायु ‘उष्णकटिबंध्ीय 157 मानसूनी’ है। प्रदेश में लगभग 90% वर्षा दक्षिण-पश्चिम मानसून (जून से सितंबर) के दौरान होती है।","यह मानसून जून के मध्य से सितंबर तक सक्रिय रहता है।","बंगाल की खाड़ी एवं अरब सागर दोनों शाखाओं से राज्य में वर्षा होती है।","प्रदेश में सबसे अध्कि वर्षा पचमढ़ी (महादेव पहाड़ियों) में दर्ज की जाती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में भोपाल रियासत पर किस अफगान जनरल के वंशजों का शासन था?","o":["शेर शाह सूरी","दोस्त मोहम्मद खान","अहमद शाह अब्दाली","महमुद गजनी"],"a":1,"e":["भोपाल रियासत की स्थापना 18 वीं शताब्दी के प्रारंभ में दोस्त मोहम्मद खान ने की।","वे मूलतः अफगानिस्तान के तिराह क्षेत्र से आए पठान सैनिक थे।","पहले वे मुगल सेना में रहे, बाद में उन्होंने भोपाल में स्वतंत्र राज्य स्थापित किया।","बाद में यहाँ चार बेगमों – कुदसिया, सिकंदर, शाहजहाँ व सुल्तान जहाँ ने भी शासन किया।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"1956 के पुनर्गठन के दौरान मध्य प्रदेश के साथ किन राज्यों का मामूली सीमा समायोजन हुआ था?","o":["महाराष्ट्र और गोवा","गुजरात, राजस्थान और उत्तर प्रदेश","पंजाब और हरियाणा","केरल और कर्नाटक"],"a":1,"e":["1 नवम्बर, 1956 को राज्य पुनर्गठन अधिनियम से नए मध्य प्रदेश का गठन हुआ।","इसमें महाकौशल, मध्य भारत, विंध्य प्रदेश तथा भोपाल राज्य मिलाए गए।","इस दौरान पड़ोसी राज्यों गुजरात, राजस्थान एवं उत्तर प्रदेश के साथ सीमाओं का मामूली समायोजन किया गया।","मराठी भाषी विदर्भ क्षेत्र बॉम्बे राज्य को हस्तांतरित कर दिया गया।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य भारत इकाई किस वर्ष गठित की गई थी?","o":["1947","1948","1950","1952"],"a":1,"e":["मध्य भारत संघ का गठन वर्ष 1948 में हुआ था।","इसमें ग्वालियर, इंदौर सहित मालवा क्षेत्र की लगभग 25 रियासतें सम्मिलित की गइ±।","ग्वालियर एवं इंदौर क्रमशः शीतकालीन तथा ग्रीष्मकालीन राजधानी बनाए गए।","1956 के पुनर्गठन में यह इकाई नए मध्य प्रदेश में विलीन कर दी गई।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"चन्द्रशेखर आ”ााद किन वर्षों के दौरान क्रांतिकारी गतिविधियों में सक्रिय रूप से शामिल थे?","o":["1915-1920","1926-1931","1935-1940","1942-1947"],"a":1,"e":["चंद्रशेखर आ”ााद का जन्म 1906 में झाबुआ जिले के भाबरा गाँव (वर्तमान अलीराजपुर, मध्य प्रदेश) में हुआ।","1925 के काकोरी ट्रेन एक्शन के बाद वे हिंदुस्तान रिपब्लिकन एसोसिएशन के प्रमुख चेहरे बने।","1928 में उन्होंने भगत सिंह व अन्य सहयोगियों के साथ इसका पुनर्गठन कर इसे ‘हिंदुस्तान सोशलिस्ट रिपब्लिकन एसोसिएशन’ (HSRA) नाम दिया तथा सांडर्स की हत्या में मुख्य भूमिका निभाई।","27 फरवरी, 1931 को इलाहाबाद के अल्प्रफेड पार्क में उन्होंने अपना बलिदान दिया।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"अक्टूबर 2025 में मध्य प्रदेश के मुख्यमंत्री कौन हैं?","o":["श्री कैलाश विजयवर्गीय","डॉ- मोहन यादव","श्री राजेन्द्र शुक्ला","श्री जगदीश देवड़ा"],"a":1,"e":["डॉ- मोहन यादव ने 13 दिसंबर, 2023 को मध्य प्रदेश के मुख्यमंत्री पद की शपथ ली।","वे उज्जैन दक्षिण विधानसभा क्षेत्र से विधायक हैं।","राजेन्द्र शुक्ला एवं जगदीश देवड़ा राज्य के उपमुख्यमंत्री हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"राजेन्द्र सागर (नागदा नाला) मध्यम सिंचाई परियोजना, मध्य प्रदेश में किस नदी घाटी पर स्थित है?","o":["नर्मदा","गोदावरी","गंगा","माही"],"a":2,"e":["राजेन्द्र सागर (नागदा नाला) मध्यम सिंचाई परियोजना टीकमगढ़ जिले में स्थित है। यह गंगा अपवाह तंत्र का अभिन्न भाग है।","मध्य प्रदेश के उत्तरी भाग की चंबल, बेतवा, केन आदि नदियाँ यमुना के माध्यम से गंगा में मिलती हैं।","अतः इन उपनदियों/नालों पर बनी परियोजनाएँ गंगा बेसिन में गिनी जाती हैं।","यह परियोजना ध्सान/बेतवा नदी प्रणाली की सहायक नदियों पर बनी है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में इंदिरासागर बांध की स्थापित विद्युत उत्पादन क्षमता क्या है?","o":["500 मेगावाट","750 मेगावाट","1000 मेगावाट","1200 मेगावाट"],"a":2,"e":["इंदिरा सागर परियोजना खंडवा जिले के पुनासा गाँव में नर्मदा नदी पर स्थित है।","इसकी स्थापित जल विद्युत उत्पादन क्षमता 1000 मेगावाट ( 8 × 125 मेगावाट) है।","यह मध्य प्रदेश की सबसे बड़ी जल विद्युत परियोजना है।","इसकी आधरशिला 23 अक्टूबर, 1984 को तत्कालीन प्रधनमंत्री श्रीमती इंदिरा गांध्ी द्वारा रखी गई थी।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में स्थित गांधीसागर बांध की अनुमानित लंबाई कितनी है?","o":["653 मीटर","514 मीटर","450 मीटर","700 मीटर"],"a":1,"e":["गांधीसागर बांध मंदसौर जिले की भानपुरा तहसील में चंबल नदी पर बना है।","यह चंबल घाटी परियोजना के पहले चरण (आधरशिला वर्ष 1954, उद्घाटन वर्ष 1960) के तहत बना प्रदेश का पहला और चंबल नदी का सबसे बड़ा बांध है।","इस चिनाई बांध की लंबाई लगभग 514 मीटर तथा ऊँचाई लगभग 62 मीटर है। 158","इससे 115 मेगावाट जल विद्युत उत्पादन के साथ व्यापक सिंचाई भी होती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में स्थित उर्मिल आरबीसी सिंचाई परियोजना किस नदी घाटी का हिस्सा है?","o":["नर्मदा","गोदावरी","गंगा","तापी"],"a":2,"e":["उर्मिल सिंचाई परियोजना मध्य प्रदेश के छतरपुर जिले में उर्मिल नदी (केन नदी की सहायक) पर स्थित है। यह मध्य प्रदेश और उत्तर प्रदेश सरकार की एक संयुक्त अंतरराज्यीय परियोजना है। उर्मिल नदी केन नदी की सहायक नदी है।","केन नदी आगे चलकर यमुना में तथा यमुना गंगा में मिलती है।","अतः उर्मिल आरबीसी सिंचाई परियोजना गंगा नदी बेसिन का भाग है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में ग्रीष्मकाल में सबसे अधिक दैनिक तापमान परिवर्तन किस क्षेत्र में होता है?","o":["मंडला और जबलपुर","ग्वालियर और दतिया","बालाघाट और सिवनी","सीधी और रीवा"],"a":1,"e":["ग्वालियर एवं दतिया मध्य प्रदेश के उत्तरी भाग में स्थित हैं, जहाँ अर्ध-शुष्क एवं महाद्वीपीय जलवायु पाई जाती है।","इस क्षेत्र में वनावरण कम तथा आद्र्रता न्यून होने से दिन में तीव्र गर्मी और रात में ते”ाी से ताप गिरता है।","इसी कारण यहाँ ग्रीष्मकाल में दैनिक तापांतर सर्वाधिक रहता है।","इसके विपरीत बालाघाट, सिवनी, मंडला जैसे वनाच्छादित एवं अधिक आद्र्र क्षेत्रों में तापांतर कम रहता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में सिविल सेवा प्रोत्साहन योजना के तहत लाभ प्राप्त करने के लिए आवेदक को आवेदन कहाँ जमा करना चाहिए?","o":["यूपीएससी कार्यालय","एमपीपीएससी कार्यालय","जिला कलेक्टर / सहायक आयुक्त / जिला समन्वयक, आदिवासी कल्याण विभाग","राज्य सचिवालय"],"a":2,"e":["मध्य प्रदेश की सिविल सेवा प्रोत्साहन योजना अनुसूचित जाति/जनजाति वर्ग के अभ्यर्थियों को प्रतियोगी परीक्षाओं की तैयारी हेतु आर्थिक सहायता देती है।","इस योजना का क्रियान्वयन जनजातीय कार्य/आदिवासी कल्याण विभाग द्वारा जिला स्तर पर किया जाता है।","अतः आवेदन जिला कलेक्टर, सहायक आयुक्त अथवा जिला समन्वयक (आदिवासी कल्याण विभाग) के कार्यालय में जमा किया जाता है।","यूपीएससी, एमपीपीएससी या राज्य सचिवालय इस योजना के आवेदन प्राप्त करने वाली संस्थाएँ नहीं हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश के उत्तर और मध्य भागों में निम्नलिखित में से कौन-सीे बोलियों के संयोजन एक साथ मिलने की सबसे अधिक संभावना है?","o":["निमाड़ी और मालवी","बघेली और मालवी","बुंदेली और बघेली","कोरकू और साठिया"],"a":2,"e":["बुंदेली बोली मध्य प्रदेश के उत्तरी भाग (सागर, छतरपुर, टीकमगढ़, दतिया, ग्वालियर क्षेत्र) में बोली जाती है।","बघेली बोली मध्य-पूर्वी भाग (रीवा, सतना, शहडोल, सीधी) की प्रमुख बोली है।","अतः उत्तरी एवं मध्य मध्य प्रदेश में ये दोनों बोलियाँ साथ-साथ मिलती हैं।","मालवी एवं निमाड़ी क्रमशः मालवा तथा निमाड़ (पश्चिमी/दक्षिण-पश्चिमी) क्षेत्र की बोलियाँ हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में कौन-सा जिला कोल जनजातियों का प्रमुख केंद्र नहीं है?","o":["रीवा","सतना","उज्जैन","शहडोल"],"a":2,"e":["कोल मध्य प्रदेश की एक प्रमुख जनजाति है, जिसकी सर्वाधिक जनसंख्या बघेलखंड (पूर्वी मध्य प्रदेश) क्षेत्र में पाई जाती है।","रीवा, सतना, शहडोल, सीधी एवं उमरिया इनके प्रमुख निवास-केंद्र हैं।","उज्जैन मालवा क्षेत्र में स्थित है, जहाँ कोल जनजाति का कोई प्रमुख संकेंद्रण नहीं है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में लोकरंजन महोत्सव में लोक नृत्यों की प्रस्तुति किस बात का प्रतीक है?","o":["एक राजनीतिक वक्तव्य","एक सांस्कृतिक मंच और आस्था की अभिव्यक्ति","एक व्यावसायिक आयोजन","एक खेल प्रतियोगिता"],"a":1,"e":["लोकरंजन मध्य प्रदेश का एक लोक-सांस्कृतिक आयोजन है जिसमें विभिन्न अंचलों के लोक नृत्य प्रस्तुत किए जाते हैं।","ये नृत्य समुदाय की परंपरा, लोक-आस्था तथा धार्मिक-सामाजिक विश्वासों से गहराई से जुड़े होते हैं।","अतः यहाँ इनकी प्रस्तुति एक सांस्कृतिक मंच एवं आस्था की सामूहिक अभिव्यक्ति का प्रतीक है।","यह आयोजन न तो व्यावसायिक है और न ही राजनीतिक या खेल-आधारित।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"1952 में भोपाल विधान सभा में कितने सदस्य शामिल थे?","o":["25","30","35","40"],"a":1,"e":["1952 में भोपाल एक पृथक ‘भाग-सी’ राज्य था, जिसकी अपनी विधान सभा गठित की गई थी।","इस भोपाल विधान सभा में कुल 30 सदस्य सम्मिलित थे।","भोपाल राज्य के प्रथम मुख्यमंत्री डॉ- शंकर दयाल शर्मा बने (जो बाद में भारत के 9वें राष्ट्रपति भी बने) थे।","1 नवंबर, 1956 को राज्य पुनर्गठन के अंतर्गत भोपाल का विलय नवगठित मध्य प्रदेश में कर दिया गया। 159"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में खजुराहो महोत्सव के दौरान नृत्य प्रस्तुतियों के साथ मुख्य रूप से किस प्रकार का संगीत बजाया जाता है?","o":["पश्चिमी शास्त्रीय संगीत","हिंदुस्तानी शास्त्रीय संगीत","जै”ा संगीत","पॉप संगीत"],"a":1,"e":["खजुराहो नृत्य महोत्सव मध्य प्रदेश के छतरपुर जिले में प्रतिवर्ष फरवरी-मार्च में आयोजित होता है।","इसकी शुरुआत वर्ष 1975 में हुई थी और यह मंदिर-परिसर की पृष्ठभूमि में आयोजित किया जाता है।","इसमें कथक, भरतनाट्यम, ओडिसी, कुचिपुड़ी, मणिपुरी आदि शास्त्रीय नृत्य प्रस्तुत किए जाते हैं।","इन प्रस्तुतियों के साथ मुख्यतः हिंदुस्तानी शास्त्रीय संगीत की संगत होती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में लोकरंग महोत्सव का आयोजन किस संस्था द्वारा किया जाता है?","o":["मध्य प्रदेश कला परिषद","मध्य प्रदेश आदिवासी लोक कला अकादमी","संस्कृति मंत्रालय","भारतीय सांस्कृतिक संबंध परिषद"],"a":1,"e":["लोकरंग महोत्सव का आयोजन मध्य प्रदेश आदिवासी लोक कला अकादमी द्वारा किया जाता है।","यह महोत्सव प्रतिवर्ष ठीक 26 जनवरी (गणतंत्र दिवस) से प्रारंभ होकर 5 दिनों तक भोपाल के ‘रवीन्द्र भवन’ परिसर में अत्यंत भव्यता के साथ आयोजित किया जाता है।","इसमें देश-विदेश के लोक एवं जनजातीय नृत्य, संगीत तथा शिल्प की प्रस्तुतियाँ होती हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में स्थित चंदोरा मध्यम सिंचाई परियोजना किस नदी घाटी द्वारा सेवित है?","o":["गंगा","नर्मदा","तापी","गोदावरी"],"a":2,"e":["चंदोरा मध्यम सिंचाई परियोजना मध्य प्रदेश की एक मध्यम श्रेणी की सिंचाई परियोजना है।","यह परियोजना तापी नदी घाटी (बेसिन) के अंतर्गत आती है (चंदोरा बांध बैतूल जिले में तापी नदी पर स्थित है)।","नर्मदा मध्य प्रदेश की जीवनरेखा है तथा राज्य की अधिकांश मध्यम-वृहद सिंचाई परियोजनाएँ इसी बेसिन में हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में तवा जलाशय बांध की विद्युत उत्पादन क्षमता कितनी है?","o":["13.5 मेगावाट","45 मेगावाट","520 मेगावाट","115 मेगावाट"],"a":0,"e":["तवा बांध नर्मदापुरम (पुराना नाम होशंगाबाद) जिले में तवा नदी पर बना है, जो नर्मदा की सहायक नदी है।","यह विशाल जलाशय सतपुड़ा टाइगर रि”ार्व, ‘बोरी वन्यजीव अभयारण्य’ और ‘पचमढ़ी बायोस्फीयर रिजर्व’ के घने जंगलों से घिरा हुआ है, जो इसे एक प्रमुख इको-टूरिज्म केंद्र बनाता है।","तवा जलाशय बांध की विद्युत उत्पादन क्षमता लगभग 13.5 मेगावाट है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में पीर बुधन मेले की अनुमानित आयु क्या है?","o":["100 वर्ष से कम","लगभग 150 वर्ष","250 वर्ष से अधिक","21 वीं सदी में स्थापित"],"a":2,"e":["पीर बुधन मेला मध्य प्रदेश का एक प्राचीन लोकमेला है, जिसे सांप्रदायिक सद्भाव का प्रतीक माना जाता है।","यह प्रतिवर्ष अगस्त-सितंबर माह में मध्य प्रदेश के ‘शिवपुरी’ जिले के ‘सांवरा’ क्षेत्र में आयोजित किया जाता है।","परंपरागत मान्यताओं के अनुसार इस मेले की आयु 250 वर्ष से भी अधिक आँकी जाती है।","इसमें हिंदू एवं मुस्लिम दोनों समुदायों के श्रद्धालु समान रूप से भाग लेते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"निम्नलिखित में से कौन-सी नदी युगल अमरकंटक पठार से उत्पन्न होती हैं?","o":["बेतवा और यमुना","केन और चंबल","नर्मदा और सोन","देनवा और तवा"],"a":2,"e":["अमरकंटक पठार अनूपपुर जिले में मैकाल श्रेणी पर स्थित है और इसे ‘तीर्थराज’ भी कहा जाता है।","यहीं से नर्मदा नदी निकलकर पश्चिम की ओर तथा सोन नदी निकलकर पूर्व की ओर प्रवाहित होती है।","जोहिला नदी (सोन की सहायक नदी) का उद्गम भी इसी क्षेत्र से होता है।","नर्मदा नदी अरब सागर में तथा सोन नदी गंगा में मिलती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"बरार क्षेत्र वर्तमान में भारत के किस राज्य का हिस्सा है?","o":["मध्य प्रदेश","महाराष्ट्र","छत्तीसगढ़","उत्तर प्रदेश"],"a":1,"e":["बरार (विदर्भ) क्षेत्र वर्तमान में महाराष्ट्र राज्य के अमरावती संभाग में स्थित है।","ब्रिटिश काल में यह ‘मध्य प्रांत एवं बरार’ का भाग था, जिसकी राजधानी नागपुर थी।","1956 के राज्य पुनर्गठन (फजल अली आयोग) के समय मराठी भाषी बरार क्षेत्र बंबई राज्य में मिलाया गया।","1960 में बंबई राज्य के विभाजन पर यह महाराष्ट्र का हिस्सा बना।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में संजा उत्सव के 18 वें दिन का क्या महत्व है?","o":["नए वर्ष की शुरुआत","उपवास का दिन","संजा को विदाई","फसल की शुरुआत"],"a":2,"e":["संजा मालवा-निमाड़ अंचल का लोकपर्व है, जिसे कुँवारी कन्याएँ मनाती हैं।","इसमें कन्याएँ गोबर से दीवार पर विविध आकृतियाँ बनाकर संजा देवी की पूजा एवं गीत-गायन करती हैं।","पर्व के अंतिम/ 18 वें दिन (किला कोट) संजा को विदाई दी जाती है और आकृतियों का विसर्जन किया जाता है। 160","अतः इस दिन का महत्व ‘संजा को विदाई’ से है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश से निम्नलिखित में से कौन-सा व्यक्तित्व पुरातत्व और कला में योगदान के लिए प्रसिद्ध है?","o":["डॉ- विष्णु श्रीधर वाकणकर","डी- जे- जोशी","भवानी प्रसाद मिश्र","कुमार गंधर्व"],"a":0,"e":["डॉ- विष्णु श्रीधर वाकणकर मध्य प्रदेश के विख्यात पुरातत्ववेत्ता एवं कलाविद् थे।, जिनका जन्म मध्य प्रदेश के नीमच जिले में हुआ था।","उन्होंने वर्ष 1957 में रायसेन जिले में भीमबेटका के प्रागैतिहासिक शैलाश्रयों की खोज की थी। भीमबेटका को वर्ष 2003 में यूनेस्को द्वारा ‘विश्व ध्रोहर स्थल’ घोषित किया गया।","इस योगदान के लिए उन्हें वर्ष 1975 ने पद्मश्री से सम्मानित किया गया।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश के भोपाल में ऊपरी और निचली झीलों को सामूहिक रूप से क्या नाम दिया गया है?","o":["टि्वन लेक्स","भोज झीलें","राजा भोज जलाशय","भोज आद्र्रभूमि"],"a":3,"e":["भोपाल की ऊपरी झील (बड़ा तालाब) एवं निचली झील (छोटा तालाब) को सामूहिक रूप से ‘भोज वेटलैंड’ कहा जाता है।","इसे वर्ष 2002 में रामसर स्थल के रूप में मान्यता प्रदान की गई थी। यह मध्य प्रदेश का ‘पहला रामसर स्थल’ है।","ऊपरी झील का निर्माण 11 वीं शताब्दी में परमार शासक राजा भोज द्वारा कराया गया माना जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में कपिलधारा मुख्य रूप से किस महान व्यक्ति से संबंधित है?","o":["ऋषि वाल्मीकि","संत कपिल","आदि शंकराचार्य","भगवान विष्णु"],"a":1,"e":["कपिलधारा जलप्रपात अनूपपुर जिले में अमरकंटक के निकट नर्मदा नदी पर स्थित है।","मान्यता है कि यहाँ महर्षि/संत कपिल ने तपस्या की थी, इसी कारण इसका नाम कपिलधारा पड़ा।","यह नर्मदा के उद्गम के बाद बनने वाला पहला प्रमुख जलप्रपात है।","इसकी ऊँचाई लगभग 100 फीट है और यह प्रमुख तीर्थ-पर्यटन स्थल है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में स्थित जोहिला मध्यम सिंचाई परियोजना किस नदी घाटी के अंतर्गत आती है?","o":["गोदावरी","गंगा","नर्मदा","तापी"],"a":1,"e":["जोहिला नदी का उद्गम अमरकंटक पठार क्षेत्र से होता है और यह शहडोल-उमरिया क्षेत्र में बहती है।","जोहिला सोन नदी की सहायक नदी है और सोन गंगा में मिलती है।","अतः जोहिला मध्यम सिंचाई परियोजना गंगा नदी घाटी (बेसिन) के अंतर्गत आती है।","इस परियोजना से शहडोल क्षेत्र में सिंचाई सुविधा उपलब्ध कराई जाती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में भीमगढ़ बांध की विशेष पहचान क्या है?","o":["भारत का सबसे ऊँचा बांध","एशिया का सबसे बड़ा मिट्टी/मृदा बांध","भारत का सबसे बड़ा कंक्रीट बांध","मध्य प्रदेश का सबसे पुराना बांध"],"a":1,"e":["भीमगढ़ बांध सिवनी जिले में वैनगंगा नदी पर बना है, जिसका जलाशय ‘संजय सरोवर’ कहलाता है।","यह एशिया का सबसे बड़ा मिट्टी (मृदा) से बना बांध माना जाता है।","इससे सिवनी, बालाघाट एवं आसपास के क्षेत्रों में सिंचाई सुविधा उपलब्ध होती है।","भारत का सबसे ऊँचा बांध टिहरी (उत्तराखंड) है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में राजघाट बांध की लंबाई कितनी है?","o":["514 मीटर","11200 मीटर","1020 मीटर","653 मीटर"],"a":1,"e":["राजघाट बांध बेतवा नदी पर मध्य प्रदेश एवं उत्तर प्रदेश की संयुक्त परियोजना के रूप में बना है।","इसके जलाशय को ‘रानी लक्ष्मीबाई सागर’ के नाम से जाना जाता है।","बांध की कुल लंबाई (मृदा बांध सहित) लगभग 11200 मीटर है।","इससे सिंचाई के साथ-साथ जलविद्युत उत्पादन भी किया जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश का कौन-सा जिला सबसे कम मेलों की मे”ाबानी करता है?","o":["जबलपुर","होशंगाबाद","टीकमगढ़","रायसेन"],"a":1,"e":["मध्य प्रदेश में लगभग 1,400 स्थानों पर मेलों का आयोजन होता है।","इनमें सर्वाधिक 227 मेले धर्मिक नगरी उज्जैन में तथा न्यूनतम केवल 13 मेले होशंगाबाद (नया नाम नर्मदापुरम) में लगते हैं।","अधिकांश मेले मार्च, अप्रैल एवं मई में आयोजित होते हैं, जब कृषि कार्य अपेक्षाकृत कम रहता है।","वर्षा ऋतु (जून–सितम्बर) में मेलों की संख्या न्यूनतम रहती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में मानसून के बारे में निम्नलिखित में से कौन-सा कथन गलत है?","o":["यह जून के मध्य में आता है।","यहाँ जून से सितम्बर तक वर्षा होती है।","इससे पूरे राज्य में एक समान वर्षा होती है।","पूर्वी जिलों में पश्चिमी जिलों की तुलना में अधिक वर्षा होती है।"],"a":2,"e":["मध्य प्रदेश में दक्षिण-पश्चिम मानसून सामान्यतः जून के मध्य में प्रवेश करता है और सितम्बर तक सक्रिय रहता है। 161","राज्य में वर्षा का वितरण अत्यंत असमान है, यह पूर्व से पश्चिम की ओर घटती जाती है।","बालाघाट, मंडला व डिंडोरी जैसे पूर्वी जिलों में अधिक तथा भिंड, मुरैना जैसे उत्तर-पश्चिमी जिलों में कम वर्षा होती है।","मध्य प्रदेश में औसत वर्षा लगभग 112 सेमी होती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में उज्जैन को ज्ञान का महान केंद्र क्यों कहा जाता है?","o":["वहाँ आधुनिक विश्वविद्यालय हैं।","यह प्राचीन विद्वानों और पौराणिक शिक्षा का केंद्र है।","यह ऑनलाइन शिक्षण प्लेटफॉर्म का केंद्र है।","वहाँ ब्रिटिश काल के विद्यालय थे।"],"a":1,"e":["उज्जैन (प्राचीन अवंतिका/उज्जयिनी) प्राचीन भारत का प्रमुख शिक्षा, ज्योतिष एवं धार्मिक केंद्र रहा है।","ऐसी मान्यता है कि यहाँ स्थित सांदीपनि आश्रम में श्रीकृष्ण, बलराम एवं सुदामा ने शिक्षा प्राप्त की थी।","वराहमिहिर, ब्रह्मगुप्त तथा महाकवि कालिदास जैसे विद्वान उज्जैन से जुड़े रहे हैं।","यहाँ राजा सवाई जयसिंह द्वारा 18वीं शताब्दी में स्थापित ‘जंतर-मंतर’ (वेध्शाला) स्थित है। भौगोलिक दृष्टि से कर्क रेखा उज्जैन से होकर गुजरती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में विक्रमादित्य निःशुल्क योजना का लाभ छात्र कैसे प्राप्त कर सकते हैं?","o":["विशेष प्रशिक्षण सत्रों में भाग लेकर","आवेदन पत्र जमा करके","शिक्षक की अनुशंसा द्वारा","आय के आधार पर स्वतः नामाकं न द्वारा"],"a":1,"e":["विक्रमादित्य निःशुल्क शिक्षा योजना मध्य प्रदेश उच्च शिक्षा विभाग द्वारा संचालित योजना है।","इसमें निर्धारित वार्षिक पारिवारिक आय सीमा से कम आय वाले सामान्य वर्ग के मेधावी विद्यार्थियों का महाविद्यालयीन शिक्षण शुल्क माफ किया जाता है।","इसका लाभ स्वतः नहीं मिलता ; विद्यार्थी को निर्धारित प्रपत्र में महाविद्यालय/पोर्टल के माध्यम से आवेदन पत्र जमा करना होता है।","आवेदन के साथ आय प्रमाण पत्र, मूल निवास तथा अंकसूची जैसे दस्तावे”ा संलग्न करने होते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"1952 में हुए आम चुनावों में मध्य भारत विधान सभा के लिए कुल कितनी सीटें निर्धारित/आरक्षित थीं?","o":["75","85","99","100"],"a":2,"e":["वर्ष 1948 में मालवा एवं आसपास की रियासतों के विलय से ‘मध्य भारत’ राज्य का गठन हुआ था।","इसकी ग्रीष्मकालीन राजधानी इंदौर 5-5 महीने के लिए तथा शीतकालीन राजधानी ग्वालियर 6-5 महीने के लिए थी।","1952 के प्रथम आम चुनाव में मध्य भारत विधान सभा हेतु कुल 99 सीटें निर्धारित की गई थीं।","1956 के राज्य पुनर्गठन में मध्य भारत, विंध्य प्रदेश एवं भोपाल को मिलाकर वर्तमान मध्य प्रदेश बना, जिसकी राजधानी भोपाल बनी।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"1950 में पुनर्गठन से पहले मध्य प्रांत और बरार राज्य में कौन-कौन-से क्षेत्र शामिल थे?","o":["वर्तमान मालवा और बुंदेलखंड","वर्तमान महाकौशल, छत्तीसगढ़ और महाराष्ट्र का बरार क्षेत्र","वर्तमान विंध्य और सतपुड़ा क्षेत्र","वर्तमान बुंदेलखंड और बरार क्षेत्र"],"a":1,"e":["ब्रिटिश काल में ‘मध्य प्रांत एवं बरार’ की राजधानी नागपुर थी।","इसमें वर्तमान महाकौशल (जबलपुर संभाग), छत्तीसगढ़ तथा महाराष्ट्र का बरार (विदर्भ) क्षेत्र सम्मिलित था।","1950 में पुनर्गठन के पश्चात इसे ‘मध्य प्रदेश’ नाम दिया गया और नागपुर ही राजधानी बनी रही।","1956 में मराठी भाषी बरार/विदर्भ क्षेत्र बंबई राज्य में सम्मिलित कर दिया गया।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"रानी लक्ष्मीबाई ने किस ऐतिहासिक घटना में महत्वपूर्ण भूमिका निभाई?","o":["प्लासी का युद्ध","1857 का स्वतंत्रता संग्राम","पानीपत का तीसरा युद्ध","प्रथम आंग्ल-मैसूर युद्ध"],"a":1,"e":["झाँसी की रानी लक्ष्मीबाई ने 1857 के स्वतंत्रता संग्राम में निर्णायक एवं वीरतापूर्ण भूमिका निभाई।","उन्होंने लॉर्ड डलहौ”ाी की ‘व्यपगत के सिद्धांत’ के अंतर्गत झाँसी के विलय का दृढ़ता से विरोध किया।","बाद में तात्या टोपे के साथ मिलकर उन्होंने ग्वालियर के किले पर अधिकार कर लिया।","17 जून, 1858 को ग्वालियर के निकट कोटा-की-सराय में अंग्रे”ाों से लड़ते हुए वे वीरगति को प्राप्त हुइ±। इनकी समाधि ग्वालियर के फूलबाग में स्थित है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"ढोला-मा: की लोककथा मूल रूप से किस राज्य से संबंधित है?","o":["गुजरात","राजस्थान","मध्य प्रदेश","उत्तर प्रदेश"],"a":1,"e":["ढोला-मा: राजस्थान की सर्वाधिक प्रसिद्ध प्रेम लोककथा है।","यह पूगल की राजकुमारी मारवणी तथा नरवर के राजकुमार ढोला (साल्हकुमार) की प्रेम कथा पर आधारित है।","इस पर आधारित ‘ढोला-मा: रा दूहा’ डिंगल भाषा का अत्यंत प्रसिद्ध काव्य ग्रंथ है।","राजस्थानी लघुचित्रकला में ऊँट पर सवार ढोला-मा: का चित्रण एक लोकप्रिय विषय रहा है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"शंकर दयाल शर्मा भारत में किस पद पर थे?","o":["राष्ट्रपति","प्रधान मंत्री","महाराष्ट्र के राज्यपाल","भारत के मुख्य न्यायाधीश"],"a":0,"e":["डॉ- शंकर दयाल शर्मा भारत के 9वें 162 राष्ट्रपति थे, जिनका कार्यकाल वर्ष 1992 से 1997 तक रहा।","वे मध्य प्रदेश के भोपाल से संबंधित थे और भोपाल राज्य के मुख्यमंत्री भी रह चुके थे।","राष्ट्रपति बनने से पूर्व वे वर्ष 1987 से 1992 तक भारत के उपराष्ट्रपति रहे।","वे आंध्र प्रदेश, पंजाब तथा महाराष्ट्र के राज्यपाल के रूप में भी सेवाएँ दे चुके थे।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में कटनी जंक्शन का स्टेशन कोड क्या है?","o":["KTE","KND","KTI","KTN"],"a":0,"e":["मध्य प्रदेश के कटनी जंक्शन रेलवे स्टेशन का कोड ‘ KTE’ है।","यह पश्चिम मध्य रेलवे के जबलपुर मंडल का अत्यंत महत्वपूर्ण जंक्शन है।","कटनी में कटनी मुरवारा ( KMZ) तथा न्यू कटनी जंक्शन ( NKJ) जैसे अन्य स्टेशन भी स्थित हैं।","यह मुंबई–हावड़ा तथा उत्तर–दक्षिण रेलमार्गों को जोड़ने वाला प्रमुख रेल केंद्र है।","कटनी को मध्य प्रदेश की ‘चूना नगरी’ भी कहा जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"2025 में, मध्य प्रदेश में डॉ- भीमराव अंबेडकर मेधावी छात्र पुरस्कार योजना के तहत राज्य स्तर पर कक्षा 12 वीं बोर्ड परीक्षा में द्वितीय स्थान प्राप्त करने वाले (छात्र और छात्रा) को कितनी पुरस्कार राशि दी जाती है?","o":["10,000 रुपये","15,000 रुपये","20,000 रुपये","25,000 रुपये"],"a":2,"e":["डॉ- भीमराव अंबेडकर मेधावी छात्र पुरस्कार योजना अनुसूचित जाति वर्ग के मेधावी विद्यार्थियों के लिए संचालित है।","कक्षा 12 वीं में प्रदेश स्तर पर प्रथम स्थान पर ` 30,000, द्वितीय स्थान पर ` 20,000 तथा तृतीय स्थान पर ` 10,000 ( छात्र एवं छात्रा दोनों को अलग-अलग) दिए जाते हैं।","कक्षा 10 वीं में यह राशि क्रमशः ` 20,000, ` 15,000 एवं ` 10,000 निर्धारित है।","यह योजना अनुसूचित जाति विकास विभाग, मध्य प्रदेश द्वारा संचालित की जाती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"2025 में, मध्य प्रदेश में डॉ- भीमराव अंबेडकर मेधावी छात्र पुरस्कार योजना के तहत कक्षा 10 वीं और 12 वीं में राज्य स्तर पर शीर्ष 50 लड़कों और 50 लड़कियों को कितनी पुरस्कार राशि दी जाती है?","o":["500 रुपये प्रत्येक","1,000 रुपये प्रत्येक","2,000 रुपये प्रत्येक","5,000 रुपये प्रत्येक"],"a":1,"e":["इसी योजना के अंतर्गत कक्षा 10 वीं तथा 12 वीं दोनों में राज्य स्तर पर शीर्ष 50 बालक एवं 50 बालिकाओं को भी पुरस्कृत किया जाता है।","इन प्रत्येक विद्यार्थी को ` 1,000 की पुरस्कार राशि स्वीकृत की जाती है।","यह राशि प्रथम, द्वितीय एवं तृतीय स्थान के बड़े पुरस्कारों से अलग एवं अतिरिक्त होती है।","आवेदन जिला संयोजक/सहायक आयुक्त कार्यालय के माध्यम से निःशुल्क किया जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"कौन-सी नदी रीवा-पन्ना पठार और मध्य प्रदेश के विंध्य क्षेत्र दोनों से होकर बहती है?","o":["चंबल","नर्मदा","केन","तापी"],"a":2,"e":["केन नदी मध्य प्रदेश के कटनी जिले में विंध्याचल (कैमूर श्रेणी) से निकलती है।","यह पन्ना एवं छतरपुर जिलों से होकर बहती हुई उत्तर प्रदेश के बांदा में यमुना नदी में मिल जाती है।","इस प्रकार यह रीवा-पन्ना पठार तथा विंध्य क्षेत्र दोनों से होकर प्रवाहित होती है।","केन नदी को ‘पन्ना राष्ट्रीय उद्यान की जीवन रेखा’ कहा जाता है। भारत की पहली महत्वाकांक्षी नदी जोड़ो परियोजना ‘केन-बेतवा लिंक परियोजना इसी से संबंध्ति है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश अपराध पीड़ित प्रतिकर योजना के तहत प्रतिकर (मुआव”ो) की सिफारिश करने के लिए कौन-सी प्राधिकृत संस्था जिम्मेदार है?","o":["ग्राम पंचायत","पुलिस थाना","विचारण न्यायालय, अपीलीय न्यायालय, उच्च न्यायालय या जिला एवं सत्र न्यायालय जो दंड प्रक्रिया संहिता की धारा 357-K(4) के तहत अधिकार क्षेत्र का प्रयोग करता है।","जिला कलेक्टर"],"a":2,"e":["मध्य प्रदेश अपराध पीड़ित प्रतिकर योजना अपराध से पीड़ित व्यक्तियों/आश्रितों को आर्थिक सहायता उपलब्ध कराती है।","प्रतिकर की सिफारिश संबंधित विचारण न्यायालय, अपीलीय न्यायालय, उच्च न्यायालय अथवा जिला एवं सत्र न्यायालय द्वारा की जाती है।","ये न्यायालय दंड प्रक्रिया संहिता की धारा 357-K(4) के अंतर्गत अधिकारिता का प्रयोग करते हैं।","सिफारिश प्राप्त होने पर जिला/राज्य विधिक सेवा प्राधिकरण मुआव”ो की राशि निर्धारित करता है। इसमें ग्राम पंचायत, थाना या कलेक्टर को यह अधिकार नहीं है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश के बुंदेलखंड पठार की सामान्य ढलान किस दिशा में है?","o":["दक्षिण","पूर्व","पश्चिम","उत्तर"],"a":3,"e":["मध्य प्रदेश का बुंदेलखंड पठार विंध्यन श्रेणी के उत्तर में स्थित है।","इस पठार का सामान्य ढाल दक्षिण से उत्तर की ओर है।","यही कारण है कि यहाँ बहने वाली बेतवा, धसान, केन आदि नदियाँ उत्तर दिशा में बहकर यमुना में मिलती हैं।","इसका निर्माण मुख्यतः प्राचीन ग्रेनाइट एवं नीस चट्टानों से हुआ है, जिससे यहाँ की मिट्टी कम उपजाऊ है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश की मैकाल पर्वतमाला किस बड़ी पर्वत श्रृंखला का हिस्सा है?","o":["विंध्य पर्वत श्रृंखला","पूर्वी घाट","सतपुड़ा पर्वत श्रृंखला","अरावली पर्वत श्रृंखला 163"],"a":2,"e":["मैकाल पर्वत श्रेणी सतपुड़ा पर्वत श्रृंखला का पूर्वी विस्तार मानी जाती है।","यह अनूपपुर, डिंडोरी एवं मंडला जिलों में पैफली हुई है।","इसी श्रेणी के अमरकंटक क्षेत्र से नर्मदा, सोन तथा जोहिला नदियों का उद्गम होता है।","मध्य प्रदेश की सर्वाेच्च चोटी ‘ध्ूपगढ़’ (1350 मीटर) है, जो महादेव पहाड़ियों (पचमढ़ी) में स्थित है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में नौरता उत्सव के दौरान घर के बाहर कौन-सी पारंपरिक सजावट की जाती है?","o":["पूफलों की मालाएं","चूना और रंगों से बनी रंगोली या जटिल डि”ााइन","लटकते हुए लालटेन","दीवारों पर चित्रकारी"],"a":1,"e":["नौरता (नवरात्रि) बुंदेलखंड क्षेत्र का लोकप्रिय लोकोत्सव है, जिसे विशेषकर कुँवारी कन्याएँ मनाती हैं।","इस अवसर पर घर के बाहर चूना, गे: तथा अन्य रंगों से जटिल ज्यामितीय रंगोली/ आकृतियाँ बनाई जाती हैं।","इन आकृतियों की पूजा करते हुए कन्याएँ लोकगीत गाती हैं और सुयोग्य वर की कामना करती हैं।","यह उत्सव मध्य प्रदेश की समृद्ध लोक-कला एवं लोक-परंपरा का महत्वपूर्ण अंग है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में करमा और सैली (सैला) नृत्य किस जनजाति से संबंधित हैं?","o":["बैगा","गोंड","भील","कोरकू"],"a":1,"e":["करमा तथा सैला मध्य प्रदेश एवं छत्तीसगढ़ की गोंड जनजाति के प्रमुख लोकनृत्य माने जाते हैं।","सैला नृत्य में पुरुष हाथों में डंडे लेकर वृत्ताकार रूप में नृत्य करते हैं ; महिलाओं द्वारा किए जाने वाले रूप को ‘रीना’ कहा जाता है।","करमा नृत्य ‘कर्म देवता’ की आराधना से जुड़ा है और यह दशहरे से वर्षा ऋतु के प्रारंभ तक चलता है।","बैगा एवं उराँव जनजातियाँ भी करमा नृत्य करती हैं, किंतु करमा-सैला का युग्म विशेष रूप से गोंड जनजाति से जोड़ा जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"कुमार गंधर्व विशेष रूप से निम्नलिखित के लिए जाने जाते थे-","o":["सारंगी प्रदर्शन","देवास से शास्त्रीय गायन संगीत में नवाचार","पुरातत्त्व","लोक गायन"],"a":1,"e":["कुमार गंधर्व (मूल नाम शिवपुत्र सिद्धरामैया कोमकली) प्रसिद्ध हिंदुस्तानी शास्त्रीय गायक थे।","स्वास्थ्य कारणों से वे मध्य प्रदेश के देवास में बस गए और वहीं से उन्होंने गायन में मौलिक प्रयोग किए।","उन्होंने मालवा की लोकधुनों को शास्त्रीय संगीत से जोड़ा तथा मालवती, अहिमोहिनी जैसे नए राग रचे।","उन्हें पद्म भूषण एवं पद्म विभूषण से सम्मानित किया गया था।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में आईआईटी इंदौर के स्थायी परिसर की आधारशिला किस केंद्रीय मंत्री ने रखी थी?","o":["डॉ- मुरली मनोहर जोशी","कपिल सिब्बल","श्री अर्जुन सिंह","रमेश पोखरियाल निशंक"],"a":2,"e":["आईआईटी इंदौर की स्थापना वर्ष 2009 में हुई और प्रारंभ में यह IET-DAVV के अस्थायी परिसर से संचालित हुआ।","इसके स्थायी परिसर (सिमरोल, खंडवा रोड) की आधारशिला 17 फरवरी, 2009 को तत्कालीन केंद्रीय शिक्षा मंत्री श्री अर्जुन सिंह ने रखी थी।","यह परिसर लगभग 501 एकड़ क्षेत्र में पैफला हुआ है और इंदौर शहर से लगभग 25 किमी दूर है।","संस्थान वर्ष 2015-16 से पूर्ण रूप से अपने स्थायी परिसर से संचालित हो रहा है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"निम्नलिखित में से कौन-सा विकल्प मध्य प्रदेश में मेलों के महत्व का सबसे अच्छा वर्णन करता है?","o":["वे केवल धार्मिक अनुष्ठानों के लिए आयोजित किए जाते हैं।","वे केवल प्रमुख पर्यटक आकर्षण हैं।","वे आर्थिक, सामाजिक और सांस्कृतिक पहलुओं को अनोखे रूप से जोड़ते हैं।","वे उद्योगों द्वारा आयोजित आधुनिक व्यावसायिक प्रदर्शनियाँ हैं।"],"a":2,"e":["मध्य प्रदेश के मेले केवल धार्मिक आयोजन नहीं, बल्कि बहुआयामी सामाजिक संस्थाएँ हैं।","इनमें स्थानीय हस्तशिल्प, पशु एवं कृषि उत्पादों का व्यापार होता है, जो आर्थिक पक्ष है।","भगोरिया, नागाजी, सिंहस्थ जैसे मेले जनजातीय एवं लोक संस्कृति के प्रदर्शन का मंच हैं।","इस प्रकार ये आर्थिक, सामाजिक एवं सांस्कृतिक तीनों आयामों को एक साथ जोड़ते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"1956 के पुनर्गठन के बाद कौन-सा शहर मध्य प्रदेश की नई राजधानी बना?","o":["नागपुर","जबलपुर","भोपाल","ग्वालियर"],"a":2,"e":["राज्य पुनर्गठन अधिनियम 1956 के तहत 1 नवंबर, 1956 को नए मध्य प्रदेश का गठन हुआ।","इसमें महाकौशल, मध्य भारत, विंध्य प्रदेश और भोपाल राज्य को मिलाया गया।","भोपाल को नवगठित राज्य की राजधानी बनाया गया, जबकि पूर्ववर्ती सी-पी- एंड बरार की राजधानी नागपुर थी।","जबलपुर में उच्च न्यायालय की मुख्य पीठ स्थापित की गई।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"छत्तीसगढ़ राज्य मध्य प्रदेश से कब अलग किया गया था?","o":["अक्टूबर 2000","नवंबर 2000","जनवरी 2001","दिसंबर 1999 164"],"a":1,"e":["मध्य प्रदेश पुनर्गठन अधिनियम 2000 के तहत 1 नवंबर, 2000 को छत्तीसगढ़ का गठन हुआ।","यह भारत का 26 वाँ राज्य बना और इसकी राजधानी रायपुर निर्धारित की गई।","मध्य प्रदेश के 16 जिले अलग होकर नए राज्य में सम्मिलित हुए।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"1952 के चुनावों के दौरान मध्य भारत विधान सभा में कितने एक सदस्यीय निर्वाचन क्षेत्र थे?","o":["59","20","75","40"],"a":0,"e":["1951-52 के प्रथम आम चुनाव में मध्य भारत विधान सभा की कुल सदस्य संख्या 99 थी।","इसमें 59 एक सदस्यीय तथा 20 द्वि-सदस्यीय निर्वाचन क्षेत्र सम्मिलित थे।","द्वि-सदस्यीय क्षेत्रों से दो-दो सदस्य चुने जाते थे ( 59 + 40 = 99) ।","द्वि-सदस्यीय निर्वाचन क्षेत्र प्रणाली को 1961 में समाप्त कर दिया गया।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में कौन-सा जनजातीय नृत्य स्वयं त्योहार के नाम पर रखा गया है?","o":["करमा","भगोरिया","लहंगी","थापटी"],"a":1,"e":["भगोरिया मध्य प्रदेश के झाबुआ, अलीराजपुर एवं धार क्षेत्र के भील-भिलाला जनजाति का प्रमुख पर्व है।","होली से पूर्व लगने वाले भगोरिया हाट-मेले में जो नृत्य किया जाता है, वह भी ‘भगोरिया’ कहलाता है।","इस प्रकार यह नृत्य सीधे उसी त्योहार के नाम से जाना जाता है।","इसमें ढोल, मांदल एवं बाँसुरी की धुन पर युवक-युवतियाँ सामूहिक नृत्य करते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"शिक्षा के क्षेत्र में मध्य प्रदेश सरकार का मुख्य उद्देश्य क्या है?","o":["शिक्षा के माध्यम से राजस्व बढ़ाना।","केवल शहरी क्षेत्रों में अधिक विश्वविद्यालयों का निर्माण करना।","केवल साक्षर नहीं, बल्कि शिक्षित राज्य बनना।","राज्य के सभी स्कूलों का निजीकरण करना।"],"a":2,"e":["मध्य प्रदेश की शिक्षा नीति का लक्ष्य केवल साक्षरता दर बढ़ाना नहीं है।","उद्देश्य गुणवत्तापूर्ण शिक्षा के माध्यम से राज्य को ‘शिक्षित राज्य’ बनाना है।","इसी दिशा में सी-एम- राइज स्कूल, निःशुल्क पाठ्यपुस्तक एवं साइकिल वितरण जैसी योजनाएँ चलाई जा रही हैं।","उच्च शिक्षा में भी राष्ट्रीय शिक्षा नीति 2020 को लागू करने वाला मध्य प्रदेश अग्रणी राज्य रहा है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"भोपाल विश्वविद्यालय का नाम मध्य प्रदेश में किस वर्ष बरकतुल्लाह विश्वविद्यालय रखा गया था?","o":["1975","1980","1985","1988"],"a":3,"e":["भोपाल विश्वविद्यालय की स्थापना वर्ष 1970 में हुई थी।","वर्ष 1988 में इसका नाम बदलकर बरकतुल्लाह विश्वविद्यालय कर दिया गया।","यह नाम प्रसिद्ध क्रांतिकारी एवं स्वतंत्रता सेनानी मौलाना बरकतुल्लाह भोपाली के सम्मान में रखा गया।","मौलाना बरकतुल्लाह 1915 में काबुल में गठित अस्थायी भारत सरकार के प्रधानमंत्री थे।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में राजघाट बांध की ऊँचाई कितनी है?","o":["33 मीटर","62.17 मीटर","43.8 मीटर","67 मीटर"],"a":2,"e":["राजघाट बांध बेतवा नदी पर मध्य प्रदेश एवं उत्तर प्रदेश की संयुक्त परियोजना है।","इस बांध की ऊँचाई लगभग 43.8 मीटर है।","इसे ‘रानी लक्ष्मीबाई सागर बांध’ के नाम से भी जाना जाता है।","यह परियोजना सिंचाई के साथ-साथ जल विद्युत उत्पादन में भी सहायक है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में तवा जलाशय बांध की ऊँचाई कितनी है?","o":["33 मीटर","62 मीटर","57.9 मीटर","43.8 मीटर"],"a":2,"e":["तवा बांध नर्मदा की सहायक तवा नदी पर नर्मदापुरम (होशंगाबाद) जिले में स्थित है।","इस बांध की ऊँचाई लगभग 57.9 मीटर है।","तवा परियोजना मध्य प्रदेश की एक प्रमुख सिंचाई परियोजना है।","तवा जलाशय सतपुड़ा टाइगर रिजर्व एवं पचमढ़ी क्षेत्र के निकट स्थित है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"निम्नलिखित में से कौन-सी कृषि पद्धति मध्य प्रदेश में निवेशकों और किसानों दोनों के लिए कानूनी रूप से अनुमत और प्रोत्साहित है?","o":["जीएम फसल की खेती","अनुबंध कृषि (कॉन्ट्रैक्ट फार्मिंग)","केवल जैविक खेती","भूमि सीमा छूट खेती"],"a":1,"e":["मध्य प्रदेश में अनुबंध कृषि (कॉन्ट्रैक्ट फार्मिंग) को कानूनी मान्यता एवं प्रोत्साहन प्राप्त है।","इसमें किसान और क्रेता कंपनी के बीच फसल की मात्रा, गुणवत्ता एवं मूल्य का पूर्व-निर्धारित अनुबंध होता है।","इससे किसान को बाजार मूल्य की अनिश्चितता से सुरक्षा तथा निश्चित आय मिलती है।","जीएम फसलों की व्यावसायिक खेती (बीटी कपास को छोड़कर) भारत में सामान्यतः अनुमत नहीं है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"2025 में, मध्य प्रदेश में सिविल सेवा प्रोत्साहन योजना के तहत यूपीएससी परीक्षा के प्रारंभिक चरण उत्तीर्ण करने वाले अनुसूचित जाति (एससी) के उम्मीदवारों को कितनी प्रोत्साहन राशि दी जाती है?","o":["20,000 रुपये","40,000 रुपये","50,000 रुपये","60,000 रुपये"],"a":1,"e":["मध्य प्रदेश सरकार की सिविल सेवा प्रोत्साहन योजना अनुसूचित जाति वर्ग के अभ्यर्थियों हेतु संचालित है। 165","इसके अंतर्गत संघ लोक सेवा आयोग की प्रारंभिक परीक्षा उत्तीर्ण करने पर 40,000 रुपये दिए जाते हैं।","इस राशि का उद्देश्य मुख्य परीक्षा की तैयारी हेतु आर्थिक सहायता उपलब्ध कराना है।","इस योजना के अंतर्गत दी जाने वाली प्रोत्साहन राशिः- प्रारंभिक परीक्षा (Prelims) ` 40,000 मुख्य परीक्षा (Mains) ` 60,000 साक्षात्कार (Interview) चयन ` 50,000","यह उपरोक्त वित्तीय सहायता मध्य प्रदेश शासन के अनुसूचित जाति कल्याण विभाग द्वारा प्रदान की जाती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में गोंड जनजाति की उपजातियों में निम्नलिखित सभी शामिल हैं सिवाए इसकेः","o":["राजगोंड","दातोलिया","अगरिया","संतिया"],"a":3,"e":["गोंड मध्य प्रदेश की दूसरी सबसे बड़ी जनजाति है, जिसकी अनेक उपजातियाँ पाई जाती हैं।","राजगोंड, दादवे, कतुलिया, मड़िया, धुरवे, अगरिया, ओझा, नगारची, सोलहा एवं दातोलिया इनमें प्रमुख हैं।","अगरिया गोंडों की वह उपजाति है जो पारंपरिक रूप से लोहा गलाने का कार्य करती रही है।","‘संतिया’ गोंड जनजाति की मान्यता प्राप्त उपजातियों में सम्मिलित नहीं है, अतः यही अपवाद है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में मुख्य रूप से बांस शिल्पकला और कृषि श्रम में संलग्न जनजातियाँ हैं-","o":["भारिया","बैगा","कोल","पनिका"],"a":0,"e":["भारिया जनजाति मुख्यतः छिंदवाड़ा के पातालकोट क्षेत्र तथा जबलपुर-मंडला में निवास करती है।","इनकी आजीविका का प्रमुख आधार बांस से टोकरी, सूप एवं अन्य वस्तुएँ बनाना तथा कृषि मजदूरी है।","भारिया को ‘भारिया-भूमिया’ भी कहा जाता है और यह विशेष पिछड़ी जनजाति ( PVTG) में शामिल है।","ये जड़ी-बूटियों के पारंपरिक ज्ञान के लिए भी विशेष रूप से जाने जाते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में पीर बुधन का मेला किसको समर्पित है?","o":["एक हिंदू संत","एक स्वतंत्रता सेनानी","एक आदिवासी नेता","एक मुस्लिम संत"],"a":3,"e":["पीर बुधन का मेला मध्य प्रदेश के शिवपुरी जिले के सावंरा क्षेत्र में आयोजित होता है।","यह मेला सूफी परंपरा के मुस्लिम संत पीर बुधन की स्मृति में समर्पित है।","इस मेले में हिंदू एवं मुस्लिम दोनों समुदायों के लोग समान रूप से भाग लेते हैं।","यह मध्य प्रदेश की गंगा-जमुनी सांस्कृतिक परंपरा का उत्कृष्ट उदाहरण है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश का कौन-सा पठार गंगा और नर्मदा बेसिन (घाटियों) के बीच जल विभाजक के रूप में कार्य करता है?","o":["बुंदेलखंड पठार","मालवा पठार","रीवा पठार","सतपुड़ा पठार"],"a":1,"e":["मालवा पठार का निर्माण दक्कन ट्रैप की लावा-निर्मित काली मिट्टी से हुआ है।","इस पठार के उत्तरी ढाल से चंबल, काली सिंध, पार्वती एवं बेतवा नदियाँ निकलकर गंगा तंत्र में मिलती हैं, जबकि इसके दक्षिणी भाग का जल नर्मदा बेसिन की ओर प्रवाहित होता है।","अतः मालवा पठार गंगा एवं नर्मदा बेसिन के मध्य जल विभाजक का कार्य करता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में महामृत्युंजय मेले का संबंध किस शहर/जिले से है?","o":["उज्जैन","रीवा","गुना","भोपाल"],"a":1,"e":["महामृत्युंजय मेला मध्य प्रदेश के रीवा जिले में आयोजित किया जाता है।","यह रीवा स्थित प्रसिद्ध महामृत्युंजय नाथ मंदिर से जुड़ा हुआ है।","यह विंध्य क्षेत्र के प्रमुख धार्मिक एवं सांस्कृतिक आयोजनों में गिना जाता है।","उज्जैन में सिंहस्थ कुंभ तथा गुना क्षेत्र में अन्य स्थानीय मेले आयोजित होते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में महामृत्युंजय मेला प्रतिवर्ष किन दो अवसरों पर आयोजित किया जाता है?","o":["दीपावली और होली","शिवरात्रि और वसंत पंचमी","मकर संक्रांति और दशहरा","राम नवमी और जन्माष्टमी"],"a":1,"e":["रीवा का महामृत्युंजय मेला वर्ष में दो बार आयोजित किया जाता है।","ये अवसर हैं – महाशिवरात्रि तथा वसंत पंचमी।","चूँकि यह मंदिर भगवान शिव को समर्पित है, इसलिए शिवरात्रि इसका प्रमुख पर्व है।","इन अवसरों पर विंध्य क्षेत्र से बड़ी संख्या में श्रद्धालु एकत्र होते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान", रैना जिले में (ग्वालियर-मुरैना सीमा पर) आसन नदी पर निर्मित है, जो चंबल की सहायक नदी है।","चंबल यमुना में तथा यमुना गंगा में मिलती है, अतः यह परियोजना गंगा बेसिन में आती है।","यह मध्य प्रदेश की पुरानी प्रमुख सिंचाई परियोजनाओं में गिनी जाती है।","ग्वालियर-चंबल अंचल की कृषि एवं सिंचाई में इस परियोजना का महत्वपूर्ण योगदान है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में राजघाट बांध किस जिले में स्थित है?","o":["शहडोल","अशोकनगर","खंडवा","मंदसौर"],"a":1,"e":["राजघाट बाँध (रानी लक्ष्मीबाई सागर परियोजना) बेतवा नदी पर बनी मध्य प्रदेश एवं उत्तर प्रदेश की संयुक्त परियोजना है।","यह मध्य प्रदेश के अशोकनगर जिले तथा उत्तर प्रदेश के ललितपुर जिले की सीमा पर स्थित है।","इससे दोनों राज्यों को सिंचाई सुविधा के साथ जल विद्युत उत्पादन का लाभ भी मिलता है। 169","शहडोल, खंडवा एवं मंदसौर जिलों में यह बाँध स्थित नहीं है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में तवा जलाशय बांध की लंबाई कितनी है?","o":["653 मीटर","1815 मीटर","1020 मीटर","514 मीटर"],"a":1,"e":["तवा बाँध नर्मदापुरम (होशंगाबाद) जिले में तवा नदी पर बना है, जो नर्मदा की सहायक नदी है।","इस बाँध की लंबाई लगभग 1,815 मीटर तथा ऊँचाई लगभग 58 मीटर है।","यह मध्य प्रदेश की प्रमुख सिंचाई परियोजनाओं में से एक है और सतपुड़ा क्षेत्र में स्थित है।","तवा जलाशय मत्स्य पालन तथा सतपुड़ा टाइगर रि”ार्व की पारिस्थितिकी के लिए भी महत्वपूर्ण है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"इनमें से कौन-सा स्टेशन भोपाल, मध्य प्रदेश में स्थित नहीं है?","o":["BPL","HBJ","INDB","NSZ"],"a":2,"e":["BPL भोपाल जंक्शन HBJ ( अब रानी कमलापति स्टेशन) तथा NSZ निषादपुरा भोपाल नगर के स्टेशन कोड हैं।","INDB इंदौर जंक्शन का कोड है, अतः यह स्टेशन भोपाल में स्थित नहीं है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"1956 में पुनर्गठित होने के बाद मध्य प्रदेश में प्रारंभ में कितने जिले थे?","o":["43","45","61","50"],"a":0,"e":["1 नवंबर, 1956 को जब मध्य प्रदेश का राज्य के रूप में पुनर्गठन किया गया था, तब इसमें प्रारंभ में कुल 43 जिले शामिल थे।","उस समय राज्य का स्व:प काफी बड़ा था और इसमें वर्तमान छत्तीसगढ़ का हिस्सा भी शामिल था। राज्य पुनर्गठन आयोग की सिफारिशों के आधार पर विभिन्न रियासतों को मिलाकर इस नए राज्य की स्थापना की गई थी।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"निम्नलिखित में से कौन-सी नदी मध्य प्रदेश की सतपुड़ा-मैकल पर्वतमाला से नहीं निकलती है या वहाँ से होकर नहीं बहती है?","o":["जोहिला","मछेरवा","देनवा","यमुना"],"a":3,"e":["यमुना नदी मध्य प्रदेश की सतपुड़ा-मैकल पर्वतमाला से नहीं निकलती है, बल्कि इसका उद्गम उत्तराखंड गढ़वाल हिमालय में स्थित ‘बंदरपूँछ चोटी के यमुनोत्री ग्लेशियर से होता है। दूसरी ओर, जोहिला, मछेरवा और देनवा जैसी नदियाँ मध्य प्रदेश के सतपुड़ा और मैकल पर्वत क्षेत्रों से संबंधित हैं।","यमुना भारत की सबसे लंबी और महत्वपूर्ण नदियों में से एक है जो मुख्य रूप से उत्तर भारत में बहती है। यह नदी प्रयागराज में गंगा में जाकर मिल जाती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में बाणसागर बांध की अनुमानित लंबाई कितनी है?","o":["653 मीटर","949 मीटर","1020 मीटर","514 मीटर"],"a":2,"e":["मध्य प्रदेश के शहडोल जिले के देवलोंद नामक स्थान पर सोन नदी पर निर्मित बाणसागर बांध की अनुमानित लंबाई लगभग 1020 मीटर ( 1 किलोमीटर से अधिक) है।","यह मध्य प्रदेश, उ त्त ार प्रदेश और बिहार की एक अत्यंत महत्वपूर्ण संयु त्त ाफ बहुउद्देशीय परियोजना है। इसमें तीनों राज्यों के बीच जल और लागत का बँटवारा क्रमशः 2ः1ः1 के अनुपात में होता है।","इस बांध का नाम प्रसिद्ध संस्कृत विद्वान बाणभट्ट के नाम पर रखा गया है। यह बांध क्षेत्र में कृषि उत्पादन बढ़ाने और बिजली उत्पादन में महत्वपूर्ण भूमिका निभाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में जगेश्वरी देवी द्वारा उपचार किए जाने से पहले चंदेरी के शासक किस बीमारी से पीड़ित थे?","o":["अंधत्व (ब्लाइंडनेस)","कुष्ठ रोग (लेप्रोसी)","लकवा","सर्पदंश"],"a":1,"e":["पौराणिक किंवदंतियों के अनुसार, चंदेरी के शासक राजा कीर्तिपाल कुष्ठ रोग ( Leprosy) से पीड़ित थे और उन्होंने इस भयंकर बीमारी से मुक्ति पाने के लिए कठोर तपस्या की थी।","ऐसा माना जाता है कि माता जगेश्वरी देवी के आशीर्वाद और उनके द्वारा बताए गए चमत्कारिक जलकुंड में स्नान करने से उनका रोग पूरी तरह ठीक हो गया था। इसी चमत्कारी घटना के सम्मान में वहां देवी का एक भव्य मंदिर बनवाया गया। चंदेरी का यह मंदिर आज भी भक्तों के बीच गहरी आस्था का केंद्र है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में मठ घोघरा मेले का स्थल किन प्राकृतिक विशेषताओं से सुंदर बनता है?","o":["नदी","झील और गुफा","पर्वत और वन","रेगिस्तान और ओएसिस"],"a":1,"e":["मध्य प्रदेश के सिवनी जिले में भैखथान नामक स्थान पर (मठ घोघरा) का प्रसिद्ध मेला आयोजित किया जाता है, जिसका आयोजन स्थल प्राकृतिक गुफाओं और झील (जल निकाय) से घिरा हुआ है। शिवरात्रि के अवसर पर लगने वाले इस मेले में प्रकृति की सुंदरता और आध्यात्मिकता का एक अनूठा संगम देखने को मिलता है।","गुफाओं के भीतर शिवलिंग स्थापित है, जहाँ प्राकृतिक जल स्रोत से लगातार पानी टपकता रहता है। यह स्थल पर्यटकों और श्रद्धालुओं को अपनी प्राकृतिक छटा से अत्यधिक आकर्षित करता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"भोपाल, मध्य प्रदेश में गौहर महल द्वारा कवर किया गया अनुमानित क्षेत्रफल कितना है?","o":["2.5 एकड़","3.0 एकड़","4.65 एकड़","5.5 एकड़"],"a":2,"e":["मध्य प्रदेश की राजधानी भोपाल में स्थित ऐतिहासिक गौहर महल लगभग 4.65 एकड़ के विस्तृत क्षेत्रफल में पैफला हुआ है। इसका निर्माण 1820 में भोपाल की 170 पहली महिला शासिका कुदसिया बेगम (जिन्हें गौहर बेगम भी कहा जाता था) द्वारा करवाया गया था।","यह शानदार महल हिंदू और मुगल वास्तुकला का एक बेजोड़ और सुंदर मिश्रण है। आज यह महल राज्य के हथकरघा और हस्तशिल्प प्रदर्शनियों के लिए एक प्रमुख सांस्कृतिक केंद्र के रूप में उपयोग किया जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"उज्जैन की बाटिक प्रिंट में उपयोग की जाने वाली मोम प्रतिरोध रंगाई (वैक्स रेसिस्ट डाइंग) तकनीक को क्या कहा जाता है?","o":["स्क्रीन प्रिंटिंग","ब्लॉक प्रिंटिंग","बाटिक","टाई एंड डाई"],"a":2,"e":["मध्य प्रदेश के उज्जैन में कपड़ों पर रंगाई और छपाई के लिए मोम प्रतिरोध तकनीक का उपयोग किया जाता है, जिसे ‘बाटिक’ कहा जाता है।","इस पारंपरिक कला में कपड़े के उन हिस्सों पर मोम लगाया जाता है जहाँ रंग नहीं चढ़ाना होता, और फिर कपड़े को रंग के घोल में डुबोया जाता है। उबलते पानी में धोने के बाद मोम पिघल जाता है और कपड़ों पर सुंदर दरार जैसे अनूठे डि”ााइन उभर कर आते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश के भवानी प्रसाद मिश्रा को किस सबसे अच्छे रूप में वर्णित किया जा सकता हैः","o":["इंदौर के चित्रकार","होशंगाबाद से राष्ट्रीय कवि और गांधीवादी दार्शनिक","उज्जैन के पुरातत्वविद्","शाजापुर के स्वतंत्रता सेनानी"],"a":1,"e":["भवानी प्रसाद मिश्र हिंदी साहित्य के एक अत्यंत प्रख्यात कवि, विचारक और स्वतंत्रता सेनानी थे, जिनका जन्म मध्य प्रदेश के होशंगाबाद (वर्तमान नर्मदापुरम ) जिले के टिगरिया गाँव में हुआ था।","वे महात्मा गांधी के विचारों और जीवनशैली से बहुत गहराई से प्रभावित थे, साहित्य जगत में उनकी सहजता के कारण उन्हें ‘कविता का गांधी’ भी कहा जाता है, और उन्होंने 1942 के ऐतिहासिक ‘भारत छोड़ो आंदोलन’ में सक्रिय रूप से भाग लिया था।","उनकी उत्कृष्ट और प्रसिद्ध काव्य रचना ‘बुनी हुई रस्सी’ के लिए वर्ष 1972 में उन्हें ‘साहित्य अकादमी पुरस्कार’ से भी सम्मानित किया गया था।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में कौन-से प्रागैतिहासिक स्थल पाषाण युग के साक्ष्य हैं?","o":["साँची और उज्जैन","भीमबेटका, आदमगढ़, जावरा, रायसेन, पचमढ़ी","मांडू और ग्वालियर","भोपाल और इंदौर"],"a":1,"e":["मध्य प्रदेश भारत के सबसे समृद्ध प्रागैतिहासिक स्थलों में से एक माना जाता है, जहाँ पाषाण युग की कई महत्वपूर्ण सभ्यताएं नदी घाटियों में विकसित हुइ±।","भीमबेटका (रायसेन जिले में) अपनी प्राचीन गुफा चित्रकला के लिए पूरी दुनिया में प्रसिद्ध है, जो पुरापाषाण और मध्यपाषाण काल के प्रारंभिक मानव जनजीवन को जीवंत रूप से दर्शाती है।","होशंगाबाद के पास स्थित आदमगढ़ मध्यपाषाण काल के पशुपालन और शिकार से संबंधित उपकरणों के प्राचीनतम साक्ष्यों की खोज के लिए बहुत जाना जाता है।","इसके अलावा, जावरा और पचमढ़ी की गुफाओं में भी प्राचीन पाषाण युगीन आश्रय और ढेरों शैल चित्र मिले हैं, जो मानव के विकास के प्रारंभिक इतिहास को बताते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में रामलीला का मेला कहाँ आयोजित किया जाता है?","o":["उज्जैन शहर","सीहोर जिला","ग्वालियर जिले की भांडेर तहसील","छत्तीसगढ़ की राजनांदगांव तहसील"],"a":2,"e":["मध्य प्रदेश के अत्यंत प्रसिद्ध मेलों में से एक ‘रामलीला का मेला’ है, जिसका भव्य आयोजन राज्य के ग्वालियर जिले की भांडेर तहसील में स्थानीय लोगों द्वारा बड़े उत्साह से किया जाता है।","यह एक बहुत ही पुराना और पारंपरिक मेला है जिसका इतिहास 100 वर्षों से भी अधिक पुराना माना जाता है और यह यहाँ की स्थानीय ग्रामीण संस्कृति का बहुत बड़ा प्रतीक है।","जनवरी और फरवरी के महीने में आयोजित होने वाले इस विशाल मेले में भगवान राम के जीवन चरित्र का सुंदर मंचन होता है ।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"1950 में जब मध्य प्रदेश का गठन हुआ था तब इसकी राजधानी क्या थी?","o":["इंदौर","नागपुर","जबलपुर","भोपाल"],"a":1,"e":["भारत की स्वतंत्रता के बाद वर्ष 1950 में, सेंट्रल प्रोविंस और बरार के विस्तृत क्षेत्रों को मिलाकर तत्कालीन ‘मध्य प्रदेश’ राज्य का आधिकारिक निर्माण किया गया था।","संविधान के प्रारंभिक प्रशासनिक वर्गीकरण के अनुसार यह एक ‘पार्ट-ए’ श्रेणी का राज्य था, जिसकी आधिकारिक विधायी और प्रशासनिक राजधानी नागपुर को बनाया गया था।","उस समय के इस विशाल मध्य प्रदेश में वर्तमान मध्य प्रदेश के कुछ हिस्सों के साथ-साथ वर्तमान महाराष्ट्र का विदर्भ क्षेत्र और आज का पूरा छत्तीसगढ़ भी पूरी तरह शामिल था।","बाद में, भाषाई आधार पर बने राज्य पुनर्गठन अधिनियम के तहत 1 नवंबर, 1956 को नए मध्य प्रदेश का गठन हुआ और राजधानी नागपुर से स्थानांतरित कर हमेशा के लिए भोपाल बनाई गई।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश के इतिहास में टंट्या भील की क्या भूमिका थी?","o":["कवि और दार्शनिक","आदिवासी नेता और स्वतंत्रता सेनानी","पश्चिमी निमाड़ के राजा","ब्रिटिश वफादार"],"a":1,"e":["टंट्या भील मध्य प्रदेश के पश्चिमी के एक अत्यंत निडर आदिवासी जननायक और भारत के स्वतंत्रता संग्राम के महान शूरवीर सेनानी के रूप में जाने जाते हैं। 171","उन्होंने ब्रिटिश साम्राज्य की क्रूर, शोषणकारी नीतियों और निर्दयी साहूकारों के अत्याचारों के खिलाफ आदिवासियों को पूरी तरह एकजुट कर एक लंबा और हिंसक सशस्त्र विद्रोह किया।","वे ब्रिटिश खजाने और अमीरों को लूटकर उस धन को गरीब और भूखे लोगों में बाँट देते थे, जिस कारण अंग्रेजों ने तंग आकर उन्हें ‘इंडियन रॉबिन हुड’ की उपाधि दी थी।","उनके इसी महान बलिदान के सम्मान में मध्य प्रदेश सरकार ने हाल ही में इंदौर के ‘पातालपानी रेलवे स्टेशन’ और प्रसिद्ध ‘भंवरकुआं चौराहे’ का नाम बदलकर ‘क्रांतिसूर्य जननायक टंट्या भील’ के नाम पर कर दिया है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में गर्मियों के मौसम में धूल भरी आँधी आना आम बात क्यों है?","o":["अधिक वर्षा से मिट्टी ढीली हो जाती है","उच्च आद्र्रता और निम्न दबाव","कम आद्र्रता और शुष्क सतह की स्थिति","अरब सागर में चक्रवाती गतिविधि"],"a":2,"e":["मध्य प्रदेश में ग्रीष्म ऋतु के दौरान महाद्वीपीय प्रभाव तापमान अधिक बढ़ जाने के कारण हवा की नमी (आद्र्रता) बहुत कम हो जाती है और वातावरण पूरी तरह शुष्क हो जाता है।","लगातार तेज धूप और भीषण गर्मी के कारण मिट्टी पूरी तरह से सूख जाती है और इसकी ऊपरी सतह अत्यंत भुरभुरी, हल्की व ढीली पड़ जाती है।","जब इस मौसम में स्थानीय स्तर पर तेज हवाएं या हवा की तापीय संवहन धाराएं चलती हैं, तो वे आसानी से इस सूखी मिट्टी को अपने साथ ऊपर उड़ा ले जाती हैं।","इन्हीं अधिक शुष्क और गर्म भौगोलिक परिस्थितियों के संयुक्त प्रभाव के कारण राज्य के कई हिस्सों में गर्मियों में धूल भरी आंधियाँ आना बहुत आम है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"किस मराठा परिवार ने इंदौर क्षेत्र पर नियंत्रण किया और मध्य प्रदेश के मालवा के अधिकांश भाग पर शासन किया?","o":["सिंधिया","होल्कर","भोंसले","गायकवाड़"],"a":1,"e":["होल्कर राजवंश एक बहुत ही प्रमुख और शक्तिशाली मराठा परिवार था जिसने मध्य प्रदेश के इंदौर शहर और मालवा के अधिकांश हिस्सों पर अपना शासन स्थापित किया था।","महान योद्धा मल्हारराव होल्कर ने 18 वीं शताब्दी की शुरुआत में इस राजवंश की नींव रखी और मालवा क्षेत्र में मराठा सत्ता को अत्यंत मजबूती प्रदान की।","पुण्यश्लोक देवी अहिल्याबाई होल्कर इस वंश की सबसे प्रतापी और न्यायप्रिय शासिका थीं, जिन्होंने पवित्र नगरी महेश्वर को अपनी राजधानी बनाकर शासन किया।","इस राजवंश ने अपने क्षेत्र में कला, सुंदर वास्तुकला (जैसे इंदौर का राजवाड़ा) और व्यापार के विकास में अद्वितीय और अत्यंत ऐतिहासिक योगदान दिया है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में अहिराई नृत्य के दौरान संगीतकार और नर्तक किस आकृति में प्रदर्शन करते हैं?","o":["चौकोर आकृति","रेखीय आकृति","गोल आकृति","त्रिकोणीय आकृति"],"a":2,"e":["अहिराई नृत्य मुख्य रूप से मध्य प्रदेश की भारिया और अन्य स्थानीय जनजातियों द्वारा विशेष अवसरों पर किया जाने वाला एक बेहद लोकप्रिय पारंपरिक लोक नृत्य है।","इस मनमोहक नृत्य प्रदर्शन के दौरान सभी नर्तक और वाद्य यंत्र बजाने वाले संगीतकार आमतौर पर एक विशाल गोलाकार आकृति बनाकर खड़े होते हैं।","सभी नर्तक एक-दूसरे के हाथों को पकड़कर या लयबद्ध तरीके से कदम मिलाते हुए ढोलक और टिमकी की धुन पर गोल-गोल घूमते हुए नृत्य करते हैं।","यह सामूहिक गोलाकार प्रस्तुति जनजाति के सदस्यों के बीच गहरी सामाजिक एकता, आपसी प्रेम और उनके मजबूत सांस्कृतिक जुड़ाव को बेहतरीन ढंग से दर्शाती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"कौन-सा स्टेशन कोड, मध्य प्रदेश के सौगोर (सागर) रेलवे स्टेशन का प्रदर्शित करता है?","o":["SGR","SGO","SAG","SGA"],"a":1,"e":["भारतीय रेलवे नेटवर्क के अंतर्गत मध्य प्रदेश के सागर रेलवे स्टेशन को आधिकारिक रूप से दर्शाने वाला विशेष स्टेशन कोड ‘ SGO’ है। सागर को इसकी मध्यवर्ती भौगोलिक स्थिति और बुंदेलखंड के केंद्र में होने के कारण ‘मध्य प्रदेश का हृदय’ (विशेषकर बुंदेलखंड का हृदय कहा जाता है।)","यह बहुत ही महत्वपूर्ण और व्यस्त रेलवे स्टेशन पश्चिम मध्य रेलवे ( WCR) जोन के अंतर्गत आने वाले जबलपुर रेलवे डिवीजन का एक प्रमुख हिस्सा है।","स्टेशन कोड रेलवे की कंप्यूटरीकृत टिकटिंग प्रणाली, पार्सल बुकिंग और ट्रेनों के सुचारु संचालन में सटीक पहचान के लिए अत्यंत आवश्यक और अनिवार्य होते हैं।","सागर शहर मध्य प्रदेश के बुंदेलखंड क्षेत्र का एक प्रमुख शैक्षिक (डॉ- हरीसिंह गौर विश्वविद्यालय) और ऐतिहासिक केंद्र है, जिससे इस स्टेशन का महत्व बढ़ जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"कुंभ मेला मध्य प्रदेश के उज्जैन में किस नदी के किनारे आयोजित होता है?","o":["नर्मदा","चंबल","बेतवा","क्षिप्रा"],"a":3,"e":["मध्य प्रदेश की धार्मिक और पवित्र नगरी उज्जैन में विश्व प्रसिद्ध सिंहस्थ कुंभ मेले का भव्य आयोजन पुण्य सलिला ‘क्षिप्रा’ नदी के पावन तट पर ही किया जाता है।","क्षिप्रा नदी का उद्गम इंदौर के पास स्थित काकरी बरडी पहाड़ी से होता है। इसकी पवित्रता के कारण ‘मालवा की गंगा’ भी कहा जाता है।","उज्जैन में महाकालेश्वर ज्योतिर्लिंग के समीप हर 12 वर्ष के अंतराल पर जब गुरु (बृहस्पति) सिंह राशि में प्रवेश करता है, तब यह विशाल मेला लगता है।","पौराणिक हिंदू मान्यताओं के अनुसार, समुद्र मंथन से निकले अमृत कलश से अमृत की कुछ बूंदें इसी नदी में गिरी थीं, जिससे यहाँ स्नान का विशेष मोक्षदायी महत्व है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"हर वर्ष मध्य प्रदेश में मांडू महोत्सव आमतौर पर किन महीनों में आयोजित किया जाता है? 172","o":["फरवरी - मार्च","जुलाई अगस्त सितंबर","नवंबर - दिसंबर - जनवरी","मार्च अप्रैल मई"],"a":2,"e":["मध्य प्रदेश पर्यटन बोर्ड द्वारा मांडू महोत्सव का रंगारंग आयोजन आम तौर पर सर्दियों के महीनों, विशेषकर दिसंबर और जनवरी के दौरान बहुत ही भव्यता से किया जाता है।","मांडू मध्य प्रदेश के ‘धर जिले’ में विंध्याचल पर्वतमाला पर स्थित है। मध्यकालीन इतिहास में इसे ‘शादियाबाद’ (आनंद की नगरी) के नाम से जाना जाता था।","इन सर्दियों के महीनों में यहाँ का मौसम पर्यटकों के लिए अत्यंत सुहावना होता है, जो हॉट एयर बलूनिंग, हेरिटेज वॉक और रात के संगीतमय कार्यक्रमों के एकदम अनुकूल है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में स्थित मड़ीखेड़ा बांध का आधिकारिक उद्घाटन कब हुआ था?","o":["1992","2008","1974","2006"],"a":1,"e":["मड़ीखेड़ा बांध मध्य प्रदेश के शिवपुरी जिले में प्रमुख सिंध नदी पर निर्मित एक बहुत ही महत्वपूर्ण और बड़ी बहुउद्देशीय जल व सिंचाई परियोजना है।","इस विशाल परियोजना को आध्किारिक तौर पर ‘मोहिनी सागर परियोजना’ के नाम से भी जाना जाता है।","इस बड़े बांध का जटिल निर्माण कार्य कई वर्षों तक चलने के बाद अंततः वर्ष 2008 में पूरी तरह से संपन्न हुआ और इसे आधिकारिक तौर पर चालू किया गया था।","यह बांध न केवल शिवपुरी, दतिया और ग्वालियर जैसे जिलों के लिए सिंचाई का सबसे मुख्य साधन है, बल्कि इससे एक निश्चित मात्रा में जलविद्युत उत्पादन भी किया जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"महाकौशल, गोंडवाना और विदर्भ पर किस मराठा परिवार का नियंत्रण था?","o":["होल्कर","सिंधिया","भोंसले","पेशवा"],"a":2,"e":["अठारहवीं सदी में विशाल मराठा साम्राज्य के पतन और विभाजन के बाद अलग-अलग भौगोलिक क्षेत्रों में विभिन्न मराठा सरदारों ने अपनी स्वतंत्र सत्ता स्थापित की थी।","इनमें से नागपुर के भोंसले राजवंश ने मध्य और पूर्वी भारत के एक बहुत बड़े भूभाग पर अपना मजबूत राजनीतिक और सैन्य नियंत्रण स्थापित किया था।","उनके अधिकार क्षेत्र में मध्य प्रदेश का महाकौशल और गोंडवाना क्षेत्र तथा वर्तमान महाराष्ट्र का संपूर्ण विदर्भ क्षेत्र प्रमुख रूप से शामिल था।","मध्य प्रदेश के वर्तमान पूर्वी और दक्षिणी हिस्सों पर नागपुर के भोंसले शासकों की ऐतिहासिक छाप और प्रभाव आज भी स्पष्ट रूप से देखा जा सकता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश एक नए राज्य के रूप में कब गठित हुआ?","o":["26 जनवरी 1950","15 अगस्त 1947","1 नवंबर 1956","17 दिसंबर 1956"],"a":2,"e":["स्वतंत्रता प्राप्ति के बाद समूचे भारत में भाषाई आधार पर नए राज्यों के गठन और सीमाओं के पुनर्गठन के लिए राज्य पुनर्गठन आयोग (फजल अली आयोग) की स्थापना की गई थी।","इस ऐतिहासिक आयोग की महत्वपूर्ण सिफारिशों के आधार पर ‘ 1 नवंबर, 1956’ को मध्य प्रदेश को भारतीय संघ के एक नए और वृहद राज्य के रूप में आधिकारिक रूप से गठित किया गया।","इसके भौगोलिक निर्माण में पुराने पार्ट ए, बी और सी राज्यों (जैसे मध्य भारत, विंध्य प्रदेश, भोपाल राज्य और महाकौशल) के क्षेत्रों को आपस में मिलाया गया था।","इसी ऐतिहासिक दिन की याद में प्रतिवर्ष 1 नवंबर को पूरे राज्य में हर्षोल्लास के साथ मध्य प्रदेश का स्थापना दिवस (मध्य प्रदेश पर्व) मनाया जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"बरकतुल्लाह विश्वविद्यालय मध्य प्रदेश के किस शहर में स्थित है?","o":["इंदौर","जबलपुर","भोपाल","ग्वालियर"],"a":2,"e":["बरकतुल्लाह विश्वविद्यालय (संक्षेप में बीयू) मध्य प्रदेश राज्य का एक अत्यंत प्रमुख, पुराना और प्रतिष्ठित राज्य स्तरीय विश्वविद्यालय है।","यह विख्यात शिक्षण संस्थान मध्य प्रदेश की राजधानी ‘भोपाल’ में स्थित है और इसे अपनी स्थापना के समय मूल रूप से ‘भोपाल विश्वविद्यालय’ के नाम से ही जाना जाता था।","वर्ष 1988 में भारत के महान स्वतंत्रता सेनानी और प्रखर राष्ट्रवादी प्रोपेफसर बरकतुल्लाह भोपाली के सम्मान में इसका नाम बदलकर उनके नाम पर रख दिया गया।","वर्तमान में यह विश्वविद्यालय उच्च शिक्षा, तकनीकी ज्ञान और विविध अनुसंधान के क्षेत्र में मध्य प्रदेश के एक अत्यंत महत्वपूर्ण शैक्षणिक केंद्र के रूप में कार्यरत है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश के रीवा-पन्ना पठार के उत्तर-पश्चिम में कौन-सा पठारी क्षेत्र स्थित है?","o":["मध्य भारत का पठार","मालवा पठार","बुंदेलखंड पठार","सतपुड़ा पठार"],"a":2,"e":["मध्य प्रदेश की भूवैज्ञानिक और भौगोलिक संरचना में विंध्य कगार क्षेत्र को आमतौर पर रीवा-पन्ना के पठार के नाम से जाना जाता है।","मानचित्र पर इस रीवा-पन्ना पठार के ठीक उत्तर-पश्चिम दिशा में प्राचीन ग्रेनाइट और नीस चट्टानों से निर्मित ‘बुंदेलखंड का पठार’ स्थित है।","बुंदेलखंड पठार का भौगोलिक विस्तार मुख्य रूप से मध्य प्रदेश के छतरपुर, टीकमगढ़, निवाड़ी, दतिया जिलों और उत्तर प्रदेश के कुछ सीमावर्ती जिलों में है।","इन दोनों प्रमुख पठारों (रीवा-पन्ना और बुंदेलखंड) के बीच की प्राकृतिक भौगोलिक सीमा मुख्य रूप से विंध्याचल पर्वत श्रृंखला की ढलान द्वारा निर्धारित की जाती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश के घोघरा में आयोजित चंडी देवी मेले का मुख्य उद्देश्य क्या है? 173","o":["आदिवासी कला का उत्सव मनाने के लिए","एक स्थानीय स्वतंत्रता सेनानी की स्मृति में","पार्वती का अवतार मानी जाने वाली देवी का सम्मान करने के लिए","कृषि और ग्रामीण अर्थव्यवस्था को बढ़ावा देने के लिए"],"a":2,"e":["चंडी देवी का अत्यंत प्रसिद्ध और प्राचीन मेला मध्य प्रदेश के सीधी जिले में स्थित घोघरा नामक छोटे से स्थान पर बड़ी श्रद्धा के साथ आयोजित किया जाता है।","यह धार्मिक मेला मुख्य रूप से चंडी देवी (जिन्हें माँ चामुंडा भी कहा जाता है) की पूजा और उनके सम्मान के लिए आयोजित होता है, जिन्हें हिंदू मान्यताओं में साक्षात देवी पार्वती का उग्र अवतार माना जाता है।","यह एक बहुत ही प्रमुख धार्मिक, सांस्कृतिक और सामाजिक आयोजन है जो प्रतिवर्ष मार्च-अप्रैल के महीनों में (चैत्र नवरात्र के पवित्र अवसर पर) पंद्रह दिनों तक लगता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में कालिदास संस्कृत अकादमी कहाँ स्थित है?","o":["जबलपुर","ग्वालियर","उज्जैन","विदिशा"],"a":2,"e":["कालिदास संस्कृत अकादमी मध्य प्रदेश के अत्यंत ऐतिहासिक, धार्मिक और सांस्कृतिक शहर ‘उज्जैन’ (जिसे प्राचीन काल में उज्जयिनी कहा जाता था) में स्थित है।","इस प्रतिष्ठित संस्था की स्थापना वर्ष 1977 में भारत के महान संस्कृत कवि और नाटककार महाकवि कालिदास की पावन स्मृति और उनकी अमूल्य साहित्यिक कृतियों के संरक्षण के लिए की गई थी।","इसी अकादमी के तत्वावधान में प्रतिवर्ष उज्जैन में भव्य ‘अखिल भारतीय कालिदास समारोह’ का आयोजन किया जाता है, जो देशभर के साहित्य प्रेमियों के लिए एक प्रमुख आकर्षण है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"हीरा भूमिया का मेला मध्य प्रदेश के किन जिलों या क्षेत्रों में प्रमुख रूप से मनाया जाता है?","o":["रीवा और सतना","ग्वालियर, गुना और आसपास के क्षेत्र","भोपाल और रायसेन","उज्जैन और इंदौर"],"a":1,"e":["हीरा भूमिया का मेला मध्य प्रदेश का एक अत्यंत महत्वपूर्ण और पारंपरिक सांस्कृतिक उत्सव है। यह मेला मुख्य रूप से ग्वालियर और गुना जिलों के साथ-साथ उनके आसपास के ग्रामीण क्षेत्रों में बड़े उत्साह के साथ आयोजित किया जाता है।","यह आमतौर पर अगस्त और सितंबर के महीनों में स्थानीय देवता ‘हीरा भूमिया’ के सम्मान में लगता है। यह मेला इन क्षेत्रों के ग्रामीण लोगों की गहरी सांस्कृतिक और धार्मिक आस्था को दर्शाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में स्थित देजला देवड़ा मध्यम सिंचाई परियोजना किस नदी घाटी से जुड़ी हुई है?","o":["माही","गंगा","नर्मदा","गोदावरी"],"a":2,"e":["देजला देवड़ा मध्यम सिंचाई परियोजना मध्य प्रदेश के खरगोन जिले में जल प्रबंधन की एक महत्वपूर्ण पहल है।","इसका निर्माण कुंदा नदी पर किया गया है, जो नर्मदा नदी घाटी की एक प्रमुख सहायक नदी है। यह परियोजना विशेष रूप से खरगोन जिले की कृषि भूमि को सिंचाई की सुविधा प्रदान करने के लिए अत्यंत महत्वपूर्ण है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में दशहरा और ददरिया नृत्य किस जनजाति से संबंधित हैं?","o":["गोंड","बैगा","भील","सहारिया"],"a":1,"e":["बैगा जनजाति मध्य प्रदेश की एक प्रमुख और विशेष रूप से कमजोर जनजातीय समूह ( PVTG) है, जिसकी सांस्कृतिक विरासत बहुत समृद्ध है।","जो मुख्यतः मंडला, डिंडोरी और बालाघाट (मैकल श्रेणी) में निवास करती है।","ददरिया एक बहुत ही अभिव्यंजक पारंपरिक लोक नृत्य और गीत है जो अक्सर दशहरा जैसे त्योहारों पर विशेष रूप से बैगा समुदाय द्वारा किया जाता है। इसमें पुरुष और महिलाएं दोनों भाग लेते हैं और इसे ‘प्रेम का नृत्य’ भी कहा जाता है। यह उनके प्राचीन जीवन और जंगल की परंपराओं का एक जीवंत प्रतीक है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में इंदिरा सागर बांध किस नदी पर बनाया गया है?","o":["सोन","तवा","बेतवा","नर्मदा"],"a":3,"e":["इंदिरा सागर बांध मध्य प्रदेश के खंडवा जिले के पुनासा (नर्मदा नगर) में नर्मदा नदी पर स्थित एक अति महत्वपूर्ण बहुउद्देशीय परियोजना है।","इसकी आधरशिला 23 अक्टूबर, 1984 को तत्कालीन प्रधनमंत्री श्रीमती इंदिरा गांध्ी द्वारा रखी गई थी।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"बेतवा नदी किस दिशा में बहती है?","o":["पश्चिम","उत्तर-पूर्व","पूर्व","उत्तर"],"a":1,"e":["बेतवा नदी मध्य भारत में विशाल यमुना नदी बेसिन की एक प्रमुख सहायक नदी है।","बेतवा (प्राचीन नाम वेत्रवती) का उåम मध्य प्रदेश के ‘रायसेन’ जिले के ‘कुमरगाँव’ में स्थित विंध्याचल पर्वतमाला से होता है।","यह नदी मध्य प्रदेश और उत्तर प्रदेश के परिदृश्यों से होकर बहते हुए लगातार उत्तर-पूर्व दिशा में बहती है। अंततः, यह उत्तर प्रदेश के ऐतिहासिक शहर हमीरपुर के पास यमुना नदी में मिल जाती है।","प्रदूषण के समान स्तर के कारण बेतवा को मध्य प्रदेश की गंगा’ और ‘बुंदेलखंड की जीवनरेखा’ भी कहा जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में शिप्रा नदी किस प्रमुख नदी की सहायक नदी है?","o":["नर्मदा नदी","बेतवा नदी","चंबल नदी","यमुना नदी"],"a":2,"e":["शिप्रा (या क्षिप्रा) नदी मध्य प्रदेश के मध्य से बहने वाली एक अत्यंत पवित्र और ऐतिहासिक नदी है। 174","यह प्राचीन शहर उज्जैन में अपने तट पर आयोजित होने वाले भव्य कुंभ मेले के लिए विश्व प्रसिद्ध है।","यह धार के उत्तर में विंध्य पर्वतमाला से निकलती है और मालवा के पठार के पार उत्तर की ओर बहती है।","अपनी अत्यध्कि पवित्रता के कारण इसे ‘मालवा की गंगा’ कहा जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में खजुराहो नृत्य महोत्सव के दौरान ‘हुनर मेला’ क्या है?","o":["एक संगीत प्रतियोगिता","मध्य प्रदेश की कला और शिल्प को प्रदर्शित करने वाला शिल्प मेला","एक नृत्य कार्यशाला","एक खाद्य स्वाद कार्यक्रम"],"a":1,"e":["खजुराहो नृत्य महोत्सव भारतीय शास्त्रीय नृत्य रूपों का जश्न मनाने वाला एक विश्व प्रसिद्ध सांस्कृतिक कार्यक्रम है। इस भव्य उत्सव के साथ आयोजित होने वाला ‘हुनर मेला’ एक प्रामाणिक शिल्प मेला है।","यह मध्य प्रदेश की उत्कृष्ट पारंपरिक कलाओं, हस्तनिर्मित शिल्पों और जटिल हथकरघा कार्यों को प्रदर्शित करने का एक जीवंत मंच है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"निम्नलिखित में से कौन-सा मध्य प्रदेश में स्थानिक वर्षा वितरण का सबसे अच्छा वर्णन करता है?","o":["मानसूनी हवाओं के कारण पूरे राज्य में एक समान वर्षा होती है","पश्चिमी क्षेत्रों में ऊंचाई के कारण अधिक वर्षा होती है","दक्षिण-पूर्व से उत्तर-पश्चिम की ओर वर्षा कम होती जाती है","हिमालय से निकटता के कारण उत्तरी जिलों में सबसे अधिक वर्षा होती है"],"a":2,"e":["मध्य प्रदेश में वर्षा मुख्य रूप से दक्षिण-पश्चिमी मानसून द्वारा होती है।","राज्य में वर्षा की मात्रा दक्षिण-पूर्व दिशा से उत्तर-पश्चिम दिशा की ओर क्रमशः घटती जाती है।","बालाघाट, मंडला (दक्षिण-पूर्व) में सबसे अधिक और भिंड, मुरैना (उत्तर-पश्चिम) में सबसे कम वर्षा होती है।","यह भौगोलिक वितरण अरब सागर और बंगाल की खाड़ी दोनों शाखाओं के मानसून के प्रभाव पर निर्भर करता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"ब्रिटिश शासन के तहत उत्तरी मध्य प्रदेश की रियासतों पर किस प्रशासनिक एजेंसी का शासन था?","o":["बंगाल प्रेसीडेंसी","मद्रास एजेंसी","मध्य भारत एजेंसी","संयुक्त प्रांत प्रशासन"],"a":2,"e":["ब्रिटिश काल में मध्य प्रदेश के उत्तरी और मध्य भाग की रियासतों को ‘सेंट्रल इंडिया एजेंसी’ के तहत रखा गया था।","इस राजनीतिक एजेंसी की स्थापना 1854 में की गई थी, जिसका मुख्यालय इंदौर में स्थित था।","इसमें ग्वालियर, इंदौर, भोपाल, और बुंदेलखंड-बघेलखंड की प्रमुख रियासतें शामिल थीं।","स्वतंत्रता के बाद 1948 में इसी क्षेत्र को मिलाकर ‘मध्य भारत’ और ‘विंध्य प्रदेश’ का गठन किया गया था।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"रानी दुर्गावती किस वंश से संबंधित थीं?","o":["मुगल","चंदेल","मराठा","राजपूत"],"a":1,"e":["वीरांगना रानी दुर्गावती का जन्म कालिंजर के प्रसिद्ध चंदेल राजवंश में हुआ था।","उनका विवाह गोंडवाना (गढ़ा मंडला) के गोंड राजा दलपत शाह से हुआ था।","पति की मृत्यु के बाद उन्होंने अपने अल्पवयस्क पुत्र वीर नारायण की ओर से गोंडवाना का सफलतापूर्वक शासन संभाला।","उन्होंने 1564 में अकबर के सेनापति आसफ खान की विशाल सेना से अत्यंत वीरतापूर्वक युद्ध किया था।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में माखनलाल चतुर्वेदी राष्ट्रीय पत्रकारिता एवं संचार विश्वविद्यालय (एमसीएनयूजेसी) की स्थापना किस वर्ष हुई थी?","o":["1992","1995","1990","2000"],"a":2,"e":["माखनलाल चतुर्वेदी राष्ट्रीय पत्रकारिता एवं संचार विश्वविद्यालय ( MCNUJC) की स्थापना वर्ष 1990 में हुई थी।","यह प्रतिष्ठित विश्वविद्यालय मध्य प्रदेश की राजधानी भोपाल में स्थित है।","यह भारत और संपूर्ण एशिया में पत्रकारिता व जनसंचार के क्षेत्र में स्थापित पहला राष्ट्रीय विश्वविद्यालय है।","इसका नामकरण प्रसि द्ध कवि, प्रखर स्वतंत्रता सेनानी और ‘एक भारतीय आत्मा’ के नाम से विख्यात पं- माखनलाल चतुर्वेदी (जन्मः बाबई/माखन नगर, नर्मदापुरम) के नाम पर किया गया है, जिनकी रचना ‘पुष्प की अभिलाषा’ विश्वविख्यात है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में भीमगढ़ बांध किस नदी पर बनाया गया है?","o":["नर्मदा","वैनगंगा","सोन","चंबल"],"a":1,"e":["भीमगढ़ बांध, जिसे संजय सरोवर बांध भी कहा जाता है, मध्य प्रदेश के सिवनी जिले में छपारा के पास स्थित है।","यह विशाल बांध गोदावरी बेसिन की प्रमुख वैनगंगा नदी पर निर्मित किया गया है।","इस बांध को एशिया के सबसे बड़े मिट्टी के बांध का दर्जा प्राप्त है।","इस परियोजना से सिवनी और बालाघाट जिलों के बड़े कृषि क्षेत्र में जल और सिंचाई सुविधा उपलब्ध होती है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"निम्नलिखित में से कौन-सी सिंचाई परियोजना मध्य प्रदेश में माही नदी घाटी से संबंधित है?","o":["सिंहपुर","शिवगढ़ भादली","सुकता","उमरार"],"a":1,"e":["शिवगढ़ भादली सिंचाई परियोजना मध्य प्रदेश में माही नदी बेसिन के अंतर्गत आती है।","माही नदी का उåम मध्य प्रदेश के धर जिले की सरदारपुर तहसील के ‘मिंडा’ गाँव (विंध्याचल पर्वत) से होता है। यह भारत की एकमात्र ऐसी नदी है जो ‘कर्क रेखा’ को दो बार (उल्टे ‘ U ’ आकार में) काटती है। 175","इस परियोजना का मुख्य उद्देश्य मालवा के जनजातीय क्षेत्रों (विशेषकर रतलाम क्षेत्र) में जल आपूर्ति सुनिश्चित करना है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"गोपत, बनास और जोहिला मध्य प्रदेश में किस नदी की सहायक नदियाँ हैं?","o":["नर्मदा","सोन","चंबल","बेतवा"],"a":1,"e":["गोपत, बनास और जोहिला नदियां मध्य प्रदेश में प्रवाहित होने वाली सोन नदी की प्रमुख सहायक नदियाँ हैं।","सोन नदी अमरकंटक के मैकल पर्वत से निकलती है और गंगा नदी बेसिन का एक प्रमुख दक्षिणी हिस्सा है।","ये सहायक नदियां विंध्य और कैमूर पर्वत श्रृंखलाओं के जल को सोन नदी में प्रवाहित करती हैं।","सोन नदी उत्तर-पूर्व दिशा में बहते हुए बिहार में दानापुर (पटना) के पास जाकर गंगा नदी में मिल जाती है।","इसी सोन नदी पर मध्य प्रदेश के शहडोल में प्रसिद्ध ‘बाणसागर बांध’ स्थित है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में लोकरंग महोत्सव के ‘स्वाद’ कार्यक्रम का मुख्य विषय क्या है?","o":["संगीत","खाद्य महोत्सव","रंगमंच","पुस्तकें"],"a":1,"e":["‘लोकरंग’ मध्य प्रदेश की राजधानी भोपाल में गणतंत्र दिवस के अवसर पर आयोजित होने वाला एक 5 दिवसीय सांस्कृतिक महोत्सव है।","इस भव्य महोत्सव का आयोजन ‘मध्य प्रदेश आदिवासी लोक कला अकादमी’ (संस्कृति विभाग) द्वारा भोपाल के ‘रवींद्र भवन’ परिसर में किया जाता है।","इस महोत्सव के अंतर्गत ‘स्वाद’ नामक कार्यक्रम एक विशेष पारंपरिक खाद्य महोत्सव है।","इसमें मध्य प्रदेश के विभिन्न अंचलों (मालवा, बुंदेलखंड आदि) और भारत के अन्य राज्यों के पारंपरिक व्यंजन परोसे जाते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"14 वीं शताब्दी में दिल्ली सल्तनत के पतन के बाद उत्तरी मध्य प्रदेश में कौन-से राज्य उभरे?","o":["मौर्य और गुप्त साम्राज्य","ग्वालियर के तोमर और मालवा की मुस्लिम सल्तनत","कुषाण और शुंग","चंदेल और परमार"],"a":1,"e":["14 वीं शताब्दी के अंत में (विशेषकर 1938 में तैमूर के आक्रमण के बाद) दिल्ली सल्तनत के कमजोर होने के बाद मध्य प्रदेश के विभिन्न हिस्सों में स्वतंत्र राज्यों का उदय हुआ।","उत्तरी मध्य प्रदेश में विशेष रूप से ग्वालियर क्षेत्र में तोमर राजवंश ने अपनी मजबूत सत्ता स्थापित की।","इसके साथ ही मालवा क्षेत्र में स्वतंत्र मुस्लिम सल्तनत का भी प्रभाव तेजी से बढ़ने लगा था।","इन क्षेत्रीय शक्तियों ने मध्य प्रदेश के ऐतिहासिक और सांस्कृतिक परिदृश्य को आकार देने में अत्यंत महत्वपूर्ण योगदान दिया।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"रेल कोच पैफक्ट्री मध्य प्रदेश के किस शहर में स्थित है?","o":["इंदौर","भोपाल","जबलपुर","देवास"],"a":1,"e":["मध्य प्रदेश में रेलवे कोच पैफक्ट्री राज्य की राजधानी भोपाल के पास स्थित निशातपुरा क्षेत्र में स्थापित है।","यह भारतीय रेलवे की प्रमुख विनिर्माण इकाइयों में से एक है, जो यात्री रेल डिब्बों के निर्माण और रखरखाव का कार्य करती है।","इसे आध्किारिक तौर पर ‘कोच पुनर्वास कार्यशाला’ के नाम से जाना जाता है। इसकी स्थापना 1989 में की गई थी (जबकि उत्पादन 1995 से शु: हुआ)।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में विदिशा का स्टेशन कोड हैः","o":["VDH","BHS","VDS","BDS"],"a":1,"e":["मध्य प्रदेश के ऐतिहासिक शहर विदिशा के रेलवे स्टेशन का आधिकारिक रेलवे कोड ‘ BHS’ है।","यह कोड विदिशा के प्राचीन नाम ‘भिलसा’ से लिया गया है।","भारतीय रेलवे में अक्सर स्टेशनों के कोड उनके पुराने या ऐतिहासिक नामों के आधार पर रखे जाते हैं, जो आज भी प्रचलन में हैं।","विदिशा स्टेशन दिल्ली-चेन्नई मुख्य रेलवे लाइन पर स्थित एक प्रमुख और अत्यंत व्यस्त रेलवे जंक्शन है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में संगमरमर का सबसे बड़ा भंडार किस जिले में पाया जाता है?","o":["छतरपुर","कटनी","सिंगरौली","मुरैना"],"a":1,"e":["मध्य प्रदेश का कटनी जिला संगमरमर और चूना पत्थर (लाइमस्टोन) के विशाल भंडार के लिए पूरे देश में प्रसिद्ध है।","कटनी के संगमरमर की उच्च गुणवत्ता और इसके विभिन्न रंग इसे निर्माण कार्यों के लिए अत्यधिक माँग वाला बनाते हैं।","यही कारण है कि कटनी को ‘चूना पत्थर का शहर’ ( City of Limestone) के नाम से भी जाना जाता है।","इस जिले का खनन उद्योग मध्य प्रदेश की अर्थव्यवस्था और रोजगार सृजन में बहुत बड़ा और महत्वपूर्ण योगदान देता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में मठ घोघरा का मेला कहाँ आयोजित होता है?","o":["गाडरवारा","भैरोंथान, सिवनी","भोपाल","नीमच"],"a":1,"e":["मठ घोघरा का प्रसिद्ध मेला मध्य प्रदेश के सिवनी जिले के भैखथान (मठ घोघरा) नामक स्थान पर आयोजित किया जाता है।","यह मेला भगवान शिव को समर्पित है और विशेष रूप से शिवरात्रि के अवसर पर लगातार 15 दिनों तक चलता है।","इस स्थान पर एक प्राकृतिक गुफा और प्राचीन शिवलिंग स्थित है, जो इस भव्य मेले का मुख्य आकर्षण केंद्र है। 176"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में पाया जाने वाला कौन-सा खनिज, कोयले के अलावा ऊर्जा उत्पादन से सबसे अधिक सीधे तौर पर संबंधित है?","o":["लिग्नाइट","यूरेनियम","कोल बेड मिथेन","थोरियम"],"a":2,"e":["मध्य प्रदेश के शहडोल और आसपास के कोयला खदान क्षेत्रों में कोल बेड मिथेन ( CBM) के प्रचुर भंडार पाए गए हैं।","कोयले के अलावा, यह प्राकृतिक गैस राज्य में ऊर्जा उत्पादन का एक अत्यंत महत्वपूर्ण और तुलनात्मक रूप से स्वच्छ स्रोत है।","CBM को सीधे कोयले की परतों से निकाला जाता है और इसका उपयोग बिजली उत्पादन तथा औद्योगिक इ±धनों के रूप में किया जाता है।","रिलायंस इंडस्ट्रीज जैसी बड़ी कंपनियों ने यहाँ CBM निष्कर्षण परियोजनाओं में अपना बड़ा निवेश किया है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में चंबल नदी किस प्रमुख नदी घाटी (बेसिन) का हिस्सा है?","o":["गोदावरी बेसिन (घाटी)","माही बेसिन (घाटी)","गंगा बेसिन (घाटी)","नर्मदा बेसिन (घाटी)"],"a":2,"e":["मध्य प्रदेश की प्रमुख नदी चंबल, अंततः उत्तर प्रदेश में जाकर यमुना नदी में पूरी तरह विलीन हो जाती है।","चूँकि यमुना स्वयं गंगा नदी की सबसे बड़ी सहायक नदी है, इसलिए चंबल नदी का जल निकासी क्षेत्र गंगा बेसिन (घाटी) का हिस्सा है।","चंबल नदी अपनी गहरी खाइयों (बीहड़ों) और मृदा अपरदन के लिए भारत भर में विशेष रूप से जानी जाती है।","यह नदी मध्य प्रदेश और राजस्थान के लिए जल आपूर्ति और सिंचाई का एक अत्यंत प्रमुख प्राकृतिक स्रोत है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"डॉ- भीमराव अंबेडकर मेधावी छात्र पुरस्कार योजना के लिए कौन पात्र है?","o":["केवल ग्रामीण क्षेत्रों के छात्र","कोई भी छात्र जिसने बोर्ड परीक्षा उत्तीर्ण की हो","म-प्र- में कक्षा 10 वीं या 12 वीं में शीर्ष स्थान प्राप्त करने वाले अनुसूचित जाति के छात्र","सामान्य वर्ग के छात्र"],"a":2,"e":["मध्य प्रदेश सरकार की यह पुरस्कार योजना विशेष रूप से अनुसूचित जाति वर्ग के उन प्रतिभावान छात्रों के लिए लागू की गई है जिन्होंने बोर्ड परीक्षाओं (कक्षा 10वीं और 12वीं) में उत्कृष्ट प्रदर्शन कर मेरिट में स्थान बनाया है।","इस योजना के अंतर्गत योग्य छात्रों को शिक्षा को आगे बढ़ाने के लिए नकद पुरस्कार और प्रमाण पत्र प्रदान किए जाते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में होलकर शासन का आधार कौन-सा शहर बना?","o":["भोपाल","ग्वालियर","नागपुर","इंदौर"],"a":3,"e":["मराठा साम्राज्य के अधीन उभरे होलकर राजवंश ने मध्य प्रदेश के इंदौर शहर को अपनी शक्ति और प्रशासन का आधार बनाया था।","इस राजवंश की स्थापना ‘मल्हारराव होलकर’ द्वारा 1732 ई- के आसपास की गई थी।","प्रतापी शासिका ‘देवी अहिल्याबाई होलकर’ ने अपनी राजधनी इंदौर से हटाकर नर्मदा तट पर स्थित ‘महेश्वर’ (खरगोन) में स्थनांतरित कद दी थी। उनके सुशासन के कारण ही इंदौर को ‘होलकरों के शहर’ के रूप में ख्याति मिली।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"अन्नपूर्णा योजना के तहत किसान कितने हेक्टेयर तक के लिए बीजों का आदान-प्रदान कर सकते हैं?","o":["अधिकतम 2 हेक्टेयर तक","अधिकतम 0.5 हेक्टेयर तक","अधिकतम 1 हेक्टेयर तक","कोई सीमा नहीं"],"a":2,"e":["‘अन्नपूर्णा’ और ‘सूरजधारा’ योजनाएं विशेष रूप से अनुसूचित जाति/जनजाति के छोटे व सीमांत किसानों की पैदावार बढ़ाने के लिए हैं। ‘अन्नपूर्णा योजना’ के तहत केवल ‘खाद्यान्न फसलों’ (जैसे गेहूँ, धन) के उन्नत बीजों का आदान-प्रदान किया जाता है। जबकि इसी के साथ चलने वाली ‘सूरजधरा योजना’ के तहत ‘दलहन और तिलहन’ के बीज दिग जाते हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"कौन मध्य प्रदेश की अर्थव्यवस्था का सबसे अच्छा वर्णन करता है?","o":["मुख्य रूप से औद्योगिक और खनन आधारित","उभरते उद्योग के साथ कृषि और पशुपालन","केवल खनिज निर्यात पर निर्भर","मुख्य रूप से मत्स्य पालन और पर्यटन पर आधारित"],"a":1,"e":["मध्य प्रदेश ऐतिहासिक रूप से एक कृषि प्रधान राज्य रहा है, जहाँ आबादी खेती और पशुपालन पर निर्भर करती है। पिछले कुछ दशकों में देवास और पीथमपुर जैसे क्षेत्रों में SEZ की स्थापना से राज्य में विनिर्माण और औद्योगिक क्षेत्रों का भी तेजी से विकास हुआ है।","पीथमपुर धर जिले में स्थित, जिसे ‘भारत का डेट्रायट’ कहा जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"निमाड़ में निर्गुणी गायन के साथ कौन-से वाद्य यंत्र प्रयोग किए जाते हैं?","o":["ढोल और तबला","सितार और हारमोनियम","एकतारा और खड़ताल","चिकारा और मृदंग"],"a":2,"e":["निमाड़ अंचल में ‘निर्गुणी गायन’ भक्ति संगीत की एक समृद्ध परंपरा है, जिसमें संत कबीरदास और सिंगाजी के निराकार ईश्वर वाले पदों का गायन होता है","इस संगीत में जटिल वाद्यों के बजाय सरल वाद्य यंत्रों जैसे ‘एकतारा’ और ‘खड़ताल’ (मंजीरा) का प्रयोग किया जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"भितरगढ़ मध्यम सिंचाई परियोजना किस नदी घाटी से संबंधित है? 177","o":["गोदावरी","नर्मदा","गंगा","तापी"],"a":2,"e":["भितरगढ़ मध्यम सिंचाई परियोजना मध्य प्रदेश के ‘छतरपुर’ जिले में स्थित है।","भितरगढ़ मध्यम सिंचाई परियोजना मध्य प्रदेश के जल संसाधन विभाग द्वारा क्रियान्वित की गई योजना है, जो गंगा नदी घाटी के अंतर्गत स्थित है।","यह परियोजना स्थानीय किसानों को वर्षा जल संचयन से वर्ष भर सिंचाई की सुविधा प्रदान करने म  खराबी के चलते सैटेलाइट को उसकी निर्धारित कक्षा में स्थापित नहीं किया जा सका। यह अंतरिक्ष अनुसंधान के क्षेत्र में आने वाली अनिश्चितताओं को रेखांकित करता है।"]},{"s":"समसामयिकी","q":"कौन-सा चंद्र मिशन इसरो लगभग 2027 में प्रक्षेपित करने की योजना बना रहा है, जिसका उद्देश्य चंद्रमा से नमूने लाकर पृथ्वी पर लौटाना है?","o":["चंद्रयान- 4","चंद्रयान- 5","लूपेक्स","शुक्र ऑर्बिटर मिशन"],"a":0,"e":["चंद्रयान- 3 की शानदार सफलता के बाद, इसरो ने चंद्रमा के रहस्यों को और गहराई से समझने के लिए ‘चंद्रयान- 4’ मिशन की महत्वाकांक्षी योजना बनाई है।","इस आगामी अंतरिक्ष मिशन का मुख्य उद्देश्य चंद्रमा के दक्षिणी ध्रुव के पास उतरकर वहाँ से प्राचीन मिट्टी और चट्टानों के नमूने ( Samples) एकत्र करना है।","एकत्र किए गए इन दुर्लभ नमूनों को सुरक्षित रूप से वापस पृथ्वी पर लाया जाएगा, जिससे वैज्ञानिक चंद्रमा की सटीक उत्पत्ति का और बेहतर अध्ययन कर सकेंगे।"]},{"s":"समसामयिकी","q":"2025 में अरुणाचल प्रदेश में ‘गवर्नर का उत्कृष्टता पदक’ किसे प्रदान किया गया?","o":["मेजर भार्गव कालिता","देविका रोटावन","कर्नल आर- एस- जामवाल","बंदी पेदि्दराजू"],"a":2,"e":["वर्ष 2025 में अरुणाचल प्रदेश के राज्यपाल (लेफ्टिनेंट जनरल के- टी- परनाइक) द्वारा कर्नल आर- एस- जामवाल को ‘गवर्नर मेडेलियन फॉर एक्सीलेंस’ (गवर्नर का उत्कृष्टता पदक) से सम्मानित किया गया।","यह सम्मान उन्हें 11 अगस्त, 2025 को NIMAS निदेशक के रूप में दो बड़े अभियानों (ब्रह्मपुत्र रिवर राफ्टिंग और माउंट कंचनजंगा आरोहण) के नेतृत्व के लिए दिया गया।","वे सातों महाद्वीपों की सर्वाेच्च चोटियों के साथ तीन बार एवरेस्ट चढ़ने वाले पहले भारतीय हैं।"]},{"s":"समसामयिकी","q":"2028 में संयुक्त राष्ट्र जलवायु शिखर सम्मेलन की मेजबानी की तैयारी के लिए किस देश ने COP-33 सेल की स्थापना की है? 201","o":["जर्मनी","रूस","भारत","ब्रा”ाील"],"a":2,"e":["भारत ने वर्ष 2028 में होने वाले प्रतिष्ठित संयुक्त राष्ट्र जलवायु परिवर्तन सम्मेलन ( COP-33) की मेजबानी करने का आधिकारिक प्रस्ताव रखा है।","इस विशाल वैश्विक आयोजन की प्रारंभिक तैयारी और समन्वय सुनिश्चित करने के लिए भारत सरकार द्वारा एक विशेष ‘ COP-33 सेल’ का गठन किया गया है।","यह सेल अंतरराष्ट्रीय जलवायु संधियों, नीतियों और सम्मेलन के सफल आयोजन की रूपरेखा तैयार करने के लिए एक नोडल एजेंसी के रूप में काम करेगा।"]},{"s":"समसामयिकी","q":"2024 में एशियाई बौद्ध शिखर सम्मेलन किस देश में आयोजित किया जाएगा?","o":["भारत","चीन","लाओस","यूके"],"a":0,"e":["2024 का एशियाई बौद्ध शिखर सम्मेलन भारत सरकार के संस्कृति मंत्रालय द्वारा अंतर्राष्ट्रीय बौद्ध परिसंघ के सहयोग से आयोजित किया गया था।","यह सम्मेलन नई दिल्ली, भारत में सफलतापूर्वक संपन्न हुआ। इसका उद्देश्य समृद्ध बौद्ध विरासत साझा करने वाले एशियाई देशों के बीच सांस्कृतिक संबंधों को मजबूत करना था।"]},{"s":"समसामयिकी","q":"जुलाई में हाल ही में आयोजित आधिकारिक फॉर्मूला वन वल्र्ड चैम्पियनशिप रेस किस स्थान पर हुई?","o":["मोनाको","सिल्वरस्टोन","स्पा-प्रफेन्कोरचैमस","बेल्जियम"],"a":2,"e":["फार्मूला वन वल्र्ड चैंपियनशिप रेस 27 जुलाई 2025 को बेल्जियम के स्पा-प्रेंफकोरचैम्प्स सर्विफट पर हुई। मैकलारेन के ऑस्कर पियास्त्री ने यह रेस जीती। यह जुलाई की आखिरी F1 रेस थी।"]},{"s":"समसामयिकी","q":"2025-26 IFAB नियम 11 के अनुसार, गोलकीपर द्वारा थ्रो करते समय खिलाड़ी की ऑफसाइड स्थिति कब निर्धारित की जाती है?","o":["जब गेंद गोलकीपर के हाथ से निकलती है।","जब गेंद साथी खिलाड़ी द्वारा पकड़ी जाती है।","जब गेंद अंतिम बार गोलकीपर के संपर्क में होती है।","जब थ्रो प्राप्तकर्ता की ओर आधे रास्ते में होती है।"],"a":0,"e":["पुफटबॉल के IFAB नियमों के अनुसार, ऑफसाइड का निर्धारण पास दिए जाने के सटीक क्षण पर होता है।","जब गोलकीपर थ्रो के माध्यम से गेंद को आगे बढ़ाता है, तो गेंद के हाथ से छूटने के समय स्थिति देखी जाती है।","यदि उस क्षण कोई खिलाड़ी ऑफसाइड पोि”ाशन में है और खेल में सक्रिय रूप से भाग लेता है, तो उसे दंडित किया जाता है।","यह नियम सुनिश्चित करता है कि हमलावर टीम को अनुचित लाभ न मिल सके।"]},{"s":"समसामयिकी","q":"भारत की प्राचीन पांडुलिपियों को डिजिटल रूप से सुलभ बनाने के लिए कौन-सा प्लेटफ़ॉर्म शु: किया गया था?","o":["भारत ज्ञान संवर्धन पोर्टल","ज्ञान भारतम् पोर्टल","पांडुलिपि विरासत डिजिटल लाइब्रेरी","डिजिटल इंडिया आर्काइव"],"a":1,"e":["भारत की प्राचीन और दुर्लभ पांडुलिपियों को संरक्षित करने के लिए ज्ञान भारतम् पोर्टल की शुरुआत की गई है।","इसका मुख्य उद्देश्य ऐतिहासिक दस्तावेजों और ग्
