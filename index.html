"q":"भारत में लगभग कितनी ऊँचाई पर नम शीतोष्ण वन पाए जाते हैं?","o":["0–500 मीटर","1000–2000 मीटर","3000–3500 मीटर","4000 मीटर से अधिक"],"a":1,"e":["पर्वतीय क्षेत्रों में ऊँचाई बढ़ने के साथ वनस्पति का प्रकार बदलता है।","लगभग 1000 से 2000 मीटर की ऊँचाई पर नम शीतोष्ण वन पाए जाते हैं।","इनमें ओक, चेस्टनट और चौड़ी पत्ती वाले सदाबहार वृक्ष प्रमुख हैं।","3000 मीटर से ऊपर अल्पाइन वन-चरागाह पाए जाते हैं।"]},{"s":"भूगोल","q":"BRO द्वारा चंडीगढ़ को मनाली और लेह से जोड़ने वाली सड़क की औसत ऊँचाई लगभग कितनी है?","o":["2,500 मीटर","3,000 मीटर","4,270 मीटर","5,000 मीटर"],"a":2,"e":["सीमा सड़क संगठन ( BRO) की स्थापना 1960 में हुई थी। 37","चंडीगढ़-मनाली-लेह मार्ग अत्यधिक ऊँचाई वाले मार्गों में शामिल है।","इसकी औसत ऊँचाई लगभग 4,270 मीटर बताई जाती है।","इस मार्ग पर बारालाचा-ला और तंगलंग-ला जैसे दर्रे आते हैं।"]},{"s":"भूगोल","q":"भारत में पहाड़ी क्षेत्र विकास कार्यक्रम पहली बार किस पंचवर्षीय योजना के दौरान शु: किया गया था?","o":["द्वितीय पंचवर्षीय योजना","पाँचवीं पंचवर्षीय योजना","छठी पंचवर्षीय योजना","सातवीं पंचवर्षीय योजना"],"a":1,"e":["पहाड़ी क्षेत्र विकास कार्यक्रम पाँचवीं पंचवर्षीय योजना में आरंभ किया गया।","पाँचवीं पंचवर्षीय योजना की अवधि 1974–79 थी।","इसका उद्देश्य पर्वतीय क्षेत्रों का पारिस्थितिकी-संतुलित और संसाधन-आधारित विकास था।","पाँचवीं योजना का प्रमुख लक्ष्य गरीबी उन्मूलन और आत्मनिर्भरता था।"]},{"s":"भूगोल","q":"वह प्रक्रिया जिसमें गर्म हवा सीधे ऊपर उठती है और गर्मी को ऊपर की ओर स्थानांतरित करती है, क्या कहलाती है?","o":["चालन ( Conduction)","प्रवहन ( Advection)","संवहन ( Convection)","विकिरण ( Radiation)"],"a":2,"e":["संवहन ( Convection) में गर्म वायु हल्की होकर ऊपर उठती है।","चालन में ऊष्मा संपर्क द्वारा स्थानांतरित होती है।","प्रवहन में ऊष्मा का स्थानांतरण मुख्यतः क्षैतिज दिशा में होता है।","विकिरण में ऊष्मा विद्युत-चुम्बकीय तरंगों के रूप में स्थानांतरित होती है।"]},{"s":"भूगोल","q":"भारत में चक्रवात की चेतावनी और निगरानी के लिए कौन-सी एजेंसी जिम्मेदार है?","o":["राष्ट्रीय आपदा प्रबंधन प्राधिकरण (NDMA)","भारत मौसम विज्ञान विभाग (IMD)","केंद्रीय जल आयोग","राष्ट्रीय रिमोट सेंसिंग केंद्र"],"a":1,"e":["भारत मौसम विज्ञान विभाग ( IMD) की स्थापना 1875 में हुई।","IMD चक्रवातों की उत्पत्ति, मार्ग और तीव्रता की निगरानी करता है।","यह चक्रवातों के संबंध में चेतावनी जारी करता है।","NDMA मुख्यतः आपदा प्रबंधन संबंधी नीतियों से जुड़ा है।"]},{"s":"भूगोल","q":"2025 तक भारत का सबसे ”यादा मरकरी-प्रदूषित क्षेत्र कौन-सा है?","o":["कोडाइकनाल, तमिलनाडु","वापी, गुजरात","अंकलेश्वर, गुजरात","कोरबा, छत्तीसगढ़"],"a":0,"e":["तमिलनाडु के कोडाइकनाल में स्थित थर्मामीटर कारखाने से पारा प्रदूषण हुआ था।","यह संयंत्र 2001 में बंद कर दिया गया।","मिट्टी और आसपास के शोला वन क्षेत्र में पारे के अवशेष पाए गए।","इसी संदर्भ में कोडाइकनाल को पारा-प्रदूषण के लिए प्रमुख क्षेत्र माना जाता है।"]},{"s":"भूगोल","q":"लेटराइट मिट्टी में आमतौर पर किसकी कमी होती है?","o":["जल","नमक","पादप पोषक तत्व","रेत के कण"],"a":2,"e":["लेटराइट मिट्टी उच्च तापमान और अत्यधिक वर्षा वाले क्षेत्रों में निक्षालन से बनती है।","भारी वर्षा से कई घुलनशील पोषक तत्व बह जाते हैं।","इसमें नाइट्रोजन, फॉस्फोरस, पोटाश, कैल्शियम और ह्यूमस की कमी रहती है।","अतः इसमें सामान्यतः पादप पोषक तत्वों की कमी होती है।"]},{"s":"भूगोल","q":"भारत के उष्णकटिबंधीय सदाबहार वनों में कौन-सा वृक्ष वाणिज्यिक दृष्टि से महत्त्वपूर्ण है?","o":["पाइन","बाँस","आबनूस (एबनी)","नीम"],"a":2,"e":["उष्णकटिबंधीय सदाबहार वन अधिक वर्षा वाले क्षेत्रों में पाए जाते हैं।","इनमें आबनूस, महोगनी और रोजवुड जैसे वाणिज्यिक वृक्ष मिलते हैं।","आबनूस की लकड़ी काली, भारी और टिकाऊ होती है।","इसका उपयोग महँगे फर्नीचर और वाद्ययंत्रों में किया जाता है।"]},{"s":"भूगोल","q":"2025 तक भारत में कुल सड़क लंबाई में नेशनल हाईवे का हिस्सा लगभग कितने प्रतिशत होगा?","o":["2%","10%","15%","25%"],"a":0,"e":["भारत का सड़क तंत्र विश्व के सबसे बड़े सड़क नेटवर्कों में शामिल है।","राष्ट्रीय राजमार्गों की लंबाई कुल सड़क नेटवर्क की तुलना में बहुत कम है।","स्रोत सामग्री के अनुसार राष्ट्रीय राजमार्ग कुल सड़क लंबाई का लगभग 2% हैं।","इसके बावजूद राष्ट्रीय राजमार्ग देश के सड़क यातायात का बड़ा हिस्सा वहन करते हैं।","वर्ष 2025 में राष्ट्रीय राजमार्गों की कुल लंबाई लगभग 1,46,195 किमी दर्ज की गई थी।"]},{"s":"भूगोल","q":"भारतीय रेलवे की शुरुआत सबसे पहले कब हुई थी?","o":["1848","1853","1861","1870"],"a":1,"e":["भारत में पहली यात्री रेलगाड़ी 16 अप्रैल 1853 को चली थी। 38","यह बोरीबंदर (मुंबई) से ठाणे तक चली।","इसने लगभग 34 किलोमीटर की दूरी तय की।","यह घटना लॉर्ड डलहौ”ाी के गवर्नर-जनरल काल में हुई।"]},{"s":"भूगोल","q":"ब्रॉड गेज में भारतीय रेल की पटरियों के बीच लगभग कितनी दूरी होती है?","o":["1.676 मीटर","1.524 मीटर","1.0 मीटर","0.762 मीटर"],"a":0,"e":["भारतीय ब्रॉड गेज में दोनों पटरियों के बीच की दूरी 1.676 मीटर होती है।","यह लगभग 5 फीट 6 इंच के बराबर है।","मीटर गेज में यह दूरी 1 मीटर होती है।","प्रोजेक्ट यूनिगेज के तहत कई छोटी लाइनों को ब्रॉड गेज में परिवर्तित किया गया।","नैरो गेज ( Narrow Gauge) की चौड़ाई 0.762 मीटर ( 762 मिमी) या 0.610 मीटर ( 610 मिमी) होती है।"]},{"s":"भूगोल","q":"कौन-सा मोटा अनाज भारत के कुल खेती वाले क्षेत्र का लगभग 5.2% हिस्सा घेरता है?","o":["मक्का","बाजरा","चावल","जौ"],"a":1,"e":["बाजरा भारत का प्रमुख मोटा अनाज है।","यह शुष्क और अल्प वर्षा वाले क्षेत्रों में उगाया जाता है।","स्रोत सामग्री के अनुसार यह कुल फसली क्षेत्र का लगभग 5.2% भाग घेरता है।","राजस्थान, महाराष्ट्र, गुजरात, उत्तर प्रदेश और हरियाणा इसके प्रमुख उत्पादक हैं।"]},{"s":"भूगोल","q":"ओ”ाोन वायुमंडल में लगभग कहाँ पाया जाता है और इसका मुख्य कार्य क्या है?","o":["0–10 किमी, ग्रीनहाउस ऊष्मा","10–50 किमी, हानिकारक पराबैंगनी विकिरण को अवशोषित करना","50–100 किमी, पराबैंगनी विकिरण का उत्पादन करना","100 किमी से ऊपर, पराबैंगनी विकिरण को स्थिर करना"],"a":1,"e":["ओ”ाोन की सर्वाधिक सांद्रता समतापमंडल में पाई जाती है।","यह लगभग 10 से 50 किमी की ऊँचाई वाले क्षेत्र में स्थित है।","ओ”ाोन सूर्य से आने वाली हानिकारक पराबैंगनी किरणों को अवशोषित करती है।","इसी कारण ओ”ाोन परत पृथ्वी के लिए सुरक्षा कवच का कार्य करती है।"]},{"s":"भूगोल","q":"पृथ्वी को सूर्य से प्राप्त होने वाली ऊर्जा किस नाम से जानी जाती है?","o":["स्थलीय विकिरण ( Terrestrial Radiation)","सौर विकिरण ( Insolation)","ऊष्मा बजट ( Heat Budget)","परावर्तन गुणांक ( Albedo)"],"a":1,"e":["सूर्य से पृथ्वी की सतह पर पहुँचने वाली ऊर्जा को इन्सोलेशन ( Incoming Solar Radiation) कहते हैं।","पृथ्वी द्वारा वापस भेजी गई ऊर्जा स्थलीय विकिरण कहलाती है।","आगत और निर्गत ऊर्जा के संतुलन को ऊष्मा बजट कहते हैं।","अल्बीडो किसी सतह द्वारा परावर्तित सौर विकिरण का अनुपात है।"]},{"s":"भूगोल","q":"भारत में सरदार सरोवर बाँध किस नदी पर बनाया गया है?","o":["नर्मदा","तापी","गोदावरी","माही"],"a":0,"e":["सरदार सरोवर बाँध गुजरात में नर्मदा नदी पर बनाया गया है।","यह नर्मदा घाटी परियोजना का प्रमुख बाँध है।","इससे गुजरात, मध्य प्रदेश, महाराष्ट्र और राजस्थान लाभान्वित होते हैं।","इसी बाँध के निकट स्टैच्यू ऑफ यूनिटी स्थित है।"]},{"s":"भूगोल","q":"भारत का नीलगिरी बायोस्फीयर रि”ार्व किस विशिष्ट प्रजाति के लिए प्रसिद्ध है?","o":["लायन-टेल्ड मकाक","एशियाई शेर","एक सींग वाला गैंडा","हिम तेंदुआ"],"a":0,"e":["नीलगिरी बायोस्फीयर रि”ार्व भारत का प्रथम बायोस्फीयर रि”ार्व है, जिसकी स्थापना 1986 में हुई।","यह तमिलनाडु, केरल और कर्नाटक में पैफला हुआ है।","यहाँ सिंहपुच्छी वानर ( Lion-tailed Macaque) और नीलगिरि तहर जैसी प्रजातियाँ पाई जाती हैं।","एशियाई शेर गिर, एक सींग वाला गैंडा का”ाीरंगा तथा हिम तेंदुआ हिमालयी क्षेत्रों से संबंधित है।"]},{"s":"भूगोल","q":"भारत में किन राज्यों के समूह में खनन-जनित वनों की कटाई के कारण गंभीर भूमि क्षरण हुआ है?","o":["पंजाब, हरियाणा, गुजरात, महाराष्ट्र","झारखंड, छत्तीसगढ़, मध्य प्रदेश, ओडिशा","राजस्थान, केरल, तमिलनाडु, कर्नाटक","हिमाचल प्रदेश, उत्तराखंड, असम, मेघालय"],"a":1,"e":["झारखंड, छत्तीसगढ़, मध्य प्रदेश और ओडिशा भारत की प्रमुख खनिज पेटी में आते हैं।","यहाँ कोयला, लौह अयस्क और बॉक्साइट के खुले खनन के लिए बड़े पैमाने पर वन काटे गए।","इससे मृदा अपरदन, अपशिष्ट-ढेर और जल प्रदूषण के कारण गंभीर भूमि क्षरण हुआ।"]},{"s":"भूगोल","q":"भारत में काली मिट्टी मुख्यतः किस क्षेत्र में पाई जाती है?","o":["हिमालयी क्षेत्र","थार मरुस्थल","दक्कन ट्रैप क्षेत्र","गंगा के मैदान"],"a":2,"e":["39","काली मिट्टी (रेगुर मिट्टी) दक्कन ट्रैप के बेसाल्ट लावा के अपक्षय से बनी है।","यह महाराष्ट्र, मध्य प्रदेश, गुजरात, आंध्र प्रदेश और तमिलनाडु के कुछ भागों में पैफली है।","इसमें नमी धारण करने की क्षमता अधिक होती है और यह कपास की खेती के लिए उपयुक्त मानी जाती है।","गंगा के मैदान में जलोढ़ तथा थार में मरुस्थलीय बलुई मिट्टी पाई जाती है।"]},{"s":"भूगोल","q":"भारत के पूर्वी तटीय मैदानों के साथ स्थित एक महत्त्वपूर्ण झील कौन-सी है?","o":["चिलिका झील","सांभर झील","डल झील","वेम्बनाड झील"],"a":0,"e":["चिलिका झील ओडिशा में पूर्वी तटीय मैदान पर स्थित है।","यह भारत की सबसे बड़ी लवणीय लैगून झील है।","यह रामसर स्थल है तथा प्रवासी पक्षियों और इरावदी डॉल्फिन के लिए प्रसिद्ध है।","वेम्बनाड झील केरल के पश्चिमी तटीय मैदान पर स्थित है।"]},{"s":"भूगोल","q":"राजस्थान में मुख्य अभ्रक बेल्ट मोटे तौर पर किस शहर से किस शहर तक पैफली हुई है?","o":["जयपुर से उदयपुर","जोधपुर से बीकानेर","कोटा से अजमेर","जोधपुर से कोटा"],"a":0,"e":["राजस्थान की प्रमुख अभ्रक पेटी अरावली श्रेणी के सहारे जयपुर से उदयपुर तक पैफली है।","इसकी लंबाई लगभग 320 किमी- बताई गई है।","यह भीलवाड़ा, अजमेर, टोंक और उदयपुर जिलों से होकर गुजरती है।","अभ्रक का उपयोग उसके उत्कृष्ट विद्युत-रोधी गुणों के कारण किया जाता है।"]},{"s":"भूगोल","q":"निम्नलिखित में से कौन-सा भारतीय राज्य-जिला यूरेनियम खनन गतिविधि के लिए सही रूप से जाना जाता है?","o":["हिमाचल प्रदेश – कुल्लू","झारखंड – सिंहभूम","ओडिशा – महानदी डेल्टा","गुजरात – कच्छ"],"a":1,"e":["झारखंड के पूर्वी सिंहभूम जिले में स्थित जादूगोड़ा प्रमुख यूरेनियम खनन क्षेत्र है।","यहाँ यूरेनियम कॉर्पोरेशन ऑफ इंडिया लिमिटेड ( UCIL) द्वारा खनन किया जाता है।","भाटिन, नरवापहाड़ और तुरामडीह भी इसी क्षेत्र की यूरेनियम खानों में शामिल हैं।"]},{"s":"भूगोल","q":"भारतीय हिमालय में “नीली भेड़” ( Blue Sheep) किस जानवर को कहा जाता है?","o":["भरल","आइबेक्स","कियांग","तिब्बती मृग"],"a":0,"e":["भरल ( Pseudois nayaur) को अंग्रे”ाी में Blue Sheep कहा जाता है।","यह लद्दाख, हिमाचल प्रदेश, उत्तराखंड और सिक्किम के ऊँचे पर्वतीय क्षेत्रों में पाया जाता है।","यह हिम तेंदुए का प्रमुख आहार-जीव है।","कियांग तिब्बती जंगली गधा तथा चि: तिब्बती मृग है।"]},{"s":"भूगोल","q":"भारत में आ”ाादी के बाद सड़कों की स्थिति सुधारने के लिए बीस वर्षीय सड़क योजना कब शु: की गई थी?","o":["1980","1990","1961","1971"],"a":2,"e":["स्वतंत्रता के बाद सड़कों के नियोजित विकास के लिए 1943 में नागपुर योजना बनी थी।","दूसरी बीस-वर्षीय सड़क योजना 1961 में आरंभ की गई।","इसे बॉम्बे रोड प्लान भी कहा जाता है और इसकी अवधि 1961–1981 थी।","इसमें ग्रामीण क्षेत्रों को मंडियों और राजमार्गों से जोड़ने पर बल दिया गया।"]},{"s":"भूगोल","q":"भारत में नेशनल हाईवे के निर्माण और रखरखाव के लिए कौन-सी सरकारी संस्था जिम्मेदार है?","o":["राज्य सरकारें","स्थानीय नगरपालिकाएँ","केंद्र सरकार","प्राइवेट कंपनियाँ"],"a":2,"e":["राष्ट्रीय राजमार्ग केंद्र सरकार के अधीन आते हैं।","इनका उत्तरदायित्व सड़क परिवहन एवं राजमार्ग मंत्रालय के पास है।","निर्माण और रखरखाव में भारतीय राष्ट्रीय राजमार्ग प्राधिकरण ( NHAI) की प्रमुख भूमिका है।","राज्य राजमार्ग राज्य सरकारों के अधीन होते हैं।"]},{"s":"भूगोल","q":"तापमान के आधार पर पृथ्वी के वायुमंडल को कितनी मुख्य परतों में बाँटा गया है?","o":["3","4","5","6"],"a":2,"e":["तापमान की विशेषताओं के आधार पर वायुमंडल को पाँच मुख्य परतों में विभाजित किया जाता है।","ये हैं–क्षोभमंडल, समतापमंडल, मध्यमंडल, तापमंडल और बाह्यमंडल।","क्षोभमंडल में मौसम संबंधी अधिकांश घटनाएँ होती हैं।","समतापमंडल में ओ”ाोन परत स्थित है।"]},{"s":"भूगोल","q":"पेड़ की शाखाओं जैसा दिखाई देने वाला जल निकासी पैटर्न क्या कहलाता है?","o":["रेडियल","ट्रेलिस","डेंड्राइटिक","सेंट्रिपिटल"],"a":2,"e":["डेंड्राइटिक (वृक्षाकार) अपवाह प्रति:प पेड़ की शाखाओं जैसा दिखाई देता है।","यह वहाँ बनता है जहाँ चट्टानें सम:प हों और ढाल सामान्यतः एक दिशा में हो। 40","रेडियल प्रति:प में नदियाँ किसी ऊँचे भाग से चारों ओर बहती हैं।","सेंट्रिपिटल प्रति:प में नदियाँ किसी केंद्रीय गर्त की ओर बहती हैं।"]},{"s":"भूगोल","q":"निम्नलिखित में से भारत का कौन-सा क्षेत्र केसर की खेती के लिए सबसे प्रसिद्ध है?","o":["कश्मीर घाटी","नीलगिरी पहाड़ियाँ","दून घाटी","कोंकण क्षेत्र"],"a":0,"e":["केसर दुनिया का सबसे महँगा मसाला है, जिसकी खेती के लिए विशेष ठंडी जलवायु और मिट्टी की आवश्यकता होती है। भारत में केसर की व्यावसायिक खेती विशेष रूप से केंद्र शासित प्रदेश जम्मू और कश्मीर की ‘कश्मीर घाटी’ (पामपोर क्षेत्र) में की जाती है। भूगोल के अनुसार, यहाँ की विशेष करेवा मिट्टी केसर की वृद्धि के लिए सबसे उपयुक्त होती है। कश्मीरी केसर को उसकी बेहतरीन गुणवत्ता, गहरे लाल रंग और ते”ा सुगंध के लिए भौगोलिक संकेतक ( GI टैग) भी प्राप्त है।"]},{"s":"भूगोल","q":"अनुसूचित जनजातियाँ मुख्य रूप से भारत के किस क्षेत्र में केंद्रित हैं?","o":["शहरी महानगर","तटीय मैदान","मध्य भारत और उत्तर-पूर्व","इंडो-गंगा का मैदान"],"a":2,"e":["भारत में अनुसूचित जनजातियों (एसटी) की एक बड़ी और विविध आबादी निवास करती है। आदिवासी आबादी भौगोलिक रूप से देश भर में समान रूप से नहीं पैफली है, बल्कि कुछ विशिष्ट क्षेत्रों में भारी रूप से केंद्रित है।","आदिवासियों का सबसे बड़ा जमाव ‘मध्य भारत’ (मध्य प्रदेश, छत्तीसगढ़, झारखंड, ओडिशा) के पठारी और वन क्षेत्रों में है। इसके अलावा, भारत का ‘उत्तर-पूर्वी’ क्षेत्र (नागालैंड, मिजोरम, मेघालय आदि) आदिवासी बहुल है जहाँ उनका प्रतिशत सबसे अधिक है।"]},{"s":"भूगोल","q":"निम्नलिखित में से कौन-सी भारत में स्थित एक रामसर आद्र्रभूमि स्थल है?","o":["सिलसाको झील","सुखना झील","चंदुबी झील","चिलिका झील"],"a":3,"e":["चिलिका झील ओडिशा राज्य में स्थित है, जो भारत की सबसे बड़ी खारे पानी की लैगून झील है। इसे 1981 में भारत के पहले रामसर आद्र्रभूमि स्थल के रूप में मान्यता मिली थी। यह प्रवासी पक्षियों और लुप्तप्राय इरावदी डॉल्फिन के लिए एक प्रमुख शीतकालीन आश्रय स्थल है।"]},{"s":"भूगोल","q":"आर्थिक भूगोल में “ब्रेक-ऑफ-बल्क पॉइंट” शब्द का तात्पर्य किससे है?","o":["वह स्थान जहाँ वस्तुएँ निर्मित की जाती हैं","वह स्थान जहाँ वस्तुएँ एक परिवहन साधन से दूसरे में स्थानांतरित की जाती हैं","वह स्थान जहाँ मुक्त व्यापार समझौते होते हैं","वह स्थान जहाँ वस्तुएँ उपभोक्ताओं को बेची जाती हैं"],"a":1,"e":["यह भूगोल में वह विशिष्ट स्थान होता है जहाँ थोक माल को एक परिवहन साधन (जैसे जहाज) से दूसरे (जैसे ट्रेन या ट्रक) में स्थानांतरित किया जाता है। बंदरगाह, बड़े रेलवे जंक्शन और अंतरराष्ट्रीय हवाई अड्डे इसके सबसे सटीक और प्रमुख उदाहरण होते हैं।","यहाँ बड़े माल (बल्क) को छोटे हिस्सों में बाँटकर आगे के सफर और वितरण के लिए तैयार किया जाता है। इस प्रक्रिया के कारण इन स्थानों पर अक्सर वाणिज्यिक गतिविधियों और औद्योगिक केंद्रों का तेजी से विकास होता है।"]},{"s":"भूगोल","q":"निम्नलिखित में से भारत का सबसे प्राचीन स्थल:प कौन-सा है?","o":["थार मरुस्थल","इंडो-गंगेटिक मैदान","पश्चिमी घाट","अरावली पर्वतमाला"],"a":3,"e":["अरावली पर्वतमाला भारत का सबसे प्राचीन स्थल:प होने के साथ-साथ विश्व के सबसे पुराने वलित (फोल्ड) पर्वतों में से एक है।","भूगोल के अनुसार, यह प्रीकैम्ब्रियन युग की संरचना है जो समय के साथ अपरदित होकर अब एक अवशिष्ट पर्वत बन गई है। इसका विस्तार भारत के उत्तर-पश्चिम में गुजरात से शु: होकर राजस्थान और हरियाणा होते हुए दिल्ली तक है। माउंट आबू स्थित ‘गुरु शिखर’ इस विशाल और प्राचीन पर्वतमाला की सबसे ऊँची चोटी है।"]},{"s":"भूगोल","q":"केन नदी निम्नलिखित में से किस नदी की सहायक नदी है?","o":["बेतवा नदी","यमुना नदी","चंबल नदी","सोन नदी"],"a":1,"e":["केन नदी बुंदेलखंड क्षेत्र की एक बहुत ही महत्त्वपूर्ण और प्रमुख नदी है, जो मध्य प्रदेश के कटनी जिले में कैमूर की पहाड़ियों से निकलती है।","यह नदी उत्तर दिशा में बहते हुए मध्य प्रदेश के पन्ना राष्ट्रीय उद्यान से होकर गुजरती है और प्राकृतिक छटा बिखेरती है। लगभग 427 किलोमीटर की लंबी यात्रा तय करने के बाद, यह उत्तर प्रदेश के बांदा जिले में चिल्ला घाट के पास यमुना नदी में मिल जाती है।","भारत सरकार की महत्त्वाकांक्षी ‘केन-बेतवा 41 नदी लिंक परियोजना’ के तहत इस नदी का अतिरिक्त जल बेतवा नदी में ले जाने की योजना पर कार्य चल रहा है।"]},{"s":"भूगोल","q":"निम्नलिखित में से कौन-सी एक प्रमुख नदी है जो बंगाल की खाड़ी में गिरती है?","o":["नर्मदा","तापी","महानदी","साबरमती"],"a":2,"e":["महानदी मध्य भारत और पूर्वी भारत की एक बहुत ही प्रमुख नदी है जो छत्तीसगढ़ के धमतरी जिले से निकलकर ओडिशा होते हुए बहती है। यह नदी पूर्व दिशा की ओर प्रवाहित होते हुए अपना एक बहुत बड़ा डेल्टा बनाती है और अंततः बंगाल की खाड़ी में गिरती है।"]},{"s":"भूगोल","q":"चंबल नदी निम्नलिखित में से किन राज्यों से होकर बहती है?","o":["मध्य प्रदेश - छत्तीसगढ़ - ओडिशा","मध्य प्रदेश - राजस्थान - उत्तर प्रदेश","गुजरात - महाराष्ट्र - मध्य प्रदेश","मध्य प्रदेश - बिहार - झारखंड"],"a":1,"e":["चंबल नदी मध्य भारत की एक बहुत ही प्रमुख और अपेक्षाकृत सबसे कम प्रदूषित नदी है, जो मध्य प्रदेश के इंदौर जिले के पास महू (जानापाव की पहाड़ियों) से निकलती है। उद्गम के बाद यह उत्तर दिशा में बहते हुए मध्य प्रदेश को पार करती है और फिर राजस्थान (कोटा, सवाई माधोपुर) राज्य में प्रवेश करती है।","राजस्थान से बहने के बाद यह नदी मध्य प्रदेश और राजस्थान के बीच एक प्राकृतिक सीमा का निर्माण करते हुए उत्तर प्रदेश में प्रवेश करती है। अंततः यह नदी उत्तर प्रदेश के इटावा शहर के पास ‘पंचनद’ नामक स्थान पर यमुना नदी में समाहित हो जाती है।"]},{"s":"भूगोल","q":"बेतवा नदी अंततः किस प्रमुख नदी में जाकर मिलती है?","o":["गंगा","नर्मदा","यमुना","सोन"],"a":2,"e":["बेतवा नदी (प्राचीन नाम वेत्रवती) मध्य प्रदेश के रायसेन जिले के कुमरा या झिरी गाँव (विंध्य पर्वतमाला) से अपना सफर शु: करती है। यह नदी उत्तर-पूर्व दिशा में प्रवाहित होते हुए मध्य प्रदेश (सांची, विदिशा, ओरछा) और उत्तर प्रदेश के बुंदेलखंड क्षेत्र को पार करती है। लगभग 590 किलोमीटर लंबी यात्रा तय करने के बाद, यह उत्तर प्रदेश के हमीरपुर जिले के पास ‘यमुना नदी’ के दाहिने तट पर मिल जाती है।","चूँकि यह सीधे यमुना में मिलती है, इसलिए बेतवा नदी विस्तृत और प्रमुख यमुना जल अपवाह तंत्र का एक अभिन्न अंग है।"]},{"s":"भूगोल","q":"कौन-सा जनसांख्यिकीय शब्द उस स्थिति को दर्शाता है जब जन्म दर प्रतिस्थापन स्तर से नीचे गिर जाती है, जिससे दीर्घकालिक जनसंख्या में गिरावट होती है?","o":["जनसंख्या संवेग","प्रतिस्थापन से कम प्रजनन दर","आश्रित अनुपात","जनसांख्यिकीय लाभांश"],"a":1,"e":["प्रतिस्थापन प्रजनन दर वह न्यूनतम दर (लगभग 2.1 बच्चे प्रति महिला) है जिस पर एक पीढ़ी बिना किसी वृद्धि या कमी के खुद को पूरी तरह से प्रतिस्थापित कर लेती है।","जब किसी देश की कुल प्रजनन दर इस 2.1 के स्तर से लगातार नीचे चली जाती है, तो उस स्थिति को ‘प्रतिस्थापन से कम प्रजनन दर’ कहा जाता है। लंबे समय तक इस स्थिति के बने रहने से देश की मृत्यु दर जन्म दर से अधिक हो जाती है, जिसके परिणामस्व:प जनसंख्या में गिरावट और उम्रदरा”ा आबादी में वृद्धि (जैसे जापान में) होने लगती है।","वर्तमान में कई विकसित देश और भारत के कुछ राज्य (जैसे केरल और सिक्किम) इसी जनसांख्यिकीय चुनौती का सामना कर रहे हैं।"]},{"s":"भूगोल","q":"जनगणना शब्दावली में “मार्जिनल वर्कर” शब्द का तात्पर्य किससे है?","o":["स्वयं-रोजगार करने वाला कार्यकर्ता","वह व्यक्ति जो वर्ष में 6 महीने से कम काम करता है","कार्य की तलाश में बेरोजगार व्यक्ति","पारंपरिक शिल्प में संलग्न व्यक्ति"],"a":1,"e":["भारत की जनगणना में कार्यबल को मुख्य रूप से दो श्रेणियों में बाँटा जाता हैः मुख्य कार्यकर्ता और सीमांत कार्यकर्ता।","सीमांत कार्यकर्ता वह व्यक्ति होता है जिसे संदर्भ वर्ष (पूरे साल) के दौरान 6 महीने (यानी 183 दिन) से कम समय के लिए काम मिलता है।","जो व्यक्ति वर्ष में 183 दिन या उससे अधिक समय तक किसी भी प्रकार का आर्थिक रूप से उत्पादक कार्य करता है, उसे ‘मुख्य कार्यकर्ता’ माना जाता है। यह वर्गीकरण देश में अल्प-रोजगार और मौसमी बेरोजगारी के स्तर को समझने के लिए अत्यंत महत्त्वपूर्ण है।"]},{"s":"भूगोल","q":"अंतः उष्णकटिबंधीय अभिसरण क्षेत्र (आईटीसीजेड) उत्तर और दक्षिण की ओर किसके साथ स्थानांतरित होता है?","o":["पृथ्वी का घूर्णन","सूर्य की मौसमी गति","टेक्टोनिक प्लेटों की गति","महासागरीय धाराओं का उलट"],"a":1,"e":["अंतः उष्णकटिबंधीय अभिसरण क्षेत्र भूमध्य रेखा के पास स्थित एक निम्न दबाव वाला क्षेत्र है जहाँ उत्तर-पूर्वी और दक्षिण-पूर्वी व्यापारिक हवाएँ मिलती हैं। 42","यह क्षेत्र पृथ्वी पर स्थायी नहीं है, बल्कि सूर्य की आभासी मौसमी गति के साथ उत्तर और दक्षिण की ओर खिसकता है।","गर्मियों (जून) में जब सूर्य कर्क रेखा पर सीधा चमकता है, तो यह क्षेत्र उत्तर की ओर खिसक कर भारतीय मानसून को सक्रिय करता है।","सर्दियों में जब सूर्य मकर रेखा की ओर बढ़ता है, तो यह क्षेत्र भूमध्य रेखा के दक्षिण में स्थानांतरित हो जाता है, जिससे हवाओं की दिशा बदल जाती है।"]},{"s":"भूगोल","q":"निम्नलिखित में से कौन हिमालयी नदियों का सही वर्णन करता है?","o":["मौसमी और वर्षा पर निर्भर","बारहमासी और हिमनदों से पोषित","अंतः प्रवाही","भूमिगत नदियाँ"],"a":1,"e":["गंगा, सिंधु और ब्रह्मपुत्र जैसी सभी प्रमुख हिमालयी नदियां अपनी प्रकृति में बारहमासी होती हैं।","इसका मुख्य कारण यह है कि इन्हें केवल मानसूनी वर्षा से ही नहीं, बल्कि ऊँचे हिमालय के पिघलते हिमनदों से भी लगातार जल प्राप्त होता है।","इसी दोहरे जलस्रोत (वर्षा और बर्फ) के कारण इन नदियों में पूरे वर्ष पानी का प्रवाह बना रहता है और ये कभी पूरी तरह नहीं सूखती हैं।","इसके विपरीत, प्रायद्वीपीय नदियाँ (जैसे गोदावरी, कृष्णा) मुख्य रूप से मौसमी होती हैं क्योंकि वे पूरी तरह से वर्षा जल पर निर्भर करती हैं।"]},{"s":"भूगोल","q":"बेतवा नदी यमुना की किस ओर से एक प्रमुख सहायक नदी है?","o":["बायाँ तट","दायाँ तट","पूर्वी तट","पश्चिमी तट"],"a":1,"e":["बेतवा नदी, जिसे प्राचीन काल में वेत्रवती कहा जाता था, यमुना नदी की सबसे प्रमुख ‘दाएँ तट’ की सहायक नदी है।","यह मध्य प्रदेश के रायसेन जिले में विंध्य पर्वतमाला (कुमरा गाँव) से निकलती है और उत्तर-पूर्व दिशा में बहते हुए उत्तर प्रदेश में प्रवेश करती है।","यमुना नदी मुख्य रूप से दक्षिण-पूर्व दिशा में बहती है, और बेतवा दक्षिण की ओर से आकर उत्तर प्रदेश के हमीरपुर के पास यमुना के दाहिने किनारे पर उससे मिल जाती है।","चंबल, सिंध और केन नदियाँ भी बेतवा की तरह यमुना की प्रमुख दाएँ तट की सहायक नदियाँ हैं जो प्रायद्वीपीय पठार से निकलती हैं।"]},{"s":"भूगोल","q":"प्रफांस या जापान जैसे देशों में प्रोनैटलिस्ट नीतियों का मुख्य उद्देश्य क्या है?","o":["परिवार नियोजन को बढ़ावा देना","प्रवासन को कम करना","उच्च जन्म दर को प्रोत्साहित करना","आश्रित अनुपात को कम करना"],"a":2,"e":["जनसांख्यिकी और सामाजिक नीतियों में ‘प्रोनैटलिस्ट नीतियाँ’ वे सरकारी नीतियाँ होती हैं जिनका मुख्य उद्देश्य देश में उच्च जन्म दर को प्रोत्साहित करना है।","जापान, प्रफांस, स्वीडन और कई अन्य यूरोपीय देश जहाँ जन्म दर बहुत तेजी से घट रही है और उनकी आबादी लगातार बूढ़ी हो रही है, वहाँ ये नीतियाँ लागू की गई हैं।","इन नीतियों के तहत सरकारों द्वारा लोगों को बच्चे पैदा करने के लिए प्रेरित किया जाता है, जिसके लिए उन्हें करों में भारी छूट, बाल देखभाल भत्ते, और लंबा सवेतन मातृत्व/पितृत्व अवकाश दिया जाता है।","इसके बिल्कुल विपरीत, ‘एंटी-नैटलिस्ट नीतियाँ’ (जैसे चीन की पूर्व की एक-संतान नीति) जनसंख्या वृद्धि को रोकने और जन्म दर को कम करने के लिए लागू की जाती हैं।"]},{"s":"भूगोल","q":"जनगणना 2011 के अनुसार, निम्नलिखित में से किस शहर की शहरी जनसंख्या सबसे अधिक थी?","o":["मुंबई","कोलकाता","बेंगलुरु","दिल्ली"],"a":0,"e":["भारत की आधिकारिक जनगणना 2011 के आँकड़ों के अनुसार, ‘ग्रेटर मुंबई’ देश का सबसे अधिक शहरी आबादी वाला शहर था।","उस समय मुंबई की कुल शहरी आबादी 1.84 करोड़ ( 18.4 मिलियन) से अधिक दर्ज की गई थी, जो इसे देश का सबसे बड़ा महानगर बनाती है।","मुंबई के बाद इस सूची में दिल्ली ( 1.63 करोड़) दूसरे स्थान पर और कोलकाता ( 1.41 करोड़) तीसरे स्थान पर रहे।","यह अत्यधिक शहरी आबादी मुख्य रूप से रोजगार और बेहतर आर्थिक अवसरों की तलाश में ग्रामीण क्षेत्रों से शहरों की ओर होने वाले भारी प्रवास का परिणाम है।"]},{"s":"भूगोल","q":"मेघालय पठार किस बड़े स्थल:प का विस्तार है?","o":["पश्चिमी घाट","दक्कन पठार","प्रायद्वीपीय पठार","छोटानागपुर पठार"],"a":2,"e":["भूगर्भिक और भौगोलिक दृष्टि से, पूर्वोत्तर भारत में स्थित ‘मेघालय पठार’ हिमालय का नहीं, बल्कि मुख्य भारतीय ‘प्रायद्वीपीय पठार’ का ही एक उत्तर-पूर्वी विस्तार है।","लाखों वर्ष पूर्व, भारतीय प्लेट के यूरेशियन प्लेट से टकराने के दौरान एक बहुत बड़ा फॉल्ट (भ्रंश) उत्पन्न हुआ, जिसे ‘मालदा गैप’ या गारो-राजमहल गैप कहा जाता है।","इसी मालदा गैप ने मेघालय पठार (और मिकिर पहाड़ियों) को मुख्य प्रायद्वीपीय पठार (छोटानागपुर क्षेत्र) से भौगोलिक रूप से अलग कर दिया।","इसलिए, मेघालय में पाई जाने वाली प्राचीन चट्टानें और खनिज हिमालय की बजाय पूरी तरह से दक्कन के प्रायद्वीपीय पठार के समान हैं। 43"]},{"s":"भूगोल","q":"ताप्ती नदी किस दिशा में बहती है?","o":["उत्तर दिशा","पूर्व दिशा","दक्षिण दिशा","पश्चिम दिशा"],"a":3,"e":["ताप्ती नदी, जिसे प्रायद्वीप की “दूसरी सबसे बड़ी पश्चिम-वाहिनी नदी” माना जाता है, भारत की उन तीन प्रमुख नदियों (नर्मदा, ताप्ती और माही) में से एक है जो सामान्य प्रवाह के विपरीत बहती हैं।","यह नदी मध्य प्रदेश के बैतूल जिले में मुलताई (मुलतापी) के पास सतपुड़ा पर्वतमाला से निकलती है।","अपनी उत्पत्ति के बाद, यह नर्मदा के समानांतर एक भ्रंश घाटी में (सतपुड़ा के दक्षिण में) पूर्व से पश्चिम दिशा की ओर तेजी से बहती है।","मध्य प्रदेश, महाराष्ट्र और गुजरात को पार करते हुए, अंततः यह गुजरात के सूरत शहर के पास खंभात की खाड़ी (अरब सागर) में गिरकर एक एस्चुअरी का निर्माण करती है।"]},{"s":"भूगोल","q":"नर्मदा और तापी नदियों के बीच जल विभाजक के रूप में कौन-सी पर्वतमाला कार्य करती है?","o":["सतपुड़ा","विंध्याचल","पश्चिमी घाट","अरावली"],"a":0,"e":["सतपुड़ा पर्वत श्रृंखला मध्य भारत की एक प्रमुख पर्वतमाला है जो मुख्य रूप से मध्य प्रदेश और महाराष्ट्र राज्यों में पैफली हुई है।","यह पर्वत श्रृंखला उत्तर में बहने वाली नर्मदा नदी और दक्षिण में बहने वाली ताप्ती (तापी) नदी के बीच एक प्राकृतिक जल विभाजक का कार्य करती है।","ये दोनों ही नदियाँ सतपुड़ा के दोनों ओर समानांतर भ्रंश घाटियों से होकर पश्चिम दिशा में बहते हुए अरब सागर में गिरती हैं।","धूपगढ़ ( 1352 मीटर) इस पर्वतमाला की सबसे ऊँची चोटी है जो पचमढ़ी के पास महादेव पहाड़ियों में स्थित है।"]},{"s":"भूगोल","q":"लक्षद्वीप द्वीप किससे बने हैं?","o":["ज्वालामुखीय चट्टानें","प्रवाल निक्षेप","रूपांतरित चट्टानें","नदी तलछट"],"a":1,"e":["लक्षद्वीप (अरब सागर में स्थित) भारत का सबसे छोटा केंद्र शासित प्रदेश है, जो मुख्य रूप से 36 छोटे द्वीपों का एक समूह है।","भौगोलिक दृष्टि से ये सभी द्वीप प्रवाल भित्तियों और एटोल से बने हैं, जो समुद्री जीवों के कंकालों के जमाव होते हैं।","NCERT के अनुसार ये द्वीप जलमग्न पर्वतों का उभरा हुआ भाग माने जाते हैं और केवल कुछ छोटे द्वीप ज्वालामुखीय उत्पत्ति के हैं। इनकी चट्टानें बलुआ पत्थर, चूना पत्थर और शेल की हैं।","प्रवाल भित्तियाँ समुद्री पारिस्थितिकी तंत्र के लिए बेहद महत्त्वपूर्ण होती हैं क्योंकि ये हजारों समुद्री प्रजातियों को आश्रय और भोजन प्रदान करती हैं।"]},{"s":"भूगोल","q":"ताप्ती नदी की कुल लंबाई कितनी है?","o":["1,077 किमी","312 किमी","724 किमी","1,312 किमी"],"a":2,"e":["ताप्ती (या तापी) नदी प्रायद्वीपीय भारत की दूसरी सबसे बड़ी पश्चिम की ओर बहने वाली नदी है (नर्मदा के बाद)।","यह नदी मध्य प्रदेश के बैतूल जिले में मुलताई (मूल-तापी) नामक स्थान से सतपुड़ा पर्वत श्रृंखला से निकलती है।","इसकी कुल अनुमानित लंबाई लगभग 724 किलोमीटर ( 450 मील) है और इसका बेसिन मध्य प्रदेश, महाराष्ट्र और गुजरात राज्यों में पैफला हुआ है।","यह नदी सतपुड़ा और अजंता की पहाड़ियों के बीच एक गहरी भ्रंश घाटी से होकर बहते हुए गुजरात में खंभात की खाड़ी (अरब सागर) में गिरती है।"]},{"s":"भूगोल","q":"समान चट्टानी संरचना और हल्की ढलान वाले क्षेत्रों में किस प्रकार की अपवाह प्रणाली विकसित होती है?","o":["रेडियल","डेंड्राइटिक","एन्युलर","ट्रेलिस"],"a":1,"e":["डेंड्राइटिक (वृक्षाकार) अपवाह प्रणाली में मुख्य नदी और उसकी सहायक नदियाँ एक पेड़ की शाखाओं जैसी आकृति का निर्माण करती हैं।","यह प्रणाली मुख्य रूप से उन क्षेत्रों में बनती है जहाँ की चट्टानी संरचना एक समान होती है और भूमि की ढलान हल्की होती है।","उत्तर भारत के विशाल मैदानों में बहने वाली गंगा और यमुना नदियाँ इसी प्रकार की अपवाह प्रणाली का बेहतरीन उदाहरण मानी जाती हैं।","इस संरचना में पानी का बहाव चट्टानों की कठोरता से कम और भूमि के प्राकृतिक ढलान से अधिक प्रभावित होता है।"]},{"s":"भूगोल","q":"गंगा के मैदान में “दोआब” का क्या अर्थ है?","o":["दो नदियों के बीच उपजाऊ क्षेत्र","पठारी क्षेत्र","रेगिस्तानी क्षेत्र","पहाड़ी क्षेत्र"],"a":0,"e":["‘दोआब’ मुख्य रूप से दो फारसी शब्दों ‘दो’ (संख्या 2) और ‘आब’ (पानी या नदी) के सार्थक मेल से मिलकर बना है।","भौगोलिक दृष्टि से इसका सीधा अर्थ दो नदियों के बीच स्थित अत्यधिक उपजाऊ और समतल मैदानी क्षेत्र से होता है।","उत्तर भारत में गंगा और यमुना नदी के बीच का विस्तृत ‘गंगा-यमुना दोआब’ कृषि के दृष्टिकोण से सबसे महत्त्वपूर्ण माना जाता है।","इन क्षेत्रों में नदियों द्वारा हर साल बहाकर लाई गई नई जलोढ़ मिट्टी जमा होती है जो विभिन्न फसलों के लिए बेहद लाभकारी होती है। 44"]},{"s":"भूगोल","q":"पर्यावरण संरक्षण अधि्नियम कब पारित हुआ?","o":["1945","1956","1937","1986"],"a":3,"e":["पर्यावरण (संरक्षण) अधि्नियम वर्ष 1986 में पारित किया गया था।","इस अधि्नियम का निर्माण वर्ष 1984 की भोपाल गैस त्रासदी के पश्चात् किया गया।","यह अधि्नियम वर्ष 1972 के स्टॉकहोम सम्मेलन के निर्णयों के क्रियान्वयन हेतु बनाया गया।","यह केंद्र सरकार को पर्यावरण संरक्षण के लिए व्यापक शक्तियाँ प्रदान करता है।"]},{"s":"भूगोल","q":"निम्नलिखित प्रश्न में दो कथन दिए हैं जिनमें से एक को “अभिकथन” और दूसरे को “कारण” के रूप में दिया गया है। आपको इन दोनों कथनों की सावधानी पूर्वक जाँच करनी है और दिए गए विकल्पों में से प्रश्न का सही उत्तर चुनना है। अभिकथन (A) ः ठोस कचरा आज की दुनिया में एक प्रमुख मुद्दा है। कारण (R) ः यह मिट्टी और पानी दोनों को प्रदूषित करता है।","o":["A और R दोनों सत्य हैं","A और R दोनों असत्य हैं","A सत्य है लेकिन R असत्य है।","A असत्य है लेकिन R सत्य है।"],"a":0,"e":["बढ़ती जनसंख्या एवं उपभोग के कारण ठोस अपशिष्ट आज गंभीर वैश्विक समस्या है, अतः अभिकथन सत्य है।","अनुपचारित ठोस कचरे से निकलने वाला लीचेट मृदा एवं भूजल को दूषित करता है, अतः कारण भी सत्य है।","कचरे के अपघटन से मीथेन जैसी गैसें निकलकर वायु प्रदूषण भी बढ़ाती हैं। इस प्रकार दोनों कथन सही हैं।"]},{"s":"भूगोल","q":"वातावरण म ंे _______ का प्रतिशत आद्यै ािे गक क्रािं त क े बाद स े दागे नु ा हा े गया ह ै जबस े मानव न े जीवाश्म इध्ंर न का े बहतु बड े़ पमै ान े पर जलाना श:ु किया था।","o":["नाइट्रोजन","कार्बन डाइऑक्साइड","वायुमंडलीय ओजोन","ऑक्सीजन"],"a":1,"e":["जीवाश्म ईंध्न (कोयला, पेट्रोलियम) के दहन से मुख्यतः कार्बन डाइऑक्साइड निकलती है।","औद्योगिक क्रांति के बाद वायुमंडल में CO 2 की सांद्रता में तीव्र वृद्धि दर्ज की गई है।","CO एक प्रमुख ग्रीनहाउस गैस है जो 2 पृथ्वी की ऊष्मा को रोककर वैश्विक तापन बढ़ाती है।","नाइट्रोजन (78%) एवं ऑक्सीजन (21%) की मात्रा वायुमण्डल में लगभग स्थिर रहती है।"]},{"s":"भूगोल","q":"अपशिष्ट जल उपचार संयंत्र (WWTP) में आपंक से पृथक किये गए पानी को कहा जाता है -","o":["शुद्ध पानी","निर्मलीकृत पानी","पुनः निर्मित जल","आरओ पानी"],"a":2,"e":["अपशिष्ट जल उपचार में ठोस अपशिष्ट (आपंक/स्लज) को अवसादन द्वारा अलग किया जाता है।","आध्किारिक उत्तर कुंजी के अनुसार इसका उत्तर विकल्प (C) ‘पुनः निर्मित जल’ दिया गया है।","एनसीईआरटी (कक्षा 7, ‘जल - अपशिष्ट जल की कहानी’) के अनुसार आपंक हटाने के बाद बचे जल को ‘निर्मलीकृत जल (Clarified water) ’ कहते हैं।","अतः मानक संदर्भ के अनुसार विकल्प (B) अध्कि उपयुक्त प्रतीत होता हैऋ यहाँ आधिकारिक उत्तर कुंजी से भिन्नता है।"]},{"s":"भूगोल","q":"मनुष्य के लिए ________ से ऊपर का शोर शारीरिक रूप से दर्दनाक हो जाता है।","o":["10 dB","30 dB","50 dB","80 dB"],"a":3,"e":["ध्वनि की तीव्रता डेसिबल (dB) में मापी जाती है।","सामान्यतः 80 dB से ऊपर की ध्वनि मानव कान के लिए कष्टकारी मानी जाती है।","लगातार तेज शोर से श्रवण क्षति, उच्च रक्तचाप एवं तनाव जैसी समस्याएँ होती हैं।","WHO के अनुसार दिन में 55 dB से अध्कि आवासीय शोर स्वास्थ्य के लिए हानिकारक है।"]},{"s":"भूगोल","q":"ओजोन परत निम्नलिखित में से किस मंडल में पायी जाती है? 45","o":["बाह्य वायुमंडल","समताप मंडल","बहिर्मंडल","क्षोभ मंडल"],"a":1,"e":["ओजोन परत समताप मंडल (स्ट्रैटोस्फीयर) में लगभग 15-35 किमी की ऊँचाई पर पाई जाती है।","यह सूर्य से आने वाली हानिकारक पराबैंगनी (UV) किरणों को अवशोषित कर लेती है।","क्लोरोफ्लोरोकार्बन (CFC) गैसें ओजोन परत के क्षरण का प्रमुख कारण हैं।","इसके संरक्षण हेतु वर्ष 1987 में मॉन्ट्रियल प्रोटोकॉल पर हस्ताक्षर किए गए थे।"]},{"s":"भूगोल","q":"प्रकाश-रसायनी ध्ूम कोहरे के बनने के समय निम्न में से कौन-सा एक उत्पन्न होता है?","o":["मीथेन","नाइट्रोजन ऑक्साइड","नाइट्रोजन सल्फाइड","नाइट्रोजन सल्फाइड डाइ मोनो सल्फाइड"],"a":1,"e":["प्रकाश-रासायनिक ध्ूमकोहरा सूर्य के प्रकाश में NOx एवं हाइड्रोकार्बन की अभिक्रिया से बनता है।","इसे ‘ऑक्सीकारक ध्ूमकोहरा’ या ‘लॉस एंजिल्स स्मॉग’ भी कहा जाता है।","यह आँखों में जलन, श्वसन रोग तथा पौधें की पत्तियों को क्षति पहुँचाता है। 3"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय न्याय संहिता (बीएनएस) से संबंधित दो कथन – कथन I: तीन नए आपराधिक कानूनों, जिनमें बीएनएस शामिल है, को लागू करने का घोषित उद्देश्य भारतीय आपराधिक न्याय प्रणाली को औपनिवेशिक प्रभाव से मुक्त करना है। कथन II: यह दावा किया गया है कि बीएनएस दंड के बजाय त्वरित न्याय प्रदान करने का प्रस्ताव करती है। उपरोक्त कथनों के प्रकाश में सही उत्तर चुनिएः","o":["दोनों कथन I और II सही हैं","दोनों कथन I और II गलत हैं","कथन I सही है और कथन II गलत है","कथन I गलत है और कथन II सही है"],"a":0,"e":["भारतीय न्याय संहिता (बीएनएस), 2023 तीन नए आपराधिक कानूनों में से एक है, जो 1 जुलाई, 2024 से देश में लागू हुई।","इस कानून ने भारतीय दंड संहिता 1860, दंड प्रक्रिया संहिता 1973 तथा भारतीय साक्ष्य अधिनियम 1872 का स्थान लिया, जो औपनिवेशिक काल की देन थे।","सरकार द्वारा घोषित उद्देश्य आपराधिक न्याय प्रणाली को औपनिवेशिक मानसिकता से मुक्त करना तथा दंड के स्थान पर त्वरित न्याय देना बताया गया है।"]},{"s":"भारतीय राजव्यवस्था","q":"राज्य के मुख्यमंत्री को पद की शपथ कौन दिलाता है?","o":["उच्च न्यायालय के मुख्य न्यायाधीश","राष्ट्रपति","राज्यपाल","राज्य विधानसभा अध्यक्ष"],"a":2,"e":["संविधान के अनुच्छेद 164 के अनुसार राज्यपाल मुख्यमंत्री की नियुक्ति करता है तथा उसे पद एवं गोपनीयता की शपथ दिलाता है।","शपथ का प्रा:प संविधान की तीसरी अनुसूची में दिया गया है।","अन्य मंत्रियों की नियुक्ति भी मुख्यमंत्री की सलाह पर राज्यपाल ही करता है और उन्हें भी शपथ दिलाता है।","राज्यपाल को शपथ उच्च न्यायालय का मुख्य न्यायाधीश (अनुच्छेद 159) तथा राष्ट्रपति को शपथ भारत का मुख्य न्यायाधीश दिलाता है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय साक्ष्य अधिनियम (बीएसए) के अंतर्गत विवाह के कितने दिनों के भीतर जन्मे बच्चे को वैध मानने की धारणा उत्पन्न होती है?","o":["180 दिन","200 दिन","240 दिन","280 दिन"],"a":3,"e":["भारतीय साक्ष्य अधिनियम, 2023 ( बीएसए) ने भारतीय साक्ष्य अधिनियम, 1872 का स्थान लिया है।","इसकी धारा 116 वैध संतानोत्पत्ति से संबंधित निश्चायक प्रमाण का उपबंध करती है।","वैध विवाह के दौरान अथवा विवाह-विच्छेद के 280 दिन के भीतर जन्मा बच्चा वैध माना जाता है।","शर्त यह है कि माता उस अवधि में अविवाहित रही हो, अतः सही उत्तर 280 दिन है।"]},{"s":"भारतीय राजव्यवस्था","q":"समवर्ती सूची के विषय पर केंद्र और राज्य कानून के बीच टकराव की स्थिति में कौन-सा कानून प्रभावी होता है?","o":["केंद्रीय कानून","राज्य कानून 46","बाद में पारित कानून","राष्ट्रपति का निर्णय"],"a":0,"e":["संविधान के अनुच्छेद 254 में केंद्र-राज्य विधि टकराव का प्रावधान है।","समवर्ती सूची के विषय पर विरोध की स्थिति में संसद द्वारा बनाया गया कानून प्रभावी होता है।","राज्य का कानून उस सीमा तक शून्य हो जाता है जहाँ तक वह असंगत है।","अपवाद यह है कि यदि राज्य विधेयक को राष्ट्रपति की पूर्व स्वीकृति मिल जाए तो वह उस राज्य में मान्य रह सकता है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारत की पहली पूर्णकालिक महिला वित्त मंत्री कौन हैं?","o":["इंदिरा गांधी","हेमवती नंदन बहुगुणा","सुषमा स्वराज","निर्मला सीतारमण"],"a":3,"e":["निर्मला सीतारमण भारत की पहली पूर्णकालिक महिला वित्त मंत्री हैं, जिन्होंने वर्ष 2019 में यह पदभार संभाला।","इंदिरा गांधी ने वर्ष 1970-71 में वित्त मंत्रालय का अतिरिक्त प्रभार संभाला था, किंतु वे पूर्णकालिक वित्त मंत्री नहीं थीं।","निर्मला सीतारमण इससे पूर्व भारत की रक्षा मंत्री भी रह चुकी हैं।"]},{"s":"भारतीय राजव्यवस्था","q":"संसद के संयुक्त सत्र की अध्यक्षता कौन करता है?","o":["राष्ट्रपति","उप-राष्ट्रपति","प्रधानमंत्री","लोकसभा अध्यक्ष"],"a":3,"e":["संविधान के अनुच्छेद 108 के अंतर्गत संसद की संयुक्त बैठक बुलाई जाती है।","इस संयुक्त बैठक की अध्यक्षता लोकसभा अध्यक्ष (स्पीकर) करते हैं।","उनकी अनुपस्थिति में लोकसभा उपाध्यक्ष तथा उसके बाद राज्यसभा उपसभापति अध्यक्षता करते हैं।","राष्ट्रपति संयुक्त बैठक को संबोधित अवश्य करते हैं, परंतु उसकी अध्यक्षता नहीं करते।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय संसद में कौन-कौन शामिल होते हैं?","o":["राष्ट्रपति और लोकसभा","राष्ट्रपति, लोकसभा और राज्यसभा","लोकसभा और राज्यसभा","प्रधानमंत्री और लोकसभा"],"a":1,"e":["संविधान के अनुच्छेद 79 के अनुसार संघ की एक संसद होगी।","इसमें राष्ट्रपति तथा दो सदन, लोकसभा (लोक सदन) एवं राज्यसभा (राज्य सभा) सम्मिलित हैं।","यद्यपि राष्ट्रपति किसी सदन के सदस्य नहीं होते, फिर भी वे संसद के अभिन्न अंग हैं।","किसी विधेयक के कानून बनने के लिए राष्ट्रपति की स्वीकृति अनिवार्य होती है।"]},{"s":"भारतीय राजव्यवस्था","q":"निम्नलिखित में से कौन-सा विषय राज्य सूची के अंतर्गत आता है?","o":["विदेशी मामले","बैंकिंग","पुलिस","शिक्षा"],"a":2,"e":["सातवीं अनुसूची में विषयों को संघ सूची, राज्य सूची तथा समवर्ती सूची में बाँटा गया है।","पुलिस एवं लोक व्यवस्था राज्य सूची के अंतर्गत आने वाले प्रमुख विषय हैं।","विदेशी मामले तथा बैंकिंग संघ सूची में सम्मिलित हैं।","शिक्षा मूलतः राज्य सूची में थी, किंतु 42 वें संविधान संशोधन ( 1976) से इसे समवर्ती सूची में शामिल कर दिया गया।"]},{"s":"भारतीय राजव्यवस्था","q":"राज्य के मुख्यमंत्री की नियुक्ति किसके द्वारा की जाती है?","o":["प्रधानमंत्री","राज्यपाल","राष्ट्रपति","लोकसभा अध्यक्ष"],"a":1,"e":["भारतीय संविधान के अनुच्छेद 164 के अनुसार राज्य के मुख्यमंत्री की नियुक्ति राज्यपाल द्वारा की जाती है।","अन्य मंत्रियों की नियुक्ति भी मुख्यमंत्री की सलाह पर राज्यपाल ही करते हैं।","परंपरा के अनुसार राज्यपाल विधानसभा में बहुमत प्राप्त दल के नेता को ही मुख्यमंत्री नियुक्त करते हैं।","मंत्रिपरिषद सामूहिक रूप से राज्य विधानसभा के प्रति उत्तरदायी होती है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय न्याय संहिता (बीएनएस), 2023 के तहत संगठित अपराध से संबंधित प्रावधान किस धारा में है?","o":["धारा 103","धारा 109","धारा 111","धारा 115"],"a":2,"e":["भारतीय न्याय संहिता, 2023 की धारा 111 में संगठित अपराध को परिभाषित कर उसके लिए दंड निर्धारित किया गया है।","इसमें अपहरण, डकैती, सुपारी हत्या, आर्थिक अपराध, साइबर अपराध आदि गिरोह द्वारा किए गए कृत्य शामिल हैं।","धारा 112 छोटे संगठित अपराध से तथा धारा 113 आतंकवादी कृत्य से संबंधित है।","पहली बार सामान्य दंड विधि में संगठित अपराध को स्वतंत्र अपराध के रूप में शामिल किया गया है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारत के संविधान के किस अनुच्छेद के तहत अंतर-राज्य परिषद की स्थापना की जाती है?","o":["अनुच्छेद 263","अनुच्छेद 280","अनुच्छेद 312","अनुच्छेद 368"],"a":0,"e":["संविधान के अनुच्छेद 263 के अंतर्गत राष्ट्रपति अंतर-राज्य परिषद की स्थापना कर सकते हैं।","सरकारिया आयोग की अनुशंसा पर वर्ष 47 1990 में इसकी औपचारिक स्थापना की गई।","इसकी अध्यक्षता प्रधानमंत्री करते हैं तथा सभी राज्यों के मुख्यमंत्री एवं कुछ केंद्रीय मंत्री इसके सदस्य होते हैं।","अनुच्छेद 280 वित्त आयोग, 312 अखिल भारतीय सेवाओं तथा 368 संविधान संशोधन से संबंधित है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारत के 16 वें अटॉर्नी जनरल (महान्यायवादी) के रूप में किसे नियुक्त किया गया है?","o":["आर- वेंकटरमणि","मुकुल रोहतगी","के- के- वेणुगोपाल","तुषार मेहता"],"a":0,"e":["वरिष्ठ अधिवक्ता आर- वेंकटरमणि ने 1 अक्टूबर, 2022 को भारत के 16 वें महान्यायवादी के रूप में पदभार ग्रहण किया।","उनसे पूर्व के- के- वेणुगोपाल 15 वें महान्यायवादी थे।","महान्यायवादी की नियुक्ति संविधान के अनुच्छेद 76 के अंतर्गत राष्ट्रपति द्वारा की जाती है।","वह भारत सरकार का सर्वोच्च विधि अधिकारी होता है और संसद की कार्यवाही में भाग ले सकता है, किंतु मत नहीं दे सकता।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय न्याय संहिता (बीएनएस), 2023 के तहत निम्नलिखित में से कौन-सी स”ाा नए रूप से शामिल की गई है?","o":["आजीवन कारावास","सामुदायिक सेवा","कठोर कारावास","मृत्युदंड"],"a":1,"e":["भारतीय न्याय संहिता, 2023 में पहली बार सामुदायिक सेवा को दंड के रूप में सम्मिलित किया गया है।","यह छोटे अपराधों जैसे मानहानि, सार्वजनिक स्थान पर नशे में उत्पात, छोटी चोरी आदि में दी जा सकती है।","बीएनएस की धारा 4 में छह प्रकार के दंड बताए गए हैं – मृत्युदंड, आजीवन कारावास, कारावास, संपत्ति समपहरण, जुर्माना एवं सामुदायिक सेवा।","यह प्रावधान सुधारात्मक न्याय की दिशा में महत्वपूर्ण कदम माना जाता है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारत में संघ (केंद्र) सरकार का कार्यकारी प्रमुख कौन होता है?","o":["राष्ट्रपति","प्रधानमंत्री","लोकसभा अध्यक्ष","भारत के मुख्य न्यायाधीश"],"a":0,"e":["संविधान के अनुच्छेद 53 के अनुसार संघ की कार्यपालिका शक्ति राष्ट्रपति में निहित है।","अतः संवैधानिक दृष्टि से राष्ट्रपति ही संघ सरकार का कार्यकारी प्रमुख (औपचारिक प्रमुख) होता है।","व्यवहार में यह शक्ति अनुच्छेद 74 के अंतर्गत प्रधानमंत्री की अध्यक्षता वाली मंत्रिपरिषद की सलाह से प्रयोग होती है,इसीलिए प्रधानमंत्री को सरकार का वास्तविक प्रमुख तथा राष्ट्रपति को राज्य का प्रमुख कहा जाता है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय संवैधानिक विकास में अल्पसंख्यकों के लिए सुरक्षा उपायों के सिद्धांत को औपचारिक रूप से किस अधिनियम के तहत प्रस्तुत किया गया था?","o":["भारतीय परिषद अधिनियम, 1909","भारत सरकार अधिनियम, 1919","भारत सरकार अधिनियम, 1935","भारतीय स्वतंत्रता अधिनियम, 1947"],"a":0,"e":["भारतीय परिषद अधिनियम 1909 को मार्ले-मिंटो सुधार के नाम से जाना जाता है।","इसी अधिनियम द्वारा पहली बार मुसलमानों के लिए पृथक निर्वाचन मंडल की व्यवस्था की गई।","यही अल्पसंख्यकों के लिए सुरक्षा उपाय के सिद्धांत की औपचारिक शुरुआत मानी जाती है।","1919 एवं 1935 के अधिनियमों ने इसका विस्तार सिख, ईसाई, आंग्ल-भारतीय आदि वर्गों तक किया।"]},{"s":"भारतीय राजव्यवस्था","q":"73 वाँ संविधान संशोधन अधिनियम किससे संबंधित है?","o":["संघ सरकार","राज्य सरकार","पंचायती राज","न्यायपालिका"],"a":2,"e":["73 वाँ संविधान संशोधन अधिनियम 1992 पंचायती राज व्यवस्था से संबंधित है, जो 24 अप्रैल 1993 से लागू हुआ।","इसने संविधान में भाग- 9 तथा 11 वीं अनुसूची ( 29 विषय) जोड़ी।","इसमें त्रि-स्तरीय पंचायत, हर 5 वर्ष में चुनाव तथा महिलाओं हेतु एक-तिहाई आरक्षण का प्रावधान है।","74 वाँ संशोधन नगरपालिकाओं (शहरी स्थानीय निकायों) से संबंधित है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारत के राष्ट्रपति कितने समय तक पद पर बने रह सकते हैं?","o":["3 वर्ष","5 वर्ष","6 वर्ष","आजीवन"],"a":1,"e":["संविधान के अनुच्छेद 56 के अनुसार राष्ट्रपति का कार्यकाल पदग्रहण की तिथि से 5 वर्ष होता है।","वे अपना त्यागपत्र उपराष्ट्रपति को संबोधित कर सकते हैं।","राष्ट्रपति पुनर्निर्वाचन के लिए पात्र होते हैं ; डॉ- राजेंद्र प्रसाद दो बार निर्वाचित हुए थे।","उन्हें अनुच्छेद 61 के तहत महाभियोग द्वारा ही पद से हटाया जा सकता है।"]},{"s":"भारतीय राजव्यवस्था","q":"राज्य लोक सेवा आयोग की स्थापना का प्रावधान संविधान के किस अनुच्छेद में है?","o":["अनुच्छेद 308","अनुच्छेद 315","अनुच्छेद 320","अनुच्छेद 324"],"a":1,"e":["संविधान का अनुच्छेद 315 संघ लोक सेवा आयोग एवं राज्य लोक सेवा आयोग की स्थापना का प्रावधान करता है।","अनुच्छेद 316: सदस्यों की नियुक्ति एवं कार्यकाल से संबंधित है। 48","अनुच्छेद 320: लोक सेवा आयोगों के कार्यों का उल्लेख करता है।","अनुच्छेद 324: भारत निर्वाचन आयोग से संबंधित है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय नागरिक सुरक्षा संहिता (बीएनएसएस) के उद्देश्यों और कारणों के विवरण में निम्नलिखित में से कौन-सा एक प्रमुख उद्देश्य बताया गया है?","o":["प्रक्रिया को अधिक जटिल बनाना","आपराधिक प्रक्रियाओं को सुव्यवस्थित करके न्याय वितरण को ते”ा और प्रभावी बनाना तथा विलंब को कम करना","अभियुक्त के अधिकारों को कमजोर करना","स”ाा देने में न्यायिक विवेक को समाप्त करना"],"a":1,"e":["भारतीय नागरिक सुरक्षा संहिता 2023 ने दंड प्रक्रिया संहिता 1973 का स्थान लिया, जो 1 जुलाई 2024 से प्रभावी हुई।","इसके उद्देश्यों एवं कारणों के विवरण में त्वरित एवं प्रभावी न्याय वितरण को प्रमुख लक्ष्य बताया गया है।","इसमें इलेक्ट्रॉनिक प्राथमिकी, शून्य प्राथमिकी, इलेक्ट्रॉनिक साक्ष्य तथा समयबद्ध जाँच एवं निर्णय के प्रावधान हैं।","यह अभियुक्त के अधिकारों को कमजोर नहीं, बल्कि प्रक्रिया को पारदर्शी बनाने पर बल देती है।"]},{"s":"भारतीय राजव्यवस्था","q":"नए आपराधिक कानूनों में मामलों को संभालने के तरीके में क्या महत्वपूर्ण बदलाव किया गया है?","o":["पुलिस अधिकारों की समाप्ति","अदालत की सुनवाई का निलंबन","न्यायपालिका का पूर्ण प्रतिस्थापन","ऑनलाइन प्राथमिकी और त्वरित सुनवाई"],"a":3,"e":["1 जुलाई 2024 से लागू तीनों नए आपराधिक कानूनों (बीएनएस, बीएनएसएस, बीएसए) ने आपराधिक प्रक्रिया को तकनीक-आधारित बनाया है।","इनमें इलेक्ट्रॉनिक प्राथमिकी तथा शून्य प्राथमिकी, इलेक्ट्रॉनिक साक्ष्य की मान्यता और वीडियो कॉन्प्रफेंसिंग से गवाही के प्रावधान हैं।","जाँच, आरोप-पत्र और निर्णय के लिए समय-सीमा निर्धारित कर त्वरित न्याय पर बल दिया गया है।","पुलिस के अधिकार समाप्त करने या न्यायपालिका को हटाने जैसा कोई प्रावधान इन कानूनों में नहीं है।"]},{"s":"भारतीय राजव्यवस्था","q":"निम्नलिखित में से कौन-सा भारत के संविधान की विशेषता नहीं है?","o":["संसदीय प्रणाली","राष्ट्रपति प्रणाली","संघीय प्रणाली","लिखित संविधान"],"a":1,"e":["भारत ने ब्रिटेन की भांति संसदीय शासन प्रणाली अपनाई है, जिसमें कार्यपालिका विधायिका के प्रति उत्तरदायी होती है।","यहाँ राष्ट्रपति राज्य का नाममात्र प्रमुख है और वास्तविक शक्ति प्रधानमंत्री एवं मंत्रिपरिषद में निहित है।","संघीय ढाँचा तथा विश्व का सबसे विस्तृत लिखित संविधान भी भारतीय संविधान की प्रमुख विशेषताएँ हैं।","राष्ट्रपति प्रणाली संयुक्त राज्य अमेरिका की विशेषता है, भारत की नहीं।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय नागरिक सुरक्षा संहिता (बीएनएसएस) के अंतर्गत लोक सेवकों के विरुद्ध अभियोजन की स्वीकृति देने की अंतिम शक्ति निम्नलिखित में से किस प्राधिकरण के पास होती है?","o":["लोकायुक्त","सक्षम सरकारी प्राधिकरण","न्यायिक मजिस्ट्रेट","जिला कलेक्टर"],"a":1,"e":["भारतीय नागरिक सुरक्षा संहिता, 2023 ( पूर्ववर्ती दंड प्रक्रिया संहिता की धारा 197 के समतुल्य प्रावधान) के अनुसार लोक सेवकों पर पदीय कर्तव्य से जुड़े अपराधों में अभियोजन हेतु पूर्व स्वीकृति अनिवार्य है।","यह स्वीकृति सक्षम सरकार अर्थात् केंद्र या राज्य सरकार के सक्षम प्राधिकारी द्वारा दी जाती है।","इसका उद्देश्य लोक सेवकों को दुर्भावनापूर्ण एवं तुच्छ मुकदमों से संरक्षण प्रदान करना है।","लोकायुक्त, न्यायिक मजिस्ट्रेट अथवा जिला कलेक्टर के पास यह अंतिम स्वीकृति-शक्ति नहीं होती।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय नागरिक सुरक्षा संहिता (बीएनएसएस) के अंतर्गत जब किसी व्यक्ति को गिरफ्तार किया जाता है, तो उसे कितने घंटे के भीतर मजिस्ट्रेट के समक्ष प्रस्तुत करना आवश्यक होता है?","o":["12 घंटे","24 घंटे","36 घंटे","48 घंटे"],"a":1,"e":["बीएनएसएस के अनुसार गिरफ्तार व्यक्ति को यात्रा में लगे समय को छोड़कर 24 घंटे के भीतर निकटतम मजिस्ट्रेट के समक्ष प्रस्तुत करना अनिवार्य है।","यही व्यवस्था संविधान के अनुच्छेद 22(2) में मौलिक अधिकार के रूप में भी दी गई है।","24 घंटे से अधिक हिरासत में रखने के लिए मजिस्ट्रेट की अनुमति आवश्यक होती है।","इस प्रावधान का उद्देश्य अवैध एवं मनमानी निरोध पर रोक लगाना है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारत में राज्यों के बीच विवादों को सुलझाने की जिम्मेदारी किस संस्था की होती है?","o":["लोकसभा","सर्वोच्च न्यायालय","चुनाव आयोग","राज्यसभा"],"a":1,"e":["भारत के संविधान के अनुच्छेद 131 के तहत राज्यों के बीच विवादों को सुलझाने 49 का मूल अधिकार क्षेत्र सर्वोच्च न्यायालय के पास है।","यह प्रावधान संघीय ढाँचे को बनाए रखने और केंद्र व राज्यों के बीच संतुलन स्थापित करने का कार्य करता है।","सर्वोच्च न्यायालय का यह अधिकार अन्य अदालतों के हस्तक्षेप को रोकता है।","इस प्रकार की कानूनी शक्ति से देश की अखंडता और न्यायिक निष्पक्षता सुनिश्चित होती है।"]},{"s":"भारतीय राजव्यवस्था","q":"निम्नलिखित में से कौन-सा अपराध ऐसा है जिसमें हिंसा का प्रयोग नहीं होता?","o":["डकैती","छीनाझपटी","जबरन वसूली","चोरी"],"a":3,"e":["चोरी एक ऐसा अपराध है, जिसमें संपत्ति को बिना किसी की सहमति के गुप्त रूप से लिया जाता है और इसमें हिंसा का प्रयोग आवश्यक नहीं है।","इसके विपरीत डकैती, छीनाझपटी और जबरन वसूली में पीड़ित के विरुद्ध प्रत्यक्ष या अप्रत्यक्ष रूप से शारीरिक बल या धमकी का प्रयोग होता है।","भारतीय न्याय संहिता में चोरी को एक अलग श्रेणी में रखा गया है।","इसलिए चोरी को अहिंसक संपत्ति अपराधों की सूची में गिना जाता है।"]},{"s":"भारतीय राजव्यवस्था","q":"स्थानांतरित और आरक्षित विषय शब्द किस अधिनियम से संबंधित है?","o":["1909 का अधिनियम","1919 का अधिनियम","1935 का अधिनियम","1858 का अधिनियम"],"a":1,"e":["भारत सरकार अधिनियम 1919 ( मोंटेग्यू-चेम्सफोर्ड सुधार) ने ब्रिटिश भारत में प्रांतीय स्तर पर द्वैध शासन प्रणाली की शुरुआत की थी।","इस नई प्रणाली के अंतर्गत सभी प्रांतीय विषयों को मुख्य रूप से दो भागों में विभाजित किया गया थाः आरक्षित और स्थानांतरित।","आरक्षित विषय सीधे ब्रिटिश गवर्नर के नियंत्रण में थे, जबकि स्थानांतरित विषय भारतीय मंत्रियों को सौंपे गए थे जो विधान परिषद के प्रति उत्तरदायी थे।","इस विभाजन का मुख्य उद्देश्य भारतीयों को आंशिक रूप से स्वशासन का अनुभव प्रदान करना और देश में सीमित प्रशासनिक सुधार लागू करना था।"]},{"s":"भारतीय राजव्यवस्था","q":"भारत के पहले कार्यवाहक प्रधानमंत्री, जिन्होंने नेह: और शास्त्री की मृत्यु के बाद दो बार संक्षिप्त रूप से सेवा दी – कौन थे?","o":["गुल”ाारीलाल नंदा","मोरारजी देसाई","चरण सिंह","लाल बहादुर शास्त्री"],"a":0,"e":["गुल”ाारीलाल नंदा एक प्रमुख भारतीय राजनीतिज्ञ और अर्थशास्त्री थे, जिन्होंने देश के पहले कार्यवाहक प्रधानमंत्री के रूप में जिम्मेदारी निभाई।","उन्होंने पहली बार 1964 में पंडित जवाहरलाल नेह: के निधन के बाद राजनीतिक संकट को टालने के लिए 13 दिनों के लिए यह पदभार संभाला था।","इसके बाद 1966 में लाल बहादुर शास्त्री के आकस्मिक निधन के बाद उन्होंने फिर से मात्र 13 दिनों के लिए देश का सफलतापूर्वक नेतृत्व किया।","वे अपने सादे जीवन और गहरी ईमानदारी के लिए जाने जाते थे, और उन्हें 1997 में देश के सर्वोच्च सम्मान भारत रत्न से भी सम्मानित किया गया।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय संविधान की प्रस्तावना में धर्मनिरपेक्ष शब्द किस संशोधन द्वारा जोड़ा गया था?","o":["24 वाँ संशोधन","42 वाँ संशोधन","44 वाँ संशोधन","52 वाँ संशोधन"],"a":1,"e":["भारतीय संविधान की प्रस्तावना में धर्मनिरपेक्ष शब्द को 42 वें संविधान संशोधन अधिनियम, 1976 के माध्यम से जोड़ा गया था।","इस बड़े संशोधन के द्वारा प्रस्तावना में कुल तीन नए शब्द शामिल किए गए थेः समाजवादी, पंथनिरपेक्ष (धर्मनिरपेक्ष) और अखंडता।","इस संशोधन का मुख्य उद्देश्य भारत राज्य को सभी धर्मों के प्रति तटस्थ और सभी आस्थाओं का समान सम्मान करने वाला घोषित करना था।","इस ऐतिहासिक संशोधन को इसके व्यापक बदलावों के कारण अक्सर भारत के लघु संविधान के रूप में भी जाना जाता है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय परिषद अधिनियम, 1892 का उद्देश्य क्या था?","o":["परिषदों में भारतीय प्रतिनिधित्व बढ़ाना","किसानों को मतदान का अधिकार देना","प्रांतीय स्वायत्तता","भारतीय सदस्यों को वित्तीय अधिकार देना"],"a":0,"e":["भारतीय परिषद अधिनियम 1892 ब्रिटिश संसद द्वारा पारित एक महत्वपूर्ण राजनीतिक और प्रशासनिक कानून था।","इस अधिनियम का प्राथमिक उद्देश्य केंद्रीय तथा प्रांतीय विधान परिषदों के आकार का विस्तार कर उन्हें अधिक व्यापक बनाना था।","इसके माध्यम से परिषदों में गैर-आधिकारिक (भारतीय) सदस्यों की संख्या बढ़ाई गई, जिससे भारतीय प्रतिनिधित्व में वृद्धि हुई।","यद्यपि यह प्रतिनिधित्व सीमित था, लेकिन इसने पहली बार भारतीयों को वार्षिक बजट पर बहस करने का आंशिक अधिकार प्रदान किया।"]},{"s":"भारतीय राजव्यवस्था","q":"अंडमान और निकोबार द्वीपसमूह पर किस उच्च न्यायालय का अधिकार क्षेत्र है?","o":["कलकत्ता उच्च न्यायालय","बॉम्बे उच्च न्यायालय","मद्रास उच्च न्यायालय","आंध्र प्रदेश उच्च न्यायालय"],"a":0,"e":["अंडमान और निकोबार द्वीपसमूह बंगाल की खाड़ी में स्थित भारत का एक महत्वपूर्ण केंद्रशासित प्रदेश है, जिसका अपना कोई स्वतंत्र उच्च न्यायालय नहीं है। 50","न्यायिक प्रशासन और कानूनी मामलों के लिए यह संपूर्ण क्षेत्र पश्चिम बंगाल के कलकत्ता उच्च न्यायालय के अधिकार क्षेत्र के अंतर्गत आता है।","द्वीपसमूह के निवासियों की सुविधा के लिए कलकत्ता उच्च न्यायालय की एक विशेष सर्किट बेंच राजधानी पोर्ट ब्लेयर में बैठती है।","भारतीय संविधान के अनुच्छेद 241 के तहत संसद को केंद्रशासित प्रदेशों के लिए उच्च न्यायालय स्थापित करने या मौजूदा न्यायालयों का अधिकार क्षेत्र बढ़ाने की संवैधानिक शक्ति प्राप्त है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय संविधान की आठवीं अनुसूची में कितनी भाषाएँ सूचीबद्ध हैं?","o":["22","21","18","14"],"a":0,"e":["भारतीय संविधान की आठवीं अनुसूची में भारत की आधिकारिक भाषाओं की सूची शामिल है।","वर्तमान में इसमें कुल 22 भाषाएँ शामिल हैं जिन्हें आधिकारिक दर्जा प्राप्त है।","मूल रूप से इस अनुसूची में 14 भाषाएँ थीं, लेकिन बाद में संवैधानिक संशोधनों के माध्यम से अन्य भाषाओं को जोड़ा गया।","ये भाषाएँ देश भर में आधिकारिक और सांस्कृतिक उद्देश्यों के लिए मान्यता प्राप्त हैं।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय संविधान का कौन-सा अनुच्छेद निर्वाचन आयोग की स्थापना का प्रावधान करता है?","o":["अनुच्छेद 320","अनुच्छेद 324","अनुच्छेद 329","अनुच्छेद 326"],"a":1,"e":["भारतीय संविधान का अनुच्छेद 324 एक स्वतंत्र निर्वाचन आयोग की स्थापना का अनिवार्य प्रावधान करता है।","यह अनुच्छेद संसद, राज्य विधानसभाओं, राष्ट्रपति और उपराष्ट्रपति के पदों के लिए होने वाले सभी चुनावों के अधीक्षण, निर्देशन और नियंत्रण की पूर्ण शक्ति निर्वाचन आयोग को देता है।","यह संवैधानिक प्रावधान देश में स्वतंत्र और निष्पक्ष लोकतांत्रिक चुनाव सुनिश्चित करता है।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय संविधान का कौन-सा अनुच्छेद अस्पृश्यता (छुआछूत) के उन्मूलन से संबंधित है?","o":["अनुच्छेद 14","अनुच्छेद 15","अनुच्छेद 17","अनुच्छेद 19"],"a":2,"e":["भारतीय संविधान का अनुच्छेद 17 अस्पृश्यता के पूर्ण उन्मूलन का प्रावधान करता है।","यह मौलिक अधिकारों (समानता के अधिकार) के अंतर्गत एक महत्वपूर्ण प्रावधान है।","इसके तहत किसी भी रूप में छुआछूत का आचरण करना एक दंडनीय अपराध घोषित किया गया है।","नागरिक अधिकार संरक्षण अधिनियम, 1955 इसे प्रभावी रूप से लागू करने के लिए बनाया गया है।"]},{"s":"भारतीय राजव्यवस्था","q":"संघ और राज्यों के बीच शक्तियों का वितरण भारतीय संविधान की किस अनुसूची में वर्णित है?","o":["चतुर्थ अनुसूची","पंचम अनुसूची","सप्तम अनुसूची","नवम अनुसूची"],"a":2,"e":["भारतीय संविधान की सातवीं अनुसूची संघ और राज्यों के बीच शक्तियों का बंटवारा करती है।","इसमें तीन सूचियाँ शामिल हैंः संघ सूची, राज्य सूची और समवर्ती सूची।","संघ सूची पर केंद्र और राज्य सूची पर राज्य सरकार कानून बनाती है।","समवर्ती सूची में दिए गए विषयों पर दोनों सरकारें कानून बना सकती हैं।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय न्याय संहिता, 2023 ( बीएनएस) के तहत किन मामूली अपराधों के लिए सामुदायिक सेवा को दंड के रूप में शामिल किया गया है?","o":["मामूली अपराध","हिंसक अपराध","गंभीर चोरी","घृणित अपराध"],"a":0,"e":["भारतीय न्याय संहिता (बीएनएस), 2023 ने पहली बार सामुदायिक सेवा को दंड के एक रूप में शामिल किया है।","यह सजा विशेष रूप से छोटे और मामूली अपराधों के लिए निर्धारित की गई है।","इसका उद्देश्य अपराधियों को सुधरने का अवसर देना और जेलों में अनावश्यक भीड़ को कम करना है।","यह न्याय प्रणाली में दंडात्मक दृष्टिकोण के साथ-साथ सुधारात्मक दृष्टिकोण को भी बढ़ावा देता है।"]},{"s":"भारतीय राजव्यवस्था","q":"निम्नलिखित में से कौन-सी संस्था भारत के संविधान में उल्लिखित नहीं है?","o":["संघ लोक सेवा आयोग","योजना आयोग","निर्वाचन आयोग","वित्त आयोग"],"a":1,"e":["योजना आयोग एक गैर-संवैधानिक संस्था थी, जिसका उल्लेख भारतीय संविधान में कहीं नहीं है।","इसकी स्थापना वर्ष 15 मार्च , 1950 में भारत सरकार के एक कार्यकारी प्रस्ताव के माध्यम से की गई थी।","योजना आयोग को समाप्त करके वर्ष 1 जनवरी, 2015 में नीति आयोग की स्थापना की गई थी।","संघ लोक सेवा आयोग, निर्वाचन आयोग और वित्त आयोग सभी संवैधानिक निकाय हैं।"]},{"s":"भारतीय राजव्यवस्था","q":"भारतीय संविधान का कौन-सा भ ी उत्तर विकल्प D है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"औद्योगिक लाइसेंस प्रणाली किस वर्ष शु: की गई थी?","o":["1948","1951","1956","1969"],"a":1,"e":["भारत में औद्योगिक लाइसेंस व्यवस्था का आधार औद्योगिक विकास एवं विनियमन अधिनियम, 1951 था।","इस अधिनियम के बाद कई उद्योगों के लिए सरकारी लाइसेंस आवश्यक हुआ। 64","इसका उद्देश्य औद्योगिक विकास को नियंत्रित और नियोजित करना था।"]},{"s":"भारतीय अर्थव्यवस्था","q":"भारत की पहली औद्योगिक गलियारा परियोजना दिल्ली-मुंबई इंडस्ट्रियल कॉरिडोर किस देश की तकनीकी और वित्तीय सहायता से शु: की गई थी?","o":["प्रफांस","जापान","यूनाइटेड किंगडम","जर्मनी"],"a":1,"e":["दिल्ली-मुंबई औद्योगिक गलियारा परियोजना में जापान का महत्वपूर्ण सहयोग रहा।","जापान ने परियोजना के लिए तकनीकी और वित्तीय सहायता उपलब्ध कराई।","यह परियोजना दिल्ली और मुंबई के बीच औद्योगिक विकास को बढ़ावा देने के लिए बनाई गई।"]},{"s":"भारतीय अर्थव्यवस्था","q":"‘राष्ट्रीय मोबाइल मॉनिटरिंग सॉफ्टवेयर ( NMMS)’ निम्नलिखित में से किस प्रमुख योजना से संबंधित है?","o":["प्रधानमंत्री ग्राम सड़क योजना","महात्मा गांधी राष्ट्रीय ग्रामीण रोजगार गारंटी अधिनियम","राष्ट्रीय कौशल विकास मिशन","प्रधानमंत्री आवास योजना-ग्रामीण"],"a":1,"e":["राष्ट्रीय मोबाइल निगरानी प्रणाली (NMMS) का उपयोग मनरेगा कार्यों की निगरानी के लिए किया जाता रहा है।","यह कार्यस्थल की उपस्थिति और कार्यों की निगरानी में मदद करता है।","इससे ग्रामीण रोजगार कार्यक्रम में पारदर्शिता बढ़ाने का प्रयास किया जाता है।","यह डिजिटल निगरानी व्यवस्था मनरेगा के क्रियान्वयन से जुड़ी रही है।","उल्लेखनीय है कि सरकार ने मनरेगा की जगह एक नई योजना \"VB-G RAM G\" (Viksit Bharat – Guarantee for Rozgar and Ajeevika Mission – Gramin) लागू की है। यह नया कानून 1 जुलाई, 2026 से पूरे देश में प्रभावी हो चुका है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"1991 में ‘राज्य-प्रधान’ से ‘बाजार-प्रधान’ अर्थव्यवस्था की ओर बदलाव को कौन-सा नीतिगत निर्णय सबसे अच्छी तरह दर्शाता है?","o":["सार्वजनिक क्षेत्र के आरक्षण का विस्तार","औद्योगिक लाइसेंसिंग का उन्मूलन और विनियमन में ढील","कृषि में अधिक सब्सिडी की शुरुआत","आयात प्रतिस्थापन नीतियों को अपनाना"],"a":1,"e":["1991 के आर्थिक सुधारों में औद्योगिक लाइसेंसिंग को बड़े पैमाने पर समाप्त किया गया।","इससे निजी क्षेत्र के लिए उद्योग स्थापित करने की स्वतंत्रता बढ़ी।","उदारीकरण ने अर्थव्यवस्था में बाजार की भूमिका को अधिक महत्व दिया। इसीलिए यह निर्णय राज्य-प्रधान से बाजार-प्रधान व्यवस्था की ओर बदलाव दर्शाता है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"1991 में वित्तीय क्षेत्र में सुधारों का आधार किस समिति की सिफारिशों पर रखा गया था?","o":["चेलैया समिति","रंगराजन समिति","नरसिंहम समिति","केलकर समिति"],"a":2,"e":["1991 के बाद बैंकिंग एवं वित्तीय क्षेत्र में व्यापक सुधार शु: हुए।","एम- नरसिंहम समिति ने बैंकिंग क्षेत्र की संरचना और कार्यप्रणाली में सुधारों के लिए महत्वपूर्ण सुझाव दिए।","इन सिफारिशों ने वित्तीय क्षेत्र के उदारीकरण की दिशा तय करने में भूमिका निभाई।"]},{"s":"भारतीय अर्थव्यवस्था","q":"योजना काल के दौरान भारत में हरित क्रांति का मुख्य उद्देश्य क्या था और इसके व्यापक आर्थिक प्रभाव क्या थे?","o":["भारी उद्योगों का विस्तार, जिससे शहरी रोजगार बढ़ा।","सेवा क्षेत्र की वृद्धि, जिससे विदेशी निवेश बढ़ा।","कृषि का निजीकरण, ताकि वैश्विक बाजारों से जुड़ सके।","खाद्यान्न में आत्मनिर्भरता प्राप्त करना, साथ ही क्षेत्रीय असमानताओं और पर्यावरणीय चुनौतियों को जन्म देना।"],"a":3,"e":["हरित क्रांति का प्रमुख लक्ष्य खाद्यान्न उत्पादन बढ़ाकर खाद्य सुरक्षा और आत्मनिर्भरता प्राप्त करना था।","उच्च उपज वाले बीज, सिंचाई, उर्वरक और कृषि तकनीक इसके प्रमुख आधार थे।","इस क्रांति का सबसे बड़ा और सकारात्मक असर गेहूँ और धन (चावल) की पैदावार पर पड़ा।","शुरुआत में इसे मुख्य रूप से पंजाब, हरियाणा और पश्चिमी उत्तर प्रदेश में लागू किया गया था, क्योंकि वहाँ सिंचाई की बेहतर सुविध उपलब्ध थी।"]},{"s":"भारतीय अर्थव्यवस्था","q":"निम्नलिखित में से कौन-सा आयुष्मान भारत कार्यक्रम के अंतर्गत एक वर्टिकल नहीं है?","o":["प्रधानमंत्री जन आरोग्य योजना (पीएम-जेएवाई)","राष्ट्रीय स्वास्थ्य बीमा योजना","डिजिटल हेल्थ आईडी","हेल्थ एंड वेलनेस सेंटर्स"],"a":1,"e":["आयुष्मान भारत के दो प्रमुख घटक पीएम-जेएवाई और हेल्थ एंड वेलनेस सेंटर्स हैं। 65","राष्ट्रीय स्वास्थ्य बीमा योजना आयुष्मान भारत से पहले की योजना थी।","राष्ट्रीय स्वास्थ्य बीमा योजना को बाद में पीएम-जेएवाई ि ( Fiscal Policy) सरकार की आय और व्यय से संबंधित नीति है।","इसके प्रमुख उपकरण सरकारी व्यय और कराधान हैं।","इनके माध्यम से सरकार अर्थव्यवस्था में समग्र मांग को प्रभावित करती है।","मुद्रा आपूर्ति और ब्याज दरों का नियंत्रण मौद्रिक नीति से संबंधित है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"निम्नलिखित में से कौन-सा विकल्प जनसंख्या वृद्धि के माल्थसियन सिद्धांत का सर्वोत्तम वर्णन करता है?","o":["सरकारें हमेशा नीतियों से जनसंख्या को नियंत्रित कर सकती हैं।","जनसंख्या रेखीय रूप से बढ़ती है, भोजन घातीय रूप से बढ़ता है।","जनसंख्या वृद्धि मुख्य रूप से तकनीक से प्रभावित होती है।","जनसंख्या भोजन की आपूर्ति से ते”ाी से बढ़ती है, जिससे संकट उत्पन्न होते हैं।"],"a":3,"e":["थॉमस रॉबर्ट माल्थस ने वर्ष 1798 में जनसंख्या संबंधी सिद्धांत प्रस्तुत किया।","उनके अनुसार जनसंख्या ज्यामितीय अनुपात में बढ़ती है, जबकि खाद्य आपूर्ति अंकगणितीय अनुपात में बढ़ती है।","इस असंतुलन से अकाल, महामारी और युद्ध जैसे अवरोध उत्पन्न हो सकते हैं।"]},{"s":"भारतीय अर्थव्यवस्था","q":"पीएम ‘स्वनिधि योजना’ का मुख्य उद्देश्य क्या है?","o":["शहरी क्षेत्रों में रूफटॉप सोलर सिस्टम को बढ़ावा देना।","आदिवासी क्षेत्रों में सूक्ष्म उद्यमियों को सशक्त बनाना।","पुफटपाथ विक्रेताओं को ऋण प्रदान करना।","कौशल विकास के लिए शहरी स्वयं सहायता समूहों को वित्त पोषण करना।"],"a":2,"e":["पीएम स्वनिधि योजना जून 2020 में शु: की गई।","इसका उद्देश्य रेहड़ी-पटरी विक्रेताओं को कार्यशील पूंजी ऋण उपलब्ध कराना है।","प्रारंभ में ` 10,000 का बिना गारंटी ऋण दिए जाने का प्रावधान था। अगस्त 2025 में इसे बढ़ाकर ` 15,000 कर दिया गया।","योजना में ब्याज सब्सिडी तथा डिजिटल लेन-देन को बढ़ावा देने के लिए कैशबैक प्रोत्साहन का प्रावधान है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"‘पीएम गति शक्ति – राष्ट्रीय मास्टर प्लान’ का मुख्य उद्देश्य क्या है? 66","o":["एकीकृत लॉजिस्टिक्स और अवसंरचना विकास","2025 तक सभी रेलवे ट्रैक का विद्युतीकरण","वस्त्र क्लस्टरों में रोजगार सृजन","सूक्ष्म, लघु और मध्यम उद्यमों को वित्तीय सहायता"],"a":0,"e":["पीएम गति शक्ति राष्ट्रीय मास्टर प्लान अक्टूबर 2021 में प्रारंभ किया गया।","यह विभिन्न मंत्रालयों को एक डिजिटल प्लेटफॉर्म पर जोड़ता है।","इसका e) की व्यवस्था भी महत्वपूर्ण रही।","अधिक नियंत्रण और उच्च आयात शुल्क जैसे उपाय विदेशी निवेश को हतोत्साहित कर सकते हैं।"]},{"s":"भारतीय अर्थव्यवस्था","q":"‘रेि”ांग एंड एक्सेलेरेटिंग एमएसएमई परफॉर्मेंस’ ( RAMP) कार्यक्रम को किसके द्वारा समर्थन प्राप्त है?","o":["विश्व व्यापार संगठन ( WTO)","एशियाई विकास बैंक","विश्व बैंक","अंतर्राष्ट्रीय मुद्रा कोष ( IMF)"],"a":2,"e":["RAMP सूक्ष्म, लघु एवं मध्यम उद्यम मंत्रालय का कार्यक्रम है।","यह विश्व बैंक सहायता प्राप्त केंद्र प्रायोजित योजना है।","इसका उद्देश्य MSME की बाजार और ऋण तक पहुँच बढ़ाना है।","यह प्रौद्योगिकी उन्नयन और हरित पहलों को भी प्रोत्साहित करता है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"‘नेशनल एससी-एसटी हब’ को किस मंत्रालय द्वारा लागू किया गया है और इसका उद्देश्य क्या है?","o":["कौशल विकास मंत्रालयः एससी/एसटी को प्रतियोगी परीक्षाओं के लिए कोचिंग प्रदान करना।","सूक्ष्म, लघु और मध्यम उद्यम मंत्रालयः एससी/एसटी उद्यमियों को सरकारी खरीद और बाजार तक पहुँच में सहायता देना।","वित्त मंत्रालयः एससी/एसटी द्वारा संचालित व्यवसायों के लिए कर छूट सुनिश्चित करना।","सामाजिक न्याय मंत्रालयः एससी/एसटी युवाओं में डिजिटल साक्षरता को बढ़ावा देना।"],"a":1,"e":["नेशनल एससी-एसटी हब ( NSSH) की शुरुआत अक्टूबर 2016 में हुई।","इसका क्रियान्वयन MSME मंत्रालय द्वारा राष्ट्रीय लघु उद्योग निगम लिमिटेड (NSIC) के माध्यम से किया जाता है।","इसका उद्देश्य SC/ST उद्यमियों को सार्वजनिक खरीद में भागीदारी बढ़ाने में सहायता देना है।","यह बाजार पहुँच, प्रशिक्षण, मेंटरशिप और क्षमता निर्माण में भी सहायता करता है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"निम्नलिखित में से कौन-सा विकल्प भारत में 1991 के बाद का “द्वितीय पीढ़ी” सुधार दर्शाता है?","o":["रुपये का अवमूल्यन","लाइसेंस राज का समाप्तिकरण","दूरसंचार सेवाओं का निजीकरण","आयात शुल्कों में कमी"],"a":2,"e":["रुपये का अवमूल्यन और लाइसेंस राज की समाप्ति प्रथम पीढ़ी के सुधारों में शामिल थे।","बाद के संरचनात्मक सुधारों को द्वितीय पीढ़ी के सुधार कहा गया।","इनमें दूरसंचार जैसे क्षेत्रों का निजीकरण शामिल था।","इन सुधारों का उद्देश्य प्रतिस्पर्धा, दक्षता और सेवा गुणवत्ता बढ़ाना था।"]},{"s":"भारतीय अर्थव्यवस्था","q":"‘ग्रामीण अवसंरचना विकास निधि ( RIDF)’ का मुख्य उद्देश्य क्या है?","o":["सूखा प्रभावित क्षेत्रों में सिंचाई परियोजनाओं को बढ़ावा देना।","ग्रामीण क्षेत्रों में सहकारी बैंकों को समर्थन देना।","राज्य सरकारों द्वारा ग्रामीण अवसंरचना परियोजनाओं को वित्तपोषित करना।","ग्रामीण MSME को ऋण सहायता प्रदान करना।"],"a":2,"e":["ग्रामीण अवसंरचना विकास निधि ( RIDF) की स्थापना वर्ष 1995-96 में NABARD में हुई।","इसका उद्देश्य राज्य सरकारों की ग्रामीण अवसंरचना परियोजनाओं को वित्त उपलब्ध कराना है।","इसमें सिंचाई, ग्रामीण सड़क-पुल और भंडारण जैसी परियोजनाएँ शामिल हैं।"]},{"s":"भारतीय अर्थव्यवस्था","q":"स्टैंड अप इंडिया योजना का मुख्य उद्देश्य क्या है?","o":["महानगरों में बेरोजगारी को कम करना।","भारतीय वस्तुओं के निर्यात को बढ़ावा देना।","अनुसूचित जाति/जनजाति और महिलाओं के बीच उद्यमिता को प्रोत्साहित करना।","युवाओं को मुफ्त कौशल प्रशिक्षण प्रदान करना।"],"a":2,"e":["स्टैंड अप इंडिया योजना 5 अप्रैल 2016 को प्रारंभ की गई।","इसका उद्देश्य SC/ST और महिला उद्यमियों को नया उद्यम स्थापित करने हेतु ऋण देना है। 68","इसके अंतर्गत ` 10 लाख से ` 1 करोड़ तक ऋण का प्रावधान है।","यह ग्रीनफील्ड उद्यमों की स्थापना के लिए लागू है।","केंद्रीय बजट 2025-26 में 5 लाख महिला एवं SC/ST प्रथम उद्यमियों के लिए ` 2 करोड़ तक के ऋण वाली नई योजना की घोषणा की गई।"]},{"s":"भारतीय अर्थव्यवस्था","q":"‘जल शक्ति अभियानः कैच द रेन’ अभियान मुख्य रूप से किस पर केंद्रित है?","o":["घरेलू वर्षा जल संचयन को बढ़ावा देना।","जल अपव्यय के लिए दंड लागू करना।","बड़े बांधों और जलाशयों का निर्माण।","भूजल उपयोग को नमकीन जल से प्रतिस्थापित करना।"],"a":0,"e":["“कैच द रेन–जहाँ भी गिरे, जब भी गिरे” अभियान जल संरक्षण से संबंधित है।","इसका उद्देश्य वर्षा जल संचयन और भूजल पुनर्भरण को बढ़ावा देना है।","इसमें रूफटॉप रेनवॉटर हार्वेस्टिंग और जल निकायों के जीर्णोद्धार पर बल दिया जाता है।","1 जून ` 2026 को ‘जल संचय जन भागीदारीः कैच द रेन ( JSJB: CTR)– 2026’ अभियान प्रारंभ किया गया, जिसमें जल संचय जन भागीदारी पहल को जल शक्ति अभियानः कैच द रेन के साथ एकीकृत किया गया है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"भारत में सबसे अधिक दूध उत्पादन किस राज्य में होता है?","o":["प भोजन, उर्वरक, और पेट्रोलियम उत्पादों पर दी जाने वाली सब्सिडी सरकार के दैनिक और कल्याणकारी कार्यों का हिस्सा होती है।","चूंकि यह एक आवर्ती प्रकृति का खर्च है, इसलिए इसे पूंजीगत व्यय के बजाय राजस्व बजट में शामिल किया जाता है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"निम्नलिखित में से कौन-सा बांध पहली पंचवर्षीय योजना ( 1951-1956) के अंतर्गत बनाया गया था?","o":["केवल हीराकुंड","केवल दामोदर घाटी","केवल भाखड़ा नांगल","ये सभी"],"a":3,"e":["भारत की पहली पंचवर्षीय योजना ( 1951- 1956) हैरोड-डोमर मॉडल पर आधारित थी और इसका मुख्य उद्देश्य कृषि क्षेत्र का विकास करना था।","कृषि विकास के लिए सिंचाई सुविधाओं 70 का विस्तार अत्यंत आवश्यक था, जिसके लिए कई विशाल बहुउद्देश्यीय नदी घाटी परियोजनाएं शु: की गइ±।","इसी योजना के तहत हीराकुंड (महानदी पर), भाखड़ा नांगल (सतलज पर) और दामोदर घाटी निगम परियोजनाओं का निर्माण शु: किया गया था।","भारत के प्रथम प्रधानमंत्री पंडित जवाहरलाल नेह: ने इन विशाल बांधों को ‘आधुनिक भारत के मंदिर’ की संज्ञा दी थी।"]},{"s":"भारतीय अर्थव्यवस्था","q":"‘ई-संजीवनी’ प्लेटफ़ॉर्म मुख्य रूप से किससे संबंधित है?","o":["आयुष्मान भारत योजना के लिए ऑनलाइन पंजीकरण","ग्रामीण क्षेत्रों में कुपोषण मामलों की निगरानी","भारत भर में टेलीमेडिसिन सेवाएँ","अस्पताल निर्माण परियोजनाओं की निगरानी"],"a":2,"e":["भारत सरकार का ‘ई-संजीवनी’ प्लेटफॉर्म मुख्य रूप से देश भर में मुफ्त टेलीमेडिसिन सेवाएं प्रदान करने से संबंधित है।","स्वास्थ्य और परिवार कल्याण मंत्रालय की इस राष्ट्रीय टेलीमेडिसिन सेवा को सी-डैक (C-DAC) , मोहाली ने विकसित किया है, ताकि दूरदराज के ग्रामीण इलाकों के मरीजों को शहरों के विशेषज्ञ डॉक्टरों से ऑनलाइन जोड़ा जा सके।","कोविड- 19 महामारी के दौरान ओपीडी सेवाओं के सुरक्षित विकल्प के रूप में इस प्लेटफॉर्म ने अत्यंत महत्वपूर्ण और जीवन रक्षक भूमिका निभाई थी।","इस डिजिटल स्वास्थ्य सेवा के तहत मरीज वीडियो कॉन्प्रफेंसिंग के माध्यम से डॉक्टर से परामर्श ले सकते हैं और ई-पर्चे प्राप्त कर सकते हैं।"]},{"s":"भारतीय अर्थव्यवस्था","q":"भारत में हरित क्रांति की शुरुआत किस दशक में हुई थी?","o":["1948 का दशक","1960 का दशक","1970 का दशक","1980 का दशक"],"a":1,"e":["भारत में कृषि उत्पादन बढ़ाने के लिए ‘हरित क्रांति’ की शुरुआत 1960 के दशक (मुख्य रूप से 1965-68 के बीच) में हुई थी।","इस दौरान देश में अकाल और भीषण खाद्य संकट से निपटने के लिए उच्च उपज वाले बीजों, आधुनिक उर्वरकों और नई सिंचाई तकनीकों को अपनाया गया।","प्रसिद्ध कृषि वैज्ञानिक एम-एस- स्वामीनाथन को भारत में इस कृषि क्रांति का जनक माना जाता है।","इस क्रांति के परिणामस्व:प पंजाब, हरियाणा और पश्चिमी उत्तर प्रदेश में गेहूं और चावल के उत्पादन में अभूतपूर्व वृद्धि हुई, जिससे भारत खाद्यान्न में आत्मनिर्भर बन गया।"]},{"s":"भारतीय अर्थव्यवस्था","q":"निम्नलिखित में से किस मिशन का उद्देश्य भारतीय शहरों का सतत और नागरिक अनुकूल विकास करना है?","o":["स्मार्ट सिटी”ा मिशन","डिजिटल इंडिया","मेड इन इंडिया","स्टैंड-अप इंडिया"],"a":0,"e":["स्मार्ट सिटीज मिशन भारत सरकार के आवासन और शहरी कार्य मंत्रालय द्वारा जून 2015 में शु: की गई एक प्रमुख शहरी नवीकरण पहल थी।","इस मिशन का मुख्य उद्देश्य देश भर के 100 चुनिंदा शहरों को आधुनिक, नागरिक-अनुकूल और पूरी तरह से टिकाऊ बनाना था।","यह योजना 31 मार्च, 2025 को समाप्त कर दी गई।"]},{"s":"भारतीय अर्थव्यवस्था","q":"हाल के दशकों में विकसित देशों से विकासशील देशों की ओर वस्त्र उद्योगों के स्थानांतरण का मुख्य कारण क्या है?","o":["विकसित देशों में बेहतर कपास गुणवत्ता","विकासशील देशों में तकनीकी पिछड़ापन","कम श्रम लागत और शिथिल नियम","विकासशील देशों में उच्च परिवहन लागत"],"a":2,"e":["वस्त्र उद्योग एक श्रम-गहन उद्योग है जिसे सुचा: रूप से चलाने के लिए अधिक मानव संसाधनों की आवश्यकता होती है।","विकासशील देशों में श्रमिकों की प्रचुरता के कारण श्रम लागत विकसित देशों की तुलना में काफी कम होती है।","इन देशों में पर्यावरण और व्यापार संबंधी नियम अक्सर लचीले होते हैं, जो उत्पादन लागत को भारी मात्रा में कम करते हैं।","बहुराष्ट्रीय कंपनियाँ अपने मुनापेफ को अधिकतम करने के लिए विकासशील देशों में अपनी उत्पादन इकाइयाँ स्थापित करना पसंद करती हैं।"]},{"s":"भारतीय अर्थव्यवस्था","q":"‘संकल्प’ और ‘स्ट्राइव’ योजनाएँ किस क्षेत्र से संबंधित हैं?","o":["प्राथमिक स्वास्थ्य अवसंरचना","कौशल विकास और व्यावसायिक प्रशिक्षण","सूक्ष्म, लघु और मध्यम उद्यम (एमएसएमई) वित्तपोषण","कृषि मूल्य श्रृंखला"],"a":1,"e":["संकल्प (आजीविका संवर्धन हेतु कौशल अर्जन एवं ज्ञान जाग:कता) और स्ट्राइव (औद्योगिक मूल्यवर्धन हेतु कौशल सुदृढ़ीकरण) भारत सरकार की प्रमुख योजनाएं हैं।","ये दोनों योजनाएं ‘कौशल विकास और उद्यमशीलता मंत्रालय’ के तहत आती हैं और विश्व बैंक द्वारा समर्थित हैं।","ये योजनाएं युवाओं को बेहतर रोजगार योग्य कौशल प्रदान करने के लिए डि”ााइन की गई हैं।"]},{"s":"भारतीय अर्थव्यवस्था","q":"निम्नलिखित में से कौन-सा विकल्प 1950 में योजना आयोग की स्थापना के पीछे की प्रेरणा को सबसे अच्छी तरह वर्णित करता है?","o":["विदेशी व्यापार को नियंत्रित करना","निजी क्षेत्र में निवेश को बढ़ाना","केंद्र द्वारा निर्देशित विकास योजनाएँ बनाना","मौद्रिक नीति की निगरानी करना 71"],"a":2,"e":["स्वतंत्रता के तुरंत बाद, भारत की अर्थव्यवस्था बहुत कमजोर थी और उसे एक व्यवस्थित विकास की आवश्यकता थी। मार्च 1950 में ‘योजना आयोग’ की स्थापना सरकार के एक संकल्प द्वारा की गई थी।","इसका मुख्य उद्देश्य देश के भौतिक, पूंजीगत और मानव संसाधनों का आकलन करना और ‘केंद्र द्वारा निर्देशित’ पंचवर्षीय योजनाएँ बनाना था।","इसने सोवियत संघ के मॉडल से प्रेरणा लेकर भारत के आर्थिक विकास का मार्गदर्शन किया ( 2015 में इसे नीति आयोग से बदल दिया गया)।"]},{"s":"भारतीय अर्थव्यवस्था","q":"राष्ट्रीय भू-स्थानिक मिशन का उद्देश्य क्या है?","o":["बेहतर योजना के लिए डिजिटल मैपिंग","खदानों का भूवैज्ञानिक सर्वेक्षण","ऑनलाइन नेविगेशन सेवाएं","भू-स्थानिक मौसम ट्रैकिंग"],"a":0,"e":["राष्ट्रीय भू-स्थानिक मिशन का मुख्य उद्देश्य देश के बेहतर बुनियादी ढांचे और योजना के लिए उच्च गुणवत्ता वाली डिजिटल मैपिंग प्रदान करना है।","राष्ट्रीय भू-स्थानिक मिशन की घोषणा केंद्रीय बजट 2025-26 में की गई। इसका उद्देश्य आधरभूत भू-स्थानिक अवसंरचना और डेटा विकसित करना है।","पीएम गति शक्ति के उपयोग से यह मिशन भूमि अभिलेखों के आध्ुनिकीकरण, शहरी नियोजन और अवसंरचना परियोजनाओं की डिजाइन को सुगम बनाएगा।"]},{"s":"भारतीय अर्थव्यवस्था","q":"1991 में भारत के भुगतान संतुलन संकट को स्पष्ट रूप से दर्शाने वाला कौन-सा संकेतक था?","o":["विदेशी मुद्रा भंडार केवल लगभग दो सप्ताह के आयात को कवर कर सकता था","चालू खाता अधिशेष अस्थिर स्तर पर पहुंच गया था","भारी पूंजी प्रवाह ने विनिमय दरों को प्रभावित किया","जीडीपी वृद्धि शून्य से नीचे चली गई"],"a":0,"e":["वर्ष 1991 में भारत को एक अत्यंत गंभीर आर्थिक संकट (भुगतान संतुलन संकट) का सामना करना पड़ा था, जिसका सबसे बड़ा संकेत विदेशी मुद्रा भंडार का खाली होना था।","उस समय देश का विदेशी मुद्रा भंडार इतना गिर गया था कि वह केवल अगले दो हफ्तों के आवश्यक आयात (जैसे पेट्रोल) का भुगतान कर सकता था। इसी भयंकर संकट से उबरने और अंतरराष्ट्रीय ऋण चुकाने के लिए भारत सरकार को अपना सोना बैंक ऑफ इंग्लैंड में गिरवी रखना पड़ा था। परिणामस्व:प, भारत को मजबूर होकर अपनी अर्थव्यवस्था खोलनी पड़ी और उदारीकरण, निजीकरण, वैश्वीकरण के ऐतिहासिक सुधारों को लागू करना पड़ा।"]},{"s":"भारतीय अर्थव्यवस्था","q":"कौन-सा विशिष्ट औद्योगिक नीति वक्तव्य पहली बार “अर्थव्यवस्था के प्रमुख क्षेत्र” को सार्वजनिक क्षेत्र के लिए आरक्षित करने की अवधारणा प्रस्तुत करता है?","o":["औद्योगिक नीति वक्तव्य, 1980","औद्योगिक नीति वक्तव्य, 1977","औद्योगिक नीति प्रस्ताव, 1956","औद्योगिक नीति प्रस्ताव, 1948"],"a":2,"e":["यह ऐतिहासिक अवधारणा 1956 के औद्योगिक नीति प्रस्ताव द्वारा प्रस्तुत की गई थी। यह प्रस्ताव महालनोबिस मॉडल पर आधारित दूसरी पंचवर्षीय योजना का अहम हिस्सा था। इसमें उद्योगों को तीन अलग-अलग अनुसूचियों ( A, B, C) में विभाजित कर सार्वजनिक क्षेत्र को प्रधानता दी गई थी।","इसका मुख्य लक्ष्य देश में तीव्र औद्योगिकीकरण को बढ़ावा देना और समाजवादी समाज की रूपरेखा तैयार करना था।"]},{"s":"भारतीय अर्थव्यवस्था","q":"निम्नलिखित में से कौन-सी योजना किसानों को सीधे आय सहायता प्रदान करती है?","o":["राष्ट्रीय खाद्य सुरक्षा अधिनियम","प्रधानमंत्री किसान सम्मान निधि","महात्मा गांधी राष्ट्रीय ग्रामीण रोजगार गारंटी अधिनियम","प्रधानमंत्री आवास योजना"],"a":1,"e":["प्रधानमंत्री किसान सम्मान निधि ( PM- KISAN) किसानों को सीधे आय सहायता प्रदान करने वाली एक प्रमुख केंद्रीय योजना है।","इसे वर्ष 2019 में मुख्य रूप से छोटे और सीमांत किसानों की आर्थिक मदद के लिए शु: किया गया था।","इसके तहत पात्र कृषक परिवारों को प्रति वर्ष कुल ` 6,000 की वित्तीय सहायता सीधे उनके बैंक खातों में जमा की जाती है। यह राशि ` 2,000 की तीन समान किस्तों में प्रत्यक्ष लाभ अंतरण ( DBT) के पारदर्शी माध्यम से वितरित होती है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"सभी के लिए अफोर्डेबल एलईडी (उजाला) द्वारा उन्नत ज्योति किस वर्ष शु: की गई थी?","o":["2017","2015","2012","2014"],"a":1,"e":["UJALA (Unnat Jyoti by Affordable LEDs for All) योजना 5 जनवरी, 2015 को आरम्भ हुई थी।","इसका क्रियान्वयन ऊर्जा दक्षता सेवा लिमिटेड (EESL) द्वारा किया जाता है।","योजना का उद्देश्य सस्ती दर पर LED बल्ब उपलब्ध कराकर घरेलू बिजली खपत घटाना है।","यह विश्व का सबसे बड़ा घरेलू प्रकाश व्यवस्था कार्यक्रम माना जाता है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"आजीविका - राष्ट्रीय ग्रामीण आजीविका 72 मिशन (NRLM) का नाम बदलकर किस वर्ष दीनदयाल अंत्योदय योजना कर दिया गया?","o":["2017","2018","2020","2015"],"a":3,"e":["राष्ट्रीय ग्रामीण आजीविका मिशन (NRLM) की शुरुआत जून 2011 में ग्रामीण विकास मंत्रालय द्वारा की गई थी।","वर्ष 2015 में इसका नाम बदलकर दीनदयाल अंत्योदय योजना - NRLM (DAY–NRLM) कर दिया गया।","इसका लक्ष्य स्वयं सहायता समूहों के माध्यम से ग्रामीण गरीब परिवारों की आय बढ़ाना है।","शहरी क्षेत्र के लिए समानांतर कार्यक्रम DAY–NULM संचालित किया जाता है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"किस सम्मेलन ने अपने सदस्य देशों के बाहरी अध्शिेष और घाटे से निपटने के लिए अंतर्राष्ट्रीय मुद्रा कोष (आईएमएफ) की स्थापना की?","o":["संयुक्त राष्ट्र मौद्रिक और वित्तीय सम्मेलन","जी-77","ब्रेटन वुड्स","डेनियल एंड्रयूज"],"a":2,"e":["जुलाई 1944 में अमेरिका के ब्रेटन वुड्स (न्यू हैम्पशायर) में मौद्रिक एवं वित्तीय सम्मेलन हुआ था।","इसी सम्मेलन में IMF तथा विश्व बैंक (IBRD) की स्थापना का निर्णय लिया गया।","IMF का कार्य सदस्य देशों के भुगतान संतुलन के घाटे-अध्शिेष में सहायता देना है।","IMF ने औपचारिक रूप से 27 दिसम्बर 1945 से कार्य आरम्भ कियाऋ मुख्यालय वाशिंगटन डी-सी- है।"]},{"s":"भारतीय अर्थव्यवस्था","q":"महामंदी अमेरिकी इतिहास की सबसे खराब आर्थिक मंदी थी। यह किस वर्ष शु: हुआ?","o":["1932","1929","1940","1931"],"a":1,"e":["महामंदी (Great Depression) का आरम्भ अक्टूबर 1929 में अमेरिकी शेयर बाजार के पतन से हुआ।","24 अक्टूबर 1929 को ‘ब्लैक थर्सडे’ तथा 29 अक्टूबर को ‘ब्लैक ट्यूजडे’ के नाम से जाना जाता है।","इससे बड़े पैमाने पर बेरोजगारी, बैंक विफलताएँ और औद्योगिक उत्पादन में भारी गिरावट आई।","इसके
