्य निकाय की आंतरिक ऊर्जा में परिवर्तन के बराबर होता है। 99","समआयतनिक प्रक्रिया में आयतन तथा समदाबीय प्रक्रिया में दाब स्थिर रहता है।","समतापी प्रक्रिया में तापमान स्थिर रहता है, परन्तु ऊष्मा स्थानांतरण होता है।","अचानक होने वाली प्रक्रियाएं अक्सर रुद्धोष्म होती हैं, जैसे साइकिल के टायर का अचानक फटना।"]},{"s":"सामान्य विज्ञान","q":"यदि हम पानी को 0°C से गर्म करते हैं, तो यह ___ तापमान तक सिकुड़ता है-","o":["4 K","4° C","–273° C","5 K"],"a":1,"e":["जल 0°C से 4°C तक गर्म करने पर फैलने के बजाय सिकुड़ता है।","4°C पर जल का आयतन न्यूनतम तथा घनत्व अध्कितम (लगभग 1 g/cm³ ) होता है।","इस असामान्य व्यवहार को ‘जल का असंगत प्रसार’ (Anomalous expansion of water) कहते हैं।","इसी कारण ठंडे क्षेत्रों में झील की सतह जमने पर भी नीचे का जल 4°C पर तरल बना रहता है।","जल के इसी असंगत प्रसार के कारण बर्फ का घनत्व पानी से कम होता है, और बर्फ पानी की सतह पर तैरती है। CHEMISTRY (रसायन विज्ञान)"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सा कथन सत्य है?","o":["B(OH) जल अणुओं से OH− 3 स्वीकार करके एक अम्ल के रूप में कार्य कर सकता है।","B(OH) OH− मुक्त करके एक 3 अम्ल के रूप में कार्य कर सकता है।","B(OH) जल अणुओं को H+ दान 3 करके एक अम्ल के रूप में कार्य कर सकता है।","B(OH) एक क्षार है। 3"],"a":0,"e":["बोरिक अम्ल ( H BO या B(OH) ) 3 3 3 एक दुर्बल एकक्षारकीय अम्ल है, किंतु यह प्रोटॉन दाता नहीं है।","बोरॉन परमाणु में अपूर्ण अष्टक (केवल 6 इलेक्ट्रॉन) होने के कारण यह लूइस अम्ल की तरह व्यवहार करता है।","यह जल के अणु से OH− आयन ग्रहण कर [B(OH) ]− बनाता है और H+ आयन 4 मुक्त होता है, जिससे विलयन अम्लीय हो जाता है।","अतः विकल्प A सत्य है ; B(OH) न तो 3 H+ दान करता है और न ही यह क्षार है।"]},{"s":"सामान्य विज्ञान","q":"ऑक्सीजन के साथ अभिक्रियाशीलता और घुलनशीलता की प्रवृत्तियों के आधार पर निम्नलिखित में से कौन-सा कथन धातुओं और अधातुओं के बीच सबसे अच्छा अंतर दर्शाता है?","o":["धातुएँ क्षारीय ऑक्साइड बनाती हैं और अम्लों में घुल जाती हैं ; अधातुएँ अम्लीय ऑक्साइड बनाती हैं और जल में घुल जाती हैं।","धातुएँ क्षारीय ऑक्साइड बनाती हैं, कुछ जल में घुलती हैं ; अधातुएँ अम्लीय ऑक्साइड बनाती हैं, अधिकांश जल में अघुलनशील होती हैं।","धातुएँ उभयधर्मी (एम्फोटेरिक) ऑक्साइड बनाती हैं ; अधातुएँ क्षारीय ऑक्साइड बनाती हैं।","धातुएँ अम्लीय ऑक्साइड बनाती हैं ; अधातुएँ उदासीन ऑक्साइड बनाती हैं।"],"a":0,"e":["धातुएँ ऑक्सीजन से क्रिया कर क्षारीय ऑक्साइड (जैसे Na O, CaO, MgO) 2 बनाती हैं, जो अम्लों से क्रिया कर लवण एवं जल देते हैं।","अधातुएँ अम्लीय ऑक्साइड (जैसे CO , 2 SO , NO ) बनाती हैं, जो जल में घुलकर 2 2 संगत अम्ल ( H CO , H SO , HNO ) 2 3 2 3 3 बनाते हैं।","यही कारण है कि धातु ऑक्साइड लाल लिटमस को नीला तथा अधातु ऑक्साइड नीले लिटमस को लाल करते हैं।","Al O एवं ZnO जैसे कुछ उभयधर्मी 2 3 ऑक्साइड अपवाद हैं।"]},{"s":"सामान्य विज्ञान","q":"धातु L क्लोरीन के साथ अभिक्रिया करके एक घुलनशील हैलाइड बनाती है जिसका उपयोग फोटोग्राफी में होता है ; यह वायु में ऑक्सीकरण के प्रति प्रतिरोधी होती है। धातु L की पहचान करें।","o":["चांदी","पारा / मर्करी","प्लैटिनम","सोना"],"a":0,"e":["चांदी क्लोरीन से क्रिया कर सिल्वर क्लोराइड ( AgCl) बनाती है, जो प्रकाश-संवेदी यौगिक है।","सिल्वर हैलाइड ( AgCl, AgBr, AgI) पारंपरिक फोटोग्राफिक फिल्म एवं प्लेट में प्रकाश-संवेदी परत के रूप में प्रयुक्त होते हैं।","चांदी वायु की ऑक्सीजन से सामान्य ताप पर क्रिया नहीं करती, केवल H S की 2 उपस्थिति में काली ( Ag S) पड़ती है। 2","ध्यान दें कि AgCl जल में लगभग अघुलनशील है, अतः प्रश्न में प्रयुक्त ‘ soluble’ शब्द तकनीकी रूप से सटीक नहीं है, फिर भी अपेक्षित उत्तर चांदी ही है।"]},{"s":"सामान्य विज्ञान","q":"sp हाइब्रिड ऑर्बिटल्स (संकर कक्षकों) के बारे में कौन-सा कथन सही है?","o":["वे गोलाकार सममित होते हैं","उनमें s और p का समान गुण होता है","वे 120° के बंध कोण बनाते हैं","वे π बंध बना सकते हैं"],"a":1,"e":["100","sp संकरण में एक s कक्षक तथा एक p कक्षक मिलकर दो समतुल्य sp संकर कक्षक बनाते हैं।","प्रत्येक sp कक्षक में 50% s गुण एवं 50% p गुण होता है, अर्थात् दोनों का समान अंश।","इनके बीच बंध कोण 180° होता है और ज्यामिति रैखिक होती है, जैसे BeCl एवं 2 एथाइन ( C H )। 2 2","संकर कक्षक केवल सिग्मा ( σ) बंध बनाते हैं ; π बंध असंकरित p कक्षकों के पाश्र्व अतिव्यापन से बनते हैं।"]},{"s":"सामान्य विज्ञान","q":"जब प्रकाश की एक तीव्र किरण को निम्नलिखित विलयनों से गुजारा जाता है तो किस स्थिति में टिण्डल शंकु दिखाई देगा?","o":["कॉपर सल्फेट विलयन","चीनी का घोल","स्वर्ण विलयन (गोल्ड सॉल)","पानी में रेत"],"a":2,"e":["टिण्डल प्रभाव कोलॉइडी विलयन का विशिष्ट लक्षण है, जिसमें कोलॉइडी कण प्रकाश का प्रकीर्णन करते हैं।","स्वर्ण विलयन (गोल्ड सॉल) एक कोलॉइड है जिसके कणों का आकार 1–1000 nm के बीच होता है, अतः इसमें प्रकाश का पथ शंकु के रूप में दिखता है।","कॉपर सल्फेट तथा चीनी का घोल वास्तविक विलयन हैं, जिनके कण अत्यंत सूक्ष्म होने से प्रकाश का प्रकीर्णन नहीं होता।","पानी में रेत एक निलंबन है, जिसमें कण बड़े होने से प्रकाश गुजरता ही नहीं, अतः सही उत्तर स्वर्ण विलयन है।"]},{"s":"सामान्य विज्ञान","q":"सामान्यतः अध्ययन की गई धातुओं में से कौन-सी धातु ऑक्सीजन के साथ सबसे अधिक अभिक्रियाशील मानी जाती है?","o":["मैग्नीशियम","सोडियम","जिंक","लोहा"],"a":1,"e":["सक्रियता श्रेणी में सोडियम, मैग्नीशियम, जिंक और लोहे से ऊपर स्थित है।","सोडियम सामान्य ताप पर ही वायु की ऑक्सीजन से तीव्रता से क्रिया करता है।","यह शीघ्र ही सोडियम ऑक्साइड/ परऑक्साइड बनाकर चमक खो देता है।","इसी कारण सोडियम को केरोसीन में डुबोकर सुरक्षित रखा जाता है।"]},{"s":"सामान्य विज्ञान","q":"मानव शरीर की pH रेंज क्या होती है?","o":["8.35 से 8.45","3.35 से 3.45","7.35 से 7.45","5.35 से 5.45"],"a":2,"e":["मानव रक्त का सामान्य pH मान 7.35 से 7.45 के बीच रहता है, जो हल्का क्षारीय है।","इसे बाइकार्बोनेट, फॉस्फेट तथा प्रोटीन बफर तंत्र नियंत्रित करते हैं।","pH 7.35 से नीचे जाने पर एसिडोसिस तथा 7.45 से ऊपर जाने पर एल्केलोसिस होता है।","इस संकीर्ण परास से अधिक विचलन जीवन के लिए घातक हो सकता है।"]},{"s":"सामान्य विज्ञान","q":"एल्युमिनियम की फॉयल्स अम्लीय और क्षारीय वातावरण में अलग-अलग तरीके से क्यों संक्षारित होती हैं?","o":["एल्युमिनियम अम्लों में समान रूप से घुलता है, क्षारों में सुरक्षात्मक Al(OH) बनाता है 3","एल्युमिनियम दोनों में समान रूप से अभिक्रिया करता है","संक्षारण pH पर निर्भर नहीं करता","एल्युमिनियम अम्लों में कार्बोनेट बनाता है"],"a":0,"e":["एल्युमिनियम एक उभयधर्मी (एम्फोटेरिक) धातु है जो अम्ल व क्षार दोनों से क्रिया करती है।","सामान्यतः इसकी सतह पर Al O की 2 3 पतली सुरक्षात्मक परत बनी रहती है।","अम्लीय माध्यम में यह परत घुल जाती है और धातु समान रूप से क्षय होने लगती है।","भिन्न माध्यमों में बनने वाले उत्पादों की प्रकृति भिन्न होने से संक्षारण व्यवहार भी भिन्न होता है।"]},{"s":"सामान्य विज्ञान","q":"आवर्त सारणी के तीसरे आवर्त में Na और Al में से किस तत्व की परमाणु त्रिज्या अधिक है, और क्यों?","o":["केवल Al की त्रिज्या अधिक होती है क्योंकि उच्च Z इलेक्ट्रॉनों को कम मजबूती से खींचता है","केवल Na की त्रिज्या अधिक होती है क्योंकि पूरे आवर्त में उसका प्रभावी नाभिकीय आवेश कम होता है","दोनों की त्रिज्या समान होती है क्योंकि वे एक ही आवर्त में हैं","केवल Al की त्रिज्या अधिक होती है क्योंकि d- ब्लॉक संकुचन होता है"],"a":1,"e":["आवर्त में बाएँ से दाएँ जाने पर परमाणु क्रमांक बढ़ता है किंतु कोश संख्या समान रहती है।","इससे प्रभावी नाभिकीय आवेश बढ़ता है और इलेक्ट्रॉन नाभिक की ओर अधिक खिंचते हैं।","सोडियम ( Z=11) में एल्युमिनियम ( Z=13) की तुलना में प्रभावी नाभिकीय आवेश कम है।","अतः Na की परमाणु त्रिज्या Al से अधिक होती है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सा क्रियात्मक समूह द्विआण्विक नाभिकस्नेही प्रतिस्थापन (S 2) अभिक्रियाओं में सबसे अधिक N स्टेरिक (त्रिविम) बाधा उत्पन्न करता है?","o":["सेक-ब्यूटाइल समूह","आइसोप्रोपिल समूह","नियोपेंटिल समूह","साइक्लोहेक्सिल समूह 101"],"a":2,"e":["नियोपेंटिल समूह में β- कार्बन पर तीन मेथिल समूह जुड़े होते हैं।","यह भारी शाखित संरचना अभिकर्मक के पीछे से आक्रमण को अत्यधिक बाधित करती है।","इसी कारण नियोपेंटिल हैलाइड S 2 N अभिक्रिया में अत्यंत मंद गति से क्रिया करते हैं।","सेक-ब्यूटाइल, आइसोप्रोपिल व साइक्लोहेक्सिल में त्रिविम बाधा तुलनात्मक रूप से कम होती है।"]},{"s":"सामान्य विज्ञान","q":"क्षारीय धातुओं को मिट्टी के तेल (केरोसीन) में संग्रहित किया जाता है ताकिः","o":["संक्षारण को रोका जा सके","ऑक्सीजन और आग के साथ अभिक्रिया को रोका जा सके","तन्यता को बेहतर बनाया जा सके","आघातवर्धनीयता को कम किया जा सके"],"a":1,"e":["सोडियम, पोटैशियम जैसी क्षार धातुएँ अत्यंत अभिक्रियाशील होती हैं।","ये वायु की ऑक्सीजन तथा नमी से तुरंत क्रिया कर आग पकड़ सकती हैं।","जल से क्रिया कर ये हाइड्रोजन गैस मुक्त करती हैं जो प्रज्वलित हो जाती है।","केरोसीन इन्हें वायु व नमी के संपर्क से बचाता है, इसलिए इसी में रखा जाता है।"]},{"s":"सामान्य विज्ञान","q":"पोटैश एलम का रासायनिक सूत्र क्या है?","o":["K SO ·Al (SO ) ·24H O 2 4 2 4 3 2","K SO ·Al (SO ) ·20H O 2 4 2 4 3 2","K SO ·Al (SO ) ·24H O 2 4 3 4 3 2","K SO ·Al (SO ) ·12H O 2 4 2 4 3 2"],"a":0,"e":["पोटैश एलम को सामान्य भाषा में फिटकरी कहा जाता है।","इसका सूत्र K SO ·Al (SO ) ·24H O 2 4 2 4 3 2 अथवा KAl(SO ) ·12H O लिखा जाता 4 2 2 है।","यह एक द्विक लवण है जो जल में घुलकर दोनों आयन देता है।","इसका उपयोग जल शुद्धिकरण तथा रक्तस्राव रोकने में किया जाता है।"]},{"s":"सामान्य विज्ञान","q":"धातु C ठंडे जल के साथ तीव्र अभिक्रिया करती है, जिससे हाइड्रोजन ( H ) उत्पन्न 2 होती है, और इसका हाइड्रॉक्साइड जल में घुलकर एक प्रबल क्षारीय विलयन बनाता है। धातु C की पहचान करें।","o":["सोडियम","मैग्नीशियम","एल्युमिनियम","कैल्शियम"],"a":0,"e":["सोडियम ठंडे जल से भी तीव्र अभिक्रिया कर हाइड्रोजन गैस मुक्त करता है।","अभिक्रियाः 2Na + 2H O → 2NaOH 2 + H के साथ ऊष्मा भी निकलती है। 2","बना हुआ NaOH प्रबल क्षार है और जल में पूर्णतः वियोजित होता है।","मैग्नीशियम गर्म जल से तथा एल्युमिनियम केवल भाप से क्रिया करता है।"]},{"s":"सामान्य विज्ञान","q":"पहले आवर्त के बारे में सही कथन चुनिए।","o":["इसमें केवल H, He और Li होते हैं।","इसमें केवल दो तत्व होते हैं क्योंकि केवल K कोश भरा होता है।","इसमें आठ तत्व होते हैं क्योंकि 2n2 में n=2 है।","d- कक्षक भरे होने के कारण इसमें दस तत्व होते हैं।"],"a":1,"e":["पहले आवर्त में केवल हाइड्रोजन और हीलियम दो ही तत्व आते हैं।","इसका कारण यह है कि इसमें केवल K कोश ( n=1) भरा जाता है।","2n2 के अनुसार n=1 के लिए अधिकतम 2 इलेक्ट्रॉन ही समा सकते हैं।","इसमें केवल 1s उपकोश (कक्षक) उपलब्ध होता है, अतः यह सबसे छोटा आवर्त है।"]},{"s":"सामान्य विज्ञान","q":"Al की प्रथम आयनन एन्थैल्पी Na, Mg, Si प्रवृत्तियों और उपकोशों के सापेक्ष किस मान के अधिक निकट है?","o":["760 kJ mol−1","575 kJ mol−1","900 kJ mol−1","496 kJ mol−1"],"a":1,"e":["एल्युमिनियम की प्रथम आयनन एन्थैल्पी लगभग 577 kJ mol−1 होती है।","इसका बाह्यतम इलेक्ट्रॉन 3p उपकोश में होता है जो 3s की तुलना में कम दृढ़ता से बद्ध है।","इसी कारण Al का मान Mg ( लगभग 738 kJ mol–1) से कम हो जाता है।","सोडियम का मान लगभग 496 kJ mol−1 है, अतः Al के लिए 575 निकटतम विकल्प है।"]},{"s":"सामान्य विज्ञान","q":"एनोडाइजिंग की प्रक्रिया के दौरान एनोड पर कौन-सी गैस उत्पन्न होती है?","o":["हाइड्रोजन","ऑक्सीजन","नाइट्रोजन","क्लोरीन"],"a":1,"e":["एनोडाइजिंग एक विद्युत-रासायनिक प्रक्रिया है जिसमें एल्युमिनियम पर ऑक्साइड की मोटी सुरक्षात्मक परत चढ़ाई जाती है।","इसमें एल्युमिनियम वस्तु को एनोड बनाया जाता है और तनु अम्ल का विद्युत-अपघट्य प्रयोग होता है।","एनोड पर ऑक्सीकरण होने से ऑक्सीजन गैस मुक्त होती है, जो धातु से क्रिया कर Al O बनाती है। 2 3","कैथोड पर हाइड्रोजन गैस मुक्त होती है।"]},{"s":"सामान्य विज्ञान","q":"धातु A पानी के साथ अभिक्रिया नहीं करती लेकिन सांद्र H SO के साथ 2 4 अभिक्रिया करके SO और एक लवण 2 बनाती है। धातु A की पहचान करें। 102","o":["ताँबा (कॉपर)","टिन","सीसा (लेड)","लोहा (आयरन)"],"a":0,"e":["ताँबा अभिक्रियाशीलता श्रेणी में हाइड्रोजन से नीचे स्थित है, अतः यह जल या तनु अम्लों से अभिक्रिया नहीं करता।","किंतु गर्म सांद्र सल्फ्यूरिक अम्ल एक प्रबल ऑक्सीकारक होने के कारण ताँबे से अभिक्रिया कर लेता है।","अभिक्रियाः Cu + 2H SO → CuSO 2 4 4 + SO + 2H O, जिसमें कॉपर सल्फेट 2 2 (लवण) तथा SO बनती है। 2","लोहा जल-वाष्प से तथा टिन एवं सीसा तनु अम्लों से क्रिया कर सकते हैं, अतः सही उत्तर ताँबा है।"]},{"s":"सामान्य विज्ञान","q":"बेकिंग सोडा रेप्रिफजरेटर से दुर्गंध हटाने में प्रभावी है क्योंकिः","o":["यह दुर्गंध पैदा करने वाले बैक्टीरिया को मारता है","यह अम्लीय और क्षारीय दुर्गंध अणुओं को उदासीन करता है","यह दुर्गंध युक्त नमी को अवशोषित करता है","यह अपनी सुगंध से दुर्गंध को छुपा देता है"],"a":1,"e":["बेकिंग सोडा (सोडियम बाइकार्बोनेट, NaHCO ) एक दुर्बल क्षार है जो 3 उभयधर्मी व्यवहार दर्शाता है।","खाद्य पदार्थों से निकलने वाले अधिकांश दुर्गंधकारी अणु अम्लीय अथवा क्षारीय प्रकृति के होते हैं।","बेकिंग सोडा इन अणुओं से क्रिया कर उन्हें उदासीन कर देता है, जिससे गंध समाप्त हो जाती है।","यह न तो केवल नमी सोखता है और न ही अपनी गंध से दुर्गंध को ढकता है।"]},{"s":"सामान्य विज्ञान","q":"आधुनिक आवर्त सारणी में तत्वों को मुख्य रूप से किस बढ़ते क्रम में व्यवस्थित किया गया हैः","o":["परमाणु क्रमांक","परमाणु द्रव्यमान","घनत्व","गलनांक"],"a":0,"e":["आधुनिक आवर्त सारणी में तत्वों को उनके बढ़ते परमाणु क्रमांक के क्रम में व्यवस्थित किया गया है।","इसका आधार हेनरी मोसले द्वारा प्रतिपादित आधुनिक आवर्त नियम है।","इसके अनुसार तत्वों के गुण उनके परमाणु क्रमांक के आवर्ती फलन होते हैं।","मेंडलीफ ने अपनी आवर्त सारणी परमाणु द्रव्यमान के आधार पर बनाई थी, जिसमें कई विसंगतियाँ थीं।"]},{"s":"सामान्य विज्ञान","q":"फायर एक्सटिंग्विशर (अग्निशामक) फोम की झाग बनने की क्रिया किस प्रकार कार्य करती हैः","o":["जलती हुई सामग्री को प्रज्वलन तापमान से नीचे ठंडा करना","इ±धन से ऑक्सीजन को अलग करने के लिए एक अवरोध बनाना","दहन को निष्क्रिय करने वाली रासायनिक अभिक्रियाएँ","ज्वलनशील वाष्पों को निष्क्रिय पदार्थों से तनु करना"],"a":1,"e":["दहन के लिए इ±धन, ऑक्सीजन तथा प्रज्वलन ताप – तीनों का होना आवश्यक है।","फोम अग्निशामक जलती हुई सतह पर झाग की एक हल्की परत बना देता है।","यह परत इ±धन तथा वायुमंडलीय ऑक्सीजन के बीच अवरोध का कार्य करती है, जिससे आग बुझ जाती है।","यह विशेष रूप से तेल एवं पेट्रोलियम जनित आग (क्लास- B) बुझाने में प्रभावी होता है।"]},{"s":"सामान्य विज्ञान","q":"चींटी के डंक में प्राकृतिक रूप से कौन-सा अम्ल पाया जाता है?","o":["लैक्टिक अम्ल","मैलिक अम्ल","साइट्रिक अम्ल","फॉर्मिक अम्ल"],"a":3,"e":["चींटी के डंक में फॉर्मिक अम्ल (मेथेनोइक अम्ल, HCOOH) पाया जाता है।","इसी अम्ल के कारण डंक मारने पर जलन एवं दर्द की अनुभूति होती है।","इसे उदासीन करने के लिए बेकिंग सोडा जैसे दुर्बल क्षार का लेप लगाया जाता है।","लैक्टिक अम्ल दही में तथा साइट्रिक अम्ल नींबू-संतरे में पाया जाता है।"]},{"s":"सामान्य विज्ञान","q":"जब एक क्षारीय विलयन और एक अम्लीय विलयन को मिलाया जाता है, तो क्या होता है?","o":["केवल तापमान बढ़ता है","तापमान बढ़ने के साथ लवण का निर्माण होता है","तापमान घटने के साथ लवण का निर्माण होता है","केवल लवण का निर्माण होता है"],"a":1,"e":["अम्ल एवं क्षार के मिलने पर उदासीनीकरण अभिक्रिया होती है – अम्ल रू क्षार → लवण रू जल।","यह अभिक्रिया ऊष्माक्षेपी होती है, अर्थात् इसमें ऊष्मा मुक्त होती है।","अतः लवण बनने के साथ-साथ विलयन का तापमान भी बढ़ जाता है।","इसीलिए ‘केवल लवण बनता है’ या ‘केवल तापमान बढ़ता है’ जैसे विकल्प अधूरे हैं।"]},{"s":"सामान्य विज्ञान","q":"एक समुद्री तेल रिग में संक्षारण होता है। कौन-सी विधि इसे संरचना से जुड़ी 103 अधिक अभिक्रियाशील धातु का उपयोग करके सुरक्षित करती है?","o":["गैल्वनीकरण","पेंटिंग","बलिदान एनोड सुरक्षा (सैक्रिफिशल एनोड प्रोटेक्शन)","मिश्रधातु बनाना"],"a":2,"e":["बलिदान एनोड सुरक्षा में लोहे/इस्पात की संरचना से जिंक या मैग्नीशियम जैसी अधिक अभिक्रियाशील धातु जोड़ी जाती है।","यह धातु स्वयं एनोड बनकर पहले संक्षारित होती है और मुख्य संरचना कैथोड बनकर सुरक्षित रहती है।","इसी कारण इसे ‘कैथोडिक संरक्षण’ भी कहा जाता है और यह जहा”ाों व समुद्री रिग में प्रयुक्त होती है।","गैल्वनीकरण में जिंक की परत चढ़ाई जाती है, जो एक भिन्न विधि है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित विकल्पों में से नाभिकस्नेही (न्यूक्लियोफाइल) की भविष्यवाणी करें।","o":["C H OH","C H 2 5 2 6","BF","AlCl 3 3"],"a":0,"e":["नाभिकस्नेही वे स्पीशी”ा होती हैं जो इलेक्ट्रॉन युग्म दान करती हैं और धनावेशित केंद्र पर आक्रमण करती हैं।","C H OH (इथेनॉल) में ऑक्सीजन परमाणु 2 5 पर दो एकाकी इलेक्ट्रॉन युग्म उपस्थित होते हैं, अतः यह नाभिकस्नेही है।","BF तथा AlCl इलेक्ट्रॉन-न्यून (अपूर्ण 3 3 अष्टक वाले) यौगिक हैं, अतः ये इलेक्ट्रॉनस्नेही हैं।","C H एक संतृप्त हाइड्रोकार्बन है जिसमें 2 6 कोई एकाकी युग्म नहीं होता।"]},{"s":"सामान्य विज्ञान","q":"प्रश्नपत्र में दी गई संरचना (एस्टर) के लिए सही नाम का अनुमान लगाएँ।","o":["3- मेथाइलपेंटाइल एथानोएट","एथिल 3- मेथाइलपेंटानोएट","एथिल 3- मेथाइलपेंटोएट","3- मेथाइलपेंटानोइक अम्ल एथिल एस्टर"],"a":1,"e":["दी गई संरचना एक एस्टर की है, जिसमें – O– से जुड़ा एल्किल समूह एथिल है।","अम्ल वाला भाग पाँच कार्बन की श्रृंखला है जिसके तीसरे कार्बन पर मेथिल समूह जुड़ा है, अर्थात् 3- मेथाइलपेंटानोइक अम्ल।","एस्टर के IUPAC नामकरण में पहले एल्किल समूह और फिर अम्ल भाग का ‘-ओएट’ रूप लिखा जाता है।","अतः यौगिक का सही नाम एथिल 3- मेथाइलपेंटानोएट है।"]},{"s":"सामान्य विज्ञान","q":"कौन-सी धातु ठंडे पानी के साथ तीव्रता से अभिक्रिया करती है और हाइड्रोजन गैस उत्पन्न करती है जो तुरंत जल उठती है?","o":["कैल्शियम","सोडियम","मैग्नीशियम","एल्युमिनियम"],"a":1,"e":["सोडियम ठंडे जल से अत्यंत तीव्रता से अभिक्रिया कर सोडियम हाइड्रॉक्साइड तथा हाइड्रोजन गैस बनाता है।","अभिक्रियाः 2Na + 2H O → 2NaOH 2 + H ↑; यह इतनी ऊष्माक्षेपी है कि उत्पन्न 2 हाइड्रोजन तुरंत जल उठती है।","कैल्शियम ठंडे जल से अपेक्षाकृत धीमी अभिक्रिया करता है और गैस नहीं जलती।","मैग्नीशियम केवल गर्म जल से तथा एल्युमिनियम केवल भाप से अभिक्रिया करता है।"]},{"s":"सामान्य विज्ञान","q":"पोटैश एलम का जलीय विलयन कैसा होता है?","o":["उदासीन","थोड़ा क्षारीय","अम्लीय","अत्यधिक क्षारीय"],"a":2,"e":["पोटैश एलम (फिटकरी) का सूत्र K SO ·Al (SO ) ·24H O है और यह 2 4 2 4 3 2 एक द्विक लवण है।","यह प्रबल अम्ल ( H SO ) तथा दुर्बल 2 4 क्षार [Al(OH) ] के संयोग से बना लवण 3 है।","जल में घुलने पर Al3+ आयन का जल-अपघटन होकर H+ आयन मुक्त होते हैं।","अतः इसका जलीय विलयन अम्लीय ( pH 7 से कम) होता है ; इसी गुण के कारण यह स्तंभक ( astringent) का कार्य करता है।"]},{"s":"सामान्य विज्ञान","q":"मेंडलीव ने तत्वों के गुणों में देखी गई दोहराव वाली प्रवृत्ति को व्यक्त करने के लिए कौन-सा शब्द प्रयोग किया?","o":["आवर्ती अनुनाद","आवर्ती पुनरावृत्ति","आवर्ती संरेखण","आवर्ती साम्यता"],"a":1,"e":["मेंडलीव ने तत्वों के गुणों में निश्चित अंतराल पर दिखने वाली दोहराव प्रवृत्ति को ‘आवर्ती पुनरावृत्ति’ ( Periodic recurrence) कहा।","उनके आवर्त नियम के अनुसार तत्वों के गुण उनके परमाणु द्रव्यमानों के आवर्ती फलन होते हैं।","इसी आधार पर उन्होंने 1869 में अपनी आवर्त सारणी प्रस्तुत की और रिक्त स्थान भी छोड़े।","बाद में मो”ाले ने सिद्ध किया कि गुणों का आधार परमाणु द्रव्यमान नहीं, बल्कि परमाणु क्रमांक है।"]},{"s":"सामान्य विज्ञान","q":"एक आवर्त में बाएँ से दाएँ जाने पर, संयोजी इलेक्ट्रॉनों की संख्या सामान्यतःः","o":["एक से घटती है","स्थिर रहती है","एक से बढ़ती है","दोगुनी हो जाती है"],"a":2,"e":["किसी आवर्त में बाएँ से दाएँ जाने पर प्रत्येक क्रमिक तत्व में एक इलेक्ट्रॉन बढ़ता है, जो बाह्यतम कोश में जुड़ता है।","इस कारण संयोजी इलेक्ट्रॉनों की संख्या 1 से बढ़कर क्रमशः 8 तक हो जाती है।","आवर्त में कोशों (शेल) की संख्या स्थिर रहती है, केवल नाभिकीय आवेश बढ़ता है।","इसके विपरीत समूह में नीचे जाने पर संयोजी इलेक्ट्रॉन समान रहते हैं परंतु कोशों की संख्या बढ़ती है।"]},{"s":"सामान्य विज्ञान","q":"कौन-सा युग्म उस अपवाद को दर्शाता है जिसमें “हल्के 2p तत्व की ΔegH (इलेक्ट्रॉन लब्धि एन्थैल्पी) उसके भारी समजातीय तत्व की तुलना में कम ऋणात्मक होती है”, क्योंकि उसके उपकोश सघन होते हैं?","o":["O बनाम S जहाँ O कम ऋणात्मक है","S बनाम Se जहाँ S अधिक ऋणात्मक है","Cl बनाम Br जहाँ Cl कम ऋणात्मक है","N बनाम P जहाँ N अधिक ऋणात्मक है"],"a":0,"e":["सामान्यतः समूह में ऊपर से नीचे जाने पर इलेक्ट्रॉन लब्धि एन्थैल्पी कम ऋणात्मक होती जाती है।","किंतु द्वितीय आवर्त ( 2p) के तत्वों – O, N, F — का आकार बहुत छोटा तथा उपकोश सघन होते हैं।","इस कारण आने वाले इलेक्ट्रॉन पर पहले से उपस्थित इलेक्ट्रॉनों का प्रबल प्रतिकर्षण होता है।","फलस्व:प ऑक्सीजन की ΔegH सल्फर की तुलना में कम ऋणात्मक होती है ; यही अपवाद F और Cl में भी दिखाई देता है।"]},{"s":"सामान्य विज्ञान","q":"एक रहस्यमय यौगिक X तापीय अपघटन से एक भूरे रंग की गैस Y और एक पीला अवशेष W उत्पन्न करता है। यदि मूल यौगिक X में द्रव्यमान के अनुसार 17% नाइट्रोजन होता है, तो X की पहचान करें।","o":["Pb(NO )","Cu(NO ) 3 2 3 2","Fe(NO )","Zn(NO ) 3 3 3 2"],"a":2,"e":["सभी नाइट्रेट लवण तापीय अपघटन पर भूरे रंग की NO गैस देते हैं, अतः यह संकेत 2 अकेले निर्णायक नहीं है।","निर्णायक आँकड़ा नाइट्रोजन का द्रव्यमान प्रतिशत है – Pb(NO ) में ≈ 8.5%, 3 2 Cu(NO ) में ≈ 14.9% तथा Zn(NO ) 3 2 3 2 में ≈ 14.8% नाइट्रोजन होती है।","Fe(NO ) का मोलर द्रव्यमान ≈ 241.9 3 3 है और उसमें नाइट्रोजन = 42/241.9 × 100 ≈ 17.4% होती है।","प्रश्न में दी गई 17% नाइट्रोजन मात्रा केवल Fe(NO ) से मेल खाती है, अतः X = 3 3 Fe(NO ) है। 3 3"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सा सूत्र pOH की गणना के लिए उपयोग किया जाता है?","o":["−log [H+]","log [OH−] 10 2","−log [OH−]","−log [H+] 10 2"],"a":2,"e":["pOH किसी विलयन में हाइड्रॉक्साइड आयन सांद्रता का ऋणात्मक साधारण (आधार 10) लघुगणक होता है।","अर्थात pOH = −log [OH−]; इसी 10 प्रकार pH = −log [H+] होता है। 10","25 °C पर जल के आयनिक गुणनफल से संबंध pH + pOH = 14 प्राप्त होता है।","pOH का मान 7 से कम होने पर विलयन क्षारीय तथा 7 से अधिक होने पर अम्लीय होता है।"]},{"s":"सामान्य विज्ञान","q":"मेंडलीव द्वारा Al ( एल्युमिनियम) और Si ( सिलिकॉन) के नीचे आने वाले अनुमानित तत्वों के लिए प्रयुक्त शब्द किस संस्कृत संख्या उपसर्ग से बना था?","o":["द्वि ( Dvi)","त्रि ( Tri)","एक ( Eka)","शून्य ( Shunya)"],"a":2,"e":["मेंडलीव ने अपनी आवर्त सारणी में रिक्त स्थानों के अज्ञात तत्वों के नाम संस्कृत उपसर्ग ‘एक’ ( Eka) लगाकर दिए।","एल्युमिनियम के नीचे वाले तत्व को ‘एका-एल्युमिनियम’ कहा गया, जिसे बाद में गैलियम नाम मिला।","सिलिकॉन के नीचे वाले तत्व को ‘एका-सिलिकॉन’ कहा गया, जिसे बाद में जर्मेनियम नाम दिया गया।","इसी प्रकार बोरॉन के नीचे ‘एका-बोरॉन’ (स्कैंडियम) था ; इन तत्वों के गुणों की उनकी भविष्यवाणी लगभग सही सिद्ध हुई।"]},{"s":"सामान्य विज्ञान","q":"फॉस्फोरस ट्राइब्रोमाइड की जल के साथ अभिक्रिया करके फॉस्फोरस अम्ल और हाइड्रोब्रोमिक अम्ल बनाने पर, हाइड्रोब्रोमिक अम्ल का गुणांक क्या है? ( PBr + H O → H PO + HBr) 3 2 3 3","o":["3","2","1","6"],"a":0,"e":["संतुलित समीकरण हैः PBr + 3H O → 3 2 H PO + 3HBr । 3 3","बाइ± ओर PBr में 3 ब्रोमीन परमाणु हैं, अतः 3 दाइ± ओर भी 3 HBr अणु बनने चाहिए।","हाइड्रोजन की जाँचः बाइ± ओर 3H O से 6 2 H; दाइ± ओर H PO से 3 तथा 3HBr 3 3 से 3, कुल 6 H ।","ऑक्सीजन भी दोनों ओर 3-3 है ; अतः HBr का गुणांक 3 है।"]},{"s":"सामान्य विज्ञान","q":"आधुनिक आवर्त सारणी में समूहों और आवतो± (periods) के बारे में निम्न में से कौन-सा कथन गलत है?","o":["एक समूह के तत्वों में संयोजी इलेक्ट्रॉनों की संख्या समान होती है।","एक आवर्त के तत्वों में भरे हुए कोशों की संख्या समान होती है।","एक आवर्त में संयोजी इलेक्ट्रॉनों की संख्या स्थिर रहती है।","एक समूह में नीचे की ओर जाने पर कोशों की संख्या बढ़ती है। 105"],"a":2,"e":["आधुनिक आवर्त सारणी में एक ही समूह के तत्वों में संयोजी इलेक्ट्रॉनों की संख्या समान होती है – यह कथन सही है।","एक ही आवर्त के तत्वों में भरे हुए कोशों (शेल) की संख्या समान रहती है – यह भी सही है।","समूह में नीचे जाने पर कोशों की संख्या बढ़ती जाती है – यह भी सही कथन है।","किंतु आवर्त में बाएँ से दाएँ जाने पर संयोजी इलेक्ट्रॉन 1 से बढ़कर 8 तक हो जाते हैं, अतः तीसरा कथन गलत है।"]},{"s":"सामान्य विज्ञान","q":"एक ता”ाा तैयार किया गया मिश्रण जिसमें सांद्र HCl और HNO का अनुपात 3:1 3 होता है, उसे क्या कहा जाता है?","o":["एक्वा रेजिया (अम्लराज)","पिघला हुआ लवण","क्षारीय विलयन","अम्लीय ऑक्साइड"],"a":0,"e":["सांद्र हाइड्रोक्लोरिक अम्ल एवं सांद्र नाइट्रिक अम्ल का 3:1 अनुपात वाला मिश्रण अम्लराज ( Aqua Regia) कहलाता है।","यह अत्यंत संक्षारक एवं प्रबल ऑक्सीकारक होता है तथा इसका रंग पीला-नारंगी होता है।","यह सोना और प्लैटिनम जैसी उत्कृष्ट धातुओं को भी घोल सकता है, जिन्हें कोई एक अम्ल नहीं घोल पाता।","‘एक्वा रेजिया’ का शाब्दिक अर्थ ‘राजाओं का जल’ है।"]},{"s":"सामान्य विज्ञान","q":"बिच्छू बूटी (नेटल पत्तियों) के डंक की pH अम्लीय क्यों होती है?","o":["मेथेनॉइक अम्ल की उपस्थिति के कारण","एस्कॉर्बिक अम्ल की उपस्थिति के कारण","मेथनॉल अम्ल की उपस्थिति के कारण","टारटारिक अम्ल की उपस्थिति के कारण"],"a":0,"e":["बिच्छू बूटी (नेटल) की पत्तियों पर डंकनुमा रोम होते हैं जिनमें मेथेनोइक अम्ल भरा रहता है।","मेथेनॉइक अम्ल को फॉर्मिक अम्ल ( HCOOH) भी कहा जाता है, यही अम्ल चींटी के डंक में भी पाया जाता है।","स्पर्श करने पर यह अम्ल त्वचा में प्रवेश कर जलन एवं दर्द उत्पन्न करता है।","इसके उपचार हेतु डॉक पौधे की पत्ती (जिसमें क्षारक होता है) रगड़ी जाती है, जो अम्ल को उदासीन कर देती है।"]},{"s":"सामान्य विज्ञान","q":"दिए गए धातुओं के रासायनिक प्रतीकों से, आभूषण बनाने में प्रयुक्त धातु की पहचान करें।","o":["Al","Gd","Ge","Pt"],"a":3,"e":["Pt, प्लैटिनम का प्रतीक है, जो आभूषण निर्माण में व्यापक रूप से प्रयुक्त होने वाली उत्कृष्ट धातु है।","प्लैटिनम संक्षारण-रोधी, चमकदार एवं आघातवध्र्य होने के कारण आभूषणों के लिए उपयुक्त है।","Al एल्युमिनियम, Gd गैडोलिनियम तथा Ge जर्मेनियम के प्रतीक हैं।","जर्मेनियम एक उपधातु है जो अर्धचालक के रूप में प्रयुक्त होती है, आभूषणों में नहीं।"]},{"s":"सामान्य विज्ञान","q":"तीसरे आवर्त के तत्व ( Na से Ar) को एक साथ रखा गया है क्योंकि इनके इलेक्ट्रॉन भरे होते हैंः","o":["केवल K और L कोशों में","K, L, और M कोशों में","केवल L और M कोशों में","M और N कोशों में"],"a":1,"e":["तृतीय आवर्त सोडियम ( Na, परमाणु क्रमांक 11) से आर्गन ( Ar, परमाणु क्रमांक 18) तक चलता है।","इन सभी तत्वों में इलेक्ट्रॉन K, L तथा M — तीनों कोशों में भरे होते हैं।","K कोश में 2 तथा L कोश में 8 इलेक्ट्रॉन पूर्ण होते हैं, शेष इलेक्ट्रॉन M कोश में भरते हैं।","किसी तत्व का आवर्त क्रमांक उसके सबसे बाहरी कोश (यहाँ M = 3) की संख्या के बराबर होता है।"]},{"s":"सामान्य विज्ञान","q":"प्रथम आयनन एन्थैल्पी अनेक तत्वों में किस कुल में स्थानीय न्यूनतम और किस कुल में स्थानीय उच्चतम दर्शाती है?","o":["उत्कृष्ट गैसों में न्यूनतम, क्षारीय धातुओं में उच्चतम","क्षारीय धातुओं में न्यूनतम, उत्कृष्ट गैसों में उच्चतम","हैलोजनों में न्यूनतम, क्षारीय मृदा धातुओं में उच्चतम","p- ब्लॉक में न्यूनतम, d- ब्लॉक में उच्चतम"],"a":1,"e":["क्षार धातुओं ( Li, Na, K आदि) के बाह्यतम कोश में केवल एक इलेक्ट्रॉन होता है जो सरलता से निकल जाता है।","अतः इनकी प्रथम आयनन एन्थैल्पी प्रत्येक आवर्त में न्यूनतम होती है।","उत्कृष्ट गैसों ( He, Ne, Ar आदि) का अष्टक पूर्ण एवं विन्यास अत्यंत स्थायी होता है।","इसलिए इनसे इलेक्ट्रॉन निकालना कठिन होता है और इनकी आयनन एन्थैल्पी उच्चतम होती है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सी धातु ऑक्सीजन, पानी और अम्लों के प्रति सबसे कम अभिक्रियाशील मानी जाती है?","o":["सोडियम","मैग्नीशियम","ताँबा","जिंक 106"],"a":2,"e":["धातुओं की सक्रियता श्रेणी में ऊपर की धातुएँ अधिक तथा नीचे की कम अभिक्रियाशील होती हैं।","सोडियम, मैग्नीशियम एवं जिंक हाइड्रोजन से ऊपर हैं, अतः तनु अम्लों से हाइड्रोजन विस्थापित करते हैं।","ताँबा हाइड्रोजन से नीचे स्थित है, इसलिए यह तनु अम्लों से अभिक्रिया नहीं करता।","अतः दिए गए विकल्पों में ताँबा सबसे कम अभिक्रियाशील धातु है।"]},{"s":"सामान्य विज्ञान","q":"एक टिन-लेपित पीतल (ब्रास) का डिब्बा समय के साथ हरे धब्बे दिखाता है। कौन-सी अभिक्रिया इस घटना को समझाती है?","o":["टिन ( Sn) वायु के साथ अभिक्रिया करके SnO बनाता है","कोटिंग के नीचे पीतल अभिक्रिया करता है और Cu (OH) Cl बनाता 2 3 है","टिन जल के साथ अभिक्रिया करके Sn(OH) बनाता है 2","पीतल Al O बनाता है 2 3"],"a":1,"e":["पीतल ताँबा एवं जस्ता की मिश्र धातु है, जिसमें ताँबा प्रमुख घटक होता है।","टिन की परत में दरार या छिद्र होने पर नमी, ऑक्सीजन एवं क्लोराइड आयन भीतर पहुँच जाते हैं।","इससे ताँबा क्षारीय कॉपर क्लोराइड Cu (OH) Cl बनाता है, जिसका रंग हरा 2 3 होता है।","यही हरी परत ‘पेटिना’ कहलाती है और डिब्बे पर हरे धब्बों के रूप में दिखाई देती है।"]},{"s":"सामान्य विज्ञान","q":"मेंडलीव ने तत्वों को समान गुणों वाले स्तंभों (समूहों) में वर्गीकृत करने के लिए मुख्य रूप से किस मानदंड का उपयोग किया?","o":["प्रोटॉनों की संख्या","निर्मित हाइड्राइड और ऑक्साइड (और उनके सूत्र)","आयनीकरण ऊर्जा","विद्युतऋणात्मकता प्रवृत्तियाँ"],"a":1,"e":["मेंडलीव ने 1869 में तत्वों को उनके बढ़ते परमाणु द्रव्यमान के क्रम में व्यवस्थित किया।","समान गुणों वाले समूह बनाने के लिए उन्होंने तत्वों द्वारा बनाए गए हाइड्राइड एवं ऑक्साइड के सूत्रों को आधार बनाया।","इसी आधार पर उन्होंने एका-बोरॉन, एका-एल्युमिनियम एवं एका-सिलिकॉन जैसे अज्ञात तत्वों की भविष्यवाणी की।","प्रोटॉन संख्या (परमाणु क्रमांक) का आधार बाद में मोजले ने आधुनिक आवर्त सारणी में दिया।"]},{"s":"सामान्य विज्ञान","q":"बर्तन साबुन द्वारा चिकनाई के दाग हटाने का रासायनिक आधार क्या है?","o":["उच्च pH द्वारा कार्बनिक यौगिकों को घोलना","सर्पेफक्टेंट्स द्वारा तेल को पानी में इमल्सीफाई (पायसीकरण) करना","वसा अम्ल श्रृंखलाओं का रासायनिक विघटन","साबुन के घुलने से ऊष्मा उत्पन्न होना"],"a":1,"e":["साबुन एवं डिटर्जेंट के अणु सर्पेफक्टेंट होते हैं जिनका एक सिरा जलरागी और दूसरा जलविरागी होता है।","जलविरागी सिरा तेल/ग्रीस से जुड़ता है तथा जलरागी सिरा पानी की ओर उन्मुख रहता है।","इससे तेल की बूँदों के चारों ओर ‘मिसेल’ बन जाते हैं और तेल पानी में पायस (इमल्शन) के रूप में बिखर जाता है।","यह पायसीकरण ही वह रासायनिक आधार है जिससे चिकनाई पानी के साथ बह जाती है।"]},{"s":"सामान्य विज्ञान","q":"कैल्शियम कार्बोनेट के उफष्मीय अपघटन द्वारा मुक्त गैस की पहचान करें।","o":["O","CO 2","CO","O 2 3"],"a":2,"e":["कैल्शियम कार्बोनेट को तीव्र गर्म करने पर वह ऊष्मीय अपघटन से टूटता है।","अभिक्रिया है – CaCO → CaO + 3 CO (लगभग 800-900°C से आरंभ 2 होता है)।","इसमें कैल्शियम ऑक्साइड (बिना बुझा चूना) शेष रहता है और कार्बन डाइऑक्साइड गैस मुक्त होती है।","यही प्रक्रिया चूना भटि्ठयों में व्यावसायिक रूप से चूना बनाने हेतु प्रयोग की जाती है।"]},{"s":"सामान्य विज्ञान","q":"ऐसी गैस, जो पॉप ध्वनि के साथ और नीले रंग की लौ में जलती है ; वह कौन-सी गैस होती है?","o":["हाइड्रोजन","ऑक्सीजन","कार्बन डाइऑक्साइड","कार्बन मोनोऑक्साइड"],"a":0,"e":["हाइड्रोजन गैस जलती हुई तीली के समीप लाने पर “पॉप” ध्वनि के साथ नीली लौ देकर जलती है।","यह गैस सक्रिय धातु और तनु अम्ल की अभिक्रिया से प्रयोगशाला में प्राप्त की जाती है।","ऑक्सीजन स्वयं नहीं जलती, वह केवल जलने में सहायक (उदासीन दहन-पोषक) गैस है।","कार्बन डाइऑक्साइड आग बुझाने वाली गैस है, जबकि कार्बन मोनोऑक्साइड विषैली गैस है जो नीली लौ के साथ जलती है परंतु पॉप ध्वनि नहीं देती। 107"]},{"s":"सामान्य विज्ञान","q":"कौन-सी धातु ठंडे पानी के साथ धीरे-धीरे अभिक्रिया करके हाइड्रोजन ( H ) उत्पन्न 2 करती है, लेकिन मैग्नीशियम से अधिक अभिक्रियाशील होती है?","o":["कैल्शियम","सोडियम","पोटैशियम","एल्युमिनियम"],"a":0,"e":["कैल्शियम ठंडे जल के साथ धीमी अभिक्रिया करके कैल्शियम हाइड्रॉक्साइड और हाइड्रोजन गैस बनाता है।","उत्पन्न हाइड्रोजन के बुलबुले धातु की सतह पर चिपक जाते हैं, जिससे कैल्शियम जल में तैरने लगता है।","सोडियम और पोटैशियम जल से अत्यंत तीव्र, ऊष्माक्षेपी और विस्फोटक अभिक्रिया करते हैं – “धीरे-धीरे” नहीं।","मैग्नीशियम ठंडे जल से अत्यंत धीमी अभिव्रिफया करता है, किंतु गर्म जल/भाप से ते”ाी से व्रिफया कर Mg(OH) अथवा 2 MgO तथा H बनाता है। 2"]},{"s":"सामान्य विज्ञान","q":"मेंडलीव की आवर्त सारणी में ऊध्र्वाधर स्तंभों और क्षैतिज पंक्तियों को क्या कहा जाता था?","o":["आवर्त और कोश क्रमशः","कुल और श्रेणियाँ क्रमशः","समूह और आवर्त क्रमशः","आवर्त और कुल क्रमशः"],"a":2,"e":["आवर्त सारणी में ऊध्र्वाधर स्तंभों को समूह तथा क्षैतिज पंक्तियों को आवर्त कहा जाता है।","एक ही समूह के तत्वों के बाह्यतम कोश में इलेक्ट्रॉनों की संख्या समान होती है, इसलिए उनके रासायनिक गुण भी समान होते हैं।","एक ही आवर्त के तत्वों में कोशों (शेल) की संख्या समान रहती है।","मेंडलीव ने तत्वों को बढ़ते परमाणु द्रव्यमान के क्रम में रखकर यह सारणी बनाई थी।"]},{"s":"सामान्य विज्ञान","q":"आवर्त प्रवृत्तियों की चर्चा में उत्कृष्ट गैसों की त्रिज्याओं की तुलना सहसंयोजक त्रिज्याओं से क्यों नहीं की जाती?","o":["उत्कृष्ट गैसों की त्रिज्या शून्य होती है","उत्कृष्ट गैसें एक परमाणु वाली होती हैं और उनकी गैर-बंधित वान्डर वाल्स वाल्स त्रिज्याएँ बहुत बड़ी होती हैं","उत्कृष्ट गैसें हमेशा धात्विक बंध बनाती हैं","उत्कृष्ट गैसों की त्रिज्या आयनिक त्रिज्या के रूप में मापी जाती है"],"a":1,"e":["उत्कृष्ट गैसें सामान्यतः अणु नहीं बनातीं, वे एकपरमाणुक अवस्था में पाई जाती हैं।","बंध न बनने के कारण इनकी सहसंयोजक त्रिज्या मापी ही नहीं जा सकती, अतः वैन डर वाल्स त्रिज्या ली जाती है।","वैन डर वाल्स त्रिज्या सहसंयोजक त्रिज्या से काफी बड़ी होती है, इसलिए सीधी तुलना भ्रामक होगी।","यही कारण है कि किसी आवर्त के अंत में उत्कृष्ट गैस की त्रिज्या अचानक बढ़ी हुई दिखाई देती है।"]},{"s":"सामान्य विज्ञान","q":"निम्न में से कौन-सा कथन सबसे अच्छी तरह यह वर्णन करता है कि कार्बन मुख्य रूप से सहसंयोजक बंध बनाता है, आयनिक बंध नहीं?","o":["कार्बन के पास बहुत कम संयोजकता इलेक्ट्रॉन होते हैं","कार्बन की आयनीकरण ऊर्जा बहुत अधिक होती है जिससे इलेक्ट्रॉन खोना कठिन होता है, और इलेक्ट्रॉन बंधुता बहुत कम होती है","कार्बन परमाणु बहुत छोटे होते हैं","कार्बन नोबल गैस विन्यास प्राप्त नहीं कर सकता"],"a":1,"e":["कार्बन के बाह्यतम कोश में चार संयोजी इलेक्ट्रॉन होते हैं।","चार इलेक्ट्रॉन त्यागकर C4+ बनाने के लिए अत्यधिक आयनन ऊर्जा चाहिए, जो व्यावहारिक रूप से संभव नहीं है।","चार इलेक्ट्रॉन ग्रहण कर C4− बनाना भी कठिन है, क्योंकि छोटे नाभिक के लिए इतने अतिरिक्त इलेक्ट्रॉनों को रोक पाना कठिन होता है।","अतः कार्बन इलेक्ट्रॉनों की साझेदारी करके सहसंयोजक बंध बनाता है और अष्टक पूर्ण करता है।"]},{"s":"सामान्य विज्ञान","q":"दूध को अधिक समय तक सुरक्षित रखने के लिए दूधवाला क्या करता है?","o":["ताजे दूध में बहुत थोड़ी मात्रा में बेकिंग सोडा मिलाता है","ताजे दूध में बहुत थोड़ी मात्रा में लैक्टिक अम्ल मिलाता है","ताजे दूध में बहुत थोड़ी मात्रा में पानी मिलाता है","ताजे दूध में बहुत अधिक मात्रा में लैक्टिक अम्ल मिलाता है"],"a":0,"e":["ताजे दूध का pH लगभग 6 होता है, अर्थात् वह हल्का अम्लीय होता है।","दूधवाला उसमें बहुत थोड़ी मात्रा में क्षारीय बेकिंग सोडा मिलाकर उसे हल्का क्षारीय बना देता है।","इससे लैक्टोबैसिलस जीवाणुओं द्वारा लैक्टिक अम्ल बनने की गति घट जाती है और दूध देर से फटता है।","लैक्टिक अम्ल मिलाने पर दूध शीघ्र फट जाएगा तथा पानी मिलाने से केवल मिलावट होगी, संरक्षण नहीं।"]},{"s":"सामान्य विज्ञान","q":"लाल विट्रिऑल, हरा विट्रिऑल और सपेफद विट्रिऑल क्या हैं? 108","o":["कोबाल्ट( II) सल्फेट, आयरन( II) सल्फेट और कॉपर( II) सल्फेट क्रमशः","आयरन( II) सल्फेट, कोबाल्ट( II) सल्फेट और ि”ांक सल्फेट क्रमशः","कोबाल्ट( II) सल्फेट, आयरन( II) सल्फेट और ि”ांक सल्फेट क्रमशः","कॉपर( II) सल्फेट, आयरन( II) सल्फेट और ि”ांक सल्फेट क्रमशः"],"a":2,"e":["“विट्रिऑल” शब्द धातु सल्फेटों के जलयोजित क्रिस्टलों के लिए प्रयुक्त होता है।","लाल विट्रिऑल कोबाल्ट( II) सल्फेट, हरा विट्रिऑल पेफरस अर्थात् आयरन( II) सल्फेट तथा सपेफद विट्रिऑल ि”ांक सल्फेट है।","कॉपर( II) सल्फेट को नीला विट्रिऑल (नीला थोथा) कहा जाता है।","इसी क्रम के कारण विकल्प ( C) सही उत्तर है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से किस आधार ने मेंडलीव के स्तंभों में समूहीकरण के निर्णयों को सबसे सीधे तौर पर निर्देशित किया?","o":["ऑक्साइड और हाइड्राइड के सूत्रों की प्रवृत्तियाँ","धात्विक चमक","केवल परमाणु त्रिज्या","केवल गलनांक"],"a":0,"e":["मेंडलीव ने तत्वों को बढ़ते परमाणु भार के साथ-साथ उनके रासायनिक गुणों के आधार पर वर्गीकृत किया।","इसमें उन्होंने तत्वों द्वारा बनाए गए ऑक्साइडों तथा हाइड्राइडों के सूत्रों को मुख्य कसौटी बनाया।","समान सूत्र वाले तत्वों को एक ही ऊध्र्वाधर स्तंभ (समूह) में रखा गया।","इसी आधार पर उन्होंने सारणी में रिक्त स्थान छोड़कर एका-बोरॉन, एका-सिलिकॉन जैसे अज्ञात तत्वों की भविष्यवाणी की।"]},{"s":"सामान्य विज्ञान","q":"मेंडलीव की आवर्त सारणी में कौन-सी विसंगति परमाणु क्रमांक के आधार पर तत्वों को क्रमबद्ध करने से हल हो जाती है?","o":["उत्कृष्ट गैसों की स्थिति","कोबाल्ट–निकेल की स्थिति","क्षारीय धातुओं का समूहन","ऑक्साइड्स की प्रकृति"],"a":1,"e":["मेंडलीव की सारणी में कोबाल्ट (परमाणु भार 58.9) को निकेल ( 58.7) से पहले रखना पड़ा, जो भार-क्रम के विरुद्ध था।","मोसले ने सिद्ध किया कि तत्वों का मूल गुण परमाणु क्रमांक है, न कि परमाणु भार।","परमाणु क्रमांक के आधार पर कोबाल्ट ( 27) स्वाभाविक रूप से निकेल ( 28) से पहले आ जाता है और विसंगति समाप्त हो जाती है।","इसी प्रकार  इलेक्ट्रॉन केवल K और L कोश में भरे होते हैं, वह किस आवर्त में आता है?","o":["पहला","दूसरा","तीसरा","चौथा"],"a":1,"e":["K और L दो इलेक्ट्रॉनिक कोश हैं।","जिस तत्व में केवल K और L कोश में इलेक्ट्रॉन होते हैं, उसमें दो मुख्य ऊर्जा स्तर होते हैं।","आवर्त संख्या इलेक्ट्रॉनिक कोशों की संख्या से निर्धारित होती है।","इसलिए वह तत्व दूसरे आवर्त में होगा।"]},{"s":"सामान्य विज्ञान","q":"कार्बन की 2s और 2p कक्षीय ऊर्जाओं के बारे में कौन-सा कथन सही है?","o":["2s और 2p की ऊर्जा समान होती है","2s की ऊर्जा 2p से कम होती है","2p की ऊर्जा 2s से कम होती है","उनकी सापेक्ष ऊर्जाएँ यौगिक पर निर्भर करती हैं"],"a":1,"e":["एक ही परमाणु में 2s और 2p कक्षीयों की ऊर्जा समान नहीं होती। 111","बहु-इलेक्ट्रॉन परमाणु में 2s कक्षक 2p की तुलना में अधिक स्थिर होती है।","इसलिए 2s की ऊर्जा 2p से कम होती है।","कार्बन में इलेक्ट्रॉन विन्यास 1s2 2s2 2p2 होता है।"]},{"s":"सामान्य विज्ञान","q":"बोरेक्स (सोडियम टेट्राबोरेट) के जलीय विलयन का pH लगभग कितना होता है?","o":["<5","=7","=8",">8"],"a":3,"e":["बोरेक्स एक क्षारीय लवण है।","सोडियम टेट्राबोरेट के जलीय विलयन का pH लगभग 9.2–9.3 होता है।","pH 7 से अधिक होने के कारण इसका विलयन क्षारीय होता है।","इसलिए सही विकल्प >8 है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सी धातु निष्क्रिय ऑक्साइड परत बनाकर जंग को धीमा करती है?","o":["लोहा","एल्युमिनियम","जस्ता","तांबा"],"a":1,"e":["एल्युमिनियम की सतह पर पतली और सघन ऑक्साइड परत बनती है।","यह परत धातु को आगे के ऑक्सीकरण और संक्षारण से बचाती है।","ऑक्साइड परत क्षतिग्रस्त होने पर एल्युमिनियम पर नई परत बन सकती है।","इसी कारण एल्युमिनियम अपेक्षाकृत संक्षारण-प्रतिरोधी होता है।"]},{"s":"सामान्य विज्ञान","q":"वाशिंग सोडा (सोडियम कार्बोनेट) सफाई में प्रभावी क्यों होता है?","o":["यह गंदगी को भौतिक रूप से रगड़कर हटाता है","इसकी क्षारीय प्रकृति अम्लीय दागों को घोलती है","यह रासायनिक क्रिया से बैक्टीरिया मारता है","यह झाग बनाकर गंदगी हटाता है"],"a":1,"e":["वाशिंग सोडा सोडियम कार्बोनेट का जलयोजित रूप है।","यह एक क्षारीय लवण है।","क्षारीय प्रकृति अम्लीय प्रकृति वाले दागों के साथ अभिक्रिया में सहायता करती है।","इसी कारण इसका उपयोग सफाई में किया जाता है।"]},{"s":"सामान्य विज्ञान","q":"किसी आवर्त में त्रिज्या, आयनीकरण एन्थैल्पी और विद्युतऋणात्मकता के बीच क्या संबंध होता है?","o":["बड़ी त्रिज्या के साथ अधिक आयनीकरण एन्थैल्पी और अधिक विद्युतऋणात्मकता","छोटी त्रिज्या के साथ अधिक आयनीकरण एन्थैल्पी और अधिक विद्युतऋणात्मकता","बड़ी त्रिज्या के साथ अधिक विद्युतऋणात्मकता लेकिन कम आयनीकरण एन्थैल्पी","प्रवृत्तियाँ स्वतंत्र हैं"],"a":1,"e":["आवर्त में बाएँ से दाएँ जाने पर प्रभावी नाभिकीय आवेश बढ़ता है।","परमाणु त्रिज्या सामान्यतः घटती है।","इलेक्ट्रॉन को हटाने के लिए आवश्यक आयनीकरण एन्थैल्पी सामान्यतः बढ़ती है।","विद्युतऋणात्मकता भी सामान्यतः बढ़ती है।"]},{"s":"सामान्य विज्ञान","q":"स्थायी मार्कर ‘परमानेंट’ क्यों होते हैं?","o":["ऐसे पिगमेंट के कारण जो सतह से रासायनिक बंध बनाते हैं","ऐसे विलायक के कारण जो सतह को भेदते/घोलते हैं","ऐसे रेजिन के कारण जो मजबूत भौतिक बंध बनाते हैं","ऐसे अम्लों के कारण जो कागज के रेशों से अभिक्रिया करते हैं"],"a":2,"e":["स्थायी मार्कर की स्याही में सामान्यतः पिगमेंट, विलायक और रेजिन/पॉलिमर बाइंडर होते हैं।","विलायक स्याही को पैफलाने और लगाने में सहायता करता है।","विलायक के वाष्पित होने के बाद रेजिन-पॉलिमर परत पिगमेंट को सतह पर टिकाए रखती है।","इसी टिकाऊ फिल्म के कारण मार्कर की स्याही सामान्य पानी से आसानी से नहीं हटती।"]},{"s":"सामान्य विज्ञान","q":"सबसे अधिक तटस्थ फल कौन-सा है?","o":["टमाटर","केला","सेब","अंगूर"],"a":1,"e":["दिए गए विकल्पों में केला अपेक्षाकृत कम अम्लीय और अधिक तटस्थ फल है।","“केले pH का ची लगभग 4.5–5.2 होता है, जबकि टमाटर ( ≈ 4.2), सेब ( ≈ 3.5), तथा अंगूर ( ≈ 3.2), अधिक अम्लीय हैं। अतः दिए गए विकल्पों में केला सर्वाधिक तटस्थ ( pH 7 के निकटतम) फल है।","टमाटर, सेब और अंगूर में सामान्यतः अधिक अम्लीयता पाई जाती है।","फल का pH उसकी अम्लीय या क्षारीय प्रकृति की तुलना बताता है।"]},{"s":"सामान्य विज्ञान","q":"जब सल्फर डाइऑक्साइड पानी में घुलता है, तो यह किस अम्ल का निर्माण करता है?","o":["सल्फेनिलिक अम्ल","सल्फ्यूरस अम्ल","सल्फ्यूरिक अम्ल","सल्फर"],"a":1,"e":["सल्फर डाइऑक्साइड पानी में घुलकर सल्फ्यूरस अम्ल बनाता है। 112","सल्फर डाइऑक्साइड पानी के साथ अभिक्रिया
