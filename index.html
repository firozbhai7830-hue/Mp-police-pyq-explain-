 <div class="card"><b>विषय / Subjects</b><div class="chips" style="margin-top:8px">${Object.keys(c).map(s=>`<button class="chip ${sel.has(s)?"on":""}" data-s="${E(s)}">${E(hn(s))} · ${E(SN[s]||"")} (${c[s]})</button>`).join("")}</div></div>
 <div class="card"><b>क्रम / Order</b><div class="chips" style="margin-top:8px"><button class="chip ${shuf?"":"on"}" data-o="0">क्रम से · In order</button><button class="chip ${shuf?"on":""}" data-o="1">मिलाकर · Shuffle</button></div></div>
 <button class="btn" id="go" ${n?"":"disabled"}>शुरू करें / Start (${n})</button>`;
 $.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const s=b.dataset.s;sel.has(s)?sel.delete(s):sel.add(s);setup()});
 $.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{shuf=b.dataset.o=="1";setup()});
 $.querySelector("#go").onclick=()=>start(D.map((q,k)=>k).filter(k=>sel.has(D[k].s)));
}
function start(ix){L=ix.slice();if(shuf)for(let k=L.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[L[k],L[j]]=[L[j],L[k]]}i=0;A={};show()}
function show(){
 const k=L[i],q=D[k],a=A[k],done=a!==undefined,en=bi&&T[k],wait=bi&&!en&&!F[k]&&S;
 const ok=L.filter(x=>A[x]===D[x].a).length,no=L.filter(x=>A[x]!==undefined&&A[x]!==D[x].a).length;
 $.innerHTML=`<div class="stats"><div style="color:var(--ok)">✓ सही/Correct<br><b>${ok}</b></div><div style="color:var(--no)">✗ गलत/Wrong<br><b>${no}</b></div><div>बाकी/Left<br><b>${L.length-ok-no}</b></div></div>
 <div class="bar"><i style="width:${(i+1)/L.length*100}%"></i></div>
 <div class="meta"><span>प्रश्न/Q ${i+1} / ${L.length}</span><span>${E(hn(q.s))} <button class="chip" id="bt" style="padding:3px 10px;font-size:12px">EN ${bi?"✓":"✗"}</button></span></div>
 <div class="card"><div class="q">${E(q.q)}</div>${en?`<div class="q en">${E(en.q)}</div>`:wait?`<div class="en">Translating… / अनुवाद हो रहा है…</div>`:bi&&!S?`<div class="en">English: open inside Claude / Claude में खोलने पर उपलब्ध</div>`:""}${q.o.map((t,j)=>`<button class="opt ${done?(j==q.a?"ok":j==a?"no":""):""}" data-j="${j}"><b>${"ABCD"[j]}.</b><span>${E(t)}${en?`<small class="en">${E(en.o[j]||"")}</small>`:""}</span><span class="m">${done?(j==q.a?"✓":j==a?"✗":""):""}</span></button>`).join("")}</div>
 ${done?`<div class="card ex"><b>${a==q.a?"✅ सही उत्तर! / Correct!":"❌ गलत / Wrong — सही उत्तर / Answer: "+"ABCD"[q.a]}</b>${q.e.map(x=>`<p>• ${E(x)}</p>`).join("")}${en&&en.e.length?`<div class="tl">${en.e.map(x=>"• "+E(x)).join("<br>")}</div>`:""}</div>`:""}
 <div class="row"><button class="btn g" id="pv" ${i?"":"disabled"}>← पिछला / Prev</button><button class="btn" id="nx">${i<L.length-1?"अगला / Next →":"परिणाम / Result"}</button></div>`;
 $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(A[k]===undefined){A[k]=+b.dataset.j;show()}});
 $.querySelector("#pv").onclick=()=>{i--;show()};
 $.querySelector("#nx").onclick=()=>{if(i<L.length-1){i++;show();scrollTo(0,0)}else result()};
 $.querySelector("#bt").onclick=()=>{bi=!bi;show()};if(bi&&S){if(en)pre();else if(!F[k])go(k)}
}
function sv(){try{localStorage.setItem("tr1",JSON.stringify(T))}catch(e){}}
function ens(k){
 if(T[k]||F[k]||!S)return Promise.resolve();
 if(busy[k])return busy[k];
 const q=D[k];
 return busy[k]=(async()=>{try{const r=await S.json("Translate this Hindi quiz item to simple English. Keep numbers and option order. Return ONLY JSON {\"q\":string,\"o\":[4 strings],\"e\":[strings]}.\n"+JSON.stringify({q:q.q,o:q.o,e:q.e}),{modelTier:"quick"});
  if(r&&r.q&&r.o&&r.o.length==4){T[k]={q:r.q,o:r.o,e:r.e||[]};sv()}else F[k]=1}catch(e){F[k]=1}delete busy[k]})()}
async function go(k){await ens(k);if(L[i]===k&&bi&&$.querySelector("#nx"))show()}
async function pre(){for(const d of[1,2]){const n=L[i+d];if(n!==undefined)await ens(n)}}
function result(){
 const ok=L.filter(x=>A[x]===D[x].a).length,wr=L.filter(x=>A[x]!==undefined&&A[x]!==D[x].a),p=Math.round(ok/L.length*100);
 $.innerHTML=`<h1>परिणाम / Result</h1><div class="card"><div class="big">${p>=70?"🏆":p>=40?"👍":"📖"} ${ok}/${L.length}</div><p style="text-align:center">${p}% · सही/Correct ${ok} · गलत/Wrong ${wr.length} · छोड़े/Skipped ${L.length-ok-wr.length}</p></div>
 <div class="row">${wr.length?`<button class="btn g" id="rw">गलत दोहराएँ / Retry wrong (${wr.length})</button>`:""}<button class="btn" id="rs">फिर से / Restart</button></div>`;
 $.querySelector("#rs").onclick=setup;const r=$.querySelector("#rw");if(r)r.onclick=()=>start(wr);
}
setup();
</script></body></html>
