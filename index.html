 planar) 4 है, जिसमें भी द्विध्रुव परस्पर निरस्त हो जाते हैं।","SF में एक एकाकी इलेक्ट्रॉन युग्म के 4 कारण ‘सी-सॉ’ आकृति बनती है, जिससे परिणामी द्विध्रुव आघूर्ण शून्य नहीं होता।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से किस तत्व में समस्थानिक नहीं होते हैं?","o":["फ्लोरीन","कार्बन","हाइड्रोजन","क्लोरीन"],"a":0,"e":["समस्थानिक वे परमाणु हैं जिनका परमाणु क्रमांक समान किंतु द्रव्यमान संख्या भिन्न होती है।","फ्लोरीन एक ‘मोनोन्यूक्लिडिक’ तत्व है – प्रकृति में इसका केवल एक स्थायी समस्थानिक F-19 पाया जाता है।","कार्बन के C-12, C-13 व C-14; 114 हाइड्रोजन के प्रोटियम, ड्यूटीरियम व ट्राइटियम तथा क्लोरीन के Cl-35 व Cl- 37 समस्थानिक होते हैं।"]},{"s":"सामान्य विज्ञान","q":"प्रोजेस्टेरोन में निम्नलिखित में से कौन-सा कार्यात्मक समूह होता है?","o":["एस्टर","कीटोन","एल्डिहाइड","ईथर"],"a":1,"e":["प्रोजेस्टेरोन एक C-21 स्टेरॉयड हॉर्मोन है, जो अंडाशय के कॉर्पस ल्यूटियम तथा प्लेसेंटा से स्रावित होता है।","इसकी संरचना में दो कीटोन ( >C=O) समूह होते हैं।","इसमें एस्टर, एल्डिहाइड अथवा ईथर कार्यात्मक समूह उपस्थित नहीं होते।","इसे ‘गर्भावस्था हॉर्मोन’ कहा जाता है क्योंकि यह गर्भाशय की अंतःभित्ति को गर्भधारण हेतु तैयार रखता है।"]},{"s":"सामान्य विज्ञान","q":"आवर्त सारणी की दूसरी पंक्ति में किस तत्व की इलेक्ट्रॉन बंधुता शून्य के करीब है, जो मुख्य रूप से इसके अर्ध-भरे p- कक्षीय विन्यास द्वारा प्रदान की गई बढ़ी हुई स्थिरता के कारण है?","o":["कार्बन","नाइट्रोजन","ऑक्सीजन","बोरॉन"],"a":1,"e":["नाइट्रोजन का इलेक्ट्रॉनिक विन्यास 1s2 2s2 2p3 है, अर्थात् p- उपकोश ठीक अर्ध-भरा है।","अर्ध-भरा विन्यास अतिरिक्त स्थायित्व देता है, इसलिए नाइट्रोजन अतिरिक्त इलेक्ट्रॉन ग्रहण करने में अनिच्छुक रहता है।","इसी कारण इसकी इलेक्ट्रॉन बंधुता लगभग शून्य (या हल्की धनात्मक) होती है।"]},{"s":"सामान्य विज्ञान","q":"पोटैशियम परमैंगनेट का गहरा बैंगनी रंग किसके कारण उत्पन्न होता है?","o":["d–d इलेक्ट्रॉनिक संक्रमण","ऑक्सीजन से मैंगनीज में आवेश स्थानांतरण","d7 प्रणाली में लिगैंड क्षेत्र विपाटन","Mn–O बंधों में π - पश्चबंधन"],"a":1,"e":["परमैंगनेट आयन ( MnO − ) में मैंगनीज 4 की ऑक्सीकरण अवस्था रू 7 है।","इस अवस्था में मैंगनीज का 3 d- उपकोश पूर्णतः रिक्त ( d0 ) होता है, अतः d–d संक्रमण संभव ही नहीं।","गहरा रंग लिगैंड-से-धातु आवेश स्थानांतरण ( LMCT) के कारण होता है, जिसमें ऑक्सीजन से इलेक्ट्रॉन मैंगनीज में जाता है।","पोटैशियम परमैंगनेट को ‘लाल दवा’ भी कहा जाता है।"]},{"s":"सामान्य विज्ञान","q":"ठंडे पानी में साबुन की सफाई क्रिया कम हो जाती है, जब तापमान किस विशिष्ट सीमा से नीचे चला जाता है?","o":["क्लाउड बिंदु","क्रान्तिक मिसेल सान्द्रण","हिमांक बिंदु","क्राफ्ट तापमान"],"a":3,"e":["क्राफ्ट तापमान वह न्यूनतम ताप है जिस पर पृष्ठसक्रियकर्मी (साबुन) मिसेल बनाने योग्य घुलनशीलता प्राप्त करता है।","इस ताप से नीचे साबुन अवक्षेपित हो जाता है और मिसेल नहीं बनते।","मिसेल के बिना तेल-चिकनाई का पायसीकरण नहीं होता, अतः सफाई क्षमता घट जाती है।"]},{"s":"सामान्य विज्ञान","q":"ऊन और रेशम जैसे प्रोटीनों का उपयोग फाइबर के रूप में क्यों किया जाता है, जबकि एल्ब्यूमिन जैसे अन्य प्रोटीनों का उपयोग नहीं किया जाता है?","o":["ऊन और रेशम का अणुभार अधिक होता है।","ऊन और रेशम में मजबूत अंतर-आणविक बल वाली रेशेदार संरचनाएँ होती हैं।","एल्बुमिन पानी में घुल जाता है जबकि ऊन और रेशम नहीं घुलते।","ऊन और रेशम में ऐरोमैटिक (सुगंधित) अमीनो एसिड होते हैं।"],"a":1,"e":["प्रोटीन दो प्रकार के होते हैं – रेशेदार ( fibrous) और गोलिकाकार ( globular) ।","ऊन (किरेटिन) व रेशम (फाइब्रोइन) रेशेदार प्रोटीन हैं, जिनकी श्रृंखलाएँ समानांतर रहती हैं।","हाइड्रोजन आबंध जैसे प्रबल अंतराआण्विक बल इन्हें तन्य, अघुलनशील व टिकाऊ बनाते हैं।","एल्ब्यूमिन गोलिकाकार व जल में घुलनशील है, इसलिए रेशा नहीं बन सकता"]},{"s":"सामान्य विज्ञान","q":"पैरा स्थिति में दो क्लोरीन परमाणुओं द्वारा प्रतिस्थापित बेंजीन वलय का आईयूपीएसी नाम क्या है?","o":["1,2- डाइक्लोरोबेंजीन","1,3- डाइक्लोरोबेंजीन","1,4- डाइक्लोरोबेंजीन","क्लोरोबेंजीन"],"a":2,"e":["बेंजीन वलय में ऑर्थो, मेटा व पैरा स्थितियाँ क्रमशः 1,2; 1,3 तथा 1,4 होती हैं।","पैरा स्थिति में दोनों प्रतिस्थापी एक-दूसरे के ठीक विपरीत सिरे पर होते हैं।","अतः पैरा-डाइक्लोरोबेंजीन का IUPAC नाम 1,4- डाइक्लोरोबेंजीन है।","यह यौगिक मॉथ बॉल व दुग±धनाशक के रूप में प्रयुक्त होता है।"]},{"s":"सामान्य विज्ञान","q":"NH में नाइट्रोजन की संयोजकता 3 _______ होगी।","o":["1","2","3","5"],"a":2,"e":["नाइट्रोजन का इलेक्ट्रॉनिक विन्यास 2,5 है और उसके बाह्यतम कोश में 5 इलेक्ट्रॉन हैं।","अष्टक पूर्ण करने हेतु उसे 3 इलेक्ट्रॉन की आवश्यकता होती है।","अमोनिया ( NH ) में नाइट्रोजन तीन 3 हाइड्रोजन परमाणुओं के साथ तीन सहसंयोजक बंध बनाता है।","अतः NH में नाइट्रोजन की संयोजकता 3 3 है। 115"]},{"s":"सामान्य विज्ञान","q":"संक्रमण धातुओं के विपरीत, गैर-संक्रमण तत्व आमतौर पर कम ऑक्सीकरण अवस्थाएं क्यों प्रदर्शित करते हैं?","o":["उनके सबसे बाहरी कक्षक अधिक आसानी से संकरित होते हैं","इनमें पूर्ण रूप से भरे हुए f- उपकोश होते हैं","स्थिर उत्कृष्ट गैस विन्यास उनकी ऑक्सीकरण अवस्थाओं को सीमित करता है","उनके p- ऑर्बिटल्स बंधन अंतःक्रिया पर हावी होते हैं"],"a":2,"e":["संक्रमण धातुओं में ( n−1)d तथा ns कक्षकों की ऊर्जा लगभग समान होती है, इसलिए दोनों के इलेक्ट्रॉन बंध में भाग ले लेते हैं और अनेक ऑक्सीकरण अवस्थाएँ बनती हैं।","गैर-संक्रमण (प्रतिनिधि) तत्वों में केवल बाह्यतम s व p इलेक्ट्रॉन ही उपलब्ध होते हैं।","ये तत्व निकटतम उत्कृष्ट गैस का स्थायी विन्यास प्राप्त करके रुक जाते हैं, जिससे अवस्थाएँ सीमित रह जाती हैं।"]},{"s":"सामान्य विज्ञान","q":"सुरक्षा अनुप्रयोगों के लिए साधारण ग्लास की तुलना में पॉलीकार्बोनेट को क्यों प्राथमिकता दी जाती है?","o":["इसमें कांच की तुलना में बेहतर प्रकाशीय (ऑप्टिकल) स्पष्टता होती है।","इसमें पारदर्शिता के साथ उच्च प्रभाव प्रतिरोध का संयोजन होता है।","यह भार में कांच से हल्का होता है।","इसमें कांच की तुलना में बेहतर तापीय स्थिरता होती है।"],"a":1,"e":["पॉलीकार्बोनेट एक अत्यंत दृढ़ और कठोर थर्मोप्लास्टिक (तापसुघटय) बहुलक है।","यह काँच जितना पारदर्शी होते हुए भी प्रहार सहने की क्षमता में उससे कई गुना अधिक है और टूटने पर नुकीले टुकड़े नहीं बनाता।","इसी कारण इसका प्रयोग सुरक्षा चश्मे, हेलमेट के वि”ार तथा बुलेटप्रूफ खिड़कियों में होता है।"]},{"s":"सामान्य विज्ञान","q":"लैंगम्यूर अधिशोषण आइसोथर्म (समतापी) किस धारणा पर आधारित है?","o":["अधिशोषक की सतह विषम होती है","अधिशोषण बहुपरत होता है","सभी अधिशोषण स्थलों की प्रकृति समान होती है","अधिशोषित अणुओं के बीच अंतःक्रिया होती है"],"a":2,"e":["लैंगम्यूर समतापी वक्र एकल-परत अधिशोषण पर आधारित है।","इसकी मूल मान्यता है कि अधिशोषक की सतह समांगी है और सभी अधिशोषण स्थल समतुल्य हैं।","साथ ही यह मानता है कि अधिशोषित अणुओं के बीच कोई पारस्परिक क्रिया नहीं होती।"]},{"s":"सामान्य विज्ञान","q":"परमाणु संख्या की अवधारणा किसके द्वारा प्रस्तुत की गई थी?","o":["नील्स बोहर","अर्नेस्ट रदरफोर्ड","हेनरी मो”ाले","जे- जे- थॉमसन"],"a":2,"e":["हेनरी मोसले ने 1913 में एक्स-किरण स्पेक्ट्रम के अध्ययन से परमाणु क्रमांक की अवधारणा दी।","उन्होंने दिखाया कि तत्वों की पहचान और आवर्त व्यवस्था का मूल आधार परमाणु क्रमांक ( Z) है।","इसके आधार पर आधुनिक आवर्त नियम में तत्वों के गुणों को परमाणु क्रमांक का आवर्ती फलन माना गया।","जे- जे- थॉमसन इलेक्ट्रॉन की खोज तथा रदरफोर्ड परमाणु के नाभिकीय मॉडल से संबंधित हैं।"]},{"s":"सामान्य विज्ञान","q":"अमीनो अम्लों को आवश्यक और अनावश्यक के रूप में वर्गीकृत करने में क्या मदद करता है?","o":["उनकी रासायनिक संरचना और कार्यात्मक समूह","प्रोटीन संरचना में उनकी भूमिका","शरीर की अन्य यौगिकों से उन्हें संश्लेषित करने की क्षमता","जल में उनकी घुलनशीलता"],"a":2,"e":["आवश्यक अमीनो अम्ल शरीर स्वयं पर्याप्त मात्रा में संश्लेषित नहीं कर सकता।","इन्हें भोजन के माध्यम से प्राप्त करना पड़ता है।","अनावश्यक अमीनो अम्लों का संश्लेषण शरीर स्वयं कर सकता है।","अतः वर्गीकरण शरीर की संश्लेषण क्षमता पर आधारित है।"]},{"s":"सामान्य विज्ञान","q":"पायस को उसके घटक द्रवों में किसके द्वारा विभाजित किया जा सकता है?","o":["अपकेंद्रीकरण","अधिक पायसीकारक मिलाकर","लायोफिलिक कोलाइड मिलाकर","तापमान को 0°C तक ठंडा करके"],"a":0,"e":["पायस ( Emulsion) दो अमिश्रणीय द्रवों का कोलॉइडी परिक्षेपण है।","अपकेंद्रीकरण में तीव्र घूर्णन द्वारा द्रव अलग किए जा सकते हैं।","दूध से क्रीम अलग करना इसका सामान्य उदाहरण है।","अधिक पायसीकारक मिलाने से पायस अधिक स्थायी हो सकता है।"]},{"s":"सामान्य विज्ञान","q":"प्रयोगशाला में Mn2+ को MnO − में 4 ऑक्सीकृत करने के लिए किस विशेष ऑक्सीकारक का उपयोग किया जाता है?","o":["हाइड्रोजन परॉक्साइड","पेरोक्सोडिसल्फेट 116","पोटैशियम नाइट्रेट","नाइट्रिक अम्ल"],"a":1,"e":["Mn2+ आयन को MnO − (परमैंगनेट 4 आयन) में ऑक्सीकृत करने के लिए प्रबल ऑक्सीकारक की आवश्यकता होती है।","पेरोक्सोडिसल्फेट ( S O 2− ) एक 2 8 शक्तिशाली ऑक्सीकारक है।","इसका उपयोग Mn2+ को MnO − में 4 ऑक्सीकृत करने के लिए किया जा सकता है।","इस प्रक्रिया में मैंगनीज की ऑक्सीकरण अवस्था रू 2 से रू 7 हो जाती है।"]},{"s":"सामान्य विज्ञान","q":"बहु-चरणीय प्रतिक्रिया में दर-निर्धारण चरण कौन-सा होता है?","o":["सबसे ते”ा चरण","अंतिम चरण","उच्चतम सक्रियण ऊर्जा वाला चरण","सबसे कम अणुकता वाला चरण"],"a":2,"e":["बहु-चरणीय अभिक्रिया की समग्र दर उसके सबसे धीमे चरण से निर्धारित होती है।","इसे दर-निर्धारक चरण कहा जाता है।","सामान्यतः अधिक सक्रियण ऊर्जा वाला चरण धीमा होता है।","अतः उच्चतम सक्रियण ऊर्जा वाला चरण सही उत्तर है।"]},{"s":"सामान्य विज्ञान","q":"पानी में साबुन द्वारा मिसेल के निर्माण के लिए कौन-सी स्थिति आवश्यक नहीं है?","o":["पर्याप्त रूप से उच्च सांद्रता","निम्न तापमान","गैर-ध्रुवीय समूह की उपस्थिति","पानी जैसा ध्रुवीय विलायक"],"a":1,"e":["मिसेल का निर्माण साबुन की सांद्रता CMC से अधिक होने पर होता है।","तापमान क्राफ्ट ताप से ऊपर होना आवश्यक है।","साबुन में ध्रुवीय सिर और अध्रुवीय हाइड्रोकार्बन पूँछ होती है।"]},{"s":"सामान्य विज्ञान","q":"कौन-सा अमीन गैब्रियल थैलिमाइड संश्लेषण द्वारा तैयार नहीं किया जा सकता है?","o":["बेनि”ालामाइन","टर्ट-ब्यूटाइलामाइन","एन-प्रोपाइलामाइन","एथिलामाइन"],"a":1,"e":["गैब्रियल थैलिमाइड संश्लेषण में पोटैशियम थैलिमाइड की एल्किल हैलाइड के साथ SN2 अभिक्रिया होती है।","यह विधि प्राथमिक एल्किल हैलाइडों के साथ उपयुक्त होती है।","तृतीयक एल्किल हैलाइड अधिक त्रिविम बाधा के कारण SN2 अभिक्रिया नहीं करते।","इसलिए टर्ट-ब्यूटाइलामाइन को गैब्रियल थैलिमाइड संश्लेषण द्वारा तैयार नहीं किया जा सकता।"]},{"s":"सामान्य विज्ञान","q":"कुछ मोनोसैकेराइड्स ग्लाइकोसिडिक बंध बनाते समय अपचायक गुण क्यों खो देते हैं?","o":["कार्बोनिल कार्बन एसीटल लिंकेज का हिस्सा बन जाता है","वलय संरचना एनोमेरिक कार्बन तक पहुँच को रोकती है","ऑक्सीकरण को स्टेरिक बाधा द्वारा रोका जाता है","इलेक्ट्रॉन घनत्व पुनः वितरित हो जाता है"],"a":0,"e":["मोनोसैकेराइड का अपचायक गुण उसके मुक्त कार्बोनिल समूह से संबंधित है।","ग्लाइकोसिडिक बंध बनने पर एनोमेरिक कार्बन एसीटल संरचना का भाग बन सकता है।","इससे मुक्त कार्बोनिल समूह उपलब्ध नहीं रहता।","इसलिए संबंधित शर्करा अपना अपचायक गुण खो सकती है।"]},{"s":"सामान्य विज्ञान","q":"कौन-सी वर्णक्रमीय श्रृंखला n = 3 पर समाप्त होने वाले संक्रमणों से संबंधित है?","o":["लाइमन","बामर","पाश्चेन","पुफण्ड"],"a":2,"e":["n = 1 पर समाप्त होने वाले संक्रमण लाइमन श्रृंखला बनाते हैं।","n = 2 पर समाप्त होने वाले संक्रमण बामर श्रृंखला बनाते हैं।","n = 3 पर समाप्त होने वाले संक्रमण पाश्चेन श्रृंखला बनाते हैं।","पाश्चेन श्रृंखला अवरक्त क्षेत्र से संबंधित है।"]},{"s":"सामान्य विज्ञान","q":"चाक का आणविक सूत्र क्या है?","o":["Ca(OH)","CaCO 2 3","Ca(SO )","CaHCO 4 2 3"],"a":1,"e":["चाक (खड़िया) रासायनिक रूप से कैल्सियम कार्बाेनेट है, जिसका सूत्र CaCO है। 3","संगमरमर एवं चूना पत्थर भी CaCO के 3 ही विभिन्न रूप हैं।","Ca(OH) बुझा हुआ चूना तथा CaO 2 बिना बुझा चूना कहलाता है।","CaCO को गर्म करने पर ब्ंव और CO 3 2 प्राप्त होती है, यह वियोजन अभिक्रिया है।","पक्षियों के अंडे का बाहरी आवरण भी मुख्य रूप से कैल्सियम कार्बाेनेट (CaCO ) का 3 ही बना होता है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन शामक और ट्रैंक्विलाइजर के रूप में कार्य कर सकता","o":["एम्फैटेमिन","कॉफी","बार्बिटुरेट्स","कोकीन"],"a":2,"e":["बार्बिटुरेट्स केंद्रीय तंत्रिका तंत्र को अवसादित करने वाली औषध्यिाँ हैं।","ये शामक (सेडेटिव) एवं प्रशांतक (ट्रैंक्विलाइजर) के रूप में प्रयुक्त होती हैं।","एम्फैटेमिन एवं कोकीन उत्तेजक (स्टिमुलेंट) होते हैं, न कि शामक। 117","कॉफी में उपस्थित कैफीन भी एक हल्का उत्तेज क पदार्थ है।"]},{"s":"सामान्य विज्ञान","q":"सोडियम धतु का भंडारण करना चाहिए -","o":["पानी में","खुले में","केरोसिन में","अल्कोहल में"],"a":2,"e":["सोडियम अत्यध्कि क्रियाशील धतु है जो वायु एवं नमी से तीव्रता से अभिक्रिया करती है।","जल के संपर्क में आने पर यह हाइड्रोजन गैस मुक्त करती है और आग पकड़ सकती है, इसीलिए सोडियम एवं पोटैशियम को केरोसिन (मिट्टी के तेल) में डुबोकर रखा जाता है।","केरोसिन इन धतुओं से अभिक्रिया नहीं करता और वायु से इनका संपर्क रोकता है।","सोडियम इतनी मुलायम धतु है कि इसे पनीर की तरह चाकू से आसानी से काटा जा सकता है। BIOLOGY (जीव विज्ञान)"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से एड्रेनालाईन का हृदय पर क्या प्रभाव होता है?","o":["धीमी हृदय गति","ते”ा हृदय गति","कोई प्रभाव नहीं","हृदय की मांसपेशियों को कमजोर करता है"],"a":1,"e":["एड्रेनालाईन (एपिनेप्रफीन) अधिवृक्क ग्रंथि के मध्यांश (एड्रीनल मेडुला) से स्रावित होने वाला हार्मोन है।","इसे ‘आपातकालीन हार्मोन’ या ‘फाइट ऑर फ्लाइट’ हार्मोन कहा जाता है।","यह हृदय गति एवं हृदय के संकुचन बल को बढ़ाता है, जिससे रक्तचाप भी बढ़ जाता है।","साथ ही यह श्वसन दर, रक्त शर्करा स्तर एवं मांसपेशियों में रक्त प्रवाह को बढ़ाता है।"]},{"s":"सामान्य विज्ञान","q":"एक 20 वर्षीय व्यक्ति के हाथ और जबड़ा बड़े हो गए हैं, लेकिन उसकी ऊंचाई सामान्य है। इसे कौन-सा कारण सबसे अच्छी तरह समझाता है?","o":["एपिफाइि”ायल प्लेट्स के बंद होने के बाद ग्रोथ हार्मोन ( GH) की अधिकता → एक्रोमेगली","ग्रोथ हार्मोन ( GH) की कमी → जाइगैन्टि”म (विशालता)","थायरॉक्सिन की अधिकता → जाइगैन्टि”म (विशालता)","एड्रेनालिन की कमी → एक्रोमेगली"],"a":0,"e":["वृद्धि हार्मोन ( GH) पीयूष ग्रंथि (पिट्यूटरी) के अग्र भाग से स्रावित होता है।","किशोरावस्था के बाद लंबी हडि्डयों की एपिफाइि”ायल प्लेट बंद हो जाती है, जिससे लंबाई बढ़ना रुक जाता है।","इसके बाद GH की अधिकता होने पर हाथ, पैर, जबड़े एवं चेहरे की हडि्डयाँ मोटी व बड़ी हो जाती हैं – इसे एक्रोमेगली कहते हैं।","बच्चों में ग्रोथ हार्मोन की कमी से ‘बौनापन’ (Dwarfism) तथा अधिकता से ‘विशालकायता’ (Gigantism) होती है।"]},{"s":"सामान्य विज्ञान","q":"नाजुक श्वसन सतहें सामान्यतः स्थलीय जानवरों के शरीर के भीतर क्यों स्थित होती हैं?","o":["ऊर्जा की खपत कम करने के लिए","विसरण की दर बढ़ाने के लिए","हवा के दबाव में ढहने से बचाने के लिए","क्षति और सूखने से सुरक्षा के लिए"],"a":3,"e":["गैसों का विनिमय केवल नम सतह पर ही हो सकता है, क्योंकि ऑक्सीजन पहले जल में घुलकर कोशिकाओं तक पहुँचती है।","यदि श्वसन सतह शरीर के बाहर होती तो शुष्क वायु में जल का वाष्पन होकर वह सूख जाती और श्वसन रुक जाता।","शरीर के भीतर स्थित होने से ये सतहें नम बनी रहती हैं तथा भौतिक क्षति, धूल एवं संक्रमण से भी सुरक्षित रहती हैं।","इसी कारण स्थलीय जीवों में पेफफड़े एवं कीटों में ट्रैकिया शरीर के भीतर पाए जाते हैं।"]},{"s":"सामान्य विज्ञान","q":"उच्च रक्तचाप धमनी के फटने का कारण बन सकता है क्योंकिः","o":["धमनियों की दीवारें पतली होती हैं","धमनियों के संकुचन से प्रतिरोध बढ़ता है","शिराओं में रक्त प्रवाह कम हो जाता है","वाल्व ठीक से कार्य नहीं करते"],"a":1,"e":["उच्च रक्तचाप में धमनिकाओं ( arterioles) के संकुचन से परिधीय प्रतिरोध बढ़ जाता है।","प्रतिरोध बढ़ने पर हृदय को अधिक दाब से रक्त पंप करना पड़ता है, जिससे धमनी भित्ति पर दबाव बहुत बढ़ जाता है।","लंबे समय तक यह दबाव बने रहने पर भित्ति कमजोर होकर फट सकती है, जैसे मस्तिष्क में रक्तस्राव (स्ट्रोक)।","धमनियों की दीवारें मोटी एवं पेशीय होती हैं तथा वाल्व शिराओं में पाए जाते हैं, अतः अन्य विकल्प असंगत हैं।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से किस वर्ष में होमो इरेक्टस के जीवाश्मों की खोज की गई थी?","o":["1890","1891","1860","1861"],"a":1,"e":["होमो इरेक्टस के प्रथम जीवाश्म 1891 में डच वैज्ञानिक यूजीन डुबॉइस ने जावा (इंडोनेशिया) की सोलो नदी घाटी में खोजे।","इन्हें प्रारंभ में ‘पिथेकैन्थ्रोपस इरेक्टस’ अर्थात् ‘जावा मानव’ नाम दिया गया था। 118","होमो इरेक्टस सीधे खड़े होकर चलने वाली प्रजाति थी, जिसकी मस्तिष्क क्षमता लगभग 900 घन सेमी थी।","यह आग का प्रयोग एवं पत्थर के औजार बनाना जानती थी और अप्रफीका से बाहर पैफलने वाली प्रथम मानव प्रजाति मानी जाती है।"]},{"s":"सामान्य विज्ञान","q":"थायरॉक्सिन हार्मोन किसे नियंत्रित करता है?","o":["रक्त शर्करा का स्तर","कार्बोहाइड्रेट, प्रोटीन और वसा का चयापचय","वृद्धि हार्मोन का स्राव","एड्रेनालिन का स्राव"],"a":1,"e":["थायरॉक्सिन ( T4) थायरॉइड ग्रंथि से स्रावित होने वाला प्रमुख हार्मोन है।","इसके निर्माण के लिए आयोडीन अनिवार्य तत्व है।","यह कार्बोहाइड्रेट, प्रोटीन एवं वसा के उपापचय की दर को नियंत्रित करता है।","इसकी कमी से घेंघा तथा बच्चों में क्रेटिनिज्म रोग हो जाता है।"]},{"s":"सामान्य विज्ञान","q":"दिन के समय जाइलम में पानी को ऊपर की ओर खींचने का कारण क्या है?","o":["बिंदुस्राव (गुट्टेशन)","केशिकात्व (कैपिलैरिटी)","पत्तियों की कोशिकाओं से वाष्पोत्सर्जन","फ्लोएम परिवहन से दबाव"],"a":2,"e":["दिन में पत्तियों के रंध्रों से वाष्पोत्सर्जन के कारण जल की हानि होती है।","इससे पर्ण कोशिकाओं में ऋणात्मक दाब अर्थात् वाष्पोत्सर्जन खिंचाव उत्पन्न होता है।","जल के अणुओं में संसंजन एवं आसंजन बल के कारण जल-स्तंभ अटूट बना रहता है।","यही खिंचाव जड़ से पत्तियों तक जाइलम में जल को ऊपर चढ़ाता है।"]},{"s":"सामान्य विज्ञान","q":"एक स्वस्थ वयस्क प्रतिदिन लगभग 180 लीटर प्रारंभिक निस्यंद उत्पन्न करता है, लेकिन केवल 1–2 लीटर मूत्र उत्सर्जित करता है। इस आयतन में कमी के लिए कौन-सी प्रक्रिया उत्तरदायी है?","o":["बोमन कैप्सूल में निस्पंदन","डायलिसिंग द्रव (अपोहन द्रव) में विसरण","गुर्दे की नलिकाओं में चयनात्मक पुनःअवशोषण","मूत्राशय की दीवारों के माध्यम से परासरण"],"a":2,"e":["ग्लोमेरुलस में केशिकागुच्छीय निस्पंदन द्वारा प्रतिदिन लगभग 180 लीटर निस्यंद बनता है।","इसमें जल, ग्लूकोज, अमीनो अम्ल तथा लवण जैसे उपयोगी पदार्थ भी होते हैं।","वृक्क नलिकाओं में लगभग 99% जल एवं उपयोगी पदार्थ पुनः रक्त में अवशोषित हो जाते हैं।","इसी चयनात्मक पुनःअवशोषण के कारण अंततः केवल 1–2 लीटर मूत्र बनता है।"]},{"s":"सामान्य विज्ञान","q":"होमो सेपियन्स और होमो निएंडरथलेंसिस के संदर्भ में निम्नलिखित में से कौन-सा कथन सही नहीं है?","o":["दोनों प्रजातियाँ एक सामान्य मानव पूर्वज से विकसित हुइ±।","होमो सेपियन्स ने कृषि विकसित की, जबकि निएंडरथल मांस के शिकार पर अधिक निर्भर थे।","होमो सेपियन्स का शरीर मजबूत और छोटे अंगों वाला होता है जो ठंडे जलवायु के लिए अनुकूल है, जबकि निएंडरथल का शरीर पतला और लंबे अंगों वाला होता है।","आनुवंशिक साक्ष्य यह पुष्टि करते हैं कि होमो सेपियन्स और निएंडरथल के बीच संकरण हुआ था।"],"a":2,"e":["यह कथन उल्टा है, अतः यही ‘सही नहीं’ है।","वास्तव में निएंडरथल का शरीर हृष्ट-पुष्ट तथा अंग छोटे थे, जो ठंडी जलवायु के अनुकूल थे।","होमो सेपियन्स की देह अपेक्षाकृत पतली और अंग लंबे होते हैं।","शेष तीनों कथन–साझा पूर्वज, कृषि का विकास तथा संकरण के आनुवंशिक प्रमाण–सत्य हैं।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन मानव उत्पत्ति (ह्यूमन ओरिजिन्स) के अध्ययन से संबंधित है?","o":["एंथ्रोपोजेनेसिस (मानवजनन)","मेटाजेनेसिस","नियोजेनेसिस (नवजनन)","फॉसिलाइ”ोशन (जीवाश्मीकरण)"],"a":0,"e":["एंथ्रोपोजेनेसिस का अर्थ मानव जाति की उत्पत्ति एवं विकास का अध्ययन है।","यह जीवाश्म, आनुवंशिक तथा पुरातात्विक साक्ष्यों के आधार पर मानव विकास बताता है।","मेटाजेनेसिस का संबंध पीढ़ी एकांतरण से है, न कि मानव उत्पत्ति से।","जीवाश्मीकरण केवल अवशेषों के पत्थर में बदलने की प्रक्रिया है।"]},{"s":"सामान्य विज्ञान","q":"महिलाओं में द्वितीयक यौन विशेषताओं के लिए कौन-सा हार्मोन जिम्मेदार होता है?","o":["थायरॉक्सिन","प्रोजेस्टेरोन","एस्ट्रोजन","इंसुलिन"],"a":2,"e":["एस्ट्रोजन का स्राव अंडाशय से होता है और यह प्रमुख मादा लैंगिक हार्मोन है।","यह स्तन विकास, श्रोणि चौड़ी होना तथा आवाज व शरीर संरचना में परिवर्तन लाता है।","यह मासिक चक्र तथा गर्भाशय की भित्ति की वृद्धि को भी नियंत्रित करता है। 119","प्रोजेस्टेरोन मुख्यतः गर्भधारण को बनाए रखने में सहायक होता है।"]},{"s":"सामान्य विज्ञान","q":"यदि निषेचन होता है तो गर्भाशय की परत मोटी होने का मुख्य कारण क्या है?","o":["शुक्राणु को रोकने के लिए","भ्रूण को पोषण प्रदान करने के लिए","हार्मोन उत्पन्न करने के लिए","अंडे संग्रहीत करने के लिए"],"a":1,"e":["निषेचन के बाद युग्मनज विभाजित होकर कोरकपुटी (ब्लैस्टोसिस्ट) बनाता है, जो गर्भाशय की भित्ति (एंडोमेट्रियम) में रोपित होता है।","इसी कारण गर्भाशय की परत रक्त वाहिकाओं से समृद्ध और मोटी हो जाती है।","यह भ्रूण को पोषण, ऑक्सीजन तथा सुरक्षा प्रदान करती है।","बाद में इसी से प्लेसेंटा (अपरा) का निर्माण होता है।"]},{"s":"सामान्य विज्ञान","q":"विकास (एवोल्यूशन) का अर्थ है कई पीढ़ियों में प्रजातियों की विशेषताओं में परिवर्तन, जो किस प्रक्रिया पर आधारित होता हैः","o":["द्रव्यमान संरक्षण","प्राकृतिक चयन","विकास","गति के नियम"],"a":1,"e":["चाल्र्स डार्विन ने ‘ऑन द ओरिजिन ऑफ स्पीशीज’ में प्राकृतिक चयन का सिद्धांत दिया।","इसके अनुसार वातावरण के अनुकूल विभिन्नताओं वाले जीव अधिक जीवित रहते हैं।","ये लाभप्रद लक्षण पीढ़ी-दर-पीढ़ी संचित होकर प्रजाति में परिवर्तन लाते हैं।","लंबे समय में यही प्रक्रिया नई जातियों के उद्भव का कारण बनती है।"]},{"s":"सामान्य विज्ञान","q":"अपघटक जटिल जैविक पदार्थों को विघटित करके _____, पानी और पोषक तत्व जैसे अकार्बनिक पदार्थों में बदल देते हैं।","o":["मीथेन","ऑक्सीजन","कार्बन डाइऑक्साइड","हाइड्रोजन"],"a":2,"e":["जीवाणु एवं कवक जैसे अपघटक मृत जैव पदार्थों का विघटन करते हैं।","इस प्रक्रिया में जटिल कार्बनिक यौगिक सरल अकार्बनिक पदार्थों में बदलते हैं।","मुख्य उत्पाद कार्बन डाइऑक्साइड, जल तथा खनिज पोषक तत्व होते हैं।","इससे पोषक तत्व पुनः मिट्टी में लौटते हैं और पोषक चक्र पूर्ण होता है।"]},{"s":"सामान्य विज्ञान","q":"घरेलू सीवेज को मानव उपयोग के लिए अनुपयुक्त बनाने वाली अशुद्धियों का प्रतिशत कितना होता है?","o":["0.01%","0.1%","1%","5%"],"a":1,"e":["घरेलू वाहितमल (सीवेज) में लगभग 99.9% भाग केवल जल होता है।","शेष लगभग 0.1% भाग ही घुलित एवं निलंबित अशुद्धियों का होता है।","इसी अल्प मात्रा के कारण जल मानव उपयोग के अयोग्य हो जाता है।","इनमें कार्बनिक पदार्थ, पोषक तत्व, रोगजनक सूक्ष्मजीव व भारी धातुएँ सम्मिलित हैं।"]},{"s":"सामान्य विज्ञान","q":"एक सिनेप्स पर, आवेग का संचरण कैसे होता है?","o":["न्यूरॉनों के बीच विद्युत धारा के सीधे प्रवाह के माध्यम से।","एक्सॉन टर्मिनल से सिनेप्टिक क्लेफ्ट में छोड़े गए न्यूरोट्रांसमीटरों के माध्यम से।","मायलिन शीथ द्वारा आवेग को छलांग लगाने की अनुमति देकर।","डेंड्राइट्स में आवेग की दिशा को उलट कर।"],"a":1,"e":["सिनेप्स दो तंत्रिका कोशिकाओं के बीच का सूक्ष्म रिक्त स्थान है, जिसे सिनेप्टिक क्लेफ्ट कहते हैं।","विद्युत आवेग जब एक्सॉन के अंतिम सिरे पर पहुँचता है, तो वहाँ से रासायनिक न्यूरोट्रांसमीटर मुक्त होते हैं।","ये रसायन (जैसे एसिटिलकोलीन) क्लेफ्ट को पार कर अगले न्यूरॉन के डेंड्राइट पर नया आवेग उत्पन्न करते हैं।","इसी कारण तंत्रिका आवेग का संचरण एकदिशीय होता है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सा परिदृश्य रिफ्लेक्स (प्रतिवर्ती) क्रिया में माइलिनेशन के सुरक्षात्मक लाभ को दर्शाता है?","o":["गर्म सतह से धीमी गति से पीछे हटना","ऊतक क्षति को कम करने के लिए त्वरित पीछे हटना","गर्म वस्तु से स्वैच्छिक बचाव","दर्द के प्रति संवेदी अनुकूलन"],"a":1,"e":["माइलिन शीथ तंत्रिका तंतु पर एक विद्युतरोधी आवरण बनाती है।","इसके कारण आवेग रैनवियर के नोड्स पर छलांग लगाते हुए (सॉल्टेटरी संचरण) अत्यंत तीव्र गति से चलता है।","गर्म वस्तु छूने पर यही तीव्रता तत्काल हाथ हटाने की प्रतिवर्ती क्रिया संभव बनाती है।","इससे ऊतकों की क्षति न्यूनतम रह जाती है, जो माइलिनेशन का सुरक्षात्मक लाभ है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सा वानर (एप) मनुष्य के सबसे अधिक निकट संबंधी है?","o":["चिम्पांजी","गोरिल्ला","ओरंगुटान","गिब्बन"],"a":0,"e":["चिम्पांजी मनुष्य का निकटतम जीवित संबंधी माना जाता है।","मनुष्य तथा चिम्पांजी के डीएनए में लगभग 98-99% तक समानता पाई जाती है। 120","दोनों का साझा पूर्वज लगभग 60-70 लाख वर्ष पूर्व अलग हुआ माना जाता है।","गोरिल्ला, ओरंगुटान तथा गिब्बन क्रमशः उससे अधिक दूर के संबंधी हैं।"]},{"s":"सामान्य विज्ञान","q":"आपतित सौर विकिरण का कितना प्रतिशत प्रकाश संश्लेषणीय सक्रिय विकिरण (पीएआर) होता है?","o":["50% से कम","60% से कम","75% से कम","10% से कम"],"a":0,"e":["प्रकाश संश्लेषणीय सक्रिय विकिरण ( PAR) वह विकिरण है जिसकी तरंगदैघ्र्य लगभग 400–700 नैनोमीटर होती है।","पौधे इसी परास के प्रकाश का उपयोग प्रकाश संश्लेषण में करते हैं।","पृथ्वी पर आपतित कुल सौर विकिरण का लगभग 50% से कम भाग ही PAR के रूप में उपलब्ध होता है।","इसमें से भी केवल 2-10% ही वास्तव में प्रकाश संश्लेषण में प्रयुक्त हो पाता है।"]},{"s":"सामान्य विज्ञान","q":"________ एक पारिस्थितिकी तंत्र के भीतर आपस में जुड़ी हुई खाद्य श्रृंखलाओं का एक जटिल नेटवर्क होता है।","o":["खाद्य जाल","अनेक खाद्य श्रृंखलाएँ","पोषण स्तर","पारिस्थितिकी पिरामिड"],"a":0,"e":["किसी पारिस्थितिकी तंत्र में अनेक खाद्य श्रृंखलाएँ आपस में जुड़कर एक जटिल नेटवर्क बनाती हैं, जिसे खाद्य जाल कहते हैं।","खाद्य जाल यह दर्शाता है कि एक जीव एक से अधिक खाद्य श्रृंखलाओं का भाग हो सकता है।","यह पारिस्थितिकी तंत्र को अधिक स्थिरता एवं संतुलन प्रदान करता है।","पोषण स्तर तथा पारिस्थितिक पिरामिड ऊर्जा-प्रवाह के भिन्न नि:पण हैं, नेटवर्क नहीं।"]},{"s":"सामान्य विज्ञान","q":"मनुष्यों में यौवन को एक विशेष काल क्यों माना जाता है?","o":["विकास पूरी तरह से रुक जाता है","सामान्य शारीरिक विकास धीमा होने पर प्रजनन ऊतक परिपक्व हो जाते हैं","केवल मानसिक परिपक्वता होती है","केवल ऊंचाई तेजी से बढ़ती है"],"a":1,"e":["यौवनारंभ (प्यूबर्टी) वह अवस्था है जिसमें शरीर प्रजनन योग्य बनता है।","इस काल में सामान्य शारीरिक वृद्धि की दर धीमी पड़ने लगती है, जबकि प्रजनन अंग व ऊतक परिपक्व होते हैं।","हार्मोनों (टेस्टोस्टेरॉन, एस्ट्रोजन) के प्रभाव से द्वितीयक लैंगिक लक्षण विकसित होते हैं।","अतः यह शारीरिक, मानसिक एवं प्रजनन संबंधी परिवर्तनों का विशेष संक्रमण काल है।"]},{"s":"सामान्य विज्ञान","q":"कौन-सा कथन सही ढंग से बताता है कि शुक्राणुओं में पूंछ क्यों होती है?","o":["अंडे से जोड़ने के लिए","महिला जनन कोशिका की ओर बढ़ने में मदद करने के लिए","हार्मोन ले जाने के लिए","आनुवंशिक पदार्थ की रक्षा के लिए"],"a":1,"e":["शुक्राणु की पूँछ वस्तुतः एक कशाभिका (फ्लैजेलम) होती है।","इसके कोड़े जैसे संचलन से शुक्राणु को गति प्राप्त होती है।","इसी गति के कारण शुक्राणु मादा जनन कोशिका (अंडाणु) तक पहुँच पाता है।","आनुवंशिक पदार्थ शुक्राणु के शीर्ष (हेड) में सुरक्षित रहता है, पूँछ में नहीं।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से किसने वंशानुक्रम के मूल नियमों का प्रतिपादन किया?","o":["चाल्र्स डार्विन","लुई पाश्चर","ग्रेगर मेंडल","वॉटसन और क्रिक"],"a":2,"e":["ग्रेगर जॉन मेंडल को आनुवंशिकी का जनक कहा जाता है।","उन्होंने मटर के पौधे ( Pisum sativum) पर प्रयोग कर वंशानुक्रम के नियम प्रतिपादित किए।","उनके तीन नियम हैं – प्रभाविता का नियम, पृथक्करण का नियम तथा स्वतंत्र अपव्यूहन का नियम।","डार्विन ने प्राकृतिक चयन तथा वॉटसन-क्रिक ने डीएनए की द्विकुंडलिनी संरचना दी थी।"]},{"s":"सामान्य विज्ञान","q":"यदि गर्भावस्था के प्रारंभिक चरण में माँ को गंभीर कुपोषण हो, तो भ्रूण को कौन-सा प्रभाव झेलना पड़ सकता हैः","o":["प्लेसेंटा के माध्यम से अपर्याप्त पोषक तत्वों के कारण विकास में बाधा","अंडाणु की विफलता के कारण तुरंत गर्भपात","निषेचन की विफलता","आरोपण से पहले प्लेसेंटा का अलग हो जाना"],"a":0,"e":["भ्रूण को समस्त पोषक तत्व एवं ऑक्सीजन माँ से प्लेसेंटा (अपरा) के माध्यम से प्राप्त होते हैं।","माँ के गंभीर रूप से कुपोषित होने पर प्लेसेंटा द्वारा पर्याप्त पोषण नहीं पहुँच पाता।","इससे भ्रूण की वृद्धि एवं अंग-विकास बाधित हो जाता है (अंतर्गर्भाशयी वृद्धि अवरोध)।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से किस प्रकार का प्रदूषण मिनामाटा रोग का कारण होता है? 121","o":["जैविक अपशिष्ट युक्त पीने का पानी","तेल रिसाव युक्त पानी","कीटनाशकों युक्त पीने का पानी","पारा युक्त औद्योगिक अपशिष्ट वाला मछली पकड़ने का पानी"],"a":3,"e":["मिनामाता रोग पारे (मरकरी), विशेषतः मिथाइल मरकरी के विषाक्तीकरण से होता है।","जापान के मिनामाटा खाड़ी क्षेत्र में औद्योगिक अपशिष्ट से समुद्री जल प्रदूषित हुआ था।","पारा मछलियों में जैव आवर्धन द्वारा संचित हो गया और वही मछली खाने से 1956 में यह रोग सामने आया।","इस रोग में तंत्रिका तंत्र प्रभावित होता है – कंपन, दृष्टि-वाणी विकार तथा लकवा जैसे लक्षण दिखते हैं।"]},{"s":"सामान्य विज्ञान","q":"यौन परिपक्वता हमेशा गर्भावस्था के लिए तत्परता का संकेत क्यों नहीं होती?","o":["शरीर का विकास जारी रहता है","मन और शरीर ि”ाम्मेदारी के लिए पर्याप्त परिपक्व नहीं हो सकते","मासिक धर्म शु: नहीं हुआ है","हार्मोन सक्रिय नहीं होते"],"a":1,"e":["यौन परिपक्वता (किशोरावस्था) केवल यह दर्शाती है कि प्रजनन अंग जैविक रूप से सक्रिय हो चुके हैं।","गर्भधारण के लिए शारीरिक विकास के साथ-साथ मानसिक, भावनात्मक, सामाजिक एवं आर्थिक परिपक्वता भी आवश्यक है।","कम आयु में गर्भधारण से माता एवं शिशु दोनों के स्वास्थ्य को गंभीर जोखिम रहता है।","इसी कारण भारत में विवाह की न्यूनतम आयु (लड़की 18, लड़का 21 वर्ष) निर्धारित की गई है।"]},{"s":"सामान्य विज्ञान","q":"कौन-सी गर्भनिरोधक विधि शुक्राणु को अंडे तक पहुंचने से रोकने के लिए यांत्रिक अवरोध का उपयोग करती है?","o":["मौखिक गोलियाँ","कंडोम","कॉपर-टी","नसबंदी (वैसक्टॉमी)"],"a":1,"e":["कंडोम एक अवरोधक (बैरियर) गर्भनिरोधक विधि है, जो शुक्राणु को अंडाणु तक पहुँचने से यांत्रिक रूप से रोकती है।","यह एकमात्र ऐसी विधि है जो यौन संचारित रोगों (एचआईवी सहित) से भी सुरक्षा प्रदान करती है।","मौखिक गोलियाँ हार्मोन द्वारा अंडोत्सर्ग रोकती हैं, जबकि कॉपर-टी एक अंतर्गर्भाशयी युक्ति ( IUD) है।","नसबंदी (वैसक्टॉमी/ट्यूबेक्टॉमी) शल्य क्रिया आधारित स्थायी गर्भनिरोधक विधि है।"]},{"s":"सामान्य विज्ञान","q":"अप्रभावी एपिस्टेसिस (रिसेसिव एपिस्टेसिस) में F अनुपात क्या होता है? 2","o":["13:3","15:1","12:3:1","9:3:4"],"a":3,"e":["एपिस्टेसिस वह जीन-अंतःक्रिया है जिसमें एक जीन दूसरे जीन की अभिव्यक्ति को दबा देता है।","अप्रभावी (रिसेसिव) एपिस्टेसिस में सामान्य द्विसंकर अनुपात 9:3:3:1 बदलकर 9:3:4 हो जाता है।","इसका उत्कृष्ट उदाहरण चूहों में कोट रंग (एगाउटी – काला – एल्बिनो) की वंशागति है।","इसके विपरीत प्रभावी एपिस्टेसिस में यह अनुपात 12:3:1 तथा दोहरे अप्रभावी एपिस्टेसिस में 9:7 होता है।"]},{"s":"सामान्य विज्ञान","q":"सकल प्राथमिक उत्पादकता में से ______ घटाने पर शुद्ध प्राथमिक उत्पादकता प्राप्त होती है।","o":["श्वसन गुणांक","श्वसन हानियाँ","श्वसन प्राप्ति","चयापचय दर"],"a":1,"e":["सकल प्राथमिक उत्पादकता ( GPP) प्रकाश संश्लेषण द्वारा निर्मित कुल कार्बनिक पदार्थ की दर है।","इसमें से पौधों द्वारा श्वसन में व्यय की गई ऊर्जा (श्वसन हानियाँ, R) घटाई जाती है।","सूत्र हैः NPP = GPP − R, जहाँ NPP शुद्ध प्राथमिक उत्पादकता है।","यही NPP शाकाहारी उपभोक्ताओं तथा अपघटकों को खाद्य ऊर्जा के रूप में उपलब्ध होती है।"]},{"s":"सामान्य विज्ञान","q":"किसी झील के जल में पोषक तत्वों की प्रचुरता द्वारा उसकी प्राकृतिक आयुवृद्धि के लिए प्रयुक्त शब्द क्या है?","o":["खनिजीकरण","जैववर्धन","सुपोषण (यूट्रोफिकेशन)","ऑक्सीकरण"],"a":2,"e":["जल में नाइट्रोजन एवं फॉस्फोरस जैसे पोषक तत्वों की वृद्धि से झील की प्राकृतिक आयुवृद्धि की प्रक्रिया यूट्रोफिकेशन कहलाती है।","इससे शैवाल प्रस्फुटन ( algal bloom) होता है और जल में घुलित ऑक्सीजन की मात्रा घट जाती है।","परिणामस्व:प मछलियाँ व अन्य जलीय जीव मर जाते हैं और झील उथली होकर धीरे-धीरे दलदल में बदल जाती है।","मानव गतिविधियों (मल-जल, उर्वरक बहाव) से होने वाली त्वरित प्रक्रिया ‘सांस्कृतिक यूट्रोफिकेशन’ कहलाती है।"]},{"s":"सामान्य विज्ञान","q":"मस्तिष्क की कौन-सी संरचना, मुद्रा और सूक्ष्म मांसपेशीय समन्वय को नियंत्रित करने के लिए सबसे अधिक जिम्मेदार होती है? 122","o":["सेरिब्रम","सेरेबेलम","मेडुला","थैलेमस"],"a":1,"e":["अनुमस्तिष्क (सेरेबेलम) शरीर का संतुलन, मुद्रा तथा ऐच्छिक गतियों का सूक्ष्म समन्वय नियंत्रित करता है।","यह मस्तिष्क के पश्च भाग में, प्रमस्तिष्क के नीचे स्थित होता है।","प्रमस्तिष्क (सेरिब्रम) सोचने, स्मृति, तर्क तथा ऐच्छिक क्रियाओं के निर्देशन का केंद्र है।","मेडुला ऑब्लोंगेटा श्वसन, हृदय गति, रक्तचाप जैसी अनैच्छिक क्रियाओं को नियंत्रित करता है।"]},{"s":"सामान्य विज्ञान","q":"कौन-सा कथन यह समझाता है कि लैंगिक प्रजनन अलैंगिक प्रजनन की तुलना में अधिक लाभकारी क्यों है?","o":["यह संतति में समान डीएनए सुनिश्चित करता है।","यह दो व्यक्तियों से विविधताओं के पुनर्संयोजन की अनुमति देता है।","यह डीएनए प्रतिलिपिकरण त्रुटियों से बचाता है।","इसमें विशेषीकृत कोशिकाओं की आवश्यकता नहीं होती।"],"a":1,"e":["लैंगिक प्रजनन में दो जनकों के युग्मकों के संयोजन से संतति में नए जीन संयोजन बनते हैं।","अर्धसूत्री विभाजन के समय क्रॉसिंग ओवर तथा गुणसूत्रों के स्वतंत्र अपव्यूहन से विविधता और बढ़ जाती है।","यह आनुवंशिक विविधता जनसंख्या को बदलते पर्यावरण के अनुकूल बनाती है और विकास ( evolution) का आधार बनती है।","अलैंगिक प्रजनन में संतति जनक की लगभग सम:प प्रतिलिपि होती है, अतः विविधता नगण्य रहती है।"]},{"s":"सामान्य विज्ञान","q":"पूफलदार पौधों में पर-परागण विविधता सुनिश्चित करता है, लेकिन यह अक्सर आत्म-परागण की तुलना में कम विश्वसनीय होता है। ऐसी कौन-सी स्थिति है जिसमें जोखिमों के बावजूद पर-परागण विकास की दृष्टि से लाभकारी होता है?","o":["जब पर्यावरणीय परिस्थितियाँ सदियों तक स्थिर रहती हैं","जब पौधों को एकसमान खेती में उगाया जाता है","जब पर्यावरणीय परिवर्तनों के लिए तेजी से अनुकूलन आवश्यक होता है","जब परागकण, स्व-परागण और पर-परागण दोनों में अजीवित होते हैं"],"a":2,"e":["पर-परागण से संतति में नए जीन संयोजन तथा उच्च आनुवंशिक विविधता उत्पन्न होती है।","जब पर्यावरण तेजी से बदलता है, तब यही विविधता प्राकृतिक चयन को ‘कच्चा माल’ देकर शीघ्र अनुकूलन संभव बनाती है।","स्व-परागण अधिक विश्वसनीय अवश्य है, परंतु वह एक:पता तथा अंतःप्रजनन अवसाद ( inbreeding depression) बढ़ाता है।","इसीलिए परागकण-हानि जैसे जोखिमों के बावजूद पर-परागण दीर्घकाल में विकास की दृष्टि से लाभकारी सिद्ध होता है।"]},{"s":"सामान्य विज्ञान","q":"हार्डी-वाइनबर्ग संतुलन में सभी एलील्स की आवृत्तियों का कुल योग कितना होता है?","o":["एक","दो","चार","पाँच"],"a":0,"e":["हार्डी-वाइनबर्ग सिद्धांत के अनुसार किसी जीन स्थल की सभी एलील आवृत्तियों का योग सदैव 1 होता है ( p + q = 1) ।","जीनोटाइप आवृत्तियों का योग भी 1 होता है, अर्थात p2 + 2pq + q2 = 1 ।","यह संतुलन तभी बना रहता है जब उत्परिवर्तन, प्रवास, आनुवंशिक विचलन, प्राकृतिक चयन न हों और संगम यादृच्छिक हो।","इन शर्तों से विचलन ही जनसंख्या में विकास ( evolution) होने का संकेत माना जाता है।"]},{"s":"सामान्य विज्ञान","q":"ताज महल के पीले रंग में परिवर्तन के लिए निम्नलिखित में से कौन-सा रासायनिक पदार्थ जिम्मेदार है?","o":["कार्बन डाइऑक्साइड","सल्फर डाइऑक्साइड","नाइट्रोजन डाइऑक्साइड","ओ”ाोन"],"a":1,"e":["आसपास के उद्योगों एवं मथुरा तेल शोधक कारखाने से निकलने वाली सल्फर डाइऑक्साइड मुख्य कारण मानी जाती है।","यह गैस वायुमंडलीय नमी एवं ऑक्सीजन से क्रिया कर सल्फ्यूरिक अम्ल बनाती है, जो अम्लीय वर्षा के रूप में गिरती है।","यह अम्ल संगमरमर ( CaCO ) से 3 अभिक्रिया कर कैल्शियम सल्फेट बनाता है, जिससे पत्थर पीला व खुरदुरा पड़ जाता है – इसे ‘मार्बल कैंसर’ कहते हैं।","इसी कारण ताजमहल के चारों ओर ‘ताज ट्रेपेि”ायम ”ाोन’ घोषित कर प्रदूषणकारी उद्योगों पर प्रतिबंध लगाया गया है।"]},{"s":"सामान्य विज्ञान","q":"लापरवाहीपूर्वक कन्या भ्रूण हत्या से जुड़ी सामाजिक चिंता क्या है?","o":["प्रजनन दर में वृद्धि","बाल लिंग अनुपात में गिरावट","मासिक धर्म की आवृत्ति में वृद्धि","गर्भावस्था की जटिलताओं में वृद्धि"],"a":1,"e":["कन्या भ्रूण हत्या से जनसंख्या में लड़कियों की संख्या लगातार घटती जाती है।","इसका सीधा परिणाम बाल लिंग अनुपात ( 0-6 वर्ष) में गिरावट के रूप में सामने आता है। 123","असंतुलित लिंग अनुपात सामाजिक असंतुलन, विवाह-संकट एवं महिलाओं के विरुद्ध अपराध बढ़ाता है।","इसे रोकने हेतु भारत में पी-सी--पी-एन-डी- टी- अधिनियम 1994 लागू है, जो लिंग परीक्षण को प्रतिबंधित करता है।"]},{"s":"सामान्य विज्ञान","q":"यदि थायरॉक्सिन का स्तर अत्यधिक बढ़ जाता है, तो कौन-सी फीडबैक प्रतिक्रिया होती है?","o":["पिट्यूटरी ग्रंथि टीएसएच को कम करती है ताकि थायरॉयड सक्रियता घटे","थायरॉयड अधिक थायरॉक्सिन स्रावित करता है","एड्रेनालाईन चयापचय को बढ़ाकर इसकी भरपाई करता है","ग्रोथ हार्मोन (जीएच) ऊर्जा को संतुलित करने के लिए बढ़ता है"],"a":0,"e":["थायरॉक्सिन का स्राव पिट्यूटरी ग्रंथि से निकलने वाले टीएसएच द्वारा नियंत्रित होता है।","रक्त में थायरॉक्सिन का स्तर अधिक होने पर ऋणात्मक पुनर्भरण (नेगेटिव फीडबैक) क्रियाशील होता है।","इसमें पिट्यूटरी टीएसएच का स्राव घटा देती है, जिससे थायरॉयड की सक्रियता कम हो जाती है।","यह तंत्र शरीर में हार्मोन के स्तर को संतुलित (होमियोस्टैसिस) बनाए रखता है।"]},{"s":"सामान्य विज्ञान","q":"श्वसन के दौरान मुक्त ऊर्जा का उपयोग _______ के संश्लेषण के लिए किया जाता है।","o":["ADP / एडीपी","ATP / एटीपी","NTP / एनटीपी","DTP / डीटीपी"],"a":1,"e":["श्वसन के दौरान ग्लूको”ा के विघटन से मुक्त ऊर्जा ATP के रूप में संचित होती है।","ATP का पूरा नाम एडिनोसिन ट्राइफॉस्फेट है, इसे कोशिका की ‘ऊर्जा मुद्रा’ कहा जाता है।","ADP और अकार्बनिक फॉस्फेट के संयोजन से ATP का निर्माण होता है।","एक ग्लूको”ा अणु के पूर्ण ऑक्सीकरण से लगभग 36-38 ATP अणु प्राप्त होते हैं।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन पारिस्थितिकी अथवा प्रकृति की क्रियात्मक इकाई के रूप में जाना जाता है?","o":["पारिस्थितिकी तंत्र","खाद्य जाल","उत्पादक","उपभोक्ता"],"a":0,"e":["पारिस्थितिकी तंत्र (इकोसिस्टम) को ही पारिस्थितिकी की क्रियात्मक इकाई माना जाता है।","इसमें जैविक घटक (उत्पादक, उपभोक्ता, अपघटक) एवं अजैविक घटक परस्पर क्रिया करते हैं।","इसी इकाई में ऊर्जा प्रवाह तथा पोषक तत्वों का चक्रण पूर्ण रूप से संपन्न होता है।","‘इकोसिस्टम’ शब्द का प्रयोग सर्वप्रथम 1935 में ए-जी- टांसले ने किया था।"]},{"s":"सामान्य विज्ञान","q":"वायुमंडल में किन गैसों की मात्रा में वृद्धि के कारण अम्लीय वर्षा होती है?","o":["कार्बन डाइऑक्साइड और कार्बन मोनोऑक्साइड","कार्बन डाइऑक्साइड और नाइट्रस ऑक्साइड","सल्फर डाइऑक्साइड और कार्बन मोनोऑक्साइड","सल्फर डाइऑक्साइड और नाइट्रोजन ऑक्साइड"],"a":3,"e":["अम्लीय वर्षा मुख्यतः सल्फर डाइऑक्साइड ( SO ) एवं नाइट्रोजन ऑक्साइड ( NO ) 2 2 के कारण होती है।","ये गैसें वायुमंडलीय जलवाष्प से क्रिया कर सल्फ्यूरिक अम्ल एवं नाइट्रिक अम्ल बनाती हैं।","इनका मुख्य स्रोत जीवाश्म इ±धन का दहन, ताप विद्युत संयंत्र एवं वाहन उत्सर्जन है।","अम्लीय वर्षा से मृदा की अम्लता बढ़ती है तथा ताजमहल जैसे संगमरमर स्मारक क्षतिग्रस्त होते हैं।"]},{"s":"सामान्य विज्ञान","q":"प्लाज्मोडियम में किस प्रकार का कोशिका विभाजन एक साथ कई संतति कोशिकाओं के निर्माण की ओर ले जाता है?","o":["द्विखंडन","मुकुलन","बहुखंडन","विखंडन"],"a":2,"e":["प्लाज्मोडियम मलेरिया रोग उत्पन्न करने वाला एककोशिकीय परजीवी प्रोटो”ाोआ है।","इसमें बहुखंडन (मल्टीपल फिशन) होता है, जिसमें पहले केंद्रक अनेक बार विभाजित होता है।","इसके बाद कोशिकाद्रव्य विभाजित होकर एक साथ अनेक संतति कोशिकाएँ (मीरो”ाोइट) बनाता है।","अमीबा में द्विखंडन तथा यीस्ट में मुकुलन द्वारा अलैंगिक जनन होता है।"]},{"s":"सामान्य विज्ञान","q":"अंडाणु के निकलने के बाद उसकी जीवित रहने की अवधि कितनी होती है?","o":["6 घंटे","12 घंटे","24 घंटे","48 घंटे"],"a":2,"e":["अंडोत्सर्ग (ओव्यूलेशन) के पश्चात अंडाणु पैफलोपियन नलिका में पहुँचता है।","निषेचन के लिए अंडाणु की जीवनक्षमता सामान्यतः लगभग 24 घंटे तक ही रहती है।","इस अवधि में निषेचन न होने पर अंडाणु नष्ट हो जाता है। 124","तुलनात्मक रूप से शुक्राणु महिला जनन मार्ग में 3-5 दिन तक जीवित रह सकते हैं।"]},{"s":"सामान्य विज्ञान","q":"भ्रूण को पोषक तत्व और ऑक्सीजन मातृ रक्त से मिलते हैं, फिर भी मातृ और भ्रूण रक्त आपस में क्यों नहीं मिलते?","o":["मातृ रक्त सीधे भ्रूण में प्रवाहित होता है","भ्रूण का रक्त मातृ धमनियों में संचरित होता है","सेमिनल फ्लूइड (वीर्य द्रव) भ्रूण को पोषण देता है","प्लेसेंटा की विलाइ एक पतली बाधा के पार विसरण की अनुमति देती हैं"],"a":3,"e":["प्लेसेंटा (अपरा) भ्रूण एवं माता के बीच पोषण तथा गैस विनिमय का माध्यम है।","भ्रूण की ओर से अंगुलीनुमा प्रवर्ध (विलाई) मातृ ऊतक के रुधिर अवकाशों में धँसे रहते हैं।","इससे विसरण के लिए विशाल सतह मिलती है, किंतु दोनों रक्त धाराएँ एक पतली झिल्ली द्वारा पृथक रहती हैं।","इसी कारण ऑक्सीजन एवं पोषक तत्व तो पार होते हैं, परंतु रक्त आपस में नहीं मिलता।"]},{"s":"सामान्य विज्ञान","q":"विवरण के अनुसार निम्नलिखित में से कौन-सा मार्ग अधिकतम ऊर्जा देता है?","o":["पाइ:वेट का लैक्टिक अम्ल में विघटन","पाइ:वेट का एथेनॉल रू CO में 2 विघटन","माइटोकॉन्ड्रिया में पाइ:वेट का CO 2 + H O में विघटन 2","ग्लूको”ा का आंशिक रूप से पाइ:वेट में परिवर्तन"],"a":2,"e":["ग्लाइकोलिसिस से बना पाइ:वेट ऑक्सीजन की उपस्थिति में माइटोकॉन्ड्रिया में प्रवेश करता है।","वहाँ क्रेब्स चक्र एवं इलेक्ट्रॉन परिवहन तंत्र द्वारा उसका पूर्ण ऑक्सीकरण CO और 2 H O में होता है। 2","इस वायवीय श्वसन से प्रति ग्लूको”ा अणु लगभग 36-38 ATP प्राप्त होते हैं।","अवायवीय मार्गों (लैक्टिक अम्ल या एथेनॉल) से केवल 2 ATP ही मिलते हैं।"]},{"s":"सामान्य विज्ञान","q":"किसी आवास में विभिन्न स्तरों पर रहने वाली विभिन्न प्रजातियों का ऊध्र्वाधर वितरण किस नाम से जाना जाता है?","o":["पारिस्थितिक पिरामिड","क्षेत्रीकरण","स्तरीकरण","विचलन"],"a":2,"e":["किसी आवास में जीव-प्रजातियों का ऊध्र्वाधर (लंबवत) स्तरों में वितरण स्तरीकरण कहलाता है।","उदाहरणस्व:प वन में शीर्ष वितान, उप-वितान, झाड़ी स्तर एवं भूतल स्तर पाए जाते हैं।","प्रत्येक स्तर पर प्रकाश, नमी एवं तापमान भिन्न होने से भिन्न प्रजातियाँ रहती हैं।","जबकि क्षेत्रीकरण (”ाोनेशन) क्षैतिज वितरण को दर्शाता है, जैसे झील में तटीय से गहरे क्षेत्र तक।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सा मुख्य कारण है कि सिनैप्स पर आवेग (इम्पल्स) रासायनिक होते हैं, विद्युत नहीं?","o":["आवेग को तेजी से प्रवाहित कराने के लिए","न्यूरॉनों की थकान को रोकने के लिए","आवेग के एकदिशीय प्रवाह को सुनिश्चित करने के लिए","आवेग को एक साथ कई दिशाओं में प्रवाहित होने की अनुमति देने के लिए"],"a":2,"e":["सिनैप्स पर पूर्व-सिनैप्टिक तंत्रिका सिरे से न्यूरोट्रांसमीटर रसायन मुक्त होते हैं।","इन रसायनों के ग्राही केवल पश्च-सिनैप्टिक झिल्ली पर होते हैं, अतः संकेत केवल एक ही दिशा में जा पाता है।","यह एकदिशीय प्रवाह तंत्रिका तंत्र में सूचना के व्यवस्थित संचरण के लिए आवश्यक है।","रासायनिक संचरण विद्युत संचरण की तुलना में धीमा होता है।"]},{"s":"सामान्य विज्ञान","q":"जब किसी छात्र की आंखों पर अचानक ते”ा रोशनी डाली जाती है, तो एक रिफ्लेक्स (प्रतिवर्ती) क्रिया देखी जाती है। इसमें कौन-कौन-से न्यूरॉन्स शामिल होते हैं?","o":["संवेदी और मोटर न्यूरॉन्स","केवल मोटर न्यूरॉन्स","संवेदी, रिले और मोटर न्यूरॉन्स","केवल संवेदी न्यूरॉन्स"],"a":2,"e":["प्रतिवर्ती चाप में संवेदी न्यूरॉन उद्दीपन की सूचना ग्राही अंग से केंद्रीय तंत्रिका तंत्र तक ले जाता है।","वहाँ रिले (सहबद्ध) न्यूरॉन संकेत को संवेदी से मोटर न्यूरॉन तक स्थानांतरित करता है।","मोटर न्यूरॉन प्रभावी अंग (यहाँ आइरिस की पेशियों) तक आदेश पहुँचाकर पुतली को सिकोड़ देता है।","ते”ा प्रकाश पर पुतली का सिकुड़ना इसी तीन-न्यूरॉन पथ का उत्तम उदाहरण है।"]},{"s":"सामान्य विज्ञान","q":"मानव मांसपेशियों में अचानक गतिविधि के दौरान पाय:वेट किसमें परिवर्तित हो जाता है?","o":["इथेनॉल रू CO 2","शर्करा (ग्लूकोज)","CO + H O 2 2","लैक्टिक अम्ल"],"a":3,"e":["125","तीव्र या अचानक व्यायाम में पेशियों को पर्याप्त ऑक्सीजन नहीं मिल पाती और अवायवीय श्वसन होने लगता है।","ऐसी दशा में ग्लूकोज से बना पाय:वेट लैक्टिक अम्ल में परिवर्तित हो जाता है।","लैक्टिक अम्ल के संचय से पेशियों में ऐंठन (क्रैम्प) और थकान का अनुभव होता है।","यीस्ट में यही पाय:वेट अवायवीय दशा में इथेनॉल और कार्बन डाइऑक्साइड में बदलता है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सी पर्यावरणीय स्थिति अपघटन को रोकती है?","o":["उच्च आद्र्रता","अच्छा ह्यूमस होना","उच्च तापमान और वायवीय स्थितियाँ","निम्न तापमान और अनावायवीय स्थितियाँ"],"a":3,"e":["अपघटन की क्रिया सूक्ष्मजीवों पर निर्भर करती है, जिन्हें उपयुक्त ताप, नमी और ऑक्सीजन की आवश्यकता होती है।","निम्न तापमान पर अपघटक जीवों की उपापचयी दर घट जाती है और उनकी क्रियाशीलता मंद पड़ जाती है।","ऑक्सीजन के अभाव (अनावायवीय दशा) में वायवीय अपघटक कार्य नहीं कर पाते, अतः अपघटन रुक जाता है।","इसी कारण ठंडे तथा जलमग्न/दलदली क्षेत्रों में कार्बनिक पदार्थ लंबे समय तक अविघटित बना रहता है, जैसे पीट का निर्माण।"]},{"s":"सामान्य विज्ञान","q":"एक पारिस्थितिकी तंत्र में, ________ एक अपवाद है जहाँ सूर्य ऊर्जा का स्रोत नहीं होता है।","o":["स्थलीय पारिस्थितिकी तंत्र","झील पारिस्थितिकी तंत्र","रेगिस्तान पारिस्थितिकी तंत्र","गहरे समुद्र का हाइड्रो-थर्मल पारिस्थितिकी तंत्र"],"a":3,"e":["गहरे समुद्र में स्थित हाइड्रोथर्मल वेंट तक सूर्य का प्रकाश नहीं पहुँच पाता।","यहाँ रसायन-संश्लेषी जीवाणु हाइड्रोजन सल्फाइड जैसे रसायनों के ऑक्सीकरण से ऊर्जा प्राप्त करते हैं।","यही जीवाणु ट्यूब वर्म, केकड़े आदि जीवों के लिए खाद्य श्रृंखला का आधार बनते हैं।","स्थलीय, झील तथा मरुस्थलीय पारिस्थितिकी तंत्र पूर्णतः सौर ऊर्जा एवं प्रकाश संश्लेषण पर निर्भर हैं।"]},{"s":"सामान्य विज्ञान","q":"कौन-सी ग्रंथि वृद्धि हार्मोन का स्राव करती है?","o":["पिट्यूटरी","थायरॉइड","एड्रीनल","पैंक्रियाज"],"a":0,"e":["वृद्धि हार्मोन ( Growth Hormone) पीयूष अर्थात् पिट्यूटरी ग्रंथि के अग्र भाग से स्रावित होता है।","बाल्यावस्था में इसकी कमी से बौनापन तथा अधिकता से जाइगैंटिज्म (अतिकायता) हो जाती है।","पिट्यूटरी को “मास्टर ग्रंथि” कहते हैं क्योंकि यह अन्य अंतःस्रावी ग्रंथियों को भी नियंत्रित करती है।","थायरॉयड थायरॉक्सिन, एड्रीनल एड्रेनालिन तथा अग्न्याशय इंसुलिन स्रावित करता है।"]},{"s":"सामान्य विज्ञान","q":"मस्तिष्क का कौन-सा भाग पिट्यूटरी ग्रंथि द्वारा वृद्धि हार्मोन के स्राव को नियंत्रित करता है?","o":["सेरिबेलम (अनुमस्तिष्क)","हाइपोथैलेमस","मेडुला ऑब्लोंगेटा","मेरुरज्जु (स्पाइनल कॉर्ड)"],"a":1,"e":["हाइपोथैलेमस GHRH तथा सोमैटोस्टैटिन जैसे नियामक हार्मोन स्रावित कर पिट्यूटरी को नियंत्रित करता है।","इस प्रकार यह तंत्रिका तंत्र और अंतःस्रावी तंत्र के बीच सेतु का कार्य करता है।","सेरिबेलम शरीर के संतुलन एवं गति के समन्वय को नियंत्रित करता है।","मेडुला ऑब्लांगेटा श्वसन व हृदय गति जैसी अनैच्छिक क्रियाओं तथा मेरुरज्जु प्रतिवर्ती क्रियाओं का केंद्र है।"]},{"s":"सामान्य विज्ञान","q":"मेयोसिस (अर्धसूत्री विभाजन) द्वारा किस प्रकार के युग्मक उत्पन्न होते हैं?","o":["अगुणित","द्विगुणित","त्रिगुणित","बहुगुणित"],"a":0,"e":["अर्धसूत्री विभाजन में गुणसूत्रों की संख्या आधी रह जाती है, अतः बने युग्मक अगुणित ( n) होते हैं।","निषेचन के समय दो अगुणित युग्मक मिलकर द्विगुणित ( 2n) युग्मनज बनाते हैं।","इससे पीढ़ी-दर-पीढ़ी जाति की गुणसूत्र संख्या स्थिर बनी रहती है।","क्रॉसिंग ओवर के कारण इस विभाजन से आनुवंशिक विविधता भी उत्पन्न होती है।"]},{"s":"सामान्य विज्ञान","q":"सीवेज में ____ % पानी और ____ % ठोस पदार्थ होते हैं।","o":["99, 1","99.9, 0.1","90, 10","95, 5"],"a":1,"e":["सीवेज मूलतः जल में घुले तथा निलंबित अपशिष्टों का मिश्रण होता है।","इसमें लगभग 99.9% जल तथा मात्र 0.1% ठोस पदार्थ (कार्बनिक एवं अकार्बनिक) होते हैं।","यही अल्प मात्रा में उपस्थित ठोस पदार्थ एवं सूक्ष्मजीव जल प्रदूषण का मुख्य कारण बनते हैं।","इसी कारण मल-जल उपचार संयंत्रों में विशाल जल-मात्रा का शोधन करना पड़ता है।"]},{"s":"सामान्य विज्ञान","q":"एक रोगी के रक्त में कैल्शियम का स्तर अधिक है, जबकि पैराथॉर्मोन का स्तर कम 126 है। कौन-सा परिदृ’य इसे सबसे अच्छी तरह समझाता है?","o":["थायरॉइड अधिक कैल्सिटोनिन स्रावित करता है","एड्रेनालिन हडि्डयों से कैल्शियम मुक्त करता है","आहार में कैल्शियम की अत्यधिक मात्रा, जिससे नकारात्मक प्रतिक्रिया द्वारा पैराथॉर्मोन दब जाता है","GH की कमी से हडि्डयों में कैल्शियम कम हो जाता है"],"a":2,"e":["रक्त में कैल्शियम बढ़ने पर पैराथॉर्मोन का स्राव नकारात्मक प्रतिपुष्टि द्वारा कम हो सक र्त क्रियाओं का समन्वय मेरुरज्जु के स्तर पर होता है।"]},{"s":"सामान्य विज्ञान","q":"बहुकोशिकीय जीवों को उत्सर्जन के लिए विशिष्ट अंगों की आवश्यकता क्यों होती है?","o":["वे नाइट्रोजनी अपशिष्ट बनाते ही नहीं हैं","उनके उपापचयी अपशिष्ट विषैले नहीं होते","शरीर की जटिलता के कारण केवल विसरण पर्याप्त नहीं होता","गैसीय अपशिष्ट केवल प्रकाश संश्लेषण द्वारा हटते हैं"],"a":2,"e":["बहुकोशिकीय जीवों में कोशिकाएँ शरीर की सतह से दूर भी स्थित होती हैं।","इस कारण केवल साधारण विसरण द्वारा सभी अपशिष्टों को हटाना प्रभावी नहीं होता।","विशिष्ट उत्सर्जी अंग अपशिष्टों को एकत्र कर नियंत्रित ढंग से बाहर निकालते हैं।","अतः शरीर की जटिलता के कारण विशेष उत्सर्जन तंत्र आवश्यक है।"]},{"s":"सामान्य विज्ञान","q":"एक एकल अप्रभावी जीन लक्षण अपना प्रभाव व्यक्त करेगा यदि वह लक्षण निम्न पर स्थित होः","o":["ऑटोसोम","पुरुष के X- गुणसूत्र पर","महिला के X- गुणसूत्र पर","महिला के Y- गुणसूत्र पर"],"a":1,"e":["पुरुष में X और Y गुणसूत्र होते हैं, इसलिए X- गुणसूत्र पर स्थित अप्रभावी जीन की दूसरी X प्रति नहीं होती।","इस कारण X- सहलग्न अप्रभावी जीन लक्षण पुरुष में एक ही प्रति होने पर व्यक्त हो सकता है।","महिला में दो X गुणसूत्र होने के कारण सामान्यतः दो अप्रभावी प्रतियों की आवश्यकता होती है।"]},{"s":"सामान्य विज्ञान","q":"केशिकाएँ रक्त और ऊतकों के बीच पदार्थों के आदान-प्रदान के लिए उपयुक्त होती हैं क्योंकिः","o":["वे बड़ी और चौड़ी होती हैं","उनकी दीवारें एक-कोशिकीय स्तर जितनी मोटी होती हैं","वे बहुत उच्च दबाव में रक्त ले जाती हैं","वे धमनियों की तरह लचीली होती हैं"],"a":1,"e":["केशिकाएँ शरीर की सबसे छोटी रक्त वाहिकाएँ हैं।","इनकी दीवारें एक-कोशिकीय स्तर जितीन होती हैं।","पतली दीवार के कारण रक्त और ऊतकों के बीच पदार्थों का आदान-प्रदान आसानी से होता है।"]},{"s":"सामान्य विज्ञान","q":"पौधे उत्सर्जन के लिए अपनी पत्तियों का किस प्रकार उपयोग करते हैं?","o":["पत्तियों की रिक्तिकाओं में अपशिष्ट जमा करके, जिन्हें बाद में गिरा दिया जाता है","अपशिष्ट को ऑक्सीजन में बदलकर पत्तियों से छोड़कर","रंध्रों के माध्यम से रेजिन का वाष्पोत्सर्जन करके","अपशिष्ट को पत्ती की सतह पर स्रावित करके"],"a":0,"e":["पौधों में अपशिष्ट पदार्थ रिक्तिकाओं में संग्रहीत किए जा सकते हैं।","गोंद और रेजिन के रूप में भी अपशिष्ट पदार्थ जमा किए जाते हैं।","कुछ अपशिष्ट पत्तियों में जमा होकर पत्तियों के गिरने के साथ बाहर निकलते हैं।","NCERT के अनुसार पत्तियाँ पौधों में अपशिष्ट निष्कासन की महत्वपूर्ण भूमिका निभाती हैं।"]},{"s":"सामान्य विज्ञान","q":"जब ऊर्जा एक पोषी स्तर से दूसरे पोषी स्तर तक स्थानांतरित होती है, तो कार्बनिक पदार्थ की ऊर्जा का लगभग कितना प्रतिशत आगे पहुँचता है?","o":["5%","10%","45%","90%"],"a":1,"e":["पारिस्थितिकी तंत्र में ऊर्जा का प्रवाह एक पोषी स्तर से अगले स्तर की ओर होता है।","औसतन लगभग 10% ऊर्जा अगले पोषी स्तर तक स्थानांतरित होती है।","बाकी 90% ऊर्जा का बड़ा भाग जीवन-क्रियाओं में उपयोग होकर ऊष्मा (Heat) के रूप में पर्यावरण में नष्ट हो जाता है। इसे ही लिंडेमैन का 10% नियम कहते हैं।"]},{"s":"सामान्य विज्ञान","q":"मानवों के लिए यौन प्रजनन क्यों महत्वपूर्ण है?","o":["शरीर की ऊंचाई बनाए रखने के लिए","जनसंख्या बढ़ाने और प्रजाति के अस्तित्व को सुनिश्चित करने के लिए","मासिक धर्म को रोकने के लिए","हार्मोन को विनियमित करने के लिए"],"a":1,"e":["यौन प्रजनन से नई संतति बनती है, प्रजाति की निरंतरता रहती है और आनुवंशिक विविधता बढ़ती है।","इस प्रक्रिया में माता-पिता से आनुवंशिक पदार्थ का संयोजन होता है।","आनुवंशिक विविधता बढ़ने से बदलते पर्यावरण में अनुकूलन की क्षमता बढ़ती है।"]},{"s":"सामान्य विज्ञान","q":"हाइपरथायराइडिज्म से ग्रस्त व्यक्ति तनाव में है और उसके रक्त में ग्लूको”ा अत्यधिक बढ़ जाता है। कौन-सा संयोजन इस प्रभाव को समझाता है?","o":["अधिक थायरॉक्सिन चयापचय को तेज करता है ; एड्रेनालिन ग्लूको”ा को सक्रिय करता है","GH ग्लूको”ा कम करता है ; इंसुलिन हृदय गति बढ़ाता है","कैल्सिटोनिन चयापचय कम करता है ; पैराथॉर्मोन ग्लूको”ा बढ़ाता है","एड्रेनालिन अकेले चयापचय को नियंत्रित करता है"],"a":0,"e":["अधिक थायरॉक्सिन चयापचय को तेज करता है और तनाव में एड्रेनालिन रक्त में ग्लूको”ा बढ़ाने में सहायता करता है।","थायरॉक्सिन शरीर की चयापचय दर को बढ़ाने में भूमिका निभाता है।","तनाव के समय एड्रेनालिन यकृत में ग्लाइकोजन के टूटने को बढ़ाकर रक्त ग्लूको”ा बढ़ाता है।","थायरॉक्सिन हार्माेन की कमी से घेंघा रोग होता है, जबकि एड्रेनालिन को ‘लड़ो या उड़ो हार्माेन’ भी कहा जाता है।"]},{"s":"सामान्य विज्ञान","q":"चतुष्कीय (टेट्रासोमिक) अवस्था कौन-सी है?","o":["2n−1","2n+1+1","2n+2","2n+3"],"a":2,"e":["टेट्रासोमी में किसी एक गुणसूत्र की दो अतिरिक्त प्रतियाँ होती हैं।","इसका गुणसूत्रीय सूत्र 2n+2 होता है।","यह ऐन्यूप्लॉइडी का एक प्रकार है।","2n−1 मोनोसोमी और 2n+1 ट्राइसोमी को दर्शाता है।"]},{"s":"सामान्य विज्ञान","q":"जब एक शुद्ध लंबा मटर का पौधा शुद्ध बौने मटर के पौधे से संकरित किया जाता है, तो F और F पीढ़ी में लंबे पौधों का 1 2 प्रतिशत क्रमशः कितना होगा?","o":["25%, 25%","50%, 50%","75%, 100%","100%, 75%"],"a":3,"e":["शुद्ध लंबा पौधा TT और शुद्ध बौना पौधा tt माना जाता है।","TT × tt से F में सभी पौधे Tt और 1 लंबे होते हैं।","F के स्वपरागण से F में TT:Tt:tt = 1 2 1:2:1 अनुपात मिलता है।","इसलिए F में 100% और F में 75% 1 2 पौधे लंबे होते हैं।"]},{"s":"सामान्य विज्ञान","q":"अपघटकों को किसके अंतर्गत वर्गीकृत किया जाता है?","o":["स्वपोषी","परपोषी","ऑर्गेनोट्रॉफ्स","परजीवी"],"a":1,"e":["अपघटक मृत जैव पदार्थों को सरल पदार्थों में तोड़ते हैं।","कवक और अनेक जीवाणु इसके प्रमुख उदाहरण हैं।","वे अपना कार्बनिक भोजन स्वयं नहीं बनाते, इसलिए पोषण की दृष्टि से परपोषी होते हैं।"]},{"s":"सामान्य विज्ञान","q":"न्यूक्लियोलस निम्नलिखित में से किस संरचना से बनता है?","o":["माइटोकॉन्ड्रिया","गॉल्जी काय","न्यूक्लियोलर ऑर्गनाइ”ार","राइबोसोम"],"a":2,"e":["केंद्रिका (न्यूक्लियोलस) एक झिल्ली-रहित संरचना है जो कोशिका के केंद्रक के भीतर पाई जाती है।","इसका निर्माण गुणसूत्रों के उन विशिष्ट भागों से होता है जिन्हें ‘न्यूक्लियोलर ऑर्गनाइ”ार क्षेत्र’ ( NOR) कहते हैं और जिनमें rRNA जीन स्थित होते हैं।","केंद्रिका में rRNA का संश्लेषण तथा राइबोसोम की उपइकाइयों का संयोजन होता है।","माइटोकॉन्ड्रिया, गॉल्जी काय एवं राइबोसोम कोशिकाद्रव्यीय अंगक हैं, ये केंद्रिका का निर्माण नहीं करते।"]},{"s":"सामान्य विज्ञान","q":"प्रोटीन की α- हेलिक्स संरचना किसके द्वारा स्थिर होती है?","o":["पेप्टाइड बंध","डाइसल्फ़ाइड सेतु","हाइड्रोजन बंध","हाइड्रोफोबिक अंतःक्रियाएं"],"a":2,"e":["129","α- हेलिक्स प्रोटीन की द्वितीयक संरचना है, जिसे लाइनस पॉलिंग एवं रॉबर्ट कोरे ने प्रस्तावित किया था।","इसमें एक अमीनो अम्ल के >C=O समूह तथा उससे चार स्थान आगे वाले अमीनो अम्ल के >N–H समूह के बीच हाइड्रोजन बंध बनते हैं।","ये हाइड्रोजन बंध कुंडली के अक्ष के लगभग समानांतर होते हैं और संरचना को स्थायित्व प्रदान करते हैं।","पेप्टाइड बंध प्राथमिक संरचना बनाते हैं, जबकि डाइसल्फ़ाइड सेतु व जलविरागी अंतःक्रियाएँ मुख्यतः तृतीयक संरचना को स्थिर करती हैं।"]},{"s":"सामान्य विज्ञान","q":"शब्द “प्रमुख प्रजाति (फ्लैगशिप स्पीशी”ा)” का तात्पर्य हैः","o":["उच्च प्रजनन क्षमता वाली प्रजातियाँ","कीस्टोन प्रजातियाँ","संरक्षण जाग:कता के लिए प्रतीकात्मक प्रजातियों का उपयोग","किसी आवास में पहली खोजी गई प्रजाति"],"a":2,"e":["‘फ्लैगशिप स्पीशी”ा’ वह आकर्षक एवं लोकप्रिय प्रजाति होती है जिसे संरक्षण अभियानों का प्रतीक बनाया जाता है।","इसके माध्यम से जनसमर्थन तथा वित्तीय सहायता जुटाकर पूरे पारितंत्र का संरक्षण किया जाता है – जैसे बाघ, एशियाई हाथी तथा विशाल पांडा।","‘कीस्टोन प्रजाति’ वह है जिसका पारितंत्र पर उसकी संख्या की तुलना में असमान रूप से बड़ा प्रभाव पड़ता है।","‘अम्ब्रेला प्रजाति’ के संरक्षण से उसके विस्तृत आवास में रहने वाली अनेक अन्य प्रजातियाँ स्वतः संरक्षित हो जाती हैं।"]},{"s":"सामान्य विज्ञान","q":"किस प्रकार के पौधों में स्पष्ट वानस्पतिक, प्रजनन और जीर्णावस्था देखे जा सकते हैं?","o":["वार्षिक और बारहमासी","बारहमासी और द्विवार्षिक","वार्षिक और द्विवार्षिक","केवल बारहमासी"],"a":2,"e":["पौधों में वृद्धि की तीन स्पष्ट अवस्थाएँ – वानस्पतिक, जननात्मक तथा जीर्णावस्था केवल सीमित जीवनकाल वाले पौधों में दिखती हैं।","वार्षिक पौधे एक ऋतु में तथा द्विवार्षिक पौधे दो वर्षों में अपना जीवनचक्र पूरा करते हैं।","बारहमासी पौधों में ये अवस्थाएँ अतिव्यापी रहती हैं, इसलिए स्पष्ट रूप से पृथक नहीं दिखतीं।"]},{"s":"सामान्य विज्ञान","q":"जड़ के निम्नलिखित में से किस क्षेत्र में मूल रोम होते हैं?","o":["दीर्घीकरण का क्षेत्र (रीजन ऑफ एलॉन्गेशन)","कोशिका विभाजन का क्षेत्र (रीजन ऑफ सेल डिविजन)","परिपक्वन का क्षेत्र (रीजन ऑफ मैच्योरेशन)","मूल गोप (:ट कैप)"],"a":2,"e":["जड़ के शीर्ष से क्रमशः मूल गोप, विभाजन क्षेत्र, दीर्घीकरण क्षेत्र और परिपक्वन क्षेत्र होते हैं।","मूल रोम परिपक्वन क्षेत्र ( region of maturation) की बाह्य त्वचा कोशिकाओं से निकलते हैं।","ये जल एवं खनिज-लवण के अवशोषण के लिए सतह-क्षेत्र बढ़ाते हैं।"]},{"s":"सामान्य विज्ञान","q":"मिट्टी को ढीला करने और पलटने की प्रक्रिया को कहा जाता हैः","o":["जुताई","गहाई (थिे्र शगं )","बोवाई","सिंचाई"],"a":0,"e":["मिट्टी को ढीला करके पलटने की क्रिया को जुताई ( ploughing/tilling) कहते हैं।","इससे मिट्टी में वायु-संचार बढ़ता है और जड़ें आसानी से गहराई तक जाती हैं।","पोषक तत्त्वों से भरपूर निचली मिट्टी ऊपर आ जाती है और खरपतवार नष्ट होते हैं।","गहाई अनाज को भूसे से अलग करने की क्रिया है।"]},{"s":"सामान्य विज्ञान","q":"पेफफड़ों में ऑक्सीजन का आंशिक दबाव सबसे अधिक किसमें होता हैः","o":["ऊतक","पुफप्पुफसीय धमनियाँ (पल्मनरी आर्टरी”ा)","पुफप्पुफसीय शिराएँ (पल्मनरी वेन्स)","विऑक्सीजनित रक्त"],"a":2,"e":["पुफप्पुफसीय धमनियाँ हृदय से पेफफड़ों तक विऑक्सीजनित रक्त ले जाती हैं, जिसमें pO लगभग 40 mm Hg होता है। 2","कूपिकाओं में गैस-विनिमय के बाद रक्त ऑक्सीजनित हो जाता है।","पुफप्पुफसीय शिराएँ यही ऑक्सीजन-समृद्ध रक्त ( pO लगभग 95 mm Hg) हृदय 2 तक लौटाती हैं।","अतः ऑक्सीजन का आंशिक दाब पुफप्पुफसीय शिराओं में सर्वाधिक होता है।"]},{"s":"सामान्य विज्ञान","q":"आरएनए में कौन-सा नाइट्रोजन बेस नहीं पाया जाता है?","o":["एडेनिन","साइटोसिन","थाइमिन","यूरेसिल"],"a":2,"e":["RNA में चार क्षारक होते हैं – एडेनिन, ग्वानिन, साइटोसिन तथा यूरेसिल।","DNA में यूरेसिल के स्थान पर थाइमिन पाया जाता है।","अतः थाइमिन RNA में अनुपस्थित रहता है (कुछ tRNA को छोड़कर)।"]},{"s":"सामान्य विज्ञान","q":"द्विबीजपत्री (डाइकोट) तने की अधस्त्वचा (हाइपोडर्मिस) मुख्य रूप से _____ से बनी होती है।","o":["मृदूतक (पैरेन्काइमा)","दृढ़ोतक (स्क्लेरेनकाइमा) 130","स्थूलकोणोतक (कोलेनकाइमा)","क्लोरेन्काइमा"],"a":2,"e":["द्विबीजपत्री तने में बाह्य त्वचा के ठीक नीचे अधस्त्वचा होती है।","यह स्थूलकोणोतक ( collenchyma) की कुछ परतों से बनी होती है।","इसकी कोशिका भित्तियाँ कोनों पर सेलुलोज व पेक्टिन से मोटी होती हैं, जो तने को यांत्रिक दृढ़ता व लचीलापन देती हैं।","एकबीजपत्री तने में अधस्त्वचा दृढ़ोतक की बनी होती है।"]},{"s":"सामान्य विज्ञान","q":"मानव में निम्नलिखित में से किस स "],"a":1,"e":["एनेलिडा संघ के जीवों में द्विपाश्र्व सम:पता एवं वास्तविक देहगुहा (सीलोम) पाई जाती है।","इनमें शरीर वलयों में विभाजित रहता है, जिसे मेटामेरिक खंडीभवन कहते हैं।","एनेलिडा में रुध्रि परिसंचरण तंत्र बंद प्रकार का होता हैऋ उदाहरण - केंचुआ, जोंक।","मोलस्का में अधिकांश खुला परिसंचरण तथा ईचिनोडर्मेटा में अरीय सम:पता पाई जाती है।","एनेलिडा संघ के जंतुओं में उत्सर्जन के लिए नेफ्रीडिया पाए जाते हैं।"]},{"s":"सामान्य विज्ञान","q":"समुद्री मछली पकड़ने का काम ___________ द्वारा निर्देशित मछली पकड़ने के जाल द्वारा किया जाता है।","o":["इको साउंडर्स और सैटेलाइट्स","आभासी इमेजिंग","ड्रोन","पनडुब्बियों 132"],"a":0,"e":["इको साउंडर ध्वनि तरंगों के परावर्तन से मछलियों के समूह की स्थिति व गहराई बताता है, वहीं उपग्रह समुद्री सतह के तापमान एवं क्लोरोफिल आंकड़ों से मत्स्य-बहुल क्षेत्र चिन्हित करते हैं।","भारत में भारतीय राष्ट्रीय महासागर सूचना सेवा केंद्र (INCOIS) द्वारा ‘पोटेंशियल फिशिंग जोन’ सलाह जारी की जाती है।"]},{"s":"सामान्य विज्ञान","q":"अमीबायसिस एक ऐसा रोग है जिसमें रोगाणु प्रभावित करते हैं।","o":["हृदय को","फेफड़े को","आंत को","मस्तिष्क को"],"a":2,"e":["अमीबियासिस (अमीबीय पेचिश) एंटअमीबा हिस्टोलिटिका नामक प्रोटोजोआ से होता है।","यह परजीवी मुख्यतः बड़ी आँत की श्लेष्मा झिल्ली को संक्रमित करता है।","इसके लक्षणों में पेट दर्द, ऐंठन तथा रक्त व श्लेष्म युक्त दस्त शामिल हैं।","यह संक्रमण दूषित जल एवं भोजन के माध्यम से मल-मुख मार्ग से फैलता है।","घरेलू मक्खियां इस रोग के संचरण में यांत्रिक वाहक का कार्य करती हैं।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सा पौध्े का उदाहरण है जो प्रकंदों के माध्यम से अलैंगिक रूप से प्रजनन करता है?","o":["स्ट्रॉबेरी","गुलबहार","फर्न","सेब का वृक्ष"],"a":2,"e":["प्रकंद (राइजोम) भूमिगत क्षैतिज तना है जिससे नए पौध्े विकसित होते हैं।","फर्न में प्रकंद द्वारा कायिक (अलैंगिक) प्रवध्र्न होता है।","स्ट्रॉबेरी में भूस्तारी (रनर) तथा सेब में बीज द्वारा लैंगिक जनन होता है।","अदरक, हल्दी एवं केला भी प्रकंद द्वारा प्रजनन के अन्य उदाहरण हैं।"]},{"s":"सामान्य विज्ञान","q":"लिनियस की वर्गीकरण प्रणाली के बारे में निम्नलिखित में से कौन सा कथन सत्य
