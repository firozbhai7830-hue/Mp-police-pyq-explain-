const D=[{"s":"इतिहास","q":"शस्त्र अधिनियम ( 1878) के तहत क्या प्रतिबंधित किया गया था?","o":["स्वयंसेवी दलों का गठन","भारतीयों को बिना लाइसेंस आग्नेयास्त्र रखने से रोकना","लाठी ले जाना","नमक का निर्माण"],"a":1,"e":["शस्त्र अधिनियम 1878 लॉर्ड लिटन के शासनकाल में लागू किया गया था।","इसने भारतीयों के लिए बिना लाइसेंस आग्नेयास्त्र रखने पर प्रतिबंध लगाया।","लॉर्ड लिटन के कार्यकाल में ही 1878 ई- में भारतीय समाचार पत्रों पर प्रतिबंध लगाने के लिए ‘वर्नाक्यूलर प्रेस एक्ट’ भी पारित किया गया था।"]},{"s":"इतिहास","q":"ह्वेनसांग का विवरण विशेष रूप से किस विषय के अध्ययन के लिए मूल्यवान है?","o":["हड़प्पा नगर","हर्षवर्धन का दरबार","मौर्य शासन व्यवस्था","चोलों के नौसैनिक अभियान"],"a":1,"e":["ह्वेनसांग 7 वीं शताब्दी में भारत आने वाला प्रसिद्ध चीनी बौद्ध यात्री था।","उसने सम्राट हर्षवर्धन के शासनकाल में भारत की यात्रा की।","उसके यात्रा-वृत्तांत से हर्षकालीन राजनीतिक और सामाजिक स्थिति की जानकारी मिलती है।","ह्वेनसांग के यात्रा-वृत्तांत को ‘सी-यू-की’ कहा जाता है।","उसने नालंदा में अध्ययन किया और भारत के अनेक क्षेत्रों का वर्णन किया। इतिहास Exercise"]},{"s":"इतिहास","q":"1905 में बंगाल के विभाजन को ब्रिटिशों द्वारा किस रूप में उचित ठहराया गया था?","o":["एक धार्मिक सुधार","एक प्रशासनिक आवश्यकता","भारतीय नेताओं की मांग","एक रक्षा उपाय"],"a":1,"e":["ब्रिटिश सरकार ने बंगाल विभाजन को प्रशासनिक सुविधा के नाम पर उचित ठहराया था।","लॉर्ड कर्जन ने वर्ष 1905 में बंगाल विभाजन की घोषणा की जो 16 अक्टूबर 1905 को प्रभावी हुआ था।","वास्तव में इसे भारतीय राष्ट्रवाद को कमजोर करने की नीति भी माना गया।","इस विभाजन के विरोध में स्वदेशी और बहिष्कार आंदोलन तेज हुआ।"]},{"s":"इतिहास","q":"किस अधिनियम के तहत बंगाल के गवर्नर-जनरल के पद को भारत के गवर्नर-जनरल में परिवर्तित किया गया था?","o":["चार्टर अधिनियम, 1813","चार्टर अधिनियम, 1833","भारत सरकार अधिनियम, 1858","पिट्स इंडिया अधिनियम, 1784"],"a":1,"e":["चार्टर अधिनियम 1833 ने बंगाल के गवर्नर-जनरल को भारत का गवर्नर-जनरल बनाया।","विलियम बेंटिंक इस पद पर नियुक्त होने वाले भारत के पहले गवर्नर-जनरल बने।","इस अधिनियम ने भारत में विधायी केंद्रीकरण को बढ़ावा दिया।","इसे स ","o":["अशोक","चंद्रगुप्त मौर्य","हर्ष","विम कडफिसेस"],"a":3,"e":["कुषाण शासक विम कडफिसेस ने भारत में बड़े पैमाने पर स्वर्ण मुद्राओं के प्रचलन को बढ़ावा दिया।","कुषाण काल में रोमन साम्राज्य से व्यापार के कारण स्वर्ण मुद्रा अर्थव्यवस्था को बल मिला।","कुषाण स्वर्ण मुद्राओं पर शासक और विभिन्न देवताओं के चित्र मिलते हैं।"]},{"s":"इतिहास","q":"‘अर्थशास्त्र’ राज्य संचालन और अर्थनीति पर आधारित ग्रंथ किस प्राचीन भारतीय विद्वान द्वारा रचित है?","o":["कालिदास","पाणिनि","आर्यभट्ट","कौटिल्य (चाणक्य)"],"a":3,"e":["अर्थशास्त्र की रचना कौटिल्य (चाणक्य) ने की थी।","भारत सरकार की संस्कृति सामग्री में इसे कौटिल्य द्वारा रचित शासन-ग्रंथ के रूप में संदर्भित किया गया है।","अर्थशास्त्र संस्कृत भाषा में लिखा गया है और इसे 15 अधिकरणों में विभाजित किया गया है।","ग्रंथ में शासन, राज्य-व्यवस्था, अर्थनीति और कूटनीति जैसे विषय मिलते हैं।"]},{"s":"इतिहास","q":"1857 के विद्रोह के बौद्धिक और सामाजिक प्रतिक्रियाओं के संबंध में निम्नलिखित कथनों पर विचार कीजिएः\n1. कार्ल माक्र्स, जिन्होंने न्यूयॉर्क डेली ट्रिब्यून में लिखा, ने इस विद्रोह को भारत के प्रथम स्वतंत्रता संग्राम के रूप में सराहा था।\n2. बंगाली बुद्धिजीवी राजनारायण बसु ने अपनी पुस्तक “हिंदुर प्रोकृत इतिहास” में इस विद्रोह को एक प्रतिक्रियावादी आंदोलन के रूप में निंदा की।\n3. ब्रिटिश प्रेस ने इस विद्रोह को औपनिवेशिक कुशासन के विरुद्ध एक उचित विरोध के रूप में चित्रित किया था। ऊपर दिए गए कथनों में से कौन-सा/ से सही है/हैं?","o":["केवल 1","केवल 2","केवल 1 और 3","1, 2 और 3"],"a":0,"e":["कार्ल माक्र्स ने 1857-58 में ‘न्यूयॉर्क डेली ट्रिब्यून’ के लिए लेख - श्रृंखला लिखी और विद्रोह को भारत का राष्ट्रीय विद्रोह बताते हुए इसका पक्ष लिया – इसी आधार पर कथन 1 सही माना जाता है।","राजनारायण बसु ‘भारतीय राष्ट्रवाद के पितामह’ कहे जाते हैं ; उनकी प्रामाणिक कृतियाँ ‘हिन्दू धर्मेर श्रेष्ठता’ तथा ‘से काल आर , काल’ हैं – उनके द्वारा 1857 को प्रतिक्रियावादी बताने का उल्लेख प्रामाणिक स्रोतों में नहीं मिलता, अतः कथन 2 गलत है।","ब्रिटिश प्रेस (द टाइम्स आदि) ने इसे ‘सिपाही ग़दर’ कहकर कठोर निंदा की और दमन का समर्थन किया, उचित विरोध नहीं माना – अतः कथन 3 भी गलत है।"]},{"s":"इतिहास","q":"निम्नलिखित जोड़ियों पर विचार करें। नीचे दी गई जोड़ियों में से कितनी जोड़ियाँ सही ढंग से मेल खाती हैं?\n1. बाल गंगाधर तिलक – केसरी (मराठी) और मराठा (अंग्रेजी) – A. स्वराज को जन्मसिद्ध अधिकार के रूप में मान्यता देना और सांस्कृतिक पुनरुद्धार के माध्यम से जन लामबंदी करना।\n2. बिपिन चंद्र पाल – न्यू इंडिया और वंदे मातरम – B. तिलक की जन अपील से भिन्न, आध्यात्मिक राष्ट्रवाद और निष्क्रिय प्रतिरोध का प्रचार।\n3. लाला लाजपत राय – द ट्रिब्यून (लाहौर) और पीपल – C. ब्रिटिश साम्राज्यवाद की आर्थिक आलोचना और सामाजिक सुधारों के साथ-साथ राजनीतिक संघर्ष पर जोर दिया गया।","o":["केवल एक","केवल दो","सभी तीन","इनमें से कोई नहीं"],"a":2,"e":["बाल गंगाधर तिलक ने मराठी में ‘केसरी’ तथा अंग्रे”ाी में ‘मराठा’ का प्रकाशन किया ; “ स्वराज मेरा जन्मसिद्ध अधिकार है” का उद्घोष तथा गणपति एवं शिवाजी उत्सवों द्वारा जन-लामबंदी उनकी विशिष्ट पहचान रही।","बिपिन चंद्र पाल ‘न्यू इंडिया’ ( 1901) तथा ‘वंदे मातरम्’ ( 1906) से जुड़े रहे और आध्यात्मिक राष्ट्रवाद एवं निष्क्रिय प्रतिरोध के प्रबल प्रवक्ता थे।","लाला लाजपत राय लाहौर से प्रकाशित ‘द ट्रिब्यून’ से संबद्ध रहे और 1925 में ‘द पीपल’ साप्ताहिक आरंभ किया ; वे आर्थिक शोषण की आलोचना तथा समाज-सुधार दोनों पर बल देते थे।"]},{"s":"इतिहास","q":"भारत के विभाजन ने उसके संविधान के निर्माण को प्रभावित किया। निम्नलिखित में से कौन-सी व्यवस्थाएँ विभाजन के अनुभवों से सबसे प्रत्यक्ष रूप से संबंधित मानी जा सकती हैं?\n1. पूरे संघ के लिए एकल नागरिकता को अपनाना।\n2. अनुच्छेद 25-28 का समावेश, जो धर्म की स्वतंत्रता की गारंटी देते हैं। 8\n3. राष्ट्रपति का निर्वाचन एक निर्वाचन मंडल द्वारा।\n4. राष्ट्रपति को वित्तीय आपातकाल घोषित करने का अधिकार।","o":["केवल 1 और 2","केवल 2 और 4","केवल 1, 2 और 3","1, 2, 3 और 4"],"a":0,"e":["विभाजन के बाद उत्पन्न प्रवास और नागरिकता संबंधी जटिल प्रश्नों के कारण संविधान निर्माताओं ने पृथक/दोहरी नागरिकता के स्थान पर संपूर्ण संघ के लिए ‘एकल नागरिकता’ की व्यवस्था अपनाई।","विभाजन की सांप्रदायिक हिंसा के अनुभव से अल्पसंख्यकों को विश्वास दिलाने हेतु अनुच्छेद 25-28 में धर्म की स्वतंत्रता की स्पष्ट संवैधानिक गारंटी दी गई तथा पृथक निर्वाचन प्रणाली त्याग दी गई।","राष्ट्रपति का निर्वाचक मंडल द्वारा अप्रत्यक्ष चुनाव संघीय-संसदीय शासन प्रणाली की देन है, इसका विभाजन से कोई संबंध नहीं है।","वित्तीय आपातकाल (अनुच्छेद 360) भारत शासन अधिनियम, 1935 तथा अमेरिकी महामंदी के अनुभव से प्रेरित है।"]},{"s":"इतिहास","q":"निम्नलिखित कथन ( A) और कारण ( R) पर विचार कीजिए। इनमें से कौन-सा कथन सत्य है? कथन ( A): 1947 का भारतीय स्वतंत्रता अधिनियम अद्वितीय था क्योंकि इसने रियासतों पर ब्रिटिश सर्वोपरिता को पूरी तरह समाप्त कर दिया, जिससे वे कानूनी रूप से स्वतंत्र हो गइ± कि भारत या पाकिस्तान में शामिल हों या स्वतंत्र रहें। कारण ( R): यह ब्रिटिशों की एक सोची-समझी रणनीति थी ताकि दक्षिण एशिया को “बाल्कनाइज्ड” (छोटे-छोटे टुकड़ों में बंटा) और राजनीतिक रूप से अस्थिर बनाया जा सके, जिससे वह ब्रिटिश आर्थिक और सैन्य प्रभाव पर निर्भर बना रहे।","o":["(A) और ( R) दोनों सत्य हैं, और ( R), (A) का सही स्पष्टीकरण है।","(A) और ( R) दोनों सत्य हैं, लेकिन ( R), (A) का सही स्पष्टीकरण नहीं है।","(A) सत्य है, लेकिन ( R) असत्य है।","(A) असत्य है, लेकिन ( R) सत्य है।"],"a":2,"e":["भारतीय स्वतंत्रता अधिनियम, 1947 ने रियासतों पर ब्रिटिश सर्वोपरिता समाप्त कर दी, जिससे वे विधिक दृष्टि से भारत या पाकिस्तान में विलय अथवा स्वतंत्र रहने को स्वतंत्र हो गइ± – अतः कथन ( A) सत्य है।","सर्वोपरिता की समाप्ति ब्रिटिश सत्ता के हस्तांतरण का एक विधिक परिणाम थी ; यह दक्षिण एशिया के ‘बाल्कनीकरण’ की कोई घोषित या सुनियोजित रणनीति नहीं थी।","इसके विपरीत लॉर्ड माउंटबेटन ने 25 जुलाई 1947 को नरेंद्र मंडल में रियासतों को स्वतंत्र रहने के स्थान पर किसी एक अधिराज्य में विलय की स्पष्ट सलाह दी थी।","अतः कारण ( R) असत्य है और सही विकल्प है – ( A) सत्य है, किंतु ( R) असत्य है।"]},{"s":"इतिहास","q":"सिंधु घाटी सभ्यता की अर्थव्यवस्था के संदर्भ में निम्नलिखित कथनों पर विचार कीजिए। निम्न में से कौन-सा/से कथन सही नहीं है/हैं?\n1. हड़प्पावासी छोटे भारों के लिए द्विआधारी प्रणाली और बड़े भारों के लिए दशमलव प्रणाली का प्रयोग करते थे, जो उनके उन्नत गणितीय ज्ञान को दर्शाता है।\n2. ‘ नृत्य करती हुई लड़की’ की मूर्ति कांस्य (ताँबा और टिन का मिश्रधातु) से बनी है, जो उनकी लॉस्ट-वैक्स कास्टिंग (लुप्त मोम ढलाई) तकनीक में दक्षता को दर्शाती है।\n3. उन्होंने लाजवर्द (लैपिस लाजुली) अफगानिस्तान के शोर्तुगई से आयात किया और कपास के वस्त्र मेसोपोटामिया को निर्यात किए, जिसे मेलुह्हा कहा जाता था।","o":["केवल 1 और 2","केवल 2 और 3","केवल 3","इनमें से कोई नहीं"],"a":2,"e":["हड़प्पाई बाट छोटे मानों में द्विआधारी क्रम ( 1, 2, 4, 8, 16, 32...) तथा बड़े मानों में दशमलव गुणकों में बढ़ते थे – अतः कथन 1 सही है।","मोहनजोदड़ो से प्राप्त ‘नृत्य करती लड़की’ की प्रतिमा कांस्य (ताँबा रू टिन) की है और लुप्त-मोम ( Lost-wax) ढलाई तकनीक का उत्कृष्ट उदाहरण है – अतः कथन 2 भी सही है।","मेसोपोटामियाई अभिलेखों में ‘मेलुह्हा’ नाम सिंधु/हड़प्पा क्षेत्र के लिए प्रयुक्त हुआ था, मेसोपोटामिया के लिए नहीं–","लाजवर्द बदख्शां (अफगानिस्तान) से आता था और शोर्तुगई वहाँ स्थित हड़प्पाई व्यापारिक चौकी थी।"]},{"s":"इतिहास","q":"हर्षवर्धन के शासनकाल की जानकारी के स्रोतों के संबंध में निम्नलिखित कथनों पर विचार कीजिएः\n1. पुलकेशिन द्वितीय का ऐहोल अभिलेख प्रशस्ति-शैली में विवरण प्रस्तुत करता है, जो हर्षचरित में उल्लिखित हर्ष की साहित्यिक उपलब्धियों की पुष्टि करता है।\n2. ह्वेनसांग का ‘सी-यू-की’ हर्ष साम्राज्य की सामाजिक-आर्थिक और प्रशासनिक परिस्थितियों का अमूल्य स्रोत है, यद्यपि यह नर्मदा तट पर हुई हर्ष की पराजय के बारे में मौन है।\n3. बाणभट्ट का ‘हर्षचरित’, एक काव्यात्मक जीवनी होने के कारण, प्रशंसात्मक और आदर्शीकृत चित्र प्रस्तुत करता है और इसे पुरातात्विक तथा विदेशी विवरणों के साथ आलोचनात्मक रूप से परखा जाना चाहिए। उपरोक्त में से कौन-सा/कौन-से कथन सही है/हैं?","o":["केवल 1 और 2","केवल 2 और 3","केवल 3","केवल 1 और 3"],"a":1,"e":["ऐहोल अभिलेख ( 634 ई-, कवि रविकीर्ति रचित) पुलकेशिन द्वितीय द्वारा हर्ष की पराजय का उल्लेख करता है ; यह हर्ष की साहित्यिक उपलब्धियों की पुष्टि नहीं करता – अतः कथन 1 गलत है। 9","ह्वेनसांग का यात्रा-वृत्तांत ‘सी-यू-की’ हर्षकालीन समाज, अर्थव्यवस्था, न्याय एवं प्रशासन का बहुमूल्य स्रोत है, किंतु नर्मदा-तट पर हुई हर्ष की पराजय पर मौन है – कथन 2 सही है।","बाणभट्ट का ‘हर्षचरित’ आख्यायिका/काव्य शैली में लिखी प्रशस्तिपरक जीवनी है, इसलिए इसका मूल्यांकन पुरातात्विक साक्ष्यों तथा विदेशी विवरणों से मिलाकर करना आवश्यक है – कथन 3 सही है।"]},{"s":"इतिहास","q":"कर्नाटक में 12 वीं शताब्दी में बसवन्ना द्वारा स्थापित वीरशैव/लिंगायत आंदोलन के संबंध में निम्नलिखित कथनों पर विचार कीजिएः उपरोक्त में से कौन-सा/कौन-से कथन सही है/हैं?\n1. इसने वेदों और जाति व्यवस्था के अधिकार को कठोरता से अस्वीकार किया, सामाजिक समानता और मंदिर-आधारित पूजा के परित्याग का समर्थन किया।\n2. इसका केंद्रीय अनुष्ठान “इष्टलिंग” धारण करना था, जो एक व्यक्तिगत लिंग था और शिव से व्यक्ति के प्रत्यक्ष संबंध का प्रतीक था, जिससे पुजारियों की मध्यस्थता की आवश्यकता समाप्त हो जाती थी।\n3. आंदोलन का आर्थिक दर्शन “कायक” ईमानदार श्रम और अपनी आय का एक हिस्सा समुदाय को दान करने पर बल देता था, जिससे एक आत्मनिर्भर सामाजिक व्यवस्था का निर्माण होता था।","o":["केवल 1 और 2","केवल 2 और 3","केवल 1 और 3","1, 2 और 3"],"a":3,"e":["बसवन्ना ( 12 वीं शताब्दी, कर्नाटक) द्वारा प्रवर्तित वीरशैव/लिंगायत आंदोलन ने वेदों की सत्ता, जाति-व्यवस्था तथा मंदिर-आधारित कर्मकांडी पूजा का खुला विरोध कर सामाजिक समानता का पक्ष लिया।","अनुयायी शरीर पर ‘इष्टलिंग’ धारण करते हैं, जो शिव से व्यक्ति के प्रत्यक्ष संबंध का प्रतीक है और पुरोहित की मध्यस्थता को अनावश्यक बना देता है।","‘कायक’ सिद्धांत ईमानदार श्रम को ही पूजा मानता है, तथा ‘दासोह’ के रूप में आय का एक अंश समुदाय को अर्पित करने पर बल देता है।","आंदोलन के विचार ‘वचन’ साहित्य में संकलित हैं।"]},{"s":"इतिहास","q":"भारतीय मंदिर मूर्तिकला में स्त्री आकृतियों की प्रतीकात्मकता के संबंध में निम्नलिखित कथनों पर विचार कीजिएः नीचे दिए गए कथनों में से कौन-सा/से सही है/हैं?\n1. मंदिर की दीवारों पर पाई जाने वाली शिलाबालिकाएँ या नायिकाएँ केवल सजावटी तत्व हैं, जो सांसारिक दरबारी जीवन को दर्शाती हैं और उनका कोई धार्मिक या प्रतीकात्मक महत्व नहीं है।\n2. दीदारगंज की यक्षिणी मौर्य काल की एक प्रकृति-देवी का उत्कृष्ट उदाहरण है, जो उर्वरता और समृद्धि का प्रतीक है तथा बाद की मंदिर-नायिकाओं की पूर्ववर्ती है।\n3. सप्तमातृका (सात मातृ देवियाँ) पैनल, जो पाल कला की विशेषता है, एक समन्वित संप्रदाय का प्रतिनिधित्व करता है जहाँ पुरुष देवताओं की ऊर्जा को स्त्री सहचरियों के रूप में व्यक्त किया जाता है, जिन्हें अक्सर उग्र और शक्तिशाली रूप में चित्रित किया जाता है।","o":["केवल 1 और 2","केवल 2 और 3","केवल 1 और 3","1, 2 और 3"],"a":1,"e":["शिलाबालिकाएँ/नायिकाएँ केवल सजावटी नहीं हैं ; शिल्प-ग्रंथों में इन्हें मंगलकारी एवं शुभ-सूचक प्रतीक माना गया है, अतः कथन 1 गलत है।","दीदारगंज (पटना) से प्राप्त चामरधारिणी यक्षिणी मौर्यकालीन चमकदार पॉलिश वाली प्रतिमा है, जो उर्वरता व समृद्धि की प्रकृति-देवी है और बाद की मंदिर-नायिकाओं की पूर्ववर्ती मानी जाती है – कथन 2 सही।","सप्तमातृका पैनल ब्राह्मी, माहेश्वरी, कौमारी, वैष्णवी, वाराही, इन्द्राणी व चामुण्डा को दर्शाते हैं, जिनमें पुरुष देवताओं की शक्ति स्त्री-:प में व्यक्त होती है और वे प्रायः उग्र रूप में उकेरी जाती हैं – कथन 3 सही।"]},{"s":"इतिहास","q":"भारत के राज्यचिह्न में लिखे गए शब्द “सत्यमेव जयते” किससे लिए गए हैं?","o":["मुण्डकोपनिषद्","सामवेद","ऋग्वेद","रामायण"],"a":0,"e":["भारत के राजचिह्न के नीचे देवनागरी में अंकित “सत्यमेव जयते” मुण्डकोपनिषद् से लिया गया है।","मूल श्लोक है – “सत्यमेव जयते नानृतं, सत्येन पन्था विततो देवयानः”, अर्थात् सत्य की ही विजय होती है, असत्य की नहीं।","यह राजचिह्न सारनाथ स्थित अशोक के सिंह-स्तंभ शीर्ष पर आधारित है, जिसे भारत सरकार ने 26 जनवरी, 1950 को अंगीकार किया।","इसका लोकप्रिय हिंदी प्रयोग पं- मदन मोहन मालवीय ने प्रचलित किया था।"]},{"s":"इतिहास","q":"प्रसिद्ध ‘दस राजाओं का युद्ध’ किस नदी के तट पर लड़ा गया था?","o":["गंगा","ब्रह्मपुत्र","कावेरी","परुष्णी"],"a":3,"e":["‘दशराज्ञ युद्ध’ अर्थात् दस राजाओं के युद्ध का वर्णन ऋग्वेद के 7वें मंडल में मिलता है।","यह युद्ध परुष्णी नदी के तट पर लड़ा गया, जिसे आज रावी नदी कहा जाता है।","एक ओर भरत जन के राजा सुदास तथा उनके पुरोहित वसिष्ठ थे, दूसरी ओर दस जनों का संघ था जिसका संबंध विश्वामित्र से जोड़ा जाता है।","इस युद्ध में सुदास विजयी हुए और भरत कुल की श्रेष्ठता स्थापित हुई, जिससे आगे चलकर ‘भारत’ नाम की परंपरा जुड़ी।"]},{"s":"इतिहास","q":"पुराणों में अशोक के बाद उल्लेखित ‘छः पुफट ऊँचे राजा’ कमजोर शासकों की एक श्रृंखला को संदर्भित करते हैं। उनके विशाल साम्राज्य पर नियंत्रण रखने में असमर्थता का प्रमुख परिणाम निम्नलिखित में से कौन-सा था? 10","o":["मौर्य सेना का तत्काल और पूर्ण पतन, जिसके कारण आसान आक्रमण हुए।","शक्तिशाली प्रांतीय राज्यपालों का उदय, जिन्होंने स्वतंत्र रूप से कार्य करना शु: कर दिया और कलिंग जैसे प्रमुख प्रांत अलग हो गए।","कठोर भूमि कर प्रणाली के विरुद्ध व्यापक किसान विद्रोह, जिसने राजवंश को उखाड़ पेंफका।","अंतिम मौर्य राजा का स्वेच्छा से पदत्याग, ताकि पुष्यमित्र शुंग को शांतिपूर्ण सत्ता हस्तांतरण हो सके।"],"a":1,"e":["अशोक के बाद के उत्तराधिकारी दुर्बल थे और विशाल मौर्य साम्राज्य पर केंद्रीय नियंत्रण ढीला पड़ गया।","इसका सबसे बड़ा परिणाम यह हुआ कि प्रांतीय शासक (कुमार/महामात्र) स्वतंत्र रूप से व्यवहार करने लगे।"]},{"s":"इतिहास","q":"चंद्रगुप्त द्वितीय के राज में भारत घूमने आए चीनी यात्री फाहियान (प-ाफाशियान) के हिसाब से, नीचे दिए गए विकल्पों में से गुप्त समाज के बारे में कौन-सी बात सही है?\n1. मृत्युदंड को आधिकारिक रूप से समाप्त कर दिया गया था।\n2. ‘ चांडालों’ (अस्पृश्य) की स्थिति दयनीय थी और उन्हें गाँवों के बाहर रहना पड़ता था।\n3. प्रशासन सामान्यतः उदार था और लोग समृद्ध थे।","o":["केवल 1 और 2","केवल 2 और 3","केवल 1 और 3","1, 2 और 3"],"a":1,"e":["फाहियान ने चाण्डालों की दयनीय दशा का उल्लेख किया – वे गाँव के बाहर रहते थे और आते समय लकड़ी पीटकर संकेत देते थे।","उसने प्रशासन को उदार तथा जनता को सुखी व समृद्ध बताया ; कर हल्के थे और आवागमन सुरक्षित था।","किंतु उसने मृत्युदंड के ‘आधिकारिक रूप से समाप्त’ किए जाने की बात नहीं कही – उसने केवल दंडों के हल्के व अर्थदंड-प्रधान होने का वर्णन किया।","फाहियान चंद्रगुप्त द्वितीय (विव्रफमादित्य) के शासनकाल में भारत आया था। उसकी प्रसिद्ध पुस्तक/यात्रा-वृत्तांत का नाम ‘फो-क्यो-की’ है।"]},{"s":"इतिहास","q":"बुलंद दरवाजा निम्नलिखित में से किस जिले में स्थित है?","o":["भोपाल","दिल्ली","हैदराबाद","आगरा"],"a":3,"e":["बुलंद दरवाजा उत्तर प्रदेश के आगरा जिले में फतेहपुर सीकरी में स्थित है।","इसका निर्माण अकबर ने 1601 ई- में गुजरात विजय की स्मृति में करवाया था।","लगभग 54 मीटर ऊँचा यह विश्व के सबसे ऊँचे प्रवेश द्वारों में गिना जाता है।","फतेहपुर सीकरी 1986 से यूनेस्को विश्व धरोहर स्थल में सम्मिलित है। 37. सूची- I सूची- II सूची- I को सूची- II से मिलाइए और दिए गए कूट का उपयोग करके सही उत्तर चुनिए।"]},{"s":"इतिहास","q":"अबुल फ़”ाल A. एक आलोचनात्मक, रूढ़िवादी विवरण, जो अकबर के धार्मिक नवाचारों के प्रति गहरी शत्रुता रखता है।\n2. बदायूँनी B. राज्य-शास्त्र और राजसत्ता पर एक सैद्धांतिक ग्रंथ, जिसमें उलेमा की सर्वोच्चता पर बल दिया गया है।\n3. ि”ायाउद्दीन C. अकबर की बरनी महिमामंडित, विस्तृत और आधिकारिक जीवनी, जो मुगल इतिहासलेखन की उत्कृष्ट कृति है।\n4. नि”ाामुद्दीन D. एक व्यापक अहमद इतिहास, जो अकबर के शासन तक भारत की सभी मुस्लिम वंशों को कवर करता है और राजनीतिक घटनाओं पर केंद्रित है।","o":["1-C, 2-A, 3-B, 4-D","1-D, 2-C, 3-A, 4-B","1-C, 2-B, 3-D, 4-A","1-A, 2-D, 3-B, 4-C"],"a":0,"e":["अबुल फ़”ाल का ‘अकबरनामा’ अकबर की आधिकारिक एवं महिमामंडित जीवनी है।","अब्दुल कादिर बदायूँनी का ‘मुन्तखब-उत-तवारीख’ अकबर की धार्मिक नीतियों का कट्टर आलोचक है ि”ायाउद्दीन बरनी का ‘फतवा-ए-जहाँदारी’ राजत्व एवं राज्य-शास्त्र पर सैद्धांतिक ग्रंथ है जिसमें उलेमा की श्रेष्ठता है","नि”ाामुद्दीन अहमद का ‘तबकात-ए-अकबरी’ अकबर तक के सभी मुस्लिम वंशों का राजनीतिक इतिहास है। 38. सूची- I सूची- II संत/आंदोलन मुख्य विचार (सिद्धांत/ संबद्ध) A. चैतन्य महाप्रभु 1. कायक और इष्टलिंग B. गुरु नानक 2. वहदत-उल-वजूद (अस्तित्व की एकता) C. बसवन्ना 3. जपुजी साहिब D. इब्न अरबी 4. संकीर्तन (आनंदमय सार्वजनिक भजन-गान) (a) A-4, B-3, C-1, D-2 (b) A-1, B-4, C-3, D-2 11 (c) A-4, B-2, C-1, D-3 (d) A-3, B-4, C-2, D-1 Ans. (a) A-4, B-3, C-1, D-2 व्याख्याः","चैतन्य महाप्रभु ने कृष्णभक्ति में सामूहिक नाम-संकीर्तन को केंद्र में रखा।","गुरु नानक की वाणी ‘जपुजी साहिब’ है, जो गुरु ग्रंथ साहिब का आरंभिक भाग है।"]},{"s":"इतिहास","q":"गर्भगृह को एक आदिम ब्रह्मांडीय गुफा के रूप में देखने की अवधारणा का सबसे प्रारंभिक वास्तुशिल्पीय रूप आजीविकों और बौद्धों के चट्टानों को काटकर बनाए गए चैत्य कक्षों में मिलता है, जो हिंदू मंदिर से पहले के हैं।\n2. स्तूप का गुंबद (अंड) ब्रह्मांडीय पर्वत मेरु का प्रतीकात्मक प्रतिनिधित्व था और उसकी दृढ़ता निर्वाण की अंतिमता को दर्शाती थी, जिससे प्रदक्षिणा (परिक्रमा) एक शारीरिक क्रिया के बजाय एक आंतरिक, ध्यानपूर्ण क्रिया बन गई।\n3. स्तूप के हार्मिका से उत्तर भारतीय मंदिर के शिखर तक का संक्रमण क्षैतिज से ऊध्र्वाधर बलाघात की ओर परिवर्तन को दर्शाता है, जो सांसारिक स्तर से दिव्य लोक की ओर आरोहण का प्रतीक है।","o":["केवल 1 और 2","केवल 2 और 3","केवल 1 और 3","1, 2 और 3"],"a":2,"e":["कथन 1 सही है – बराबर की आजीविक गुफाएँ तथा बौद्ध चैत्यगृह गुफा-प्रतीक के आरंभिक उदाहरण हैं, जो परवर्ती गर्भगृह की पूर्वपीठिका बने।","कथन 3 भी सही है – स्तूप की क्षैतिज संरचना से नागर शैली के ऊध्र्वगामी शिखर की ओर संक्रमण ऊध्र्व आरोहण का प्रतीक है।","कथन 2 गलत है क्योंकि प्रदक्षिणा स्तूप के चारों ओर की जाने वाली वास्तविक शारीरिक परिक्रमा है, केवल आंतरिक/ मानसिक क्रिया नहीं। 40. प्रारंभिक वैदिक काल के राजनीतिक जीवन के संबंध में निम्नलिखित कथनों पर विचार कीजिए। नीचे दिए गए कथनों में से कौन-सा/से सही है/हैं?"]},{"s":"इतिहास","q":"राजा का अधिकार पूर्ण और निर्विवाद था, क्योंकि उसे पृथ्वी पर दिव्य प्रतिनिधि माना जाता था।\n2. सभा और समिति दो सबसे शक्तिशाली सभाएँ थीं, जबकि विदथ का महत्व नगण्य था और वह केवल आर्थिक भूमिका निभाती थी।\n3. ‘ गविष्टि’ एक राजकीय सैन्य अभियान का शब्द था, जो ऋग्वैदिक राजनीति में स्थायी सेना की केंद्रीय भूमिका को दर्शाता है।","o":["केवल 1 और 2","केवल 2 और 3","केवल 3","इनमें से कोई नहीं"],"a":3,"e":["कथन 1 गलत – ऋग्वैदिक राजन् की शक्ति सभा-समिति व जन से नियंत्रित थी ; राजा का दैवीकरण उत्तर वैदिक काल की विशेषता है।","कथन 2 गलत – विदथ ऋग्वेद की प्राचीनतम एवं सर्वाधिक उल्लिखित संस्था थी, जिसके धार्मिक, सैनिक व सामाजिक कार्य भी थे।","कथन 3 गलत – ‘गविष्टि’ का शाब्दिक अर्थ ‘गायों की खोज’ अर्थात् गोधन के लिए संघर्ष है ; ऋग्वैदिक काल में कोई स्थायी सेना नहीं थी। 41. मध्यकालीन भारत में ‘जीतल’ शब्द किसके लिए प्रयुक्त होता था? (a) भार (b) आहार (c) सिक्का (d) खेल Ans. (c) सिक्का व्याख्याः","‘जीतल’ दिल्ली सल्तनत काल का ताँबे का सिक्का था।","इल्तुतमिश ने शुद्ध अरबी सिक्का पद्धति चलाकर चाँदी का ‘टंका’ और ताँबे का ‘जीतल’ प्रचलित किया।"]},{"s":"इतिहास","q":"इसे विद्रोहियों की एक परिषद ने तैयार किया था और इसमें ब्रिटिशों को भारत से बाहर निकालकर मुगल सम्राट के अधीन एक हिंदू राज्य स्थापित करने की स्पष्ट घोषणा की गई थी।\n2. इसमें हिंदुओं और मुसलमानों दोनों से सम्राट के ध्वज के नीचे एकजुट होने की अपील की गई थी, तथा सभी धर्मों का सम्मान करने और धार्मिक प्रथाओं में हस्तक्षेप न करने का वादा किया गया था।\n3. इस घोषणा ने सिपाही विद्रोह से एक राजनीतिक युद्ध की ओर औपचारिक परिवर्तन को चिह्नित किया, जिसका उद्देश्य ब्रिटिश-पूर्व सत्ता संरचनाओं की पुनस्र्थापना था। ऊपर दिए गए कथनों में से कौन-सा/से सही नहीं है/हैं?","o":["केवल 1","केवल 2 और 3","केवल 1 और 3","केवल 3"],"a":0,"e":["बहादुर शाह ”ाफ़र की घोषणा में कहीं भी ‘हिंदू राज्य’ की स्थापना की बात नहीं थी।","इसके विपरीत घोषणा में हिंदू-मुस्लिम एकता तथा सभी धर्मों के सम्मान का आह्नान था, अतः कथन 1 गलत है।","कथन 2 सही है – घोषणा में धार्मिक रीति-रिवाजों में हस्तक्षेप न करने का वचन दिया गया।","कथन 3 भी सही है – यह घोषणा विद्रोह को सैनिक असंतोष से राजनीतिक संघर्ष में बदलने का प्रतीक बनी ; अतः उत्तर विकल्प (a) 46. 1857 के विद्रोह के संदर्भ में वहाबी आंदोलन की भूमिका से संबंधित निम्नलिखित कथनों पर विचार कीजिएः"]},{"s":"इतिहास","q":"वहाबी, सैयद अहमद बरेलवी के नेतृत्व में, 1857 से पहले ही पंजाब में सिखों के विरुद्ध जिहाद छेड़े हुए थे, जिससे ब्रिटिश विरोधी उग्रवादी भावना पहले से ही मौजूद थी।\n2. 1857 के बाद ब्रिटिशों ने वहाबी आंदोलन को सीधे विद्रोह से जोड़ दिया और बड़े पैमाने पर दमन अभियान चलाया, जिसका चरम सैयद अहमद बरेलवी के उत्तराधिकारी विलायत अली के मुकदमे में देखा गया।\n3. वहाबियों ने दिल्ली और लखनऊ में विद्रोह के लिए वैचारिक आधार और कई प्रमुख सैन्य नेता प्रदान किए। ऊपर दिए गए कथनों में से कौन-सा/ से सही है/हैं?","o":["केवल 1 और 3","केवल 2 और 3","1, 2 और 3","केवल 1"],"a":0,"e":["सैयद अहमद बरेलवी ने 1826 से पंजाब में सिख सत्ता के विरुद्ध जिहाद चलाया और 1831 में बालाकोट में मारे गए – कथन 1 सही है।","वहाबियों ने 1857 में दिल्ली व लखनऊ के विद्रोह को वैचारिक बल तथा कई सैन्य नेता दिए – कथन 3 सही है।","कथन 2 गलत है, क्योंकि विलायत अली की मृत्यु 1852 में ही हो चुकी थी ; 1857 के बाद अंबाला व पटना षड्यंत्र मुकदमे अन्य नेताओं पर चले। 47. निम्नलिखित का मिलान करें और तदनुसार सही विकल्प चुनें। A. अभिज्ञानशाकुंतलम B. पंचतंत्र C. मुद्राराक्षस D. अमरकोश"]},{"s":"इतिहास","q":"चाणक्य की कूटनीति पर आधारित राजनीतिक नाटक\n2. संस्कृत भाषा का एक शब्दकोश या कोश\n3. आम जीवन पर केंद्रित एक कथा संग्रह\n4. कालिदास द्वारा रचित एक प्रेम नाटक","o":["A-4, B-3, C-1, D-2","A-4, B-3, C-2, D-1","A-1, B-4, C-3, D-2","A-4, B-1, C-3, D-2"],"a":0,"e":["‘अभिज्ञानशाकुंतलम’ कालिदास रचित प्रसिद्ध शृंगार/प्रेम नाटक है।","‘पंचतंत्र’ (विष्णु शर्मा) सामान्य जन-जीवन एवं व्यवहार-नीति पर केंद्रित कथा-संग्रह है।","‘मुद्राराक्षस’ (विशाखदत्त) चाणक्य की कूटनीति पर आधारित राजनीतिक नाटक है।","‘अमरकोश’ (अमरसिंह) संस्कृत का प्रसिद्ध शब्दकोश है। 48. दिल्ली सल्तनत काल की वास्तुकला में सांस्कृतिक संश्लेषण के संदर्भ में निम्नलिखित कथनों पर विचार कीजिएः"]},{"s":"इतिहास","q":"सच्चे मेहराब और गुम्बद का प्रयोग भारत में तुर्क शासकों द्वारा शु: किया गया, जिसने इंडो-इस्लामिक या इंडो-सारसेनिक शैली की शुरुआत की। 13\n2. प्रारंभिक सल्तनत इमारतों में मुख्यतः स्थानीय रूप से प्राप्त पत्थरों और मलबे का उपयोग किया गया तथा ध्वस्त मंदिरों की सामग्री को पुनः प्रयुक्त किया गया।\n3. पिएत्रा दुरा (रंगीन पत्थरों की जड़ाई का काम) का उपयोग तुगलक वास्तुकला की एक विशिष्ट विशेषता थी, जो उनके स्मारकों को एक विशिष्ट फारसी रंग प्रदान करती थी। उपरोक्त में से कौन-सा/कौन-से कथन सही है/हैं?","o":["केवल 1","केवल 1 और 2","केवल 2 और 3","1, 2 और 3"],"a":1,"e":["तुर्क शासकों ने भारत में वास्तविक मेहराब ( true arch) और गुम्बद की तकनीक लाकर इंडो-इस्लामिक शैली की नींव रखी – कथन 1 सही।","कुव्वत-उल-इस्लाम मस्जिद जैसी आरंभिक इमारतें स्थानीय पत्थर व ध्वस्त मंदिरों की सामग्री से बनीं – कथन 2 सही।","पिएत्रा दुरा (रंगीन पत्थरों की जड़ाई) मुगल वास्तुकला, विशेषकर शाहजहाँ काल की विशेषता है, तुगलक की नहीं – कथन 3 गलत। 49. उत्तर-मौर्य और प्रारंभिक ऐतिहासिक शैल-निर्मित वास्तुकला के संबंध में निम्नलिखित कथनों पर विचार कीजिए। इनमें से कौन-सा/से सही है/हैं?"]},{"s":"इतिहास","q":"चैत्य का मुख्य उद्देश्य अनुष्ठानिक पूजा और सभा था, जबकि विहार मूलतः भिक्षुओं के लिए एक आवासीय परिसर या मठ था।\n2. प्रारंभिक शैल-निर्मित चैत्य और विहार पूरी तरह से निराकार थे और महायान संप्रदाय के प्रभाव में ही बुद्ध की मूर्तिमान प्रतिमाओं को सम्मिलित करना शु: किया गया।\n3. शैल-निर्मित संरचनाओं की स्थापत्य विशेषताएँ, जैसे मुड़े हुए लकड़ी जैसे बीमों का अनुकरण और छतों में रिब वॉल्टिंग, यह संकेत देती हैं कि वे लकड़ी के निर्माण के प्रा:पों पर आधारित थीं।","o":["केवल 1","केवल 1 और 3","केवल 2 और 3","1, 2 और 3"],"a":3,"e":["चैत्य पूजा-स्थल (स्तूप सहित प्रार्थना कक्ष) तथा विहार भिक्षुओं का आवास-गृह होता था।","हीनयान काल की आरंभिक गुफाएँ अनिकोनिक (प्रतीकात्मक) थीं ; बुद्ध की मूर्तियाँ महायान के प्रभाव से आइ±।","कार्ले, भाजा व अजंता की गुफाओं में लकड़ी जैसी बीम व रिब वॉल्ट काष्ठ-निर्माण की नकल हैं – कथन 3 सही। 50. ‘शाक्य’ और ‘कोलिय’ महाजनपदों की राजनीतिक व्यवस्था, जहाँ बुद्ध का जन्म हुआ था, उसे सबसे अच्छे तरीके से इस प्रकार बताया जा सकता है? (a) वंशानुगत राजतंत्र, जिसमें राजा मंत्रिपरिषद की सहायता से शासन करता था। (b) जनजातीय अल्पतंत्र या गण-संघ, जहाँ नेतृत्व संबंधों (कुटुम्ब/वंश) पर आधारित था और निर्णय सार्वजनिक सभा में लिए जाते थे। (c) अनेक जनजातियों (महाजनपदों) का महासंघ, जिसका नेतृत्व एक निर्वाचित प्रधान प्रमुख करता था, जिसके पास सैन्य मामलों में पूर्ण अधिकार होते थे। (d) एक अधीनस्थ राज्य, जो कोसल जैसे अधिक शक्तिशाली राजतंत्रीय महाजनपद को कर अर्पित करता था, जबकि आंतरिक स्वायत्तता बनाए रखता था। Ans. (b) जनजातीय अल्पतंत्र या गण-संघ, जहाँ नेतृत्व संबंधों (कुटुम्ब/वंश) पर आधारित था और निर्णय सार्वजनिक सभा में लिए जाते थे। व्याख्याः","शाक्य (कपिलवस्तु) और कोलिय (रामग्राम) गण-संघ अर्थात् गणतंत्रात्मक/ कुल-अल्पतंत्रीय व्यवस्थाएँ थीं।","इनमें सत्ता किसी एक वंशानुगत राजा में नहीं, बल्कि कुलीन ‘राजाओं’ के समूह में निहित थी।"]},{"s":"इतिहास","q":"उपयोगितावादी बनाम प्राच्यवादी (ओरिएंटलिस्ट)ः शिक्षा नीति को लेकर संघर्ष, जहाँ मैकाले के “मिनट ऑन एजुकेशन” (एंग्लिसिस्ट दृष्टिकोण) ने जोन्स और कोलब्रुक द्वारा संस्कृत और अरबी शिक्षा के प्रोत्साहन पर विजय प्राप्त की।\n2. इल्बर्ट बिल विवाद ( 1883): ब्रिटिशों के गहरे नस्लीय अहंकार को उजागर करता है, क्योंकि इसने भारतीय न्यायाधीशों को यूरोपियनों पर मुकदमा चलाने की अनुमति देने का प्रस्ताव रखा था, जिसका भारत में यूरोपीय समुदाय ने तीव्र विरोध किया।\n3. क्रिमिनल ट्राइब्स एक्ट ( 1871): “ सेफ्टी वाल्व” सिद्धांत का प्रत्यक्ष परिणाम, जिसके तहत संपूर्ण समुदायों को “जन्मजात अपराधी” घोषित कर दिया गया ताकि संभावित विद्रोहियों को पहले ही दबाया जा सके। ऊपर दिए गए युग्मों में से कौन-सा/से सही मेल खाते हैं?","o":["केवल 1 और 2","केवल 2 और 3","केवल 1 और 3","1, 2 और 3"],"a":0,"e":["1835 के मैकाले के ‘मिनट ऑन एजुकेशन’ ने आंग्लवादी दृष्टिकोण को विजयी बनाया और प्राच्यवादियों (जोन्स, कोलब्रुक) की संस्कृत-अरबी नीति पीछे छूट गई।","इल्बर्ट बिल ( 1883) ने भारतीय न्यायाधीशों को यूरोपीयों पर मुकदमा चलाने का अधिकार देना चाहा, जिसका श्वेत समुदाय ने उग्र विरोध किया।","‘सेफ्टी वाल्व’ सिद्धांत कांग्रेस की स्थापना ( 1885) से जुड़ा है, क्रिमिनल ट्राइब्स एक्ट ( 1871) से नहीं। 56. प्रारंभिक वर्धन (पुष्यभूति) वंश के संबंध में निम्नलिखित कथनों पर विचार कीजिएः"]},{"s":"इतिहास","q":"वे प्रारंभ में गुप्त साम्राज्य के सामंत थे।\n2. कन्नौज के मौखरी वंश के साथ विवाह-संबंध प्रभाकरवर्धन के समय संपन्न हुआ।\n3. वंश की राजधानी थानेसर हर्ष के शासनकाल में कभी भी प्राथमिक राजनीतिक केंद्र के रूप में प्रतिस्थापित नहीं हुई। उपरोक्त में से कौन-सा/ कौन-से कथन सही है/हैं?","o":["केवल 1","केवल 1 और 2","केवल 2 और 3","1, 2 और 3"],"a":1,"e":["पुष्यभूति (वर्धन) वंश आरंभ में गुप्त साम्राज्य के अधीन सामंत था।","प्रभाकरवर्धन ने अपनी पुत्री राज्यश्री का विवाह कन्नौज के मौखरि शासक गृहवर्मन से किया।","हर्ष ने बाद में अपनी राजधानी थानेसर से हटाकर कन्नौज स्थानांतरित कर दी, अतः कथन 3 गलत है। 57. निम्नलिखित कथनों पर विचार कीजिए और विश्लेषण कीजिए कि इनमें से कौन-सा सही है? कथन ( A): फ़िरो”ा शाह तुगलक का इक्ता (या जागीर) को वंशानुगत बनाने का निर्णय उनके पूर्ववर्तियों की नीतियों से एक बड़ा विचलन था और उनकी मृत्यु के बाद सल्तनत के तीव्र विघटन का प्रमुख कारण बना। कारण ( R): यह नीति पुराने, स्थापित तुर्की अमीरों (अयान-ए-कुदाम) की निष्ठा प्राप्त करने की एक सोची-समझी रणनीति थी, जिन्हें अलाउद्दीन खिलजी और मुहम्मद बिन तुगलक जैसे शासकों की कठोर और केंद्रीकृत नीतियों ने अलग-थलग कर दिया था। (a) (A) और ( R) दोनों सही हैं, और ( R), (A) का सही स्पष्टीकरण है। (b) (A) और ( R) दोनों सही हैं, लेकिन ( R), (A) का सही स्पष्टीकरण नहीं है। (c) (A) सही है, लेकिन ( R) गलत है। (d) (A) गलत है, लेकिन ( R) सही है। Ans. (a) (A) और ( R) दोनों सही हैं, और ( R), (A) का सही स्पष्टीकरण है। व्याख्याः","फ़िरो”ा शाह तुगलक ने इक्ता तथा सैनिक पदों को वंशानुगत बना दिया, जो पूर्ववर्ती केंद्रीकृत नीति से बड़ा विचलन था – कथन ( A) सही।","इससे प्रशासन व सेना की कार्यक्षमता घटी और उसकी मृत्यु के बाद सल्तनत तेजी से बिखर गई।"]},{"s":"इतिहास","q":"ये अभिलेख केवल राजाओं और रानियों द्वारा ही करवाए गए थे, इनमें व्यापारियों, श्रेणियों या आम लोगों, जिनमें महिलाएँ भी शामिल हैं, के दान का कोई प्रमाण नहीं मिलता।\n2. ये अभिलेख विश्वकर्मा और नगरश्रेष्ठिन जैसी श्रेणियों के अस्तित्व और उनकी भूमिका का महत्त्वपूर्ण प्रमाण देते हैं, जिन्होंने न केवल पूरे मंदिरों बल्कि द्वार, स्तंभ और फर्श की पट्टियों जैसे छोटे घटकों को भी वित्तपोषित किया।\n3. बोधगया के अभिलेख विशेष रूप से महत्त्वपूर्ण हैं क्योंकि वे विभिन्न दक्षिण-पूर्व एशियाई राज्यों से प्राप्त दानों को दर्ज करते हैं, जो प्रारंभिक अंतर-क्षेत्रीय बौद्ध संबंधों को दर्शाते हैं। 15","o":["केवल 1 और 2","केवल 2 और 3","केवल 1 और 3","1, 2 और 3"],"a":1,"e":["सांची के अभिलेखों में राजाओं के साथ-साथ व्यापारियों, शिल्पियों, भिक्षुओं तथा अनेक महिलाओं के दान भी दर्ज हैं, अतः कथन 1 गलत है।","इन अभिलेखों से श्रेणियों (गिल्ड) द्वारा तोरण, स्तंभ व फर्श-पट्टिका जैसे छोटे-छोटे भागों के वित्तपोषण का प्रमाण मिलता है – कथन 2 सही।","बोधगया के अभिलेखों में श्रीलंका, म्यांमार सहित विविध क्षेत्रों से आए दान अंकित हैं, जो अंतर-क्षेत्रीय बौद्ध संपर्क दर्शाते हैं – कथन 3 सही। 59. निम्नलिखित युग्मों पर विचार करें। दिए गए युग्मों में से कितने सही ढंग से मेल खाते हैं? (महाजनपद – राजधानी – वर्तमान क्षेत्र)"]},{"s":"इतिहास","q":"गांधार – तक्षशिला – पंजाब, पाकिस्तान\n2. अवंति – उज्जैन – मालवा, मध्य प्रदेश\n3. चेदी – सुक्तिमति – बुंदेलखंड, उत्तर प्रदेश/मध्य प्रदेश\n4. कंबोज – राजगीर – बिहार","o":["केवल एक युग्म","केवल दो युग्म","केवल तीन युग्म","सभी चार युग्म"],"a":2,"e":["गांधार की राजधानी तक्षशिला थी, जो आज पाकिस्तान के पंजाब क्षेत्र में है।","अवंति की राजधानी उज्जयिनी (उत्तरी भाग) थी, जो मालवा, मध्य प्रदेश में है।","चेदी की राजधानी सुक्तिमती (शक्तिमती) थी, जो बुंदेलखंड क्षेत्र में स्थित थी।","कंबोज की राजधानी राजपुर/हाटक थी, राजगीर नहीं (राजगीर मगध की राजध ाई","उरणी सिंचाई"],"a":0,"e":["तमिलनाडु में प्राचीन काल से टैंक (तालाब /‘एरी’) सिंचाई प्रणाली सर्वाधिक प्रचलित रही है।","यहाँ की कठोर चट्टानी भूमि तथा मौसमी नदियाँ कुओं व नहरों की तुलना में टैंक सिंचाई को अधिक उपयुक्त बनाती हैं।","चोल शासकों ने अनेक विशाल एरी बनवाए, जिनमें वीरानम एरी सर्वाधिक प्रसिद्ध है।","आज भी राज्य के सिंचित क्षेत्र का बड़ा भाग इन्हीं परंपरागत टैंकों से सिंचित होता है। 25"]},{"s":"भूगोल","q":"भारत में किस राज्य के अंतर्गत सबसे अधिक वन क्षेत्र आता है?","o":["ओडिशा","अरुणाचल प्रदेश","छत्तीसगढ़","मध्य प्रदेश"],"a":3,"e":["भारत वन स्थिति रिपोर्ट के अनुसार क्षेत्रफल की दृष्टि से सर्वाधिक वन क्षेत्र मध्य प्रदेश में पाया जाता है।","इसी कारण मध्य प्रदेश को ‘भारत का वन प्रदेश’ भी कहा जाता है ; यहाँ सागौन व साल वन प्रमुख हैं।","इसके बाद क्रमशः अरुणाचल प्रदेश, छत्तीसगढ़ तथा ओडिशा का स्थान आता है।","प्रतिशत की दृष्टि से सर्वाधिक वन आवरण वाले क्षेत्र लक्षद्वीप एवं मि”ाोरम हैं।"]},{"s":"भूगोल","q":"अवैध रेत खनन के कारण गंभीर पारिस्थितिक क्षति के लिए विशेष रूप से उत्तर प्रदेश और बिहार में किस भारतीय नदी को सबसे अधिक राष्ट्रीय ध्यान प्राप्त हुआ है?","o":["कृष्णा","पालार","गंगा","नर्मदा"],"a":2,"e":["उत्तर प्रदेश एवं बिहार में अवैध रेत खनन के कारण गंगा नदी सर्वाधिक चर्चा में रही है।","इससे नदी तल का क्षरण, नदी तटों की अस्थिरता तथा जैव विविधता की गंभीर हानि हुई है।","गंगा डॉल्फिन, घड़ियाल एवं कछुओं जैसे संकटग्रस्त जीवों के आवास पर सीधा प्रभाव पड़ा है।","राष्ट्रीय हरित अधिकरण ( NGT) ने इस विषय पर कई बार हस्तक्षेप किया है ; नमामि गंगे कार्यक्रम भी गंगा नदी के संरक्षण हेतु चलाया जा रहा है।"]},{"s":"भूगोल","q":"अतिशहरीकरण की अवधारणा का तात्पर्य किससे है?","o":["शहरी वृद्धि का औद्योगिक या आर्थिक विकास से ते”ा होना","महानगरीय शासन में वृद्धि","शहरी क्षेत्रों में कम जनसंख्या घनत्व","शहरी अवसंरचना की तीव्र वृद्धि"],"a":0,"e":["अतिशहरीकरण वह स्थिति है जिसमें नगरों की जनसंख्या वृद्धि वहाँ के औद्योगिक एवं आर्थिक विकास से अधिक ते”ा होती है।","इससे रो”ागार, आवास, जल, परिवहन तथा स्वच्छता जैसी बुनियादी सेवाओं पर अत्यधिक दबाव पड़ता है।","परिणामस्व:प मलिन बस्तियों (स्लम), बेरो”ागारी एवं प्रदूषण की समस्याएँ बढ़ती हैं।","यह प्रायः ग्रामीण क्षेत्रों के ‘प्रतिकर्ष कारकों’ से उत्पन्न प्रवास का परिणाम होता है और विकासशील देशों में अधिक देखा जाता है।"]},{"s":"भूगोल","q":"निम्नलिखित में से कौन-सी नदी एक रिफ्ट घाटी (रिफ्ट वैली) बनाती है?","o":["नर्मदा","ब्रह्मपुत्र","यमुना","गंगा"],"a":0,"e":["नर्मदा नदी विंध्य एवं सतपुड़ा श्रेणियों के बीच एक भ्रंश घाटी (रिफ्ट वैली) से होकर बहती है।","भ्रंश घाटी का निर्माण दो समानांतर भ्रंशों के बीच भूखंड के नीचे धँसने से होता है।","इसी कारण नर्मदा तथा तापी नदियाँ डेल्टा न बनाकर ज्वारनदमुख बनाती हैं।","नर्मदा अमरकंटक (मध्य प्रदेश) से निकलकर पश्चिम की ओर बहते हुए खंभात की खाड़ी ( अरब सागर )में गिरती है।","असम में ब्रह्मपुत्र नदी की घाटी एक रैम्प घाटी (Ramp Valley) मानी जाती है।"]},{"s":"भूगोल","q":"जनगणना 2011 के अनुसार, हिंदी के बाद भारत में किस भाषा समूह के सबसे अधिक वक्ता थे?","o":["बंगाली","तमिल","तेलुगु","मराठी"],"a":0,"e":["जनगणना 2011 के भाषा आँकड़ों के अनुसार हिंदी प्रथम स्थान पर (लगभग 43. 63%) थी।","दूसरे स्थान पर बांग्ला भाषा रही, जिसके वक्ता कुल जनसंख्या का लगभग 8.03% थे।","इसके बाद क्रमशः मराठी, तेलुगु, तमिल और गुजराती का स्थान आता है।","बांग्ला मुख्यतः पश्चिम बंगाल, त्रिपुरा एवं असम के कुछ भागों में बोली जाती है।"]},{"s":"भूगोल","q":"“करेवा” शब्द भारत के किस भौगोलिक क्षेत्र के संदर्भ में प्रयोग होता है?","o":["पूर्वी हिमालय","कश्मीर घाटी","पश्चिमी घाट","कच्छ का रण"],"a":1,"e":["‘करेवा’ कश्मीर घाटी में पाए जाने वाले हिमोढ़ (मोरेन) युक्त झील निक्षेपों को कहते हैं।","ये मिट्टी, गाद एवं रेत के मोटे निक्षेप हैं जो प्राचीन झील के सूखने से बने।","करेवा मृदा केसर की खेती के लिए प्रसिद्ध है। जम्मू-कश्मीर का पंपोर (Pampore) क्षेत्र केसर उत्पादन का मुख्य केंद्र होने के कारण ‘केसर का कटोरा’ (Saffron Bowl of Kashmir) कहलाता है।","इन पर बादाम, अखरोट, सेब एवं अन्य शीतोष्ण फलों की खेती भी होती है।","भारत म ंे लवै फे स्टा्र इन (सरावे रीय) झीला ंे के पम्र ख्ु ा उदाहरण वलू र व डल (जम्म-ू कश्मीर), 26 लाके टक (मणिपरु ) आरै पगंै ागंे त्सा े (लद्दाख) है।"]},{"s":"भूगोल","q":"निम्नलिखित में से कौन-सा देश अपनी निम्न ऊँचाई के कारण समुद्र स्तर में वृद्धि के प्रति सबसे अधिक संवेदनशील है?","o":["चिली","मालदीव","इथियोपिया","नेपाल"],"a":1,"e":["मालदीव विश्व का सबसे निचला देश है, जिसकी औसत ऊँचाई समुद्र तल से लगभग 1.5 मीटर ही है।","समुद्र स्तर में मामूली वृद्धि से भी इसके अनेक प्रवाल द्वीपों के डूबने का खतरा उत्पन्न हो जाता है।","इसी कारण मालदीव जलवायु परिवर्तन संबंधी वैश्विक मंचों पर सबसे मुखर देशों में से एक रहा है।","नेपाल और इथियोपिया स्थलरुद्ध तथा ऊँचाई वाले देश हैं, जबकि चिली की तटरेखा ऊँचे भूभाग वाली है।"]},{"s":"भूगोल","q":"निम्नलिखित में से कौन-से हिमनद और उनके संबंधित क्षेत्र सही रूप से मेल खाते हैं?\n1. बाल्टोरो ः गिलगित बाल्टिस्तान (काराकोरम)\n2. चोराबाड़ी हिमनद ः पीर पंजाल\n3. गंगोत्री ः लद्दाख\n4. बारा शिगरीः हिमाचल प्रदेश","o":["केवल 1 और 2","केवल 2 और 3","केवल 3 और 4","केवल 1 और 4"],"a":3,"e":["बाल्टोरो हिमनद काराकोरम श्रृंखला (गिलगित-बाल्टिस्तान) में स्थित है।","यह ध्रुवीय क्षेत्रों के बाहर के सबसे लंबे हिमनदों में से एक है।","बारा शिगरी हिमनद हिमाचल प्रदेश की लाहौल घाटी में है और यह राज्य का सबसे बड़ा हिमनद है, अतः चौथा युग्म भी सही है।","चोराबाड़ी हिमनद उत्तराखंड में केदारनाथ के निकट है, पीर पंजाल श्रृंखला में नहीं।","गंगोत्री हिमनद भी उत्तराखंड में स्थित है, लद्दाख में नहीं ; इसलिए केवल 1 और 4 सही हैं।"]},{"s":"भूगोल","q":"2001-2011 के दशक में निम्नलिखित में से किस भारतीय राज्य ने नकारात्मक जनसंख्या वृद्धि दर दर्ज की?","o":["सिक्किम","नागालैंड","गोवा","हिमाचल प्रदेश"],"a":1,"e":["2011 की जनगणना के अनुसार नागालैंड एकमात्र ऐसा राज्य रहा जिसकी दशकीय जनसंख्या वृद्धि दर ऋणात्मक रही।","यहाँ 2001-2011 के दशक में वृद्धि दर लगभग - 0.58% दर्ज की गई।","इसका एक बड़ा कारण 1991-2001 के दशक में असामान्य रूप से अत्यधिक दर्ज की गई वृद्धि दर का सुधार माना जाता है।","सिक्किम, गोवा तथा हिमाचल प्रदेश में इस दशक में जनसंख्या वृद्धि दर धनात्मक रही।"]},{"s":"भूगोल","q":"दामोदर नदी को सामान्यतः किस नाम से जाना जाता है?","o":["बंगाल का दुःख","बिहार का दुःख","छत्तीसगढ़ की जीवनरेखा","पूर्वी घाट की नदी"],"a":0,"e":["दामोदर नदी भारत के झारखंड और पश्चिम बंगाल राज्यों से होकर बहने वाली एक बहुत ही प्रमुख और वेगवान नदी है। अतीत में इस नदी में आने वाली विनाशकारी बाढ़ के कारण मैदानी इलाकों में भारी मात्रा में जान-माल का भयानक नुकसान होता था। इसी भयंकर तबाही और बर्बादी के कारण दामोदर नदी को पारंपरिक रूप से ‘बंगाल का दुःख’ या ‘बंगाल का शोक’ कहा जाता था।","स्वतंत्र भारत की पहली बहुउद्देशीय नदी घाटी परियोजना, दामोदर घाटी निगम (DVC) के अंतर्गत विभिन्न बाँधों के निर्माण से इस नदी की विनाशकारी बाढ़ पर प्रभावी नियंत्रण पा लिया गया है।"]},{"s":"भूगोल","q":"हिमालय उत्तर से दक्षिण की ओर कितनी समानांतर पर्वतमालाओं में विभाजित है?","o":["दो","तीन","चार","पाँच"],"a":1,"e":["भौगोलिक संरचना और उत्पत्ति के आधार पर, हिमालय पर्वत श्रृंखला को उत्तर से दक्षिण की ओर मुख्य रूप से तीन समानांतर श्रेणियों में बाँटा गया है। सबसे उत्तरी श्रृंखला को ‘महान हिमालय’ या हिमाद्रि कहा जाता है, जिसमें माउंट एवरेस्ट जैसी दुनिया की सबसे ऊँची और बर्फीली चोटियाँ स्थित हैं। इसके दक्षिण में ‘मध्य हिमालय’ या हिमाचल श्रेणी स्थित है, जो पर्यटकों के बीच अपने खूबसूरत पहाड़ी पर्यटन स्थलों (हिल स्टेशनों) के लिए बहुत प्रसिद्ध है। सबसे दक्षिणी और बाहरी श्रृंखला को ‘शिवालिक’ कहा जाता है, जो इन तीनों में अपेक्षाकृत कम ऊँचाई वाली और सबसे नवीन पर्वत श्रेणी मानी जाती है।"]},{"s":"भूगोल","q":"सोन नदी अंततः किस प्रमुख नदी में जाकर मिलती है?","o":["यमुना","गंगा","नर्मदा","ताप्ती"],"a":1,"e":["सोन नदी बिहार में गंगा की सबसे बड़ी दक्षिणी (दाहिने तट की) सहायक नदी है।","सोन नदी मध्य भारत की एक बहुत ही महत्त्वपूर्ण नदी है, जिसका उद्गम मध्य प्रदेश के अनूपपुर जिले में स्थित अमरकंटक के पठार से होता है।","यह प्रायद्वीपीय भारत के पठारी क्षेत्र से निकलकर उत्तर दिशा की ओर बहने वाली पवित्र गंगा नदी की सबसे बड़ी और प्रमुख 27 दक्षिणी सहायक नदियों में से एक मानी जाती है।","मध्य प्रदेश, उत्तर प्रदेश और झारखंड के ऊबड़-खाबड़ पहाड़ी इलाकों से तेजी से गुजरते हुए, यह नदी बिहार राज्य में प्रवेश करती है और समतल मैदानी भागों में बहती है। अंततः, सोन नदी बिहार के पटना जिले के पास दानापुर के समीप विशाल गंगा नदी में मिलकर अपने संपूर्ण जल को उसी मुख्य धारा में पूरी तरह विसर्जित कर देती है।"]},{"s":"भूगोल","q":"भारत में कौन-सा राज्य गोदावरी नदी का प्राथमिक स्रोत है?","o":["मध्य प्रदेश","महाराष्ट्र","कर्नाटक","तेलंगाना"],"a":1,"e":["दक्षिण भारत की जीवन रेखा कही जाने वाली गोदावरी नदी का उद्गम स्थल महाराष्ट्र राज्य के नासिक जिले में स्थित त्र्यंबकेश्वर की पहाड़ियाँ हैं।","यह गंगा के बाद भारत की दूसरी सबसे लंबी नदी है और अपने विशाल आकार व विस्तार के कारण इसे बड़े आदर से ‘दक्षिण गंगा’ भी कहा जाता है।","गोदावरी बेसिन पूरे प्रायद्वीपीय भारत का सबसे बड़ा नदी बेसिन है, जो लाखों किसानों की कृषि और सिंचाई आवश्यकताओं के लिए अत्यंत महत्त्वपूर्ण है।"]},{"s":"भूगोल","q":"कौन-सा राज्य खासी और गारो पहाड़ियों के लिए प्रसिद्ध है?","o":["अरुणाचल प्रदेश","मेघालय","मि”ाोरम","नागालैंड"],"a":1,"e":["खासी और गारो पहाड़ियाँ पूर्वोत्तर भारत के खूबसूरत मेघालय राज्य की प्रमुख भौगोलिक, प्राकृतिक और सांस्कृतिक पहचान का एक बहुत बड़ा हिस्सा हैं।","इन पहाड़ियों का नामकरण मुख्य रूप से यहाँ सदियों से निवास करने वाली प्रमुख मातृसत्तात्मक जनजातियों- गारो, खासी और जयंतिया के नाम पर किया गया है।","यह पूरा पहाड़ी क्षेत्र अपनी असाधारण प्राकृतिक सुंदरता, दुनिया की सर्वाधिक वर्षा (जैसे मासिनराम में) और अत्यंत समृद्ध जैव विविधता के लिए प्रसिद्ध है।","भूवैज्ञानिक दृष्टिकोण से ये पहाड़ियाँ हिमालय का हिस्सा न होकर, प्राचीन प्रायद्वीपीय पठार का ही एक सुदूर पूर्वी विस्तार मानी जाती हैं।"]},{"s":"भूगोल","q":"निम्नलिखित में से कौन-सी नदी माजुली, जो विश्व का सबसे बड़ा नदी द्वीप है, का निर्माण करती है?","o":["गंगा","ब्रह्मपुत्र","गोदावरी","यमुना"],"a":1,"e":["माजुली द्वीप पूर्वोत्तर भारत के असम राज्य में शक्तिशाली और विशालकाय ब्रह्मपुत्र नदी के ठीक मध्य में स्थित एक बहुत ही बड़ा और प्रसिद्ध नदी द्वीप है।","इसे आधिकारिक रूप से गिनीज बुक द्वारा विश्व का सबसे बड़ा नदी द्वीप और असम सरकार द्वारा देश का पहला पूर्ण द्वीप जिला घोषित किया गया है।","यह सुंदर द्वीप नव-वैष्णव संस्कृति और असमिया सांस्कृतिक नवजागरण का एक प्रमुख केंद्र है, जिसे महान संत श्रीमंत शंकरदेव ने स्थापित किया था।","वर्तमान समय में यह अद्वितीय पारिस्थितिक तंत्र ब्रह्मपुत्र नदी में आने वाली बाढ़ और निरंतर हो रहे मृदा कटाव के कारण गंभीर खतरे का सामना कर रहा है।"]},{"s":"भूगोल","q":"मेघालय पठार में वनस्पति क्यों नहीं प
