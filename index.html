रोजन","कार्बन","हाइड्रोजन","मैग्नीशियम"],"a":1,"e":["प्रकाश संश्लेषण में पौध्े वायुमंडलीय CO 2 से कार्बन ग्रहण कर ग्लूकोज बनाते हैं।","इस प्रकार अकार्बनिक कार्बन जैव रूप में परिवर्तित होकर कार्बन चक्र का भाग बनता है। 133","समीकरणः 6CO + 6H O → C H O 2 2 6 12 6 + 6O (सूर्य प्रकाश एवं क्लोरोफिल की 2 उपस्थिति में)।","यही कार्बन खाद्य श्रृंखला के माध्यम से समस्त जीवों तक पहुँचता है।","प्रकाश संश्लेषण की प्रक्रिया में मुक्त होने वाली ऑक्सीजन गैस, जल (H O) के 2 अपघटन से प्राप्त होती है।"]},{"s":"सामान्य विज्ञान","q":"व्यावसायिक शहद उत्पादन के लिए निम्न में से कौन सी स्थानीय किस्म की मधुमक्खियों का उपयोग किया जाता है?","o":["एपिस सेराना इंडिका","एपिस मजोरा","एपिस मेलिफेरा","एपिस नेक्टेरियस"],"a":0,"e":["एपिस सेराना इंडिका को भारतीय मौन कहा जाता है और यह स्थानीय किस्म है।","यह मध्ुमक्खी पालन (एपीकल्चर) में व्यावसायिक शहद उत्पादन हेतु व्यापक रूप से प्रयुक्त होती है।","एपिस मेलिफेरा इटैलियन मध्ुमक्खी है, जो विदेशी (आयातित) किस्म है।","एपिस डोरसेटा (शैल मौन) एवं एपिस फ्लोरिया अन्य भारतीय प्रजातियाँ हैं।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन श्वसन तंत्र का एक भाग है?","o":["महाध्मनी","ग्रसनी","मूत्रमार्ग","पित्त वाहिका"],"a":1,"e":["ग्रसनी (फैरिंक्स) नासा गुहा एवं स्वरयंत्र के बीच स्थित श्वसन तंत्र का भाग है।","यह वायु एवं भोजन दोनों के मार्ग के रूप में कार्य करती है।","महाध्मनी परिसंचरण तंत्र तथा मूत्रमार्ग उत्सर्जन तंत्र का भाग है।","पित्त वाहिका पाचन तंत्र से संबंध्ति है।","ग्रसनी के पास एपिग्लोटिस (Epiglottis) नामक एक उपास्थि का ढक्कन होता है, जो भोजन निगलते समय उसे श्वास नली में जाने से रोकता है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से किस तरीके से एच-आई-वी- (HIV) फैल सकता है?","o":["एक संक्रमित व्यक्ति को गले लगाना","संक्रमित व्यक्ति से हाथ मिलाना","संक्रमित व्यक्ति के साथ भोजन या बर्तन साझा करना","संक्रमित व्यक्ति के साथ यौन संपर्क"],"a":3,"e":["एच-आई-वी- मुख्यतः असुरक्षित यौन संपर्क से फैलता है।","यह संक्रमित रक्त चढ़ाने, संक्रमित सुई के प्रयोग तथा माँ से शिशु में भी संचारित होता है।","गले लगाने, हाथ मिलाने, साथ भोजन करने या बर्तन साझा करने से यह नहीं फैलता।","यह विषाणु शरीर की प्रतिरक्षा प्रणाली की CD4 कोशिकाओं को नष्ट करता है।","नोट - सीडी4 (CD4) कोशिकाएं सफेद रक्त कोशिकाओं (White Blood Cells) का एक महत्वपूर्ण प्रकार हैं, जो हमारे शरीर की प्रतिरक्षा प्रणाली (Immune System) को मजबूत रखने और संक्रमणों से लड़ने में मदद करती हैं। इन्हें ‘टी-हेल्पर कोशिकाएं’ (T-helper cells) भी कहा जाता है।"]},{"s":"सामान्य विज्ञान","q":"एक शार्क के पास नहीं ------- है।","o":["गलफड़े","स्विम ब्लैडर","उदर मुँह","प्लेकॉइड स्केल"],"a":1,"e":["शार्क कॉन्ड्रिक्थीज वर्ग की उपास्थिमय मछली है, जिसमें वायु आशय (स्विम ब्लैडर) नहीं होता। इसी कारण डूबने से बचने के लिए शार्क को निरंतर गतिशील रहना पड़ता है।","इसका बड़ा तैलीय यकृत उत्प्लावकता बनाए रखने में सहायता करता है।","शार्क में गलफड़े, अध्र (उदर) मुख तथा प्लेकॉइड शल्क उपस्थित होते हैं।","शार्क का कंकाल पूरी तरह से उपास्थि (Cartilage) का बना होता है, इसमें हिîóयां (Bones) नहीं पाई जाती हैं। 134"]},{"s":"सामान्य विज्ञान","q":"सैलामैंडर किस वर्ग का है?","o":["उभयचर","कोर्डेटा","पशु","सलामंद्रा"],"a":0,"e":["सैलामैंडर एम्फीबिया (उभयचर) वर्ग का प्राणी है।","उभयचर जल एवं स्थल दोनों में रह सकते हैं तथा इनकी त्वचा नम व ग्रंथियुक्त होती है।","मेंढक, टोड एवं सैलामैंडर इस वर्ग के प्रमुख उदाहरण हैं।","कोर्डेटा एक संघ (फाइलम) है, वर्ग नहींऋ अतः सही उत्तर उभयचर है।","उभयचर असमतापी जीव होते हैं और इनके हृदय में तीन कक्ष होते हैं। 6"]},{"s":"स्टेटिक जी-के-","q":"गुड़ी पड़वा के त्योहार के दौरान महाराष्ट्र में कौन-सा नृत्य किया जाता है?","o":["डांडिया","लावणी","गरबा","ले”ाीम"],"a":3,"e":["गुड़ी पड़वा महाराष्ट्र का नववर्ष पर्व है, जो चैत्र शुक्ल प्रतिपदा को मनाया जाता है।","लेि”ाम ( Lezim) महाराष्ट्र की पारंपरिक वीर/ऊर्जावान लोक-नृत्य शैली है, जिसमें लेि”ाम नामक वाद्य के साथ सामूहिक नृत्य किया जाता है, ले”ाीम में नर्तक धातु की छोटी झांझ लगे लकड़ी के उपकरण (ले”ाीम) को ढोल की ताल पर बजाते हुए सामूहिक नृत्य करते हैं।","चैत्र-बैसाख में उगादी–आंध्र प्रदेश-कर्नाटक, गुड़ी पड़वा–महाराष्ट्र, संवत्सर पाड़वो–गोवा, पहला बैशाख–पश्चिम बंगाल, पुथांडु–तमिलनाडु, विशु–केरल, नवरेह–कश्मीर और पना संक्रांति–ओडिशा में नववर्ष पर्व मनाए जाते हैं।"]},{"s":"स्टेटिक जी-के-","q":"मकर संक्रांति का क्या महत्व है?","o":["यह मानसून के आगमन को दर्शाता है","यह शीतकालीन संक्रांति को दर्शाता है","यह सूर्य के मकर राशि में प्रवेश का उत्सव है","यह देवी सरस्वती को समर्पित है"],"a":2,"e":["उत्तरायण सूर्य के उत्तर दिशा की ओर आभासी गमन को कहा जाता है।","22-21 दिसंबर (शीत अयनांत) को सूर्य की सीधी किरणे मकर रेखा पर पड़ती हैंऋ इसके बाद सूर्य का आभासी गमन उत्तर की ओर होने लगता है।","खगोलीय दृष्टि से शीत अयनांत से ग्रीष्म अयनांत (लगभग 21 जून) तक की अवधि उत्तरायण कहलाती है। स्टेटिक जी-के- Exercise","मकर संक्रााति (14-15 जनवरी) सूर्य के निरयन मकर राशि में प्रवेश से संबंधित है। दोनों तिथियों में अंतर का प्रमुख कारण अयन-चंलन (Precession) एवं अयनांश है।"]},{"s":"स्टेटिक जी-के-","q":"कर्नाटिक संगीत में वायलिन के उपयोग को लोकप्रिय बनाने का श्रेय किसे जाता है?","o":["द्वारम वेंकटस्वामी नायडू","मुत्तुस्वामी दीक्षितर","त्यागराज","बालुस्वामी दीक्षितर"],"a":3,"e":["बालुस्वामी दीक्षितर, प्रसिद्ध वाग्गेयकार मुत्तुस्वामी दीक्षितर के छोटे भाई तथा रामस्वामी दीक्षितर के पुत्र थे।","उन्होंने मद्रास में यूरोपीय बैंड से वायलिन वादन सीखा था।","18 वीं शताब्दी के अंत में उन्होंने इसे कर्नाटक संगीत की संगत में अपनाया।","इसी कारण वायलिन को दक्षिण भारतीय शास्त्रीय संगीत में स्थापित करने का श्रेय उन्हें दिया जाता है।","बालुस्वामी दीक्षितर का संबंध एट्टयापुरम दरबार से भी था।"]},{"s":"स्टेटिक जी-के-","q":"उत्तर-पूर्वी भारत का कौन-सा त्योहार, जिसे लोकप्रिय रूप से “ 100 ढोल नृत्य” के नाम से जाना जाता है?","o":["वांगला","हॉर्नबिल उत्सव","मोआत्सु","सागा दावा"],"a":0,"e":["वांगला मेघालय की गारो जनजाति का प्रमुख फसल कटाई पर्व है। यह त्योहार मिसी सलजोंग नामक स्थानीय देवता के सम्मान में मनाया जाता है।","मोत्सु आओ जनजाति का प्रमुख कृषि एवं फसल उत्सव है, जो मई में मनाया जाता है। 135","सागा दावा तिब्बती बौद्ध समुदाय का प्रमुख धार्मिक त्योहार है, जो बुद्ध के जन्म, ज्ञान प्राप्ति और महापरिनिर्वाण की स्मृति में मनाया जाता है।","हॉर्नबिल महोत्सव नागालैंड का प्रमुख सांस्कृतिक उत्सव है, जिसे “ Festival of Festivals” कहा जाता है।"]},{"s":"स्टेटिक जी-के-","q":"रस्किन बॉन्ड को उनकी पुस्तक ‘अवर ट्रीज स्टिल ग्रो इन देहरा’ के लिए साहित्य अकादमी पुरस्कार किस वर्ष प्राप्त हुआ?","o":["1975","1980","1992","2005"],"a":2,"e":["उन्हें 1992 में ‘अवर ट्री”ा स्टिल ग्रो इन देहरा’ के लिए साहित्य अकादमी पुरस्कार (अंग्रेजी भाषा हेतु) मिला।","उनकी प्रमुख कृतियों में ‘द रूम ऑन द रूफ’ (पहली),‘द ब्लू अम्ब्रेला’, ‘ए फ्लाइट ऑफ पिजन्स’ और ‘रस्ट्री’ श्रृंखला शामिल हैं।"]},{"s":"स्टेटिक जी-के-","q":"दिल्ली सल्तनत काल के दौरान हिंदू और इस्लामी वास्तुकला परंपराओंं के समन्वय का सबसे अच्छा उदाहरण कौन-सा स्थापत्य संरचना है?","o":["दिलवाड़ा जैन मंदिर","लिंगराज मंदिर","सूर्य मंदिर, कोणार्वफ","कुतुब मीनार"],"a":3,"e":["कुतुब मीनार मेहरौली, दिल्ली में स्थित UNESCO विश्व धरोहर है इसकी निर्माण श्रृं","खला इस प्रकार है – पहली मंि”ाल – कुतुबुद्दीन ऐबक, अगली तीन – इल्तुतमिश, 5 वीं/ऊपरी मंि”ाल – फ़िरो”ा शाह तुगलक।","इसकी उचाई 72.5 मीटर, आधार-व्यास 14.32 मीटर, शीर्ष-व्यास 2.75 मीटर है और इसमें 5 मंि”ालें हैं।","कुतुब मीनार एवं उसके स्मारक 1993 में UNESCO विश्व धरोहर सूची में शामिल हुए परिसर में कुव्वत-उल-इस्लाम मस्जिद और अलाई दरवा”ाा प्रमुख हैं।"]},{"s":"स्टेटिक जी-के-","q":"“थाईपुसम” त्योहार, जिसमें भक्त त्वचा में कांटे और हुक्स चुभाकर अपनी श्रद्धा व्यक्त करते हैं, मुख्य रूप से किस देवता से जुड़ा है?","o":["भगवान मुरुगन","भगवान हनुमान","भगवान विष्णु","भगवान शिव"],"a":0,"e":["थाईपुसम भगवान मुरुगन (कार्तिकेय) को समर्पित तमिल त्योहार है।","यह तमिल माह ‘थाई’ की पूर्णिमा को पुष्य नक्षत्र में मनाया जाता है।","भक्त कावड़ी उठाकर तथा शरीर में हुक-भाले चुभाकर प्रायश्चित एवं मन्नत पूरी करते हैं।","थाईपुसम का प्रमुख आयोजन तमिलनाडु के पालनी स्थित अरुल्मिगु दंडायुधपाणि स्वामी मंदिर में होता है। यह भगवान मुरुगन के छह प्रमुख निवासों (अरुपडै वीड़ु) में से एक है।"]},{"s":"स्टेटिक जी-के-","q":"अजंता गुफा चित्रोंं का मुख्य धार्मिक विषय क्या था?","o":["शैव धर्म","बौद्ध धर्म","वैष्णव धर्म","जैन धर्म"],"a":1,"e":["महाराष्ट्र के औरंगाबाद जिले में स्थित अजंता की गुफाएँ का निर्माण लगभग दूसरी शताब्दी ईसा पूर्व से पाँचवीं-छठी शताब्दी ईस्वी तक हुआ।","अजंता की गुफाएँ 1983 में UNESCO विश्व धरोहर सूची में शामिल हुइ±।","अजंता गुफा 1: पद्मपाणि बोधिसत्व का प्रसिद्ध चित्र तथा अनेक जातक कथाओं के चित्र मिलते हैं।","अजंता गुफा 17: बुद्ध का कपिलवस्तु लौटना इसका अत्यंत प्रसिद्ध चित्र है।","अजंता में कुल 29 शैल-कट गुफाएँ हैं। (कुछ स्रोतों में 30 दिया गया है)"]},{"s":"स्टेटिक जी-के-","q":"2023 तक किस देश ने सबसे अधिक बार एशियाई खेलोंं की मे”ाबानी की है?","o":["दक्षिण कोरिया","जापान","चीन","थाईलैंड"],"a":3,"e":["थाईलैंड ने अब तक सर्वाधिक चार बार ( 1966, 1970, 1978 तथा 1998 में) एशियाई खेलों की मेजबानी की है।","पहले एशियाई खेल 1951 में नई दिल्ली, भारत में आयोजित हुए और भार त में कुल 2 बार एशियाई गेम्स ( 1951, 1982 ) का आयोजन हुआ है । 20 वें एशियाई खेल , 2026 → आइची-नागोया, जापान।","एशियाई खेलों की शासी संस्था (ओलंपिक काउंसिल ऑफ एशिया– OCA) का मुख्यालय कुवैत सिटी, कुवैत में है।"]},{"s":"स्टेटिक जी-के-","q":"कौन-सी दवाओंं की श्रेणी आमतौर पर प्रदर्शन बढ़ाने से नहीं जुड़ी होती है, लेकिन फिर भी प्रतियोगिता में उनके मनोवैज्ञानिक प्रभावोंं के कारण प्रतिबंधित होती है?","o":["बीटा-ब्लॉकर्स","ईपीओ","स्टेरॉयड्स","क्रिएटिन"],"a":0,"e":["ये मांसपेशीय शक्ति या सहनशक्ति को सीधे नहीं बढ़ातीं, लेकिन कुछ खेलों में स्थिरता और सटीकता के कारण अनुचित लाभ दे सकती हैं।","WADA के अनुसार बीटा-ब्लॉकर्स निशानेबाजी ( Shooting) और तीरंदाजी ( Archery) सहित कुछ विशेष खेलों में प्रतिबंधित हैं ; प्रतिबंध की स्थिति खेल के अनुसार अलग हो सकती है।","EPO और एनाबॉलिक स्टेरॉयड WADA की प्रतिबंधित सूची में हैं, जबकि क्रिएटिन ( Creatine) प्रतिबंधित पदार्थों की सूची में नहीं है।","बीटा-ब्लॉकर्स हृदय गति को धीमा करने तथा कंपकंपी ( tremor) जैसे शारीरिक लक्षणों को कम करने वाली औषधियाँ हैं। 136"]},{"s":"स्टेटिक जी-के-","q":"इनमें से कौन-सी पुस्तक खुशवंत सिंह द्वारा नहीं लिखी गई थी?","o":["ट्रेन टू पाकिस्तान","द कंपनी ऑफ वीमेन",", सूटेबल बॉय","द हिस्ट्री ऑफ सिख्स"],"a":2,"e":["‘ए सूटेबल बॉय’ ( A Suitable Boy) उपन्यास विक्रम सेठ द्वारा लिखा गया है, खुशवंत सिंह द्वारा नहीं। खुशवंत सिंह की प्रसिद्ध कृतियों में ‘ट्रेन टू पाकिस्तान’, ‘द कंपनी ऑफ वीमेन’ तथा ‘ए हिस्ट्री ऑफ द सिख्स’ शामिल हैं।","साहित्य अकादमी पेफलोशिपः खुशवंत सिंह को 2010 में साहित्य अकादमी पेफलो चुना गया था।","राज्यसभाः वे अप्रैल 1980 से अप्रैल 1986 तक राज्यसभा के नामित सदस्य रहे।","पद्म सम्मानः उन्हें 1974 में पद्म भूषण और 2007 में पद्म विभूषण मिला।"]},{"s":"स्टेटिक जी-के-","q":"गेटवे ऑफ इंडिया का निर्माण किस वर्ष पूरा हुआ था?","o":["1911","1924","1931","1941"],"a":1,"e":["1948 में अंतिम ब्रिटिश सैनिक टुकड़ी इसी द्वार से भारत से रवाना हुई थी।","गेटवे ऑफ इंडिया मुंबई के अपोलो बंदर में स्थित है और इसका निर्माण 1924 में पूरा हुआ।","इसकी नींव 31 मार्च 1911 को रखी गई थी और इसका अंतिम डिजाइन जॉर्ज विटेट ने तैयार किया था।","इसकी स्थापत्य शैली इंडो-सारासेनिक है और इसकी ऊँचाई लगभग 26 मीटर है।"]},{"s":"स्टेटिक जी-के-","q":"किस भारतीय लेखक के उपन्यास ‘नार्कोपोलिस’ को, जो 1970 के दशक के बॉम्बे पर आधारित है, 2012 में मैन बुकर पुरस्कार के लिए शॉर्टलिस्ट किया गया था?","o":["चेतन भगत","जीत थायिल","विक्रम चंद्र","मनु जोसेफ"],"a":1,"e":["यह उपन्यास वर्ष 2012 के मैन बुकर पुरस्कार की शॉर्टलिस्ट में शामिल हुआ था।","इस उपन्यास की कथा मुख्यतः 1970 के दशक के बंबई (वर्तमान मुंबई) की अफ़ीम की दुनिया और उससे जुड़े पात्रों के इर्द-गिर्द बुनी गई है।","‘नार्कोपोलिस’ को वर्ष 2013 में डीएससी प्राइ”ा फॉर साउथ एशियन लिटरेचर प्रदान किया गया था।","‘नार्कोपोलिस’ ( Narcopolis) उपन्यास के लेखक जीत थायिल हैं, जो कवि एवं संगीतकार भी हैं।"]},{"s":"स्टेटिक जी-के-","q":"पहला क्रिकेट विश्व कप किस देश में और किस वर्ष आयोजित किया गया था?","o":["भारत, 1983","इंग्लैंड, 1975","ऑस्ट्रेलिया, 1987","वेस्ट इंडीज, 1979"],"a":1,"e":["1983 में भारत ने लॉड्र्स में वेस्टइंडीज को हराकर पहली बार वनडे विश्व कप का खिताब जीता।","1987 का वनडे विश्व कप पहली बार इंग्लैंड के बाहर भारत और पाकिस्तान में आयोजित किया गया तथा इसमें 50 ओवर प्रति पारी का प्रा:प अपनाया गया।","ऑस्ट्रेलिया ने सबसे अधिक 6 बार पुरुष ODI क्रिकेट विश्व कप ( 1987, 1999, 2003, 2007, 2015 और 2023) जीता है।"]},{"s":"स्टेटिक जी-के-","q":"भारतीय प्रदर्शन कलाओंं (जैसे संगीत, नृत्य, नाटक) में “रस” की अवधारणा मुख्य रूप से किस बात को दर्शाती है?","o":["रचना की संरचना","सौंंदर्यात्मक भाव या भावनात्मक सार जो दर्शकोंं में उत्पन्न होता है","लय और गति","प्रयुक्त वाद्य यंत्र का प्रकार"],"a":1,"e":["रस सिद्धांत का विस्तृत विवेचन भरत मुनि ने अपने ग्रंथ ‘नाट्यशास्त्र’ में किया है।","भरत मुनि ने आठ रसों का उल्लेख किया ; बाद में ‘शांत रस’ को सम्मिलित कर कुल नौ रस (नवरस) माने गए।","लय, ताल और वाद्य यंत्र संगीत एवं नृत्य-प्रस्तुति के तकनीकी घटक हैं ; ये रस नहीं हैं।","‘रस’ से तात्पर्य उस सौंदर्यात्मक अनुभूति अथवा भावात्मक आस्वाद से है, जो कलात्मक प्रस्तुति के माध्यम से दर्शक या श्रोता अनुभव करता है।"]},{"s":"स्टेटिक जी-के-","q":"ग्रैंड स्लैम खिताब जीतने वाली पहली भारतीय महिला कौन थी?","o":["सानिया मि”ाार","अंकिता रैना","रुश्मी चक्रवर्ती","निरुपमा संजीव"],"a":0,"e":["उन्होंने अपना पहला ग्रैंड स्लैम खिताब 2009 ऑस्ट्रेलियन ओपन में महेश भूपति के साथ मिश्रित युगल में जीता था।","सानिया मि”ाार ने कुल 6 ग्रैंड स्लैम खिताब जीते– 3 महिला युगल और 3 मिश्रित युगल में।","वह 2015 में महिला युगल की विश्व नंबर- 1 रैंकिंग हासिल करने वाली पहली भारतीय महिला भी बनीं।","सानिया मि”ाार को वर्ष 2004 में अर्जुन पुरस्कार तथा वर्ष 2006 में पद्म श्री से सम्मानित किया गया।"]},{"s":"स्टेटिक जी-के-","q":"भारतीय शास्त्रीय नृत्य के संदर्भ में “मार्गम” शब्द का क्या अर्थ है?","o":["एक भक्ति गीत","भरतनाट्यम की प्रस्तुतियोंं का संरचित क्रम","परिधान की शैली","एक नर्तक की पहली प्रस्तुति"],"a":1,"e":["‘मार्गम’ का शाब्दिक अर्थ ‘मार्ग’ अथवा ‘पथ’ है।","भरतनाट्यम में यह संपूर्ण प्रस्तुति के पारंपरिक एवं संरचित क्रम को दर्शाता है।","इसका सामान्य क्रम है–अलारिप्पु, 137 जतिस्वरम, शब्दम, वर्णम, पदम, तिल्लाना तथा मंगलम।"]},{"s":"स्टेटिक जी-के-","q":"त्रिशूर में ओणम उत्सव के दौरान प्रस्तुत की जाने वाली लोक कला “पुलिकली” में कलाकार किस जानवर का वेश धारण करते हैं?","o":["हाथी","शेर","बाघ","मोर"],"a":2,"e":["‘पुलिकली’ केरल के त्रिशूर की प्रसिद्ध लोक कला है, जिसे ‘कडुवाकली’ भी कहा जाता है।","मलयालम में ‘पुली’ का अर्थ बाघ तथा ‘कली’ का अर्थ खेल/नृत्य होता है।","इसमें कलाकार शरीर पर बाघ जैसी धारियाँ चित्रित कर नृत्य करते हैं।","यह प्रस्तुति ओणम पर्व के चौथे दिन विशेष रूप से आयोजित की जाती है।"]},{"s":"स्टेटिक जी-के-","q":"पुफटबॉल मैच में टॉस जीतने वाला खिलाड़ी किस विकल्प का चयन कर सकता है?","o":["पहले गेंद को किक करने वाले खिलाड़ी का चयन","हमले के लिए छोर का निर्णय","रेफरी का चयन","किक-ऑफ में गेंद प्राप्त करने या रक्षा करने का चयन"],"a":1,"e":["पुफटबॉल के नियमों ( IFAB – Laws of the Game, नियम 8) के अनुसार टॉस जीतने वाली टीम यह तय करती है कि वह पहले हाफ में किस गोल (छोर) पर आक्रमण करेगी।","प्रथम FIFA विश्व कपः वर्ष 1930 में उरुग्वे में आयोजित किया गया था तथा उरुग्वे इसका प्रथम विजेता बना।","FIFA का मुख्यालयः ज्यूरिख, स्विट्जरलैंड में स्थित है। वर्तमान FIFA अध्यक्षः जियानी इन्फेंटिनो हैं।","2026 FIFA विश्व कपः कनाडा, मेक्सिको और संयुक्त राज्य अमेरिका की संयुक्त मेजबानी में आयोजित हुआ। { विजेता -स्पेन, उपविजेता-अर्जेंटीना }"]},{"s":"स्टेटिक जी-के-","q":"भारत के किस राज्य में हॉर्नबिल महोत्सव मनाया जाता है और ‘हॉर्नबिल’ का क्या अर्थ है?","o":["अरुणाचल प्रदेश – एक जनजातीय नेता","मि”ाोरम – एक पूफल","नागालैंड – एक पक्षी","मणिपुर – एक पर्वत श्रृंखला"],"a":2,"e":["हॉर्नबिल महोत्सव भारत के नागालैंड राज्य में मनाया जाता है। इसे प्रतिवर्ष 1 से 10 दिसंबर तक आयोजित किया जाता है।","इसका प्रमुख आयोजन नागा हेरिटेज विलेज, किसामा, कोहिमा के निकट होता है।","वर्ष 2000 में शु: किए गए इस महोत्सव का उद्देश्य नागालैंड की समृद्ध पारंपरिक एवं सांस्कृतिक विरासत को प्रदर्शित और संरक्षित करना है ; इसे “ Festival of Festivals” भी कहा जाता है।"]},{"s":"स्टेटिक जी-के-","q":"‘कथकली’ एक शास्त्रीय नृत्य है, जो किस विशेषता के लिए जाना जाता है?","o":["कलाबा”ाी (एक्रोबेटिक्स)","समूह गायन (ग्रुप सिंगिंग)","रंग-बिरंगा मेकअप और मुखौटे","ते”ा पद संचालन (फास्ट पुफटवर्क)"],"a":2,"e":["कथकली केरल का शास्त्रीय नृत्य-नाट्य है, जो प्रायः रामायण एवं महाभारत की कथाओं पर आधारित होता है।","इसकी सर्वाधिक विशिष्ट पहचान विस्तृत रंगीन मुख-सज्जा (‘चुट्टी’), भारी वेशभूषा तथा मुखौटेनुमा श्रृंगार है। इसमें मुद्राओं (हस्त संकेत) एवं नेत्र संचालन द्वारा भाव-अभिव्यक्ति प्रमुख होती है।","रंगों से पात्र का चरित्र दर्शाया जाता है–हरा ‘पच्चा’ (नायक) तथा लाल दाढ़ी ‘चुवन्ना ताड़ी’ (खलनायक)।","कथकली के आधुनिक पुनरुत्थान का प्रमुख श्रेय वल्लथोल नारायण मेनन को दिया जाता है।"]},{"s":"स्टेटिक जी-के-","q":"किस प्रसिद्ध भारतीय धावक को उनकी अद्वितीय दौड़ क्षमता के कारण “द फ्लाइंग सिख” की उपाधि दी गई?","o":["पी- टी- उषा","सुशील कुमार","मिल्खा सिंह","विश्वनाथन आनंद"],"a":2,"e":["1960 के रोम ओलंपिक की 400 मीटर दौड़ में वे चौथे स्थान पर रहे।","उन्होंने 1958 एवं 1962 के एशियाई खेलों तथा 1958 के राष्ट्रमंडल खेलों में स्वर्ण पदक जीता।","वर्ष 1959 में उन्हें पद्मश्री से सम्मानित किया गया था।","मिल्खा सिंह को ‘फ्लाइंग सिख’ की उपाधि पाकिस्तान के तत्कालीन राष्ट्रपति अयूब खान ने दी थी।"]},{"s":"स्टेटिक जी-के-","q":"शास्त्रीय तमिल ग्रंथ ‘शिलप्पदिकारम’ (लगभग 5 वीं शताब्दी ई-) में दक्षिण भारत में मनाए जाने वाले किस प्राचीन त्योहार का उल्लेख है?","o":["पोंगल","ओणम","नवरात्रि","कार्तिगई दीपम"],"a":3,"e":["‘शिलप्पदिकारम’ संगम काल के बाद का महाकाव्य है, जिसकी रचना इलंगो अडिगल ने की थी।","इसमें तमिल क्षेत्र में मनाए जाने वाले कार्तिगई दीपम (दीप पर्व) का उल्लेख मिलता है।","कार्तिगई दीपम तमिलनाडु का सबसे प्राचीन दीपोत्सव माना जाता है, जो कार्तिक मास में मनाया जाता है।"]},{"s":"स्टेटिक जी-के-","q":"कौन-सा भारतीय राज्य खो-खो का जन्मस्थान माना जाता है?","o":["तमिलनाडु","महाराष्ट्र","पंजाब","हरियाणा"],"a":1,"e":["इसका प्राचीन रूप ‘रथेरा’ के नाम से महाराष्ट्र में खेला जाता था।","पुणे के डेक्कन जिमखाना ने सर्वप्रथम खो-खो के नियम तैयार किए।","वर्ष 1959-60 में विजयवाड़ा में प्रथम 138 अखिल भारतीय खो-खो चैंपियनशिप आयोजित हुई थी।","खो-खो में एक टीम में कुल 12 खिलाड़ी होते हैं, जिनमें से 9 खिलाड़ी मैदान पर खेलते हैं और 3 खिलाड़ी स्थानापन्न ( substitutes) होते हैं।"]},{"s":"स्टेटिक जी-के-","q":"कथक नृत्य पर किस दो प्रमुख सांस्कृतिक परंपराओंं का प्रभाव पड़ा?","o":["पर्शियन और राजपूत","मुग़ल और हिंदू","जैन और द्रविड़","तमिल और बंगाली"],"a":1,"e":["इसके प्रमुख घराने लखनऊ, जयपुर एवं बनारस हैं।","इसके प्रमुख घराने लखनऊ, जयपुर और बनारस हैं।","पंडित बिरजू महाराज कथक के प्रसिद्ध नर्तक एवं गुरु थे।","कथक केंद्र, नई दिल्ली की स्थापना 1964 में हुई।","कथक उत्तर भारत की प्रमुख शास्त्रीय नृत्य शैली है।"]},{"s":"स्टेटिक जी-के-","q":"इंडिविजुअल मेडले में तैराकी की कौन-सी क्रमबद्ध शैली का पालन किया जाना चाहिए?","o":["प्रफीस्टाइल → बैकस्ट्रोक → ब्रेस्टस्ट्रोक → फ्लाई","बैकस्ट्रोक → ब्रेस्टस्ट्रोक → फ्लाई → प्रफीस्टाइल","फ्लाई → बैकस्ट्रोक → ब्रेस्टस्ट्रोक → प्रफीस्टाइल","ब्रेस्टस्ट्रोक → फ्लाई → बैकस्ट्रोक → प्रफीस्टाइल"],"a":2,"e":["इंडिविजुअल मेडले में तैराक चार अलग-अलग तैराकी शैलियों का प्रयोग करता है।","इसका निर्धारित क्रम है–बटरफ्लाई → बैकस्ट्रोक → ब्रेस्टस्ट्रोक → प्रफीस्टाइल।","प्रत्येक शैली में कुल निर्धारित दूरी का एक-चौथाई ( ¼) भाग पूरा किया जाता है।","तैराकी की अंतरराष्ट्रीय शासी संस्था वल्र्ड एक्वेटिक्स (पूर्व नाम FINA) का मुख्यालय लॉ”ोन, स्विट्”ारलैंड में स्थित है।"]},{"s":"स्टेटिक जी-के-","q":"खो-खो में सक्रिय चे”ार पीछा करते समय वैध रूप से दिशा कैसे बदल सकता है?","o":["“खो” कहकर किसी साथी को टैग करके","केंद्रीय लेन के अंत में प्रफी ”ाोन में पोल को छूकर","पीछा करते समय केंंद्रीय लेन को पार करके","”ामीन पर दो बार पैर से थपथपाकर"],"a":1,"e":["खो-खो में सक्रिय चे”ार केंद्रीय लेन में एक ही दिशा में दौड़ने के नियम से बँधा होता है।","वह बीच में दिशा नहीं बदल सकता, अन्यथा इसे ‘फाउल’ माना जाता है।","दिशा बदलने के लिए उसे लेन के अंत में प्रफी ”ाोन तक जाकर पोल के चारों ओर घूमना पड़ता है।","इसे ‘पोल टू पोल’ नियम कहा जाता है, जो खेल की मूलभूत तकनीकी शर्त है।"]},{"s":"स्टेटिक जी-के-","q":"उत्तर भारत की वह कौन-सी लोक नृत्य-नाट्य शैली है जो भगवान श्रीकृष्ण के जीवन को दर्शाती है और मुख्य रूप से ब्रज क्षेत्र (उत्तर प्रदेश) में प्रस्तुत की जाती है?","o":["नौटंकी","रास लीला","लावणी","घूमर"],"a":1,"e":["रासलीला ब्रज क्षेत्र (मथुरा-वृंदावन) की प्रसिद्ध लोक नृत्य-नाट्य शैली है।","इसमें भगवान श्रीकृष्ण, राधा एवं गोपियों की लीलाओं का नृत्य, संगीत एवं संवाद द्वारा मंचन होता है।","इसका उल्लेख भागवत पुराण में मिलता है और यह भक्ति आंदोलन से गहराई से जुड़ी है।","नौटंकी उत्तर प्रदेश की लोक नाट्य शैली, लावणी महाराष्ट्र का तथा घूमर राजस्थान का लोक नृत्य है।"]},{"s":"स्टेटिक जी-के-","q":"झुम्पा लाहिरी को 2000 में फिक्शन के लिए पुलित्जर पुरस्कार किस पुस्तक के लिए मिला?","o":["द नेमसेक","अनअकस्टम्ड अर्थ","द लोवलैंड","इंटरप्रेटर ऑफ मलाडीज"],"a":3,"e":["झुम्पा लाहिरी को उनके प्रथम कहानी-संग्रह ‘इंटरप्रेटर ऑफ मलाडीज’ के लिए वर्ष 2000 का पुलित्जर पुरस्कार (फिक्शन) प्रदान किया गया।","यह संग्रह वर्ष 1999 में प्रकाशित हुआ था और इसमें भारतीय-अमेरिकी प्रवासी जीवन पर आधारित नौ कहानियाँ संकलित हैं।","पुलित्जर पुरस्कार के अलावा झुम्पा लाहिरी को पेन/हेमिंग्वे पुरस्कार ( 2000) उनकी पुस्तक इंटरप्रेटर ऑफ मैलडी”ा के लिए मिला था।","इसके अतिरिक्त उन्हें 2014 में राष्ट्रीय मानविकी पदक से भी सम्मानित किया गया।"]},{"s":"स्टेटिक जी-के-","q":"“वंदे मातरम्” की रचना किसने की?","o":["रवींद्रनाथ टैगोर","बंकिम चंद्र चट्टोपाध्याय","सुब्रमणिय भारती","कवि प्रदीप"],"a":1,"e":["बाद में इसे उन्होंने अपने उपन्यास “आनंदमठ” ( 1882) में सम्मिलित किया।","1896 के कलकत्ता कांग्रेस अधिवेशन में रवींद्रनाथ टैगोर ने इसे पहली बार सार्वजनिक रूप से गाया था।","24 जनवरी 1950 को संविधान सभा ने इसे राष्ट्रीय गीत के रूप में स्वीकार किया।"]},{"s":"स्टेटिक जी-के-","q":"1896 में पहली आधुनिक ओलंपिक खेलोंं की मे”ाबानी किस शहर ने की थी?","o":["पेरिस","एथेंस","लंदन","रोम"],"a":1,"e":["प्रथम आधुनिक ओलंपिक खेल वर्ष 1896 में एथेंस, ग्रीस में आयोजित किए गए। 139","ओलंपिक के पाँच छल्ले पाँच महाद्वीपीय क्षेत्रों का प्रतिनिधित्व करते हैं–अप्रफीका, अमेरिका, एशिया, यूरोप और ओशिनिया।","वर्तमान IOC अध्यक्ष कस्र्टी कोवेंट्री हैं। { ग्रीष्मकालीन ओलंपिक खेल 2028 — लॉस एंजिल्स, संयुक्त राज्य अमेरिका }","अंतरराष्ट्रीय ओलंपिक समिति ( IOC) की स्थापना 23 जून 1894 को हुई तथा इसका मुख्यालय लॉ”ोन, स्विट्”ारलैंड में स्थित है।"]},{"s":"स्टेटिक जी-के-","q":"लोसर या लोसार का त्यौहार किस भारतीय समुदाय का नववर्ष उत्सव है?","o":["खासी","तिब्बती बौद्ध","संताल","पारसी"],"a":1,"e":["भारत में लद्दाख, हिमाचल प्रदेश (लाहौल-स्पीति), सिक्किम तथा अरुणाचल प्रदेश के मोनपा क्षेत्रों में मनाया जाता है।","तिब्बती चंद्र पंचांग के अनुसार यह प्रायः फरवरी–मार्च में आता है और कई दिनों तक चलता है।","इस अवसर पर मठों में छम नृत्य, दीप प्रज्वलन तथा बुरी शक्तियों को दूर करने से संबंधित पारंपरिक अनुष्ठान किए जाते हैं।","लोसर तिब्बती बौद्ध समुदाय का पारंपरिक नववर्ष उत्सव है। अरुणाचल प्रदेश में इसे मुख्य रूप से मोनपा जनजाति द्वारा मनाया जाता है।"]},{"s":"स्टेटिक जी-के-","q":"प्रसिद्ध कर्नाटिक संगीत रचना ‘पंचरत्न कृतियाँ’ की रचना किसने की?","o":["त्यागराज","पुरंदर दास","मुत्तुस्वामी दीक्षितर","श्यामा शास्त्री"],"a":0,"e":["ये पाँच कृतियाँ नाट, गौल, आरभि और श्री नामक घन रागों में निबद्ध हैं।","त्यागराज, मुत्तुस्वामी दीक्षितर और श्यामा शास्त्री को कर्नाटक संगीत की त्रिमूर्ति कहा जाता है।","प्रतिवर्ष तिरुवैयारु में आयोजित त्यागराज आराधना महोत्सव में इन कृतियों का सामूहिक गायन किया जाता है।"]},{"s":"स्टेटिक जी-के-","q":"उत्तर भारत के पंजाब राज्य में कौन-सा लोक नृत्य लोकप्रिय है?","o":["मोहिनीअट्टम","भांगड़ा","कथकली","ओडिसी"],"a":1,"e":["यह पारंपरिक रूप से बैसाखी एवं फसल कटाई के अवसर से जुड़ा है तथा इसमें ढोल का विशेष महत्त्व है।","पंजाब की महिलाओं का प्रसिद्ध पारंपरिक लोकनृत्य “गिद्दा” कहलाता है।","मोहिनीअट्टम और कथकली केरल के तथा ओडिसी ओडिशा का शास्त्रीय नृत्य है।"]},{"s":"स्टेटिक जी-के-","q":"जल्लीकट्टू त्योहार किस भारतीय राज्य से जुड़ा हुआ है?","o":["कर्नाटक","तमिलनाडु","महाराष्ट्र","आंध्र प्रदेश"],"a":1,"e":["जल्लीकट्टू मुख्य रूप से तमिलनाडु का एक पारंपरिक खेल है, जो पोंगल त्योहार के दौरान आयोजित किया जाता है।","इस आयोजन में बैलों को भीड़ में छोड़ा जाता है और प्रतिभागी उन्हें काबू करने का प्रयास करते हैं।","यह खेल तमिलनाडु की ग्रामीण संस्कृति और वीरता का प्रतीक माना जाता है।","जल्लीकट्टू के आयोजन और विनियमन से संबंधित कानूनी प्रावधान भी बनाए गए हैं।"]},{"s":"स्टेटिक जी-के-","q":"चापचार कुट त्योहार किस भारतीय जनजातीय समुदाय द्वारा मनाया जाता है?","o":["खासी","मि”ाो","गारो","नागा"],"a":1,"e":["चापचार कुट मिजोरम में मि”ाो समुदाय द्वारा मनाया जाने वाला एक प्रमुख वसंत उत्सव है।","यह त्योहार झूम खेती के लिए जंगल साफ करने का कार्य पूरा होने के बाद, सामान्यतः मार्च महीने में बड़े उत्साह से मनाया जाता है।","इस अवसर पर चेराव (बाँस नृत्य) सहित पारंपरिक नृत्य प्रस्तुत किए जाते हैं और मि”ाो संस्कृति का उत्सव मनाया जाता है।","यह पर्व मि”ाो समुदाय की सांस्कृतिक एवं कृषि परंपराओं से निकटता से जुड़ा है।"]},{"s":"स्टेटिक जी-के-","q":"अरुंधति रॉय को उनके प्रथम उपन्यास ‘द गॉड ऑफ स्मॉल थिंग्स’ के लिए बुकर पुरस्कार किस वर्ष मिला?","o":["1990","1997","2003","2012"],"a":1,"e":["अरुंधति रॉय को उनके पहले उपन्यास ‘द गॉड ऑफ स्मॉल थिंग्स’ के लिए वर्ष 1997 में बुकर पुरस्कार से सम्मानित किया गया।","यह उपन्यास केरल के अयेमेनम की पृष्ठभूमि पर आधारित है और सामाजिक संबंधों एवं मानवीय भावनाओं को प्रस्तुत करता है।","वे इस पुरस्कार को जीतने वाली पहली भारतीय नागरिक बनीं।","अरुंधति रॉय की प्रमुख पुस्तकों में ‘द गॉड ऑफ स्मॉल थिंग्स’, ‘द मिनिस्ट्री ऑफ अटमोस्ट हैप्पीनेस’, ‘द अल्जेब्रा ऑफ इनफिनिट जस्टिस’ और ‘ब्रोकन रिपब्लिक’ शामिल हैं।"]},{"s":"स्टेटिक जी-के-","q":"“डोटारा” - यह दो तारों वाला लोक वाद्य यंत्र बंगाल (भारत और बांग्लादेश) के किन रहस्यवादी, घुमंतू लोक गायकों द्वारा प्रमुख रूप से प्रयोग किया जाता है?","o":["भाटियाली गायक","बाउल गायक","भावैया कलाकार","लालन फकीर के अनुयायी (विशेष रूप से)"],"a":1,"e":["डोटारा एक पारंपरिक दो या चार तारों वाला लोक वाद्य यंत्र है, जिसका प्रयोग मुख्य रूप से बंगाल के बाउल गायकों द्वारा किया जाता है।","बाउल एक रहस्यवादी घुमंतू समुदाय है, जो अपने गीतों के माध्यम से आध्यात्मिकता और प्रेम का संदेश पैफलाता है।","डोटारा की मधुर धुन उनके गायन को एक विशिष्ट स्व:प प्रदान करती है। यह वाद्य यंत्र बंगाल की लोक संस्कृति और संगीत परंपरा का महत्त्वपूर्ण हिस्सा है।"]},{"s":"स्टेटिक जी-के-","q":"आर-के- नारायण को भारत का दूसरा 140 सर्वोच्च नागरिक सम्मान पद्म विभूषण किस वर्ष प्राप्त हुआ?","o":["1954","1965","2000","2001"],"a":2,"e":["साहित्य और शिक्षा के क्षेत्र में उनके योगदान को मान्यता देते हुए भारत सरकार ने उन्हें प्रतिष्ठित नागरिक सम्मानों से सम्मानित किया।","उन्हें वर्ष 1964 में पद्म भूषण प्रदान किया गया था, जो देश का तीसरा सर्वोच्च नागरिक सम्मान है।","इसके बाद वर्ष 2000 में उन्हें देश के दूसरे सर्वोच्च नागरिक सम्मान ‘पद्म विभूषण’ से सम्मानित किया गया।","आर-के- नारायण भारत के प्रसिद्ध अंग्रे”ाी भाषा के लेखकों में से एक थे, जिन्हें ‘मालगुडी डे”ा’ के लिए मुख्य रूप से जाना जाता है।"]},{"s":"स्टेटिक जी-के-","q":"निम्नलिखित में से कौन-सा विकल्प सामाजिक स्तरीकरण की अवधारणा को सबसे अच्छी तरह परिभाषित करता है?","o":["सामाजिक विशेषताओं के आधार पर समाज का श्रेणीबद्ध विभाजन","भूमि का उपयोग के अनुसार वर्गीकरण","जाति के आधार पर लोगों का प्रवासन","क्षेत्रों में जनसंख्या का समान वितरण"],"a":0,"e":["सामाजिक स्तरीकरण ( Social Stratification) समाजशास्त्र की एक महत्त्वपूर्ण अवधारणा है, जो समाज की श्रेणीबद्ध संरचना को दर्शाती है।","यह समाज को धन, आय, जाति, शिक्षा और शक्ति जैसी सामाजिक विशेषताओं के आधार पर अलग-अलग स्तरों या वर्गों में बाँटता है।","इस विभाजन के परिणामस्व:प समाज में एक पदानुक्रम ( Hierarchy) बनता है, जिसमें विभिन्न समूहों की संसाधनों तक पहुँच असमान हो सकती है।","यह व्यवस्था समाज में संसाधनों के असमान वितरण और लोगों की सामाजिक स्थिति को समझने में सहायता करती है।"]},{"s":"स्टेटिक जी-के-","q":"किस अमेरिकी कलाकार ने प्रसिद्ध चित्रकला ‘फ्लैग’ बनाई, जो 2010 में 110 मिलियन अमेरिकी डॉलर से अधिक में बिकी?","o":["जैस्पर जॉन्स","जैक्सन पोलक","एंडी वारहोल","मार्क रोथको"],"a":0,"e":["‘फ्लैग’ ( Flag) आधुनिक कला के इतिहास की प्रतिष्ठित और विश्वप्रसिद्ध चित्रकृतियों में से एक मानी जाती है।","यह चित्रकला अमेरिकी ध्वज को विशिष्ट कलात्मक शैली में दर्शाती है और जैस्पर जॉन्स को पॉप कला के महत्त्वपूर्ण अग्रदूतों में माना जाता है।","वर्ष 2010 में जैस्पर जॉन्स की 1958 की ‘ Flag’ एक निजी बिक्री में लगभग 110 मिलियन अमेरिकी डॉलर में बिकी थी।","1954–55 की प्रसिद्ध ‘ Flag’ एक अलग कृति है, जो MoMA, न्यूयॉर्क के संग्रह में है।"]},{"s":"स्टेटिक जी-के-","q":"भारत ने अपना पहला और एकमात्र हॉकी विश्व कप खिताब किस वर्ष और किस प्रतिद्वंद्वी के खिलाफ जीता था?","o":["1971, पाकिस्तान","1975, पाकिस्तान","1975, जर्मनी","1982, नीदरलैंड्स"],"a":1,"e":["भारतीय पुरुष हॉकी टीम ने अपना पहला और अब तक का एकमात्र विश्व कप खिताब वर्ष 1975 में जीता था।","यह टूर्नामेंट कुआलालंपुर, मलेशिया में आयोजित किया गया था।","फाइनल में भारत ने पाकिस्तान को 2–1 से हराकर विश्व कप खिताब जीता था।","इस विश्व कप विजेता भारतीय टीम के कप्तान अजीत पाल सिंह थे।"]},{"s":"स्टेटिक जी-के-","q":"गोल्फ खिलाड़ी एक राउंड के दौरान अधिकतम कितने क्लब अपने साथ रख सकता है?","o":["12","14","16","18"],"a":1,"e":["गोल्फ के आधिकारिक नियमों के अनुसार, एक खिलाड़ी एक राउंड की शुरुआत अधिकतम 14 क्लबों के साथ कर सकता है।","USGA और R&A द्वारा निर्धारित Rule 4.1b के अनुसार, खिलाड़ी अपने साथ 14 से अधिक क्लब नहीं रख सकता।","यदि खिलाड़ी के पास 14 से अधिक क्लब हों, तो नियमों के अनुसार उस पर पेनल्टी लगती है और अतिरिक्त क्लब को खेल से बाहर करना होता है।","खिलाड़ी इन 14 क्लबों में अपनी आवश्यकता के अनुसार वुड्स, आयरन्स, वेजेज और पुटर का संयोजन चुन सकता है।"]},{"s":"स्टेटिक जी-के-","q":"पश्चिम बंगाल के पुरुलिया छऊ नृत्य पर किस प्राचीन ग्रंथ का प्रभाव पड़ा है?","o":["ऋग्वेद","नाट्यशास्त्र","महाभारत","अर्थशास्त्र"],"a":1,"e":["पुरुलिया छऊ पश्चिम बंगाल का प्रसिद्ध नृत्य रूप है, जिसमें मुखौटों का विशेष रूप से प्रयोग किया जाता है।","इसकी प्रस्तुति में वीर रस, युद्ध-सदृश गतियों तथा शारीरिक मुद्राओं का प्रमुख स्थान है।","इसमें रामायण और महाभारत सहित पौराणिक कथाओं पर आधारित प्रसंग प्रस्तुत किए जाते हैं।","छऊ नृत्य में मार्शल आर्ट, नृत्य और नाटकीय अभिव्यक्ति का समन्वय दिखाई देता है।","छऊ नृत्य को वर्ष 2010 में UNESCO की मानवता की अमूर्त सांस्कृतिक विरासत की प्रतिनिधि सूची ( Representative List of the Intangible Cultural Heritage of Humanity) में शामिल किया गया था।"]},{"s":"स्टेटिक जी-के-","q":"प्रफांसीसी औपनिवेशिक वास्तुकला शैली, जिसमें ग्रिड योजना, हल्के रंगों वाले विला और मेहराबदार बालकनियाँ शामिल हैं, भारत के किस शहर में सबसे अच्छी तरह संरक्षित है? 141","o":["गोवा","पुडुचेरी","मुंबई","कोलकाता"],"a":1,"e":["पुडुचेरी (पूर्व नाम पांडिचेरी) लंबे समय तक प्रफांसीसी औपनिवेशिक शासन के अधीन रहा।","यहाँ का व्हाइट टाउन क्षेत्र प्रफांसीसी शैली की इमारतों और नियोजित सड़कों के लिए प्रसिद्ध है।","यहाँ हल्के रंगों वाले विला, मेहराबदार बालकनियाँ और ग्रिड आधारित सड़क योजना देखने को मिलती है।","गोवा मुख्यतः पुर्तगाली, जबकि कोलकाता ब्रिटिश औपनिवेशिक वास्तुकला के लिए प्रसिद्ध है।"]},{"s":"स्टेटिक जी-के-","q":"भारत में पोलो खेल पारंपरिक रूप से किस राज्य से जुड़ा हुआ है?","o":["पंजाब","मणिपुर","राजस्थान","असम"],"a":1,"e":["आधुनिक पोलो के विकास का प्रमुख संबंध मणिपुर से माना जाता है।","मणिपुर में इसके पारंपरिक स्व:प को सगोल कांगजेई ( Sagol Kangjei) कहा जाता है।","यह खेल पारंपरिक रूप से मणिपुरी टट्टुओं ( Manipuri Ponies) पर खेला जाता है।","मणिपुर की संस्कृति और इतिहास में सगोल कांगजेई का विशेष स्थान है।"]},{"s":"स्टेटिक जी-के-","q":"किस लेखक के उपन्यास “ट्रस्ट” को 2023 का पुलित्जर पुरस्कार मिला?","o":["हर्नान डिया”ा","जेसमिन वार्ड","जोशुआ पेफरिस","एंड्रयू सीन ग्रियर"],"a":0,"e":["हर्नान डिया”ा के उपन्यास ‘ट्रस्ट’ को 2023 का पुलित्जर पुरस्कार (फिक्शन) प्रदान किया गया।","यह पुरस्कार बारबरा किंग्सोल्वर के उपन्यास ‘डेमन कॉपरहेड’ के साथ संयुक्त रूप से दिया गया था।","उपन्यास की कथा मुख्य रूप से धन, सत्ता और वित्त के इर्द-गिर्द घूमती है।","इसकी पृष्ठभूमि 20 वीं सदी के शुरुआती दशकों के न्यूयॉर्क की वित्तीय दुनिया से जुड़ी है।"]},{"s":"स्टेटिक जी-के-","q":"भारतीय हॉकी टीम की ओलंपिक में 30 लगातार जीतों की श्रृंखला किस वर्ष में टूटी?","o":["1960","1964","1968","1972"],"a":0,"e":["भारत ने 1928 से 1956 तक पुरुष ओलंपिक हॉकी में लगातार छह स्वर्ण पदक जीते।","इस दौरान भारतीय टीम ने ओलंपिक में लगातार 30 मैचों में जीत दर्ज की।","यह विजय क्रम 1960 के रोम ओलंपिक में समाप्त हुआ।","फाइनल में पाकिस्तान ने भारत को 1–0 से हराया और भारत को रजत पदक मिला।"]},{"s":"स्टेटिक जी-के-","q":"किसे पहला आधिकारिक विश्व शतरंज चैंपियन माना जाता है?","o":["बॉबी फिशर","विल्हेम स्टीनिट्”ा","गैरी कास्पारोव","पॉल मॉर्फी"],"a":1,"e":["विल्हेम स्टीनिट्”ा को पहला आधिकारिक विश्व शतरंज चैंपियन माना जाता है।","उन्होंने 1886 में जोहान्स ”ाुकेर्टोर्ट को हराकर विश्व चैंपियनशिप जीती।","स्टीनिट्”ा को आधुनिक स्थितिगत शतरंज ( Positional Chess) के विकास के लिए जाना जाता है।","उन्होंने शतरंज की आधुनिक रणनीतिक अवधारणाओं के विकास में महत्वपूर्ण भूमिका निभाई।"]},{"s":"स्टेटिक जी-के-","q":"किस भारतीय राज्य ने पिछले संस्करण के बाद सबसे लंबे अंतराल के बाद राष्ट्रीय खेलों की मेजबानी की?","o":["केरल","गुजरात","झारखंड","असम"],"a":1,"e":["36 वें राष्ट्रीय खेल वर्ष 2022 में गुजरात में आयोजित किए गए।","इससे पहले 35 वें राष्ट्रीय खेल वर्ष 2015 में केरल में आयोजित हुए थे।","इस प्रकार दोनों संस्करणों के बीच लगभग सात वर्षों का अंतराल रहा।","36 वें राष्ट्रीय खेलों का शुभंकर ‘सावज’ था, जो गिर के एशियाई सिंह का प्रतिनिधित्व करता है।"]},{"s":"स्टेटिक जी-के-","q":"कौन-सा कथन अखिल भारतीय शतरंज महासंघ का सबसे अच्छा वर्णन करता है?","o":["1958 में पंजीकृत, केवल पुरुषों की प्रतियोगिताओं का संचालन करता है और FIDE द्वारा मान्यता प्राप्त नहीं है।","1951 में गठित, स्वतंत्र और अंतरराष्ट्रीय निकायों से संबद्ध नहीं है।","1958 में स्थापित, मुंबई में मुख्यालय, केवल राज्य निकायों से संबद्ध है।","1951 में स्थापित, नई दिल्ली में मुख्यालय, FIDE और एशियाई शतरंज महासंघ से संबद्ध है।"],"a":3,"e":["अखिल भारतीय शतरंज महासंघ ( AICF) भारत में शतरंज का प्रमुख प्रशासनिक निकाय है।","इसकी स्थापना 1951 में हुई थी और इसका मुख्यालय नई दिल्ली में है।","यह विश्व शतरंज महासंघ ( FIDE) और एशियाई शतरंज महासंघ से संबद्ध है।","यह भारत में विभिन्न राष्ट्रीय शतरंज प्रतियोगिताओं के आयोजन और खेल के विकास में महत्वपूर्ण भूमिका निभाता है।"]},{"s":"स्टेटिक जी-के-","q":"निम्नलिखित में से कौन-सी द्रविड़ शैली के मंदिरों की महत्वपूर्ण विशेषता नहीं है?","o":["मंडप","शिखर","विमान","गर्भगृह 142"],"a":1,"e":["दक्षिण भारत की प्रमुख मंदिर वास्तुकला को द्रविड़ शैली कहा जाता है।","इसमें गर्भगृह, मंडप, विमान और गोपुरम जैसी प्रमुख वास्तु विशेषताएँ पाई जाती हैं।","गर्भगृह के ऊपर निर्मित पिरामिडनुमा संरचना को विमान ( Vimana) कहा जाता है।","शिखर मुख्य रूप से उत्तर भारतीय नागर शैली के मंदिरों से संबंधित है।"]},{"s":"स्टेटिक जी-के-","q":"आत्मकथा ‘विंग्स ऑफ फायर’ किसने लिखी है?","o":["इंदिरा गांधी","सुभाष चंद्र बोस","प्रणब मुखर्जी",",- पी- जे- अब्दुल कलाम"],"a":3,"e":["‘विंग्स ऑफ फायर’ ( Wings of Fire) डॉ- ,- पी- जे- अब्दुल कलाम की आत्मकथा है।","इसे ,- पी- जे- अब्दुल कलाम और अरुण तिवारी ने संयुक्त रूप से लिखा था।","डॉ- ,- पी- जे- अब्दुल कलाम को ‘भारत के मिसाइल मैन’ के नाम से जाना जाता है ; वे भारत के 11 वें राष्ट्रपति थे और उन्हें वर्ष 1997 में भारत के सर्वोच्च नागरिक सम्मान ‘भारत रत्न’ से सम्मानित किया गया था।"]},{"s":"स्टेटिक जी-के-","q":"किस भारतीय कबड्डी खिलाड़ी ने पुलिस में DSP के रूप में सेवा दी है और अंतरराष्ट्रीय स्तर पर पदक जीते हैं?","o":["राकेश कुमार","दीपक हुड्डा","अजय ठाकुर","मंजीत छिल्लर"],"a":2,"e":["अजय ठाकुर भारत के प्रसिद्ध कबड्डी खिलाड़ियों में से एक हैं।","वे 2016 कबड्डी विश्व कप जीतने वाली भारतीय टीम के प्रमुख सदस्य ै।"]},{"s":"स्टेटिक जी-के-","q":"पहली टूर डी प्रफांस साइक्लिंग रेस किस वर्ष और किस देश में आयोजित की गई थी?","o":["1903 — प्रफांस","1910 — बेल्जियम","1898 — इटली","1924 — स्विट्”ारलैंड"],"a":0,"e":["पहली टूर डी प्रफांस प्रतियोगिता 1903 में प्रफांस में आयोजित हुई थी।","पहली टूर डी प्रफांस प्रतियोगिता 1903 में आयोजित हुई थी।","यह विश्व की सबसे प्रतिष्ठित बहु-दिवसीय साइक्लिंग प्रतियोगिताओं में से एक है।","इसका आयोजन मुख्यतः प्रफांस की सड़कों पर होता है और यह रोड साइक्लिंग से संबंधित है।"]},{"s":"स्टेटिक जी-के-","q":"2008 के ग्रीष्मकालीन ओलंपिक खेलों का आयोजन किस शहर में हुआ था और उसमें कौन-सी तकनीकी पहली बार प्रयोग की गई थी?","o":["टोक्यो – रोबोटिक रेफरी","बीजिंग – डिजिटल आतिशबा”ाी","लंदन – वर्चुअल स्टेडियम","सियोल – पहली इंटरनेट लाइवस्ट्रीम"],"a":1,"e":["2008 के ग्रीष्मकालीन ओलंपिक बीजिंग में हुए और उद्घाटन समारोह में डिजिटल आतिशबा”ाी का प्रयोग किया गया।","2008 के ग्रीष्मकालीन ओलंपिक खेल बीजिंग, चीन में आयोजित हुए थे।","उद्घाटन समारोह में डिजिटल आतिशबा”ाी का प्रयोग व्यापक रूप से किया गया।","बीजिंग ओलंपिक 8 से 24 अगस्त 2008 तक आयोजित हुआ था।"]},{"s":"स्टेटिक जी-के-","q":"2023 इंडिया ओपन बैडमिंटन टूर्नामेंट की मेजबानी किस शहर ने की थी?","o":["नई दिल्ली","मुंबई","हैदराबाद","बेंगलुरु"],"a":0,"e":["2023 इंडिया ओपन बैडमिंटन टूर्नामेंट नई दिल्ली में आयोजित हुआ था।","2023 इंडिया ओपन बैडमिंटन टूर्नामेंट नई दिल्ली में आयोजित हुआ था।","यह बीडब्ल्यूएफ वल्र्ड टूर के सुपर 750 स्तर का टूर्नामेंट था।","प्रतियोगिता इंदिरा गांधी इंडोर स्टेडियम में आयोजित की गई थी।"]},{"s":"स्टेटिक जी-के-","q":"ब्रेक को छोड़कर प्रो कबड्डी लीग मैच की मानक अवधि कितनी होती है?","o":["30 मिनट","40 मिनट","45 मिनट","60 मिनट"],"a":1,"e":["मानक कबड्डी मैच 40 मिनट का होता है।","यह दो 20-20 मिनट के हाफ में खेला जाता है।","दोनों हाफ के बीच सामान्यतः अंतराल दिया जाता है।","प्रो कबड्डी में भी खेल का मूल समय 40 मिनट है।"]},{"s":"स्टेटिक जी-के-","q":"ओलंपिक शैली की मुक्केबा”ाी में कितने जज मुकाबले को स्कोर करते हैं?","o":["3","5","4","2"],"a":1,"e":["ओलंपिक शैली की मुक्केबा”ाी में 5 जज स्कोरिंग करते हैं।","प्रत्येक राउंड में जज मुक्केबा”ाों के प्रदर्शन का मूल्यांकन करते हैं।","आधुनिक अंतरराष्ट्रीय प्रतियोगिताओं में जजिंग प्रणाली मानकीकृत है।","यह प्रश्न मुक्केबा”ाी के मूल खेल नियमों से संबंधित है।"]},{"s":"स्टेटिक जी-के-","q":"अक्टूबर 2025 तक वीनस विलियम्स के पास कितने ग्रैंड स्लैम एकल खिताब हैं?","o":["5","6","7","9"],"a":2,"e":["WTA के आधिकारिक रिकॉर्ड में वीनस विलियम्स के 7 ग्रैंड स्लैम एकल खिताब दर्ज हैं।","उन्होंने विंबलडन 5 बार और यूएस ओपन 2 बार जीता।","उनका कुल ग्रैंड स्लैम एकल खिताब 7 है। 93 गुप्तकालीन कला के संदर्भ में, ‘सारनाथ बुद्ध’ की प्रतिमा की विशेषता निम्नलिखित में से किस रूप में पहचानी जाती है? (a) हेलेनिस्टिक वस्त्र-शैली और यथार्थवादी पेशीय संरचना। (b) पारदर्शी, शरीर से चिपकी हुई वस्त्र-शैली और शांत, ध्यानमग्न अभिव्यक्ति। (c) अलंकृत मुकुट और आभूषण, जिसमें बुद्ध को राजकुमार के रूप में दर्शाया गया है। (d) उग्र चेहरे की विशेषताएँ, जो बुद्ध की शक्ति का प्रतीक हैं। Ans. (b) पारदर्शी, शरीर से चिपकी हुई वस्त्र-शैली और शांत, ध्यानमग्न अभिव्यक्ति। व्याख्याः","सारनाथ शैली गुप्तकालीन मूर्तिकला की सर्वोच्च उपलब्धि मानी जाती है, जिसमें चुनार के बलुआ पत्थर का प्रयोग हुआ।","इस शैली में वस्त्र अत्यंत महीन और पारदर्शी दिखाए गए हैं।"]},{"s":"स्टेटिक जी-के-","q":"बूंदी-कोटा शैली ‘चौगान’ के चित्रण के लिए प्रसिद्ध है।\n2. मेवाड़ शैली फ़ारसी-सफ़वीद शैली का गढ़ थी और स्वदेशी राजपूत विषयों को अस्वीकार करती थी।\n3. कांगड़ा शैली राजा संसार चंद के संरक्षण में उत्कर्ष पर पहुँची।","o":["केवल 1 और 3","केवल 2","केवल 1 और 2","केवल 3"],"a":3,"e":["कांगड़ा शैली का विकास गुलेर शैली से हुआ तथा राजा संसारचंद द्वितीय के संरक्षण में उत्कर्ष पर पहुँची।","इसकी विशेषता कोमल रेखाएँ, प्राकृतिक दृश्य और नारी-सौंदर्य का चित्रण है।","इसके प्रमुख विषय राध-कृष्ण, गीत गोविंद और भागवत पुराण हैं। 96. अजंता-एलोरा गुफाओं के बारे में दिए गए कथनों में से कौन-सा सही नहीं है?"]},{"s":"स्टेटिक जी-के-","q":"अजंता मुख्यतः बौद्ध चैत्य-विहारों और जातक कथाओं के भित्तिचित्रों से संबंधित है।\n2. एलोरा में हिंदू, बौद्ध और जैन गुफाएँ तथा कैलाश मंदिर शामिल हैं।\n3. एलीपेंफटा गुफाएँ समुद्री क्षरण से बनी ग्रेनाइट चट्टानों में स्थित हैं।","o":["केवल 1","केवल 2","केवल 3","इनमें से कोई नहीं"],"a":2,"e":["अजंता गुफाएँ बौद्ध चैत्यगृह और विहार हैं तथा उनकी चित्रकला बौद्ध धार्मिक कला से संबंधित है ; इनमें जातक कथाओं के दृश्य भी मिलते हैं।","एलोरा में बौद्ध, हिंदू और जैन तीनों परंपराओं की गुफाएँ हैं ; प्रसिद्ध कैलाश मंदिर (गुफा 16) भी यहीं स्थित है।","एलीपेंफटा गुफाएँ प्राकृतिक समुद्री क्षरण से बनी गुफाएँ नहीं हैं, बल्कि मानव-निर्मित rock-cut caves हैं ; अतः कथन 3 गलत है। 97. निम्नलिखित में से किस ग्रंथ में भारतीय गणितीय लेखन का सबसे प्राचीन प्रमाण मिलता है? (a) अरण्यक (b) कल्पसूत्र (c) यजुर्वेद (d) शुल्बसूत्र Ans. (d) शुल्बसूत्र व्याख्याः","शुल्बसूत्रों में यज्ञ-वेदियों के निर्माण हेतु ज्यामितीय विधियाँ दी गई हैं।","बौधायन, आपस्तम्ब, कात्यायन और मानव शुल्बसूत्र प्रमुख हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश का राजवंशीय इतिहास किस साम्राज्य के दौरान शु: हुआ?","o":["गुप्त साम्राज्य","मौर्य साम्राज्य","मुगल साम्राज्य","दिल्ली सल्तनत"],"a":1,"e":["मध्य प्रदेश का क्रमबद्ध राजवंशीय इतिहास मौर्य साम्राज्य से आरंभ माना जाता है।","सम्राट अशोक मौर्य सम्राट बनने से पूर्व उज्जयिनी (अवंति प्रांत) के राज्यपाल थे।","अशोक ने ही विदिशा के निकट सांची में महान स्तूप का निर्माण करवाया, जिसे वर्ष वर्ष 1989 में यूनेस्को ने विश्व ध्रोहर स्थल घोषित किया।","मौर्यों के बाद शुंग, सातवाहन, गुप्त, वाकाटक, परमार एवं चंदेल जैसे राजवंश इस क्षेत्र पर शासन करते रहे।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"निम्नलिखित में से कौन-सा मध्य प्रदेश में अग्नि सुरक्षा और अग्निशमन सेवाओं का हिस्सा नहीं है?","o":["पानी में डूबे शवों को बचाना और उन्हें अस्पताल पहुँचाना।","भोपाल में विशेष अतिथियों के दौरे के दौरान अग्नि सुरक्षा व्यवस्था।","अग्नि दुर्घटना पीड़ितों के अस्पताल बिलों के लिए वित्तीय सहायता प्रदान करना।","गणेश विसर्जन, दुर्गा विसर्जन, मुहर्रम, दिवाली और होली जैसे त्योहारों के दौरान अग्नि सुरक्षा।"],"a":2,"e":["मध्य प्रदेश में अग्निशमन सेवाएँ नगरीय प्रशासन एवं विकास विभाग के अधीन नगरीय निकायों द्वारा संचालित होती हैं।","इनके कार्यों में आग बुझाना, बचाव कार्य, मध्य प्रदेश सामान्य Exercise डूबे व्यक्तियों/शवों को निकालकर अस्पताल पहुँचाना तथा VIP दौरों व त्योहारों पर अग्नि सुरक्षा व्यवस्था शामिल है।","पीड़ितों के अस्पताल बिलों के लिए वित्तीय सहायता या मुआवजा देना अग्निशमन सेवा का कार्य नहीं है।","यह कार्य ‘आपदा प्रबंध्न अधि्नियम, 2005’ के तहत ‘राजस्व एवं राहत विभाग’ द्वारा किया जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में मटकी नृत्य की शुरुआत कौन करता है?","o":["पुरुषों का एक समूह","एक अकेली महिला जिसे झेला कहा जाता है","एक पुजारी","गाँव का मुखिया"],"a":1,"e":["मटकी मालवा क्षेत्र का प्रसिद्ध सामुदायिक नृत्य है, जिसे महिलाएँ विभिन्न मांगलिक अवसरों पर करती हैं।","नृत्य की शुरुआत स्थानीय स्तर पर ‘झेला’ कहलाने वाली एक अकेली महिला करती है, बाद में अन्य नर्तकियाँ जुड़ जाती हैं।","नर्तकियाँ पारंपरिक मालवी वेशभूषा पहनकर तथा चेहरे पर घूँघट डालकर इसमें भाग लेती हैं।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"रानी दुर्गावती का विवाह किस राजा से हुआ था?","o":["राजा छत्रसाल","दलपत शाह","अकबर","रानी अहिल्या बाई"],"a":1,"e":["रानी दुर्गावती कालिंजर के चंदेल राजा कीर्तिसिंह (कीरत राय) की पुत्री थीं।","उनका विवाह गोंडवाना के गढ़ा-मंडला 155 ज्ञान राज्य के राजा संग्राम शाह के पुत्र दलपत शाह से हुआ था।","पति की असामयिक मृत्यु के बाद उन्होंने अपने पुत्र वीर नारायण के संरक्षक के रूप में कुशल शासन किया।","1564 ई- में अकबर के सेनापति आसफ खाँ से नरई नाला (जबलपुर) के युद्ध में लड़ते हुए उन्होंने अपना बलिदान दिया ; इसी दिन की याद में मध्य प्रदेश में 24 जून को बलिदान दिवस (जिसे अब ‘गौरव दिवस’ के रूप में भी मनाया जाता है) मनाया जाता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"आलमी तबलीगी इज्तिमा मध्य प्रदेश के किस शहर में आयोजित होता है?","o":["इंदौर","भोपाल","ग्वालियर","जबलपुर"],"a":1,"e":["आलमी तबलीगी इज्तिमा का आयोजन प्रतिवर्ष भोपाल में किया जाता है।","यह एशिया के सबसे बड़े धार्मिक जमावड़ों में गिना जाता है, जिसमें देश-विदेश से लाखों लोग शामिल होते हैं।","चार दिवसीय इस आयोजन का समापन सामूहिक दुआ के साथ होता है।"]},{"s":"मध्य प्रदेश सामान्य ज्ञान","q":"मध्य प्रदेश में खजुराहो नृत्य महोत्सव की अवधि कितनी होती है?","o":["3 दिन","5 दिन","7 दिन (सप्ताह भर)","10 दिन"],"a":2,"e":["खजुराहो नृत्
