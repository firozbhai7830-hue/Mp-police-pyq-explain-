थित है?","o":["वाशिंगटन डीसी","न्यूयॉर्क","लुसियाना","डेट्रॉइट"],"a":0,"e":["अंतर्राष्ट्रीय मुद्रा कोष (IMF) एवं विश्व बैंक दोनों का मुख्यालय वाशिंगटन डी- सी- में है।","दोनों संस्थाओं की स्थापना 1944 के ब्रेटन वुड्स सम्मेलन में हुई थी।","IMF मुद्रा स्थिरता एवं भुगतान संतुलन में सहायता करता है।","विश्व बैंक विकासशील देशों को दीर्घकालिक विकास ऋण उपलब्ध कराता है। 5 PHYSICS (भौतिक विज्ञान)"]},{"s":"सामान्य विज्ञान","q":"यदि मायोपिया (निकट दृष्टि दोष) वाली आँख (जिसका दूर बिंदु 80 सेमी है) को लेंस द्वारा सुधारा जाता है, तो उस लेंस की क्षमता ______ होती है।","o":["−1.25 D","−0.80 D","+1.25 D","+0.80 D"],"a":0,"e":["निकट दृष्टि दोष (मायोपिया) में प्रतिबिंब रेटिना के आगे बनता है, अतः सुधार हेतु अवतल (अपसारी) लेंस प्रयुक्त होता है।","अवतल लेंस की फोकस दूरी ऋणात्मक होती है, इसलिए उसकी क्षमता ( P = 1/f मीटर में) भी ऋणात्मक ही होगी।","दूर बिंदु 80 सेमी ( 0.8 मीटर) की सामान्य स्थिति में P = 1/(−0.8) = −1.25 D प्राप्त होता है।","धनात्मक क्षमता वाले विकल्प उत्तल लेंस के हैं जो दूर दृष्टि दोष (हाइपरमेट्रोपिया) में प्रयुक्त होते हैं।"]},{"s":"सामान्य विज्ञान","q":"एक प्रतिरोधक R, विभवांतर V के परिपथ से संयोजित होने पर शक्ति P का क्षय करता है। यदि उसी प्रतिरोधक को 2V पर संयोजित किया जाए, तो क्षयित शक्ति होगीः","o":["2P","4P","P","P/2"],"a":1,"e":["प्रतिरोधक में व्यय शक्ति का सूत्र P = V2/R होता है, जहाँ R नियत रहता है।","विभवांतर को दोगुना करने पर P′ = (2V)2/R = 4V2/R = 4P प्राप्त होता है।","ओम के नियम से धारा भी दोगुनी हो जाती है, अतः P = I2R से भी शक्ति 4 गुना ही आती है। सामान्य विज्ञान Exercise","इस प्रकार शक्ति विभवांतर के वर्ग के अनुक्रमानुपाती होती है।"]},{"s":"सामान्य विज्ञान","q":"एक सीधे तार में, यदि धारा को दोगुना कर दिया जाए और दूरी को आधा कर दिया जाए, तो चुंबकीय क्षेत्र की तीव्रता क्या होगी?","o":["समान","दोगुनी","आधी","चार गुनी"],"a":3,"e":["लंबे सीधे धारावाही तार के कारण चुंबकीय क्षेत्र B = μ I / 2πr होता है (बायो-सावर्ट 0 नियम से व्युत्पन्न)।","यहाँ B धारा I के अनुक्रमानुपाती तथा दूरी r के व्युत्क्रमानुपाती होता है।","धारा दोगुनी करने पर B दोगुना तथा दूरी आधी करने पर B पुनः दोगुना हो जाता है।","अतः कुल प्रभाव 2 × 2 = 4 गुना होगा, अर्थात् चुंबकीय क्षेत्र की तीव्रता चार गुनी हो जाएगी।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सा फ्लेमिंग के बाएँ हाथ के नियम का सही अनुप्रयोग नहीं है?","o":["मोटर में बल की दिशा निर्धारित करना","जनरेटर में प्रेरित धारा की दिशा निर्धारित करना","चुंबकीय क्षेत्र में चालक पर लगने वाले बल की दिशा निर्धारित करना","धारावाही चालक की गति की दिशा निर्धारित करना"],"a":1,"e":["फ्लेमिंग का बाएँ हाथ का नियम चुंबकीय क्षेत्र में रखे धारावाही चालक पर लगने वाले बल की दिशा बताता है – यही विद्युत मोटर का सिद्धांत है।","इसमें तर्जनी चुंबकीय क्षेत्र, मध्यमा धारा तथा अंगूठा बल की दिशा दर्शाता है। 74","जनरेटर में प्रेरित धारा की दिशा फ्लेमिंग के दाएँ हाथ के नियम से ज्ञात की जाती है,"]},{"s":"सामान्य विज्ञान","q":"एक आयताकार लूप जिसमें धारा प्रवाहित हो रही है, उसे एक समान चुंबकीय क्षेत्र में इस प्रकार रखा गया है कि इसकी एक भुजा क्षेत्र के लंबवत है और दूसरा समांतर है। किस भुजा पर अधिकतम बल लगेगा?","o":["चुंबकीय क्षेत्र के समांतर भुजा","चुंबकीय क्षेत्र के लंबवत भुजा","अधिक लंबाई वाली भुजा","दोनों भुजाओं पर समान रूप से"],"a":1,"e":["धारावाही चालक पर बल का सूत्र F = BIL sinθ है, जहाँ θ धारा एवं चुंबकीय क्षेत्र के बीच का कोण है।","जब चालक क्षेत्र के लंबवत हो ( θ = 90°), तब sinθ = 1 होने से बल अधिकतम F = BIL होता है।","जब चालक क्षेत्र के समांतर हो ( θ = 0°), तब sinθ = 0 होने से बल शून्य हो जाता है।","अतः चुंबकीय क्षेत्र के लंबवत भुजा पर ही अधिकतम बल लगेगा।"]},{"s":"सामान्य विज्ञान","q":"एक उत्तल दर्पण की वक्रता त्रिज्या 50 सेमी है। एक वस्तु दर्पण के सामने 50 सेमी की दूरी पर रखी गई है। प्रतिबिंब दूरी और आवर्धन ज्ञात कीजिए।","o":["v = +30 सेमी, m = 0.5","v = +20 सेमी, m = 0.33","v = +16.67 सेमी, m = 0.333","v = +25 सेमी, m = 0.416"],"a":2,"e":["उत्तल दर्पण के लिए फोकस दूरी f = R/2 = +25 सेमी होती है।","दर्पण सूत्र 1/v + 1/u = 1/f में u = –50 सेमी रखने पर 1/v = 1/25 – 1/(–50) = 1/25 + 1/50 = 3/50","अतः v = 50/3 = + 16.67 सेमी प्राप्त होता है।","आवर्धन m = –v/u = – (16.67)/(–50) = +0.333 आता है, अर्थात् प्रतिबिंब आभासी, सीधा व छोटा है।"]},{"s":"सामान्य विज्ञान","q":"एक उत्तल लेंस का उपयोग प्रोजेक्टर के रूप में पर्दे पर वास्तविक प्रतिबिंब बनाने के लिए किया जाता है। तब वस्तु की दूरी होती हैः","o":["f से कम","f के बराबर","f से अधिक","अनंत पर"],"a":2,"e":["उत्तल लेंस वास्तविक प्रतिबिंब तभी बनाता है जब वस्तु फोकस से बाहर रखी जाए।","प्रोजेक्टर में बड़ा (आवर्धित) वास्तविक प्रतिबिंब चाहिए, अतः वस्तु f और 2f के बीच होती है।","f और 2f के बीच की स्थिति भी ‘ f से अधिक’ दूरी ही कहलाती है।","यदि वस्तु f के भीतर हो तो आभासी प्रतिबिंब बनेगा जो पर्दे पर नहीं आ सकता।"]},{"s":"सामान्य विज्ञान","q":"सूर्योदय और सूर्यास्त के समय सूर्य का रंग लाल क्यों दिखाई देता हैं?","o":["अपवर्तन लाल रंग को चुनता है","लंबे पथ के कारण नीली किरणें अधिक प्रकीर्णित हो जाती हैं, जिससे लाल रंग शेष रहता है","सूर्य निम्न ऊंचाई पर लाल रंग उत्सर्जित करता है","मानव आंख लाल रंग के प्रति अधिक संवेदनशील होती है"],"a":1,"e":["सूर्योदय व सूर्यास्त के समय सूर्य की किरणें वायुमंडल में सर्वाधिक लंबा पथ तय करती हैं।","रैले प्रकीर्णन के अनुसार प्रकीर्णन तरंगदैघ्र्य की चौथी घात के व्युत्क्रमानुपाती होता है।","इसलिए कम तरंगदैघ्र्य वाला नीला-बैंगनी प्रकाश अधिक प्रकीर्णित होकर दृष्टि पथ से हट जाता है।","अधिक तरंगदैघ्र्य वाला लाल प्रकाश सीधा पहुँचता है, अतः आकाश व सूर्य लाल दिखते हैं।"]},{"s":"सामान्य विज्ञान","q":"एक वस्तु से 40 सेमी की दूरी पर रखा 20 सेमी फोकल लंबाई का उत्तल लेंस समान आमाप का एक प्रतिबिंब बनाता है। यदि उत्तल लेंस को अवतल लेंस द्वारा प्रतिस्थापित किया जाता है तोः","o":["प्रतिबिंब की दूरी 20 सेमी से कम होगी और प्रतिबिंब छोटा होगा","प्रतिबिंब की दूरी 20 सेमी से कम होगी और प्रतिबिंब अभिवर्धित होगा","प्रतिबिंब की दूरी 20 सेमी के बराबर होगी और प्रतिबिंब समान आमाप का होगा","प्रतिबिंब की दूरी 20 सेमी से कम होगी और प्रतिबिंब समान आमाप का होगा"],"a":0,"e":["अवतल लेंस के लिए f = –20 सेमी तथा वस्तु दूरी u = –40 सेमी होगी।","लेंस सूत्र 1/v – 1/u = 1/f से v ≈ –13.3 सेमी प्राप्त होता है, जो 20 सेमी से कम है।","आवर्धन m = v/u ≈ 0.33 आता है, अर्थात् प्रतिबिंब वस्तु से छोटा है।","अवतल लेंस सदैव आभासी, सीधा और छोटा प्रतिबिंब ही बनाता है।"]},{"s":"सामान्य विज्ञान","q":"10 सेमी फोकल लंबाई का एक उत्तल दर्पण, 1.4 अपवर्तनांक के तरल के अंदर रखा गया। तरल के अंदर दर्पण की वक्रता त्रिज्या होगीः","o":["10 सेमी","5 सेमी","20 सेमी","14 सेमी"],"a":2,"e":["दर्पण की फोकस दूरी केवल उसकी 75 ज्यामिति (वक्रता त्रिज्या) पर निर्भर करती है।","लेंस के विपरीत, दर्पण की फोकस दूरी माध्यम के अपवर्तनांक से नहीं बदलती।","सूत्र R = 2f के अनुसार R = 2 × 10 = 20 सेमी होगा।","अतः तरल में डुबोने पर भी वक्रता त्रिज्या 20 सेमी ही रहेगी।"]},{"s":"सामान्य विज्ञान","q":"यदि कोई प्रेक्षक (पर्यवेक्षक) समुद्र तल की तुलना में ऊँचाई पर है, तो वायुमंडलीय अपवर्तन के कारण सूर्योदय का अग्रिम समय कैसा होगाः","o":["पर्वत की चोटी पर अधिक होगा","पर्वत की चोटी पर कम होगा","समान होगा","दुगना अधिक होगा"],"a":1,"e":["वायुमंडलीय अपवर्तन के कारण वास्तविक सूर्योदय से लगभग 2 मिनट पूर्व सूर्य दिख जाता है।","यह प्रभाव वायुमंडल के घनत्व एवं प्रेक्षक के ऊपर उपस्थित वायु की मात्रा पर निर्भर करता है।","अधिक ऊँचाई पर वायु विरल होती है, अतः अपवर्तन का प्रभाव घट जाता है।","इसलिए केवल अपवर्तन जनित अग्रिम समय पर्वत की चोटी पर कम होगा।"]},{"s":"सामान्य विज्ञान","q":"साफ आकाश बैंगनी के बजाय नीला क्यों दिखाई देता है, जबकि बैंगनी प्रकाश अधिक प्रकीर्णित होता है?","o":["मानव आँखें नीले रंग के प्रति बैंगनी की तुलना में अधिक संवेदनशील होती हैं।","ओ”ाोन अधिकांश बैंगनी प्रकाश को अवशोषित कर लेता है।","बैंगनी प्रकाश बिल्कुल भी प्रकीर्णित नहीं होता।","ये सभी"],"a":0,"e":["रैले प्रकीर्णन के अनुसार बैंगनी प्रकाश नीले से भी अधिक प्रकीर्णित होता है।","फिर भी सूर्य के प्रकाश में बैंगनी घटक की मात्रा अपेक्षाकृत कम होती है।","मानव नेत्र की शंकु कोशिकाएँ नीले रंग के प्रति अधिक संवेदनशील होती हैं।","इसी संयुक्त कारण से आकाश हमें नीला प्रतीत होता है।"]},{"s":"सामान्य विज्ञान","q":"भारत में पहला परमाणु ऊर्जा संयंत्र कौन-सा है?","o":["काकरापार परमाणु ऊर्जा स्टेशन","कुडनकुलम परमाणु ऊर्जा स्टेशन","नरोरा परमाणु ऊर्जा स्टेशन","तारापुर परमाणु ऊर्जा स्टेशन"],"a":3,"e":["तारापुर परमाणु ऊर्जा स्टेशन भारत का पहला परमाणु बिजलीघर है।","यह महाराष्ट्र के पालघर जिले में स्थित है और वर्ष 1969 में प्रारंभ हुआ था।","इसकी स्थापना अमेरिका के सहयोग से उबलते जल रिएक्टर ( BWR) तकनीक पर हुई।","काकरापार (गुजरात), कुडनकुलम (तमिलनाडु) तथा नरोरा (उत्तर प्रदेश) में स्थित हैं।"]},{"s":"सामान्य विज्ञान","q":"गैल्वेनोमीटर का सिद्धांत क्या है?","o":["एक कुंडली में ईएमएफ उत्पन्न होता है जब इसे परिवर्तनशील चुंबकीय क्षेत्र में रखा जाता है","एक कुंडली में ईएमएफ उत्पन्न होता है जब इसे एक समान चुंबकीय क्षेत्र में रखा जाता है","एक धारावाही कुंडली विक्षेपित होती है जब इसे चुंबकीय क्षेत्र में रखा जाता है","एक कुंडली विक्षेपित होती है जब इसे समान चुंबकीय क्षेत्र में रखा जाता है"],"a":2,"e":["गैल्वेनोमीटर धारा की उपस्थिति एवं दिशा ज्ञात करने का यंत्र है।","इसका सिद्धांत है कि चुंबकीय क्षेत्र में रखी धारावाही कुंडली पर बल आघूर्ण कार्य करता है।","इस बल आघूर्ण के कारण कुंडली घूमती है और सूचक विक्षेपित हो जाता है।","विक्षेप का मान कुंडली में प्रवाहित धारा के समानुपाती होता है।"]},{"s":"सामान्य विज्ञान","q":"सामान्य मानव नेत्र के लिए नीचे दिया गया कौन-सा मापदण्ड स्थिर रहता है?","o":["प्रतिबिंब की दूरी","वस्तु की दूरी","नेत्र लेन्स की फोकल लंबाई","नेत्र लेन्स की क्षमता"],"a":0,"e":["नेत्र लेंस और रेटिना के बीच की दूरी नियत रहती है, अर्थात् प्रतिबिंब दूरी स्थिर है।","वस्तु दूरी बदलने पर स्पष्ट प्रतिबिंब रेटिना पर ही बनना आवश्यक होता है।","इसके लिए सिलियरी मांसपेशियाँ लेंस की वक्रता बदलकर फोकस दूरी को समायोजित करती हैं।","इस गुण क्षमता को समंजन कहते हैं, अतः फोकस दूरी व लेंस की क्षमता दोनों परिवर्तनशील हैं।"]},{"s":"सामान्य विज्ञान","q":"वृत्ताकार इंद्रधनुष पूरी तरह दिखाई नहीं देता क्योंकिः","o":["निचला भाग पृथ्वी द्वारा ढका होता है","प्रकीर्णन पूर्ण वृत्त बनने से रोकता है","केवल आधी बूंदें प्रकाश का प्रकीर्णन करती हैं","सूर्य का प्रकाश आंशिक रूप से ध्रुवित होता है"],"a":0,"e":["इंद्रधनुष वास्तव में एक पूर्ण वृत्त होता है, किंतु पृथ्वी की सतह/क्षितिज उसके निचले भाग को ढक लेती है। 76","इसी कारण भूमि पर खड़े प्रेक्षक को केवल इसका ऊपरी अर्धवृत्त (चाप) ही दिखाई देता है।","हवाई जहाज या ऊँचे पर्वत से देखने पर पूर्ण वृत्ताकार इंद्रधनुष देखा जा सकता है।","इंद्रधनुष जल की बूंदों में प्रकाश के अपवर्तन, वर्षा-बूँद के भीतर परावर्तन “पूर्ण” आंतरिक परावर्तन नहीं होता आंतरिक परावर्तन एवं विक्षेपण से लगभग 42° के कोण पर बनता है।"]},{"s":"सामान्य विज्ञान","q":"एक विद्युत मोटर में कुंडली के घूर्णन की दिशा किस नियम से निर्धारित की जा सकती है?","o":["फ्लेमिंग का दाएँ हाथ का नियम","फ्लेमिंग का बाएँ हाथ का नियम","दाएँ हाथ का अंगूठा नियम","एम्पीयर का नियम"],"a":1,"e":["विद्युत मोटर में कुंडली पर लगने वाले बल तथा घूर्णन की दिशा फ्लेमिंग के बाएँ हाथ के नियम से ज्ञात की जाती है।","इस नियम में तर्जनी चुंबकीय क्षेत्र की दिशा, मध्यमा धारा की दिशा तथा अंगूठा बल/गति की दिशा दर्शाता है।","फ्लेमिंग का दाएँ हाथ का नियम जनरेटर (डायनमो) में प्रेरित धारा की दिशा बताता है।","दाएँ हाथ का अंगूठा नियम धारावाही चालक के चारों ओर चुंबकीय क्षेत्र की दिशा बताता है।"]},{"s":"सामान्य विज्ञान","q":"बहुत ऊँचाई से आकाश काला क्यों दिखाई देता हैः","o":["ऊँचाई पर प्रकीर्णन स्पष्ट नहीं होता, इसलिए आकाश नीले की बजाय काला दिखाई देता है","सूर्य बहुत दूर होता है","बादल नहीं होते","तारे दिन के प्रकाश को ढक लेते हैं"],"a":0,"e":["आकाश का नीला रंग वायुमंडल के अणुओं द्वारा सूर्य के प्रकाश के रैले प्रकीर्णन के कारण दिखाई देता है।","अत्यधिक ऊँचाई पर वायुमंडल अत्यंत विरल हो जाता है, अतः प्रकीर्णन करने वाले अणु बहुत कम रह जाते हैं।","प्रकीर्णन नगण्य होने के कारण वहाँ आकाश नीला न दिखकर काला प्रतीत होता है।","यही कारण है कि अंतरिक्ष यात्रियों को दिन में भी आकाश काला तथा तारे दिखाई देते हैं।"]},{"s":"सामान्य विज्ञान","q":"घरेलू विद्युत परिपथ में स्विच का उद्देश्य क्या होता है?","o":["धारा को नियंत्रित करना","ओवरलोड (अतिभार) से सर्किट की सुरक्षा करना","धारा के प्रवाह को नियंत्रित करना","धारा को मापना"],"a":2,"e":["स्विच एक ऐसी युक्ति है जो परिपथ को जोड़कर या तोड़कर धारा के प्रवाह को नियंत्रित करती है।","स्विच ऑन करने पर परिपथ पूर्ण हो जाता है और धारा प्रवाहित होती है ; ऑफ करने पर परिपथ टूट जाता है।","ओवरलोड एवं शॉर्ट-सर्किट से सुरक्षा का कार्य फ्यूज अथवा एम-सी-बी- करता है, स्विच नहीं।","धारा मापने के लिए अमीटर तथा धारा का मान घटाने-बढ़ाने के लिए रिओस्टेट का उपयोग होता है।"]},{"s":"सामान्य विज्ञान","q":"मंगल ग्रह पर दिन के समय आकाश गुलाबी क्यों दिखाई देता हैः","o":["रेले प्रकीर्णन","धूल प्रकीर्णन","वायुमंडल की अनुपस्थिति","अपवर्तन"],"a":1,"e":["मंगल के वायुमंडल में लौह-ऑक्साइड युक्त महीन धूल कण बड़ी मात्रा में निलंबित रहते हैं।","ये अपेक्षाकृत बड़े कण प्रकाश का प्रकीर्णन इस प्रकार करते हैं कि लाल-गुलाबी वर्ण प्रबल हो जाते हैं।","मंगल का वायुमंडल अत्यंत विरल है, अतः पृथ्वी जैसा रैले प्रकीर्णन वहाँ प्रभावी नहीं होता।","इसी कारण दिन में मंगल का आकाश गुलाबी/बटरस्कॉच रंग का प्रतीत होता है।"]},{"s":"सामान्य विज्ञान","q":"एक उत्तल दर्पण जिसकी फोकस दूरी 15 सेमी है। वस्तु 20 सेमी दूर रखी है। आवर्धन ज्ञात कीजिए।","o":["0.429","0.5","0.333","0.25"],"a":0,"e":["उत्तल दर्पण के लिए f = +15 सेमी तथा u = −20 सेमी लिया जाता है।","दर्पण सूत्र 1/v + 1/u = 1/f से → 1/v = 1/15 (–) (–1/20) = 7/60, अतः v = 60/7 ≈ 8.57 सेमी।","आवर्धन m = −v/u = −(8.57)/(−20) = +0.429 प्राप्त होता है।","धनात्मक एवं 1 से कम मान दर्शाता है कि प्रतिबिंब आभासी, सीधा तथा वस्तु से छोटा है।"]},{"s":"सामान्य विज्ञान","q":"एक उत्तल लेंस द्वारा उल्टा प्रतिबिंब बनता है। इसका आकार वस्तु के बराबर होता है जबः","o":["u = f","u = 2f","u = f/2","u = 3f"],"a":1,"e":["उत्तल लेंस में जब वस्तु ठीक 2f दूरी पर रखी जाती है, तब प्रतिबिंब दूसरी ओर 2f पर बनता है।","यह प्रतिबिंब वास्तविक, उल्टा तथा वस्तु के आकार के ठीक बराबर होता है।","इस स्थिति में आवर्धन का मान m = −1 होता है। 77","u = f पर प्रतिबिंब अनंत पर बनता हैै, तथा u < f पर आभासी एवं सीधा प्रतिबिंब बनता है।"]},{"s":"सामान्य विज्ञान","q":"विद्युतचुंबक में नरम लोहा (सॉफ्ट आयरन) कोर का उपयोग करने का उद्देश्य क्या होता है?","o":["चुंबकीय क्षेत्र की तीव्रता बढ़ाना","प्रतिरोध को कम करना","वोल्टेज बढ़ाना","धारा को कम करना"],"a":0,"e":["नरम लोहे की चुंबकीय पारगम्यता बहुत अधिक होती है।","कुंडली के भीतर इसे रखने पर चुंबकीय बल रेखाएँ संकेंद्रित हो जाती हैं और क्षेत्र की तीव्रता कई गुना बढ़ जाती है।","नरम लोहा शीघ्र चुंबकित तथा धारा बंद होते ही विचुंबकित हो जाता है, जो विद्युतचुंबक के लिए आदर्श गुण है।","इस्पात (Steel) को स्थायी चुंबक बनाने में प्रयोग किया जाता है, विद्युतचुंबक में नहीं।"]},{"s":"सामान्य विज्ञान","q":"एक साइकिल डायनामो हेडलैम्प को बिजली देने के लिए एक छोटा जनरेटर उपयोग करता है। जब गति कम होती है, तो लैंप की रोशनी मंद पड़ जाती है। इस व्यवहार को कौन-सा कारण स्पष्ट करता है?","o":["कुंडली के पेफरों की संख्या में कमी","चुंबकीय क्षेत्र की तीव्रता में कमी","तार का प्रतिरोध बढ़ जाना","चुंबकीय फ्लक्स के परिवर्तन की दर में कमी"],"a":3,"e":["पैफराडे के विद्युत चुंबकीय प्रेरण नियम के अनुसार प्रेरित विद्युत वाहक बल (EMF) चुंबकीय फ्लक्स के परिवर्तन की दर के समानुपाती होता है।","साइकिल की गति घटने पर डायनामो की कुंडली धीमी घूमती है, अतः फ्लक्स परिवर्तन की दर घट जाती है।","इससे प्रेरित विद्युत वाहक बल तथा धारा दोनों कम हो जाते हैं और बल्ब मंद जलने लगता है।","कुंडली के पेफरे, चुंबक की तीव्रता तथा तार का प्रतिरोध गति के साथ नहीं बदलते।"]},{"s":"सामान्य विज्ञान","q":"फ्यू”ा तार बनाने के लिए सामान्यतः किस पदार्थ का उपयोग किया जाता हैः","o":["तांबा","एल्युमिनियम","केवल सीसा","सीसा और टिन की एक मिश्र धातु"],"a":3,"e":["फ्यू”ा तार सामान्यतः सीसा और टिन की मिश्र धातु से बनाया जाता है।","इस मिश्र धातु का गलनांक कम तथा प्रतिरोधकता अपेक्षाकृत अधिक होती है।","अत्यधिक धारा प्रवाहित होने पर यह तार शीघ्र पिघलकर परिपथ को तोड़ देता है।","इससे उपकरण शॉर्ट-सर्किट एवं ओवरलोड से सुरक्षित रहते हैं।"]},{"s":"सामान्य विज्ञान","q":"आंख का कौन-सा भाग प्रमुख रूप से प्रकाश को फोकस करने की शक्ति प्रदान करता है?","o":["कॉर्निया","एक्वस ह्यूमर (जलीय द्रव)","लेंस","विट्रियस ह्यूमर (काचाभ द्रव)"],"a":0,"e":["आँख में प्रकाश का सर्वाधिक अपवर्तन वायु एवं कॉर्निया की सीमा-सतह पर होता है।","कॉर्निया आँख की कुल फोकसिंग शक्ति का लगभग दो-तिहाई भाग (लगभग 40 डायोप्टर) प्रदान करता है।","नेत्र लेंस शेष लगभग एक-तिहाई क्षमता देता है, परंतु उसकी विशेषता यह है कि वह समंजन कर सकता है।","जलीय एवं काचाभ द्रव मुख्यतः नेत्र गोलक का आकार व दाब बनाए रखते हैं, वे फोकसिंग में नगण्य योगदान देते हैं।"]},{"s":"सामान्य विज्ञान","q":"एक परिपथ में, यदि वोल्टेज को तीन गुना कर दिया जाए और प्रतिरोध को दोगुना कर दिया जाए, तो धारा पर क्या प्रभाव पड़ेगा?","o":["50% की वृद्धि","150% की वृद्धि","200% की वृद्धि","अपरिवर्तित रहेगी"],"a":0,"e":["ओम के नियम के अनुसार धारा I = V/R होती है।","नई धारा I′ = 3V / 2R = 1.5 × (V/R) = 1.5 I प्राप्त होती है।","अर्थात नई धारा मूल धारा की 1.5 गुना है, जो (1.5 – 1.0 = 0.5 अर्थात् ) 50% की वृद्धि दर्शाती है।"]},{"s":"सामान्य विज्ञान","q":"प्रतिरोध R के दो समान तारों को, श्रेणीक्रम में और फिर वैकल्पिक रूप से समांतरक्रम में जोड़ा गया है। तुल्य प्रतिरोधों का अनुपात (श्रेणी ः समांतर) हैः","o":["2:1","1:2","4:1","2:3"],"a":2,"e":["श्रेणीक्रम में दो समान प्रतिरोधों का तुल्य प्रतिरोध R + R = 2R होता है।","समांतरक्रम में तुल्य प्रतिरोध 1/Rp = 1/R + 1/R से Rp = R/2 प्राप्त होता है।","अतः अभीष्ट अनुपात = 2R : (R/2) = 4 : 1 होगा।","यही कारण है कि श्रेणीक्रम कुल प्रतिरोध बढ़ाता है जबकि समांतरक्रम उसे घटा देता है।"]},{"s":"सामान्य विज्ञान","q":"अतिचालकता (सुपरकंडक्टिविटी) प्रतिरोध को शून्य क्यों बना देती है?","o":["इलेक्ट्रॉन बिना टकराव के प्रवाहित होते हैं","पदार्थ सिकुड़ता है 78","प्रतिरोधकता अत्यधिक बढ़ जाती है","तापमान गुणांक अनंत हो जाता है"],"a":0,"e":["क्रांतिक ताप (Critical Temperature) से नीचे कुछ पदार्थ अतिचालक बन जाते हैं और उनका विद्युत प्रतिरोध पूर्णतः शून्य हो जाता है।","BCS सिद्धांत के अनुसार इलेक्ट्रॉन ‘कूपर युग्म’ बनाकर जालक के साथ ऊर्जा-क्षयकारी टकराव किए बिना प्रवाहित होते हैं।","टकराव न होने से ऊष्मा के रूप में ऊर्जा हानि नहीं होती और धारा बिना ह्रास के बहती रहती है।","अतिचालक पदार्थ चुंबकीय क्षेत्र को बाहर धकेलने वाला मेस्नर प्रभाव भी प्रदर्शित करते हैं।"]},{"s":"सामान्य विज्ञान","q":"एक विद्युत स्टेशन में डीसी जनरेटर को एसी जनरेटर से बदल दिया जाता है। विद्युत संचरण के संदर्भ में इसका प्रमुख लाभ क्या है?","o":["स्थिर धारा प्रवाह","ऊर्जा की कोई हानि नहीं","ट्रांसफार्मर का उपयोग करके वोल्टेज स्तरों का आसान रूपांतरण","चुंबकीय क्षेत्र की आवश्यकता नहीं"],"a":2,"e":["प्रत्यावर्ती धारा ( AC) को ट्रांसफार्मर द्वारा सरलता से उच्च या निम्न वोल्टेज में बदला जा सकता है।","उच्च वोल्टेज पर संचरण करने से धारा घट जाती है और I2R के रूप में होने वाली ऊर्जा हानि अत्यंत कम हो जाती है।","साधारण ट्रांसफार्मर दिष्ट धारा ( DC) पर कार्य नहीं करता, क्योंकि उसमें फ्लक्स परिवर्तन नहीं होता।","यही कारण है कि लंबी दूरी के विद्युत संचरण में AC प्रणाली का उपयोग किया जाता है।"]},{"s":"सामान्य विज्ञान","q":"कौन-सा संरचनात्मक अनुकूलन यह सुनिश्चित करता है कि आँख के अंदर प्रकाश सबसे कम संख्या में सतहों से होकर गु”ारे?","o":["पारदर्शी ह्यूमर (द्रव)","गोलाकार लेंस","वर्णक युक्त कोरॉइड","अपारदर्शी आईरिस"],"a":0,"e":["आँख के भीतर उपस्थित जलीय द्रव ( aqueous humour) तथा काचाभ द्रव ( vitreous humour) पूर्णतः पारदर्शी होते हैं।","इनका अपवर्तनांक लगभग जल के समान होने से प्रकाश को अनेक अतिरिक्त सतहों पर अपवर्तन नहीं झेलना पड़ता।","इससे प्रकाश न्यूनतम प्रकीर्णन एवं ऊर्जा हानि के साथ सीधे रेटिना तक पहुँच जाता है।","कोरॉइड का वर्णक आंतरिक परावर्तन रोकता है और आईरिस प्रकाश की मात्रा नियंत्रित करती है – ये फोकसिंग पथ नहीं घटाते।"]},{"s":"सामान्य विज्ञान","q":"यदि रेटिना अलग हो जाए, तो कौन-सा कार्य सीधे तौर पर प्रभावित होता है?","o":["अपवर्तन","समायोजन","तंत्रिका संकेतों का संप्रेषण","प्रकाश प्रवेश का नियमन"],"a":2,"e":["रेटिना में उपस्थित शलाका ( Rod) एवं शंकु (Cone) कोशिकाएँ प्रकाश को विद्युत-तंत्रिका संकेतों में परिवर्तित करती हैं।","ये संकेत दृक तंत्रिका ( Optic nerve) के माध्यम से मस्तिष्क तक पहुँचकर दृष्टि बोध कराते हैं।","रेटिना के अलग होने पर संकेत निर्माण एवं संप्रेषण सीधे बाधित हो जाता है और दृष्टि चली जाती है।","अपवर्तन का कार्य कॉर्निया व लेंस का तथा समंजन का कार्य सिलियरी पेशियों का होता है।"]},{"s":"सामान्य विज्ञान","q":"एक पतला लेंस 5 सेमी ऊँचाई वाली वस्तु का वास्तविक प्रतिबिंब बनाता है। प्रतिबिंब उल्टा है और उसकी ऊँचाई 15 सेमी है। यदि प्रतिबिंब लेंस से 90 सेमी की दूरी पर बनता है, तो वस्तु की दूरी और लेंस की फोकस दूरी क्या होगी?","o":["u = −30 सेमी, f = 22.5 सेमी","u = −30 सेमी, f = 23 सेमी","u = −40 सेमी, f = 22.5 सेमी","u = −40 सेमी, f = 32.5 सेमी"],"a":0,"e":["आवर्धन m = h′/h = −15/5 = −3 ( ऋण चिह्न उल्टे व वास्तविक प्रतिबिंब को दर्शाता है)।","m = v/u से u = v/m = 90/(−3) = −30 सेमी प्राप्त होता है।","लेंस सूत्र 1/f = 1/v − 1/u में मान रखने पर 1/f = 1/90 − 1/(−30) = 1/90 + 3/90 = 4/90 ।","अतः f = 90/4 = 22.5 सेमी ; यह उत्तल लेंस है क्योंकि f धनात्मक है।"]},{"s":"सामान्य विज्ञान","q":"लोहे का बुरादा एक छड़ चुंबक के चारों ओर वक्र आकृति में क्यों व्यवस्थित हो जाता हैं?","o":["क्योंकि बुरादे की दिशा पहले से तय होती है","क्योंकि बुरादा प्रतिकर्षण अनुभव करता हैं","क्योंकि बुरादे का प्रत्येक कण एक छोटे चुंबक की तरह बन जाता है और क्षेत्र रेखाओं के अनुदिश संरेखित हो जाता है","क्योंकि लोहे का बुरादा छड़ चुंबक को प्रतिकर्षित करता हैं"],"a":2,"e":["चुंबकीय क्षेत्र में रखने पर लोहे की प्रत्येक कण चुंबकीय प्रेरण द्वारा एक छोटा चुंबक बन जाता है।","ये छोटे चुंबक क्षेत्र की दिशा में संरेखित होकर सिरे-से-सिरा जुड़ते चले जाते हैं।","इसी कारण चुंबक के चारों ओर वक्राकार पैटर्न बनता है, जो चुंबकीय बल रेखाओं को दर्शाता है।","ये बल रेखाएँ चुंबक के बाहर उत्तरी ध्रुव से निकलकर दक्षिणी ध्रुव में प्रवेश करती हैं और कभी एक-दूसरे को काटती नहीं।"]},{"s":"सामान्य विज्ञान","q":"धारा-वाहक सोलेनॉइड (परिनालिका) के अंदर चुंबकीय क्षेत्र की तीव्रता कैसी होती है?","o":["केंद्र पर शून्य होती है","लंबाई के अनुदिश बदलती रहती है","एकसमान और अक्ष के समांतर होती है","सिरों पर अधिक प्रबल होती है"],"a":2,"e":["लंबी धारावाही परिनालिका के भीतर चुंबकीय क्षेत्र एकसमान होता है तथा उसकी अक्ष के समांतर रहता है।","इसका मान B = μ nI होता है, जहाँ n 0 प्रति इकाई लंबाई में पेफरों की संख्या तथा I धारा है।","परिनालिका के सिरों पर क्षेत्र घटकर लगभग आधा ( μ nI/2) रह जाता है। 0","इसी कारण धारावाही परिनालिका का बाह्य व्यवहार एक छड़ चुंबक जैसा होता है।"]},{"s":"सामान्य विज्ञान","q":"एक हाइपरमेट्रोपिक (दूर दृष्टि दोष) आँख का निकट बिंदु 3 मीटर है। यदि व्यक्ति को 25 सेंटीमीटर की दूरी पर पढ़ना है, तो उसे कितनी क्षमता वाला लेंस चाहिए?","o":["+3.7 D","+4.00 D","+5.00 D","+2.7 D"],"a":0,"e":["दीर्घदृष्टि दोष के निवारण हेतु उत्तल (धनात्मक शक्ति वाला) लेंस प्रयुक्त होता है।","यहाँ वस्तु दूरी u = –25 सेमी तथा प्रतिबिंब दूरी v = –300 सेमी (निकट बिंदु पर) है।","लेंस सूत्र 1/f = 1/v – 1/u मेंे, 1/f = (–1/300) + (1/–25) (यहाँ सूत्र के अनुसार 1/f = – 1/300 – (1/25 ) = – 1/300 + 1/25 होगा) =11/300","अतः f = 300/11 सेमी ≈ + 27.3 सेमी = +0.273 मीटर।","शक्ति P = 1/f ( मीटर में) = 1/0.273 ≈ +3.67 D, अर्थात् लगभग रू 3.7 D ।"]},{"s":"सामान्य विज्ञान","q":"यदि किसी काँच की पट्टी (स्लैब) में पाश्र्व विस्थापन दोगुना हो जाए, तो मोटाई को क्या करना होगा?","o":["दोगुना","आधा","चार गुना बढ़ाना होगा","अपरिवर्तित"],"a":0,"e":["काँच की समांतर पट्टी से गुजरने पर निर्गत किरण आपतित किरण के समांतर किंतु पाश्र्व रूप से विस्थापित होती है।","पाश्र्व विस्थापन d = t·sin(i–r)/cos r होता है, जहाँ t पट्टी की मोटाई है।","आपतन कोण स्थिर रहने पर पाश्र्व विस्थापन सीधे मोटाई के समानुपाती होता है।","अतः विस्थापन दोगुना करने के लिए मोटाई भी दोगुनी करनी होगी।"]},{"s":"सामान्य विज्ञान","q":"एक 200 वॉट का बल्ब प्रतिदिन 5 घंटे उपयोग किया जाता है। बल्ब को चलाने की दैनिक लागत रु- 1.80 है। बिजली की 1 यूनिट की लागत कितनी है?","o":["3 रुपये","2 रुपये","1.80 रुपये","1 रुपये"],"a":2,"e":["विद्युत ऊर्जा = शक्ति × समय = 200 वॉट × 5 घंटे = 1000 वॉट-घंटा।","1000 वॉट-घंटा = 1 किलोवॉट-घंटा ( kWh), जिसे विद्युत की 1 यूनिट कहा जाता है।","अर्थात् बल्ब प्रतिदिन ठीक 1 यूनिट बिजली की खपत करता है।","चूँकि दैनिक लागत रु- 1.80 है, अतः 1 यूनिट की लागत भी रु- 1.80 ही होगी।"]},{"s":"सामान्य विज्ञान","q":"एक मोटर में, यदि चुंबकीय क्षेत्र पृष्ठ की ओर निर्देशित हो (पृष्ठ के अंदर) और धारा बाएँ से दाएँ प्रवाहित हो, तो बल की दिशा क्या होगी?","o":["पृष्ठ के अंदर की ओर","पृष्ठ के बाहर की ओर","नीचे की ओर","ऊपर की ओर"],"a":3,"e":["धारावाही चालक पर बल की दिशा फ्लेमिंग के वाम-हस्त नियम से ज्ञात की जाती है।","बाएँ हाथ की तर्जनी को क्षेत्र (पृष्ठ के अंदर) तथा मध्यमा को धारा (बाएँ से दाएँ) की दिशा में रखें।","तब अँगूठा जिस दिशा में संकेत करेगा, वही बल की दिशा होगी – यहाँ ऊपर की ओर।","सदिश रूप में F = I(L × B) से भी परिणाम ऊध्र्वाधर ऊपर की ओर प्राप्त होता है।"]},{"s":"सामान्य विज्ञान","q":"यदि पृथ्वी के वायुमंडल में गैस अणुओं के स्थान पर बड़े धूलकण होते, तो क्या होता?","o":["आकाश अधिक नीला दिखाई देता","आकाश लाल दिखाई देता","प्रकीर्णन तरंगदैध्र्य पर निर्भर नहीं करता, और आकाश सपेफद दिखाई देता","कोई प्रकीर्णन नहीं होता"],"a":2,"e":["आकाश का नीला रंग रैले प्रकीर्णन के कारण होता है, जिसमें प्रकीर्णन ∝ 1/λ4 होता है। 80","रैले प्रकीर्णन तभी लागू होता है जब कण का आकार प्रकाश की तरंगदैध्र्य से बहुत छोटा हो।","बड़े धूलकणों की स्थिति में ‘माई प्रकीर्णन’ होता है, जो तरंगदैध्र्य पर निर्भर नहीं करता।","सभी रंगों के समान प्रकीर्णन से आकाश सपेफद दिखाई देगा – जैसे बादल या कोहरा सपेफद दिखते हैं।"]},{"s":"सामान्य विज्ञान","q":"यदि किसी व्यक्ति की दूर दृष्टि सीमा उसकी आंखों के सामने 50 सेंटीमीटर है (अर्थात वह 50 सेंटीमीटर से दूर नहीं देख सकता), तो दूर की दृष्टि को सुधारने के लिए कितनी क्षमता वाला अवतल लेंस आवश्यक होगा?","o":["–2 D","–1 D","–0.5 D","–3 D"],"a":0,"e":["निकट दृष्टि दोष (मायोपिया) में दूर बिंदु अनंत के स्थान पर सीमित दूरी पर आ जाता है।","इसके निवारण हेतु ऐसा अवतल लेंस चाहिए जो अनंत की वस्तु का प्रतिबिंब दूर बिंदु पर बनाए।","अतः फोकस दूरी f = –50 सेमी = –0.5 मीटर होगी।","क्षमता P = 1/f = 1/(–0.5) = –2 डायोप्टर, अर्थात् – 2 D शक्ति का अवतल लेंस आवश्यक है।"]},{"s":"सामान्य विज्ञान","q":"एक 100 W, 220 V का लैम्प और एक 60 W, 220 V का लैम्प श्रेणीक्रम में 220 V की आपूर्ति से जोड़े गए हैं। इस श्रृंखला संयोजन में प्रवाहित धारा क्या होगी?","o":["100 W लैंप धारा","60 W लैंप धारा","प्रत्येक लैम्प को अलग-अलग जोड़ने पर मिलने वाली धारा से कम","प्रत्येक लैम्प को अलग-अलग जोड़ने पर मिलने वाली धारा से अधिक"],"a":2,"e":["100 W लैम्प का प्रतिरोध = V2/P = 2202/100 = 484 Ω तथा 60 W लैम्प का = 2202/60 ≈ 806.7 Ω ।","श्रेणीक्रम में कुल प्रतिरोध दोनों के योग के बराबर = लगभग 1290.7 Ω हो जाता है।","220 V पर धारा = 220/1290.7 ≈ 0.17 A, जबकि अकेले जोड़ने पर धाराएँ 0.45 A और 0.27 A होतीं।","अतः श्रेणीक्रम में प्रवाहित धारा दोनों की अलग-अलग धाराओं से कम होती है।"]},{"s":"सामान्य विज्ञान","q":"किसी उपकरण द्वारा खपत की गई ऊर्जा किससे स्वतंत्र होती है?","o":["वोल्टेज","धारा","समय","प्रतिरोध"],"a":3,"e":["विद्युत ऊर्जा की मूल परिभाषा W = V × I × t है।","इस संबंध में ऊर्जा केवल वोल्टेज, धारा एवं समय पर निर्भर करती है।","प्रतिरोध इस सूत्र में स्पष्ट रूप से नहीं आता, अतः दिए गए विकल्पों में उत्तर प्रतिरोध है।","यद्यपि W = I2Rt तथा W = (V2/R)t रूपों में R आता है, किंतु वह ओम के नियम से V एवं I में ही निहित है।"]},{"s":"सामान्य विज्ञान","q":"विक्षेपण (वर्ण-विक्षेपण) के बारे में निम्नलिखित में से कौन-सा कथन गलत है?","o":["विक्षेपण श्वेत प्रकाश का उसके घटक रंगों में विभाजन है।","यह विभिन्न तरंगदैध्र्य के लिए विभिन्न अपवर्तनांक के कारण होता है।","विक्षेपण हमेशा बैंगनी प्रकाश की तुलना में लाल प्रकाश के लिए विचलन को अधिक बढ़ाता है।","एक दूसरा समान प्रिज्म वर्णक्रम को उलट सकता है।"],"a":2,"e":["वर्ण-विक्षेपण में श्वेत प्रकाश अपने सात घटक रंगों में विभाजित हो जाता है।","यह इसलिए होता है क्योंकि माध्यम का अपवर्तनांक तरंगदैध्र्य के साथ बदलता है ( μ ∝ 1/λ2 )।","बैंगनी की तरंगदैध्र्य सबसे कम होने से उसका अपवर्तनांक अधिक और विचलन सर्वाधिक होता है।","अतः ‘लाल प्रकाश का विचलन अधिक होता है’ कथन गलत है – लाल का विचलन सबसे कम होता है।"]},{"s":"सामान्य विज्ञान","q":"एक छात्रा अपना दायाँ अंगूठा ऊपर की ओर रखती है और उंगलियों को मोड़ती है। वह देखती है कि उंगलियाँ पूर्व दिशा की ओर हैं। तो धारा किस दिशा में प्रवाहित हो रही होगीः","o":["पूर्व","पश्चिम","ऊपर की ओर","नीचे की ओर"],"a":2,"e":["सीधे धारावाही चालक के लिए मैक्सवेल के दाहिने हाथ के अंगूठे का नियम लागू होता है।","इस नियम में पैफलाया गया अंगूठा धारा की दिशा को दर्शाता है।","मुड़ी हुई उंगलियाँ चालक के चारों ओर उत्पन्न चुंबकीय क्षेत्र रेखाओं की दिशा बताती हैं।","यहाँ अंगूठा ऊपर की ओर है, अतः धारा ऊपर की ओर प्रवाहित हो रही है।"]},{"s":"सामान्य विज्ञान","q":"किस स्थिति में आँख का दूर बिंदु अनंत से अधिक निकट (सीमित दूरी पर) आ जाता है?","o":["हाइपरमेट्रोपिया (दीर्घदृष्टि)","मायोपिया (निकट दृष्टि)","प्रेसबायोपिया (जरादूरदृष्टि)","एस्टिग्मैटि”म (दृष्टिवैषम्य)"],"a":1,"e":["मायोपिया अर्थात् निकट दृष्टि दोष में आँख का दूर बिंदु अनंत के स्थान पर सीमित दूरी पर आ जाता है।","इसका कारण नेत्रगोलक का लंबा हो जाना या नेत्र लेंस की फोकस दूरी कम हो जाना है।","इस दोष में दूर की वस्तु का प्रतिबिंब रेटिना के पहले बन जाता है, अतः वस्तु धुँधली दिखती है।","उपयुक्त क्षमता के अवतल (अपसारी) लेंस के प्रयोग से इस दोष का संशोधन किया जाता है।"]},{"s":"सामान्य विज्ञान","q":"किसी तार का प्रतिरोध निम्न में से किसके व्युत्क्रमानुपाती होता है?","o":["लंबाई","प्रतिरोधकता","अनुप्रस्थ काट क्षेत्रफल","तापमान"],"a":2,"e":["किसी तार का प्रतिरोध सूत्र R = ρL/A द्वारा व्यक्त किया जाता है।","इसमें प्रतिरोध तार की लंबाई ( L) के समानुपाती तथा अनुप्रस्थ काट क्षेत्रफल ( A) के व्युत्क्रमानुपाती होता है।","प्रतिरोधकता ρ पदार्थ की प्रकृति और ताप पर निर्भर करती है, तार की माप पर नहीं।","यही कारण है कि मोटा तार पतले तार की तुलना में कम प्रतिरोध प्रदान करता है।"]},{"s":"सामान्य विज्ञान","q":"एक एसी जनरेटर में प्रेरित धारा की दिशा क्यों बदलती रहती है?","o":["बाहरी परिपथ खुला होता है","कुंडली स्थिर होती है","चुंबकीय क्षेत्र स्थिर होता है","कुंडली निरंतर घूमती रहती है"],"a":3,"e":["प्रत्यावर्ती धारा जनित्र में आयताकार कुंडली चुंबकीय क्षेत्र में लगातार घूर्णन करती रहती है।","प्रत्येक आधे चक्कर के बाद कुंडली की भुजाओं की गति की दिशा चुंबकीय क्षेत्र के सापेक्ष उलट जाती है।","फ्लेमिंग के दायें हाथ के नियम के अनुसार इससे प्रेरित धारा की दिशा भी विपरीत हो जाती है।","इसी कारण जनित्र का निर्गत प्रत्यावर्ती ( AC) होता है (जबकि दिष्ट धारा या DC प्राप्त करने के लिए स्प्लिट रिंग कम्यूटेअर लगाया जाता है।)"]},{"s":"सामान्य विज्ञान","q":"वायुमंडल में कौन-सी गैस रेले प्रकीर्णन में सबसे अधिक योगदान देती है?","o":["CO","N और O 2 2 2","आर्गन","जल वाष्प"],"a":1,"e":["रेले प्रकीर्णन तब होता है जब प्रकीर्णक कण का आकार प्रकाश की तरंगदैघ्र्य से बहुत छोटा हो।","वायुमंडल में नाइट्रोजन (लगभग 78%) और ऑक्सीजन (लगभग 21%) की प्रधानता है, अतः प्रकीर्णन में इन्हीं का योगदान सर्वाधिक है।","प्रकीर्णन की तीव्रता तरंगदैघ्र्य की चौथी घात के व्युत्क्रमानुपाती ( I ∝ 1/λ4 ) होती है।","इसी कारण कम तरंगदैघ्र्य वाला नीला प्रकाश अधिक प्रकीर्णित होता है और आकाश नीला दिखाई देता है।"]},{"s":"सामान्य विज्ञान","q":"एक छड़ चुंबक को दो बराबर भागों में काटा जाता है, तोः","o":["दोनों भाग अलग क्षमता के चुंबक बन जायेंगे","एक हिस्सा दक्षिण ध्रुव और दूसरा उत्तरी ध्रुव बन जाएगा","दोनों भाग समान क्षमता के चुंबक बन जाएंगे","दोनों हिस्सों का चुंबकत्व खो जाएगा"],"a":2,"e":["चुंबक को काटने पर प्रत्येक टुकड़ा एक स्वतंत्र चुंबक बन जाता है जिसमें उत्तर व दक्षिण दोनों ध्रुव होते हैं।","पृथक चुंबकीय एकल ध्रुव (मोनोपोल) प्राप्त करना संभव नहीं है, यही चुंबकत्व का मूल गुण है।","बराबर भागों में काटने पर दोनों टुकड़ों का ध्रुव-सामथ्र्य समान बना रहता है।","केवल लंबाई घटने से प्रत्येक टुकड़े का चुंबकीय आघूर्ण आधा रह जाता है, चुंबकत्व समाप्त नहीं होता।"]},{"s":"सामान्य विज्ञान","q":"एक उत्तल दर्पण की वक्रता त्रिज्या 80 सेमी है। वस्तु की दूरी 40 सेमी है। प्रतिबिंब की दूरी ज्ञात कीजिए।","o":["26.67 सेमी","30 सेमी","35 सेमी","20 सेमी"],"a":3,"e":["उत्तल दर्पण के लिए फोकस दूरी f = R/2 = 80/2 = +40 सेमी होती है (चिह्न परिपाटी के अनुसार धनात्मक)।","दर्पण सूत्र 1/v + 1/u = 1/f में u = –40 सेमी तथा f = +40 सेमी रखने पर 1/v = 1/40 (–) (– 1/40) प्राप्त होता है।","इससे v = +20 सेमी मिलता है, अर्थात् प्रतिबिंब दर्पण के पीछे 20 सेमी की दूरी पर बनता है।","उत्तल दर्पण में बना यह प्रतिबिंब सदैव आभासी, सीधा तथा वस्तु से छोटा होता है।"]},{"s":"सामान्य विज्ञान","q":"रेगिस्तान में मृगतृष्णा बनने का कारण होता हैः","o":["प्रकीर्णन","परिक्षेपण (डिस्पर्शन)","पूर्ण आंतरिक परावर्तन","व्यतिकरण"],"a":2,"e":["गर्म रेगिस्तान में भूमि के निकट की वायु गर्म एवं विरल तथा ऊपर की वायु ठंडी एवं सघन होती है।","सघन से विरल माध्यम में जाती हुई प्रकाश किरण क्रमशः अपवर्तित होकर क्रांतिक कोण को पार कर जाती है। 82","इसके बाद पूर्ण आंतरिक परावर्तन होता है और आकाश का प्रतिबिंब भूमि पर जल जैसा दिखाई देने लगता है।","इसी दृश्य भ्रम को मृगतृष्णा या मिराज कहा जाता है।"]},{"s":"सामान्य विज्ञान","q":"एक प्रकाश किरण किसी मोटाई वाली कांच की पट्टी से अपवर्तित होती है। यदि आपतन कोण निर्गमन कोण के बराबर हो, तोः","o":["कोई पाश्र्व विस्थापन नहीं होता","पाश्र्व विस्थापन कोण पर निर्भर नहीं करता","निर्गमन किरण समानांतर है लेकिन विस्थापित है","निर्गमन किरण आपतित किरण के साथ विस्थापित है"],"a":2,"e":["आयताकार काँच की पट्टी में प्रकाश दो बार अपवर्तित होता है – प्रवेश करते समय और बाहर निकलते समय।","पट्टी की दोनों सतहें समानांतर होने के कारण निर्गमन किरण आपतित किरण के समानांतर ही रहती है।","किंतु वह अपने मूल पथ से कुछ हटकर निकलती है, इस विस्थापन को पाश्र्व विस्थापन कहते हैं।","पाश्र्व विस्थापन पट्टी की मोटाई तथा आपतन कोण बढ़ने पर बढ़ता है, अतः वह शून्य या कोण-निरपेक्ष नहीं होता।"]},{"s":"सामान्य विज्ञान","q":"बिजली की खपत की गणना करते समय पावर रेटिंग और संचालन समय दोनों को ध्यान में रखना क्यों महत्वपूर्ण है?","o":["वे बिजली की लागत निर्धारित करते हैं","वे उपकरण की दक्षता निर्धारित करते हैं","वे उपकरण की आयु निर्धारित करते हैं","वे वोल्टेज स्थिरता को प्रभावित करते हैं"],"a":0,"e":["विद्युत ऊर्जा की खपत = शक्ति × समय होती है, जिसे किलोवाट-घंटा अर्थात् “यूनिट” में मापा जाता है।","केवल पावर रेटिंग या केवल संचालन समय जान लेने से वास्तविक खपत का आकलन संभव नहीं है।","बिजली का बिल खपत की गई यूनिटों के आधार पर बनता है, इसलिए दोनों राशियाँ आवश्यक हैं।","उपकरण की दक्षता, आयु या वोल्टेज स्थिरता से इस गणना का सीधा संबंध नहीं है।"]},{"s":"सामान्य विज्ञान","q":"आकाश के नीले रंग के लिए उत्तरदायी परिघटना हैः","o":["प्रकाश का परिक्षेपण","प्रकाश का परावर्तन","प्रकाश का अपवर्तन","प्रकाश का प्रकीर्णन"],"a":3,"e":["वायुमंडल के अत्यंत सूक्ष्म अणु सूर्य के श्वेत प्रकाश का प्रकीर्णन करते हैं।","रेले के नियम के अनुसार प्रकीर्णन तरंगदैघ्र्य की चौथी घात के व्युत्क्रमानुपाती होता है।","नीले प्रकाश की तरंगदैघ्र्य कम होने से वह अधिक प्रकीर्णित होकर चारों ओर से हमारी आँखों तक पहुँचता है।","सूर्योदय एवं सूर्यास्त के समय प्रकाश का मार्ग लंबा होने से नीला प्रकाश रास्ते में ही प्रकीर्णित होकर छँट जाता है और लाल रंग दिखाई देता है।"]},{"s":"सामान्य विज्ञान","q":"किसी व्यक्ति का निकट बिंदु 100 सेंटीमीटर है। यदि वह 25 सेंटीमीटर की दूरी पर किताब पढ़ना चाहता है, तो उसे कितनी क्षमता वाला लेंस चाहिए?","o":["+4 D","+3 D","+2.50 D","+1.50 D"],"a":1,"e":["दिया है, निकट बिंदु = –100 सेमी और वस्तु दूरी = –25 सेमी।","लेंस को आभासी प्रतिबिंब 100 सेमी पर बनाना होगा।","लेंस सूत्र 1/f = 1/v – 1/u से 1/f = 1/ (–100) – 1/(–25) = –1/100 + 4/100 = 3/100","फोकस दूरी f = 100/3 सेमी अर्थात् 1/3 मीटर प्राप्त होती है।","अतः लेंस की क्षमता P = 1/f = +3 डायोप्टर है।"]},{"s":"सामान्य विज्ञान","q":"यदि सूर्य सपेफद के बजाय बैंगनी होता, तो आकाश का रंग कैसा दिखाई देता?","o":["पीला","लाल","बैंगनी","सपेफद"],"a":2,"e":["आकाश का नीला रंग मुख्यतः प्रकाश के प्रकीर्णन के कारण दिखाई देता है।","कम तरंगदैध्र्य वाला प्रकाश अधिक प्रकीर्णित होता है।","बैंगनी प्रकाश की तरंगदैध्र्य दृश्यमान प्रकाश में बहुत कम होती है। (और यदि सूर्य का मूल रंग ही बैंगनी होता , तो बैंगनी रंग ही प्रकीर्णित होता)।"]},{"s":"सामान्य विज्ञान","q":"स्वच्छ आकाश का रंग क्षितिज के पास नीले से सपेफद क्यों हो जाता है?","o":["अधिक अणु समान रूप से प्रकीर्णित करते हैं","प्रकाश का पथ लंबा हो जाता है जिससे बहु-प्रकीर्णन होता है","परिक्षेपण होता है","प्रकाश अवशोषित हो जाता है"],"a":1,"e":["क्षितिज के पास सूर्य का प्रकाश वायुमंडल में अधिक लंबा पथ तय करता है।","इससे प्रकाश का बहु-प्रकीर्णन अधिक प्रभावी हो जाता है।","विभिन्न तरंगदैध्र्यों का मिश्रित प्रकीर्णन सपेफदपन बढ़ाता है। 83","इसी कारण क्षितिज के पास आकाश नीले के बजाय सपेफद-सा दिखाई दे सकता है।"]},{"s":"सामान्य विज्ञान","q":"टंगस्टन फिलामेंट बल्ब का V-I ग्राफ सीधी रेखा का न होकर मुड़ता है। इसका सही कारण क्या है?","o":["उच्च वोल्टेज पर मुक्त इलेक्ट्रॉन घनत्व घटता है","टंगस्टन की प्रतिरोधकता तापमान के साथ बढ़ती है","उच्च धारा पर इलेक्ट्रॉन कम टकराते हैं","फिलामेंट पर परावैद्युत भंजन होता है"],"a":1,"e":["टंगस्टन फिलामेंट में धारा बढ़ने पर तापमान बहुत बढ़ जाता है।","टंगस्टन (धातु होने के कारण) की प्रतिरोधकता तापमान बढ़ने के साथ बढ़ती है।","इसलिए V और I के बीच संबंध रैखिक नहीं रहता।","इसी कारण V-I ग्राफ उच्च वोल्टेज पर वक्र दिखाई देता है।"]},{"s":"सामान्य विज्ञान","q":"यदि 100 वॉट का बल्ब 10 घंटे तक चलता है, तो खपत की गई ऊर्जा कितनी होगी?","o":["1 kWh","2 kWh","0.5 kWh","10 kWh"],"a":0,"e":["बल्ब की शक्ति 100 W = 0.1 kW है।","ऊर्जा = शक्ति × समय होता है।","अतः ऊर्जा = 0.1 × 10 = 1 kWh ।","इसलिए सही उत्तर 1 किलोवाट-घंटा है।"]},{"s":"सामान्य विज्ञान","q":"भले ही विद्युत उपकरण समान कार्य करते हों, फिर भी उनकी पावर रेटिंग अलग क्यों होती है?","o":["डि”ााइन और दक्षता में अंतर","रंग और आकार में अंतर","केवल संचालन वोल्टेज में अंतर","निर्माण स्थान में अंतर"],"a":0,"e":["पावर रेटिंग उपकरण द्वारा प्रति इकाई समय उपयोग की जाने वाली विद्युत ऊर्जा को दर्शाती है।","समान कार्य करने वाले उपकरणों की डिजाइन अलग हो सकती है।","उनकी दक्षता और ऊर्जा-उपयोग की क्षमता भी अलग होती है।","इसीलिए समान कार्य वाले उपकरणों की पावर रेटिंग अलग हो सकती है।"]},{"s":"सामान्य विज्ञान","q":"धारा-वाहक सीधे चालक के चारों ओर चुंबकीय क्षेत्र की दिशा किस नियम से निर्धारित की जाती है?","o":["दाएँ हाथ का अंगूठा नियम","बाएँ हाथ का अंगूठा नियम","फ्लेमिंग का बाएँ हाथ का नियम","फ्लेमिंग का दाएँ हाथ का नियम"],"a":0,"e":["धारा-वाहक सीधे चालक के चारों ओर चुंबकीय क्षेत्र वृत्ताकार होता है।","दाएँ हाथ का अंगूठा नियम इसकी दिशा निर्धारित करता है।","दाएँ हाथ का अंगूठा धारा की दिशा में रखने पर मुड़ी उँगलियाँ चुंबकीय क्षेत्र की दिशा बताती हैं।"]},{"s":"सामान्य विज्ञान","q":"कौन-सा अवलोकन इस तथ्य का समर्थन करता है कि प्रकीर्णन तरंगदैध्र्य पर निर्भर करता है?","o":["केवल साफ दिनों में नीला आकाश","केवल सूर्यास्त के समय लाल आकाश","केवल प्रदूषित शहरों में सपेफद आकाश","ये सभी"],"a":3,"e":["प्रकाश के प्रकीर्णन की मात्रा उसकी तरंगदैध्र्य पर निर्भर करती है।","नीला आकाश छोटी तरंगदैध्र्य के अधिक प्रकीर्णन को दर्शाता है।","सूर्योदय और सूर्यास्त में लाल रंग का प्रभाव भी प्रकीर्णन से संबंधित है।","प्रदूषित शहरों में बड़े ध्ूल कणों से सभी तरंगदैध्र्य समान रूप से प्रकीर्णित होती हैं (माई प्रकीर्णन), जिससे आकाश सफेद दिखता है।","विभिन्न परिस्थितियों के ये सभी अवलोकन तरंगदैध्र्य-निर्भर प्रकीर्णन को दर्शाते हैं।"]},{"s":"सामान्य विज्ञान","q":"लेंस की कौन-सी विशेषता उसे अपनी आकृति बदलने की अनुमति देती है?","o":["प्रकाशग्राही कोशिकाओं की उपस्थिति","प्रत्यास्थ पदार्थ","दृढ़ कैप्सूल (आवरण)","अपारदर्शी संरचना"],"a":1,"e":["मानव नेत्र का लेंस प्रत्यास्थ प्रकृति का होता है।","सिलियरी मांसपेशियाँ लेंस की वक्रता को बदलती हैं।","इस प्रक्रिया से विभिन्न दूरियों की वस्तुओं पर स्पष्ट प्रतिबिंब बनता है।","इसे समंजन या एकॉमोडेशन कहा जाता है।"]},{"s":"सामान्य विज्ञान","q":"विद्युत धारा, आवेश के प्रवाह की दर होती है। यदि 5 C आवेश 2 सेकंड में प्रवाहित होता है, तो धारा कितनी होगी?","o":["2.5 A","0.4 A","10 A","1 A"],"a":0,"e":["विद्युत धारा का सूत्र I = Q/t होता है।","यहाँ Q = 5 कूलॉम और t = 2 सेकंड है।","अतः I = 5/2 = 2.5 एम्पियर होगा।","इसलिए सही उत्तर 2.5 A है।"]},{"s":"सामान्य विज्ञान","q":"प्रतिरोधकता के बारे में निम्नलिखित में से कौन-सा कथन सही है?","o":["य ॉप हो सकता है।"]},{"s":"सामान्य विज्ञान","q":"एक कंपनी अपनी मासिक बिजली बिल को कम करना चाहती है। सबसे प्रभावी तरीका कौन-सा है?","o":["अधिक पावर वाली मशीनों के संचालन समय को कम करना","सभी उपकरणों को उच्च पावर रेटिंग वाले उपकरणों से बदलना","मशीनों के संचालन घंटे बढ़ाना","उपकरणों का उच्च वोल्टेज पर उपयोग करना"],"a":0,"e":["विद्युत ऊर्जा की खपत E = P × t से निर्धारित होती है।","उच्च शक्ति वाली मशीनों का संचालन समय घटाने से ऊर्जा खपत कम होती है।","उच्च पावर रेटिंग वाले उपकरण सामान्यतः अधिक ऊर्जा खर्च कर सकते हैं।"]},{"s":"सामान्य विज्ञान","q":"दो समकोण प्रिज्मों को उनके कर्ण पर जोड़कर बनाए गए प्रिज्म से गुजरने वाले प्रकाश की विशेषता क्या है?","o":["यह अभिसरण करता है","यह अपसरण करता है","यह आपतित किरण के समानांतर निकलता है","यह ध्रुवित हो जाता है"],"a":2,"e":["समकोण प्रिज्मों में पूर्ण आंतरिक परावर्तन के कारण प्रकाश की दिशा बदली जा सकती है।","उचित व्यवस्था में प्रकाश किरणें समानांतर रूप से निकलती हैं। (अर्थात् यह संयोजन एक आयातकार काँच के स्लैब की तरह व्यवहार करता है)।","यह व्यवस्था प्रकाश की दिशा बदलते हुए किरणों के समानांतर पथ को बनाए रख सकती है।"]},{"s":"सामान्य विज्ञान","q":"एक तारे को नीले रंग में लाल की तुलना में अधिक टिमटिमाते हुए देखा जाता है। इसका सबसे अच्छा कारण क्या है?","o":["नीला प्रकाश कम प्रकीर्णित होता है","छोटी तरंगदैध्र्य वायुमंडल की सूक्ष्म असमानताओं से अधिक अपवर्तित होती हैं","नीले फोटॉन कम होते हैं","लाल अधिक चमकीला होता है"],"a":1,"e":["वायुमंडल की सूक्ष्म असमानताएँ विभिन्न तरंगदैध्र्यों को अलग-अलग प्रभावित करती हैं।","छोटी तरंगदैध्र्य का प्रकाश अपवर्तन में अधिक परिवर्तन अनुभव करता है।","नीले प्रकाश का तरंगदैध्र्य लाल प्रकाश से कम होता है।","इसलिए नीला प्रकाश अधिक टिमटिमाता हुआ दिखाई दे सकता है।"]},{"s":"सामान्य विज्ञान","q":"यदि वायुमंडलीय अपवर्तन तरंगदैध्र्य से स्वतंत्र होता, तो क्या होता?","o":["तारे टिमटिमाना बंद कर देते","सूर्योदय अभी भी पहले होता, लेकिन कोई वर्णक्रमीय पृथक्करण नहीं होता","इंद्रधनुष का निर्माण अप्रभावित रहता","आकाश हरा दिखाई देता"],"a":1,"e":["वायुमंडलीय अपवर्तन का प्रभाव केवल तरंगदैध्र्य पर निर्भर नहीं होता।","यदि यह तरंगदैध्र्य-स्वतंत्र हो, तो रंगों के बीच अपवर्तन का अंतर समाप्त हो जाएगा।","सूर्योदय का अग्रिम दिखाई देना वायुमंडलीय अपवर्तन के कारण फिर भी बना रहेगा।"]},{"s":"सामान्य विज्ञान","q":"नेत्रगोलक की कौन-सी परत रेटिना को पोषण देती है और बिखरी हुई प्रकाश किरणों को अवशोषित करती है?","o":["स्क्लेरा","कोरॉइड","कॉर्निया","आइरिस 87"],"a":1,"e":["कोरॉइड नेत्रगोलक की रक्त वाहिकाओं से समृद्ध मध्य परत है।","यह रेटिना को आवश्यक पोषक तत्व और ऑक्सीजन पहुँचाने में सहायता करती है।","इसमें मेलेनिन वर्णक होता है जो अतिरिक्त प्रकाश को अवशोषित करता है।","इससे आँख के भीतर प्रकाश के अनावश्यक परावर्तन को कम किया जाता है।"]},{"s":"सामान्य विज्ञान","q":"फोविया के बारे में निम्नलिखित में से कौन-सा कथन गलत है?","o":["इसमें केवल शंकु कोशिकाएँ होती हैं","यह सबसे तीव्र दृष्टि वाला क्षेत्र है","यह सीधे ऑप्टिक तंत्रिका के माध्यम से संकेत भेजता है","यह रेटिना में एक अवनति (गडढा / Depression ) है"],"a":2,"e":["फोविया रेटिना का वह भाग है जहाँ दृष्टि की तीक्ष्णता सर्वाधिक होती है।","इसमें मुख्यतः शंकु कोशिकाएँ अत्यधिक सघन होती हैं।","फोविया में प्राप्त संकेत पहले रेटिनल न्यूरॉनों (बाइपोलर कोशिकाओं) द्वारा संसाधित होते हैं। फिर वे ऑप्टिक तंत्रिका तक जाते हैं।"]},{"s":"सामान्य विज्ञान","q":"उच्च प्रतिरोधकता के कारण ताप तत्व बनाने के लिए निम्नलिखित में से किस पदार्थ का सामान्यतः उपयोग किया जाता है?","o":["तांबा","एल्युमिनियम","नाइक्रोम","चाँदी"],"a":2,"e":["नाइक्रोम निकल और क्रोमियम का मिश्रधातु है। इसके अलावा इसमें अक्सर लोहा और मैगनीज भी मिलाया जाता है।","इसकी विद्युत प्रतिरोधकता अपेक्षाकृत अधिक होती है।","धारा प्रवाहित होने पर यह पर्याप्त ऊष्मा उत्पन्न करता है।","इसी कारण हीटर, टोस्टर और अन्य ताप उपकरणों में इसका उपयोग किया जाता है।"]},{"s":"सामान्य विज्ञान","q":"श्रेणीक्रम परिपथ में यदि एक प्रतिरोधक हटा दिया जाए, तो कुल प्रतिरोध क्या होगा?","o":["बढ़ेगा","घटेगा","समान रहेगा","शून्य हो जाएगा"],"a":1,"e":["श्रेणीक्रम परिपथ में कुल प्रतिरोध सभी प्रतिरोधकों के योग के बराबर होता है। (R = R +R + ...) । 1 2","एक प्रतिरोधक हटाने पर योग में उस प्रतिरोध का योगदान समाप्त हो जाता है।","इसलिए कुल प्रतिरोध का मान कम हो जाता है।","यदि परिपथ खुला हो जाए तो धारा रुक सकती है, लेकिन प्रतिरोधों के योग की दृष्टि से शेष प्रतिरोध घटता है।"]},{"s":"सामान्य विज्ञान","q":"विद्युत मोटर में आर्मेचर क्या होता है?","o":["स्थिर भाग","घूमने वाला भाग","शक्ति स्रोत","चुंबकीय क्षेत्र"],"a":1,"e":["आर्मेचर विद्युत मोटर का वह भाग है जिसमें कुंडली स्थित होती है।","चुंबकीय क्षेत्र में धारा के कारण इस पर बल लगता है।","यह बल आर्मेचर को घुमाने के लिए टॉर्क उत्पन्न करता है।","इसलिए सामान्य डीसी मोटर में आर्मेचर घूमने वाला भाग होता है।"]},{"s":"सामान्य विज्ञान","q":"डीसी जनरेटर में स्प्लिट-रिंग कम्यूटेटर का कार्य क्या है?","o":["एसी को डीसी में बदलना","धारा की दिशा को उलटना","धारा की दिशा बनाए रखना","वोल्टेज बढ़ाना"],"a":2,"e":["कम्यूटेटर आर्मेचर में उत्पन्न प्रत्यावर्ती धारा को बाहरी परिपथ में एकदिशीय बनाता है।","यह प्रत्येक आधे चक्र में कुंडली के संपर्कों को बदलता है।","इससे बाहरी परिपथ में धारा की दिशा एक ही बनी रहती है।","इसी कारण इसे डीसी जनरेटर का यांत्रिक दिष्टकारी कहा जाता है।"]},{"s":"सामान्य विज्ञान","q":"मानव आँख की रेटिना में शंकु (Cones) और दंड (Rods) कोशिकाएँ क्रमशः किसके प्रति संवेदनशील होती हैं?","o":["रंग और तीव्रता","तीव्रता और रंग","चमक और अंधकार","लाल रंग और बैंगनी रंग"],"a":0,"e":["शंकु कोशिकाएँ मुख्यतः रंगों और तीव्र प्रकाश में दृष्टि के लिए जिम्मेदार होती हैं।","दंड कोशिकाएँ कम प्रकाश में दृष्टि के लिए अधिक संवेदनशील होती हैं।","इसलिए शंकु रंगों की पहचान में और दंड प्रकाश की तीव्रता में महत्वपूर्ण हैं।"]},{"s":"सामान्य विज्ञान","q":"सामान्य व्यक्ति के लिए दृष्टि की स्थायित्व अवधि और श्रवण की स्थायित्व अवधि क्रमशः कितनी होती है?","o":["1/40 सेकंड और 1/10 सेकंड","1/10 सेकंड और 1/16 सेकंड","1/16 सेकंड और 1/10 सेकंड","1/10 सेकंड और 1/14 सेकंड"],"a":2,"e":["दृष्टि की स्थायित्व अवधि लगभग 1/16 सेकंड मानी जाती है।","श्रवण की स्थायित्व अवधि लगभग 1/10 सेकंड मानी जाती है।","इसी कारण तेज गति से बदलते दृश्य निरंतर दिखाई दे सकते हैं।"]},{"s":"सामान्य विज्ञान","q":"दृष्टि दोषों को सुधारने के लिए उपयोग किया जाने वाला लेंस सूत्र कौन-सा है? 88","o":["1/f = 1/v + 1/u","1/f = 1/u − 1/v","1/f = 1/v − 1/u","1/f = −(1/v + 1/u)"],"a":2,"e":["कार्तीय संकेत परिपाटी में पतले लेंस का सूत्र 1/f = 1/v − 1/u होता है।","यह सूत्र वस्तु-दूरी, प्रतिबिंब-दूरी और फोकस दूरी के बीच संबंध बताता है।","दृष्टि दोषों में प्रयुक्त सुधारात्मक लेंस के लिए इसी लेंस सूत्र का उपयोग किया जाता है।"]},{"s":"सामान्य विज्ञान","q":"45° के आपतन कोण पर μ = 1.5 की आयताकार काँच की पट्टी में प्रवेश करने वाली किरण बाहर निकलने पर कैसी होगी?","o":["आपतित किरण के समानांतर, पाश्र्व विस्थापित","आपतित किरण के लंबवत","30° पर निर्गत","पट्टी से अविचलित निर्गत"],"a":0,"e":["आयताकार काँच की पट्टी की विपरीत सतहें समानांतर होती हैं।","अतः बाहर निकलने वाली किरण आपतित किरण के समानांतर होती है।","हालाँकि अपवर्तन के कारण किरण का पाश्र्व विस्थापन होता है।"]},{"s":"सामान्य विज्ञान","q":"प्रतिरोधक के V-I ग्राफ में उच्च वोल्टेज पर धारा कम तेजी से बढ़ने का कारण क्या है?","o":["तापमान के साथ प्रतिरोधकता बढ़ती है","वोल्टेज के साथ क्रॉस सेक्शन बदलता है","बैटरी आदर्श नहीं है","चालक आयनित हो जाता है"],"a":0,"e":["धात्विक प्रतिरोधक में धारा बढ़ने पर ऊष्मा (I2R) उत्पन्न होती है।","तापमान बढ़ने से धातु की प्रतिरोधकता सामान्यतः बढ़ती है।","इससे प्रतिरोध बढ़ता है और V-I संबंध सीधी रेखा से विचलित हो सकता है।"]},{"s":"सामान्य विज्ञान","q":"एक उत्तल लेंस पर्दे पर वास्तविक प्रतिबिंब बनाता है। वस्तु को लेंस के थोड़ा और पास ले जाने पर क्या होगा?","o":["प्रतिबिंब आभासी हो जाएगा","प्रतिबिंब का आकार घटेगा","प्रतिबिंब दूर चला जाएगा और आवर्धन बढ़ जाएगा","प्रतिबिंब अपरिवर्तित रहेगा"],"a":2,"e":["वास्तविक प्रतिबिंब की स्थिति में वस्तु को लेंस की ओर लाने पर, जब तक वह फोकस से बाहर है, प्रतिबिंब दूसरी ओर दूर जाता है।","इस स्थिति में रैखिक आवर्धन का परिमाण भी बढ़ता है।","वस्तु फोकस के निकट आने पर प्रतिबिंब बहुत दूर जा सकता है।"]},{"s":"सामान्य विज्ञान","q":"चुंबकीय क्षेत्र में चालक की लंबाई दोगुनी कर दी जाए तो बल पर क्या प्रभाव पड़ेगा?","o":["बल आधा हो जाता है","बल दोगुना हो जाता है","बल अपरिवर्तित रहता है","बल शून्य हो जाता है"],"a":1,"e":["धारा-वाहक चालक पर चुंबकीय बल F = BIL sinθ होता है।","यदि B, I और θ समान रहें तो बल चालक की लंबाई L के समानुपाती होता है।","लं कस दूरी ज्ञात कीजिए।","o":["24 सेमी","18 सेमी","12 सेमी","36 सेमी"],"a":0,"e":["लेंस निर्माता सूत्र 1/f = (n−1)(1/R − 1/ 1 R ) होता है। 2","समतल सतह के लिए वक्रता त्रिजया अनंत (R = ∞ ) होती है, इसलिए 1/R = 0 । 2 2","सूत्र में मान रखने पर 1/f = (1.5 – 1) (1/12 – 0) = 0.5 × (1/12) = 0.5/12","अतः f = 12/0.5 = 24 सेमी प्राप्त होता है।"]},{"s":"सामान्य विज्ञान","q":"एक अवतल दर्पण वस्तु का आभासी प्रतिबिंब बनाता है जो वस्तु से 3 गुना बड़ा है। यदि वस्तु की दूरी 10 सेमी है, तो फोकस दूरी ज्ञात कीजिए।","o":["13.33 सेमी","15 सेमी","12.5 सेमी","14 सेमी"],"a":1,"e":["आभासी प्रतिबिंब के लिए आवध्र्न धनात्मक (m = +3) होता है।","आवध्र्न सूत्र m = –v/u में u = –10 सेमी रखने परः 3 = –v/(–10) ⇒ v = +30 सेमी।","दर्पण सूत्र 1/f = 1/v + 1/u सेः","1/f = 1/30 + 1/(–10) = 1/30 – 1/10 = (1 – 3)/30 = –2/30","अतः f = –15 सेमी प्राप्त होता है (जिसका परिमाण 15 सेमी है)।"]},{"s":"सामान्य विज्ञान","q":"तारों का टिमटिमाना किस कारण होता है?","o":["विक्षेपण","वायुमंडल द्वारा अपवर्तन","प्रकीर्णन","धूल द्वारा विवर्तन"],"a":1,"e":["तारों का प्रकाश पृथ्वी के वायुमंडल की विभिन्न घनत्व वाली परतों से होकर गुजरता है।","इन परतों में प्रकाश का अपवर्तन बार-बार बदलता रहता है।","इससे तारे की आभासी चमक और स्थिति में तीव्र परिवर्तन दिखाई देता है।","इसी घटना को तारों का टिमटिमाना कहा जाता है।"]},{"s":"सामान्य विज्ञान","q":"समान लंबाई वाले लेकिन विभिन्न पदार्थों के दो तारों का प्रतिरोध अलग-अलग होता है क्योंकिः","o":["अनुप्रस्थ काट क्षेत्र में परिवर्तन","पदार्थों की प्रतिरोधकता भिन्न होती है","लंबाई में परिवर्तन","तापमान अलग होता है"],"a":1,"e":["प्रतिरोध का सूत्र R = ρL/A है।","समान लंबाई और समान अनुप्रस्थ क्षेत्रफल पर प्रतिरोध मुख्यतः प्रतिरोधकता पर निर्भर करता है।","विभिन्न पदार्थों की प्रतिरोधकता अलग-अलग होती है।","इसी कारण समान आकार के तारों का प्रतिरोध अलग हो सकता है।"]},{"s":"सामान्य विज्ञान","q":"विद्युत मोटर किस प्रकार की ऊर्जा को किस अन्य प्रकार में परिवर्तित करती है?","o":["विद्युत ऊर्जा को यांत्रिक ऊर्जा में","यांत्रिक ऊर्जा को विद्युत ऊर्जा में","विद्युत ऊर्जा को रासायनिक ऊर्जा में","रासायनिक ऊर्जा को विद्युत ऊर्जा में"],"a":0,"e":["विद्युत मोटर विद्युत ऊर्जा को यांत्रिक ऊर्जा में बदलती है।","यह चुंबकीय क्षेत्र में धारा-वाहक चालक पर लगने वाले बल के सिद्धांत पर काम करती है।","मोटर में विद्युत ऊर्जा के कारण कुंडली घूमती है।","जनरेटर इसके विपरीत यांत्रिक ऊर्जा को विद्युत ऊर्जा में बदलता है।"]},{"s":"सामान्य विज्ञान","q":"यदि क्षितिज पर वायुमंडलीय अपवर्तन 34 94 आर्कमिनट है, तो सूर्योदय का अनुमानित अग्रिम समय कितना होगा? पृथ्वी 15° प्रति घंटे घूमती है।","o":["2 मिनट","10 मिनट","30 सेकंड","1 घंटा"],"a":0,"e":["34 आर्कमिनट लगभग 0.567° के बराबर है। (चूँकि 1° = 60 आर्वफमिनट)।","पृथ्वी 15° प्रति घंटे (यानि 60 मिनट में 15° ) की दर से घूमती है।","इसका अर्थ है कि पृथ्वी को 1° घूमने में 60/15 = 4 मिनट लगते हैं।","अतः 0.567° घूमने में लगने वाला समय = 0.567 × 4 = 2.268 मिनट।","यह लगभग 2.27 मिनट है, इसलिए निकटतम विकल्प 2 मिनट है।"]},{"s":"सामान्य विज्ञान","q":"विद्युत चुम्बक में कोर पदार्थ के रूप में नरम लोहे का उपयोग करने का मुख्य कारण क्या है?","o":["उच्च चुंबकीय पारगम्यता","उच्च गलनांक","कम प्रतिरोध","उच्च घनत्व"],"a":0,"e":["नरम लोहे की चुंबकीय पारगम्यता बहुत अधिक होती है।","इससे बाहरी चुंबकीय क्षेत्र के कारण यह आसानी से चुंबकित हो जाता है।","क्षेत्र हटाने पर इसका अवशिष्ट चुंबकत्व कम रहता है।","इसलिए विद्युत चुम्बकों के कोर के लिए नरम लोहा उपयुक्त है।"]},{"s":"सामान्य विज्ञान","q":"यदि किसी व्यक्ति की आँख का लेंस कम लचीला हो जाता है, तो इस दृष्टि दोष को क्या कहा जाता है?","o":["निकट दृष्टि दोष","दूर दृष्टि दोष","प्रेसबायोपिया (जरा दृष्टि दोष)","अबिंदुकता"],"a":2,"e":["उम्र बढ़ने के साथ आँख के लेंस की समंजन क्षमता कम हो सकती है।","इससे पास की वस्तुओं पर स्पष्ट फोकस करना कठिन होता है।","इस अवस्था को प्रेसबायोपिया या जरा दृष्टि दोष कहते हैं।"]},{"s":"सामान्य विज्ञान","q":"एक पतले समतल-अवतल लेंस की एक सतह की त्रिज्या R = -20 सेमी और अपवर्तनांक n = 1.6 है। इसकी फोकस दूरी क्या होगी?","o":["–10 सेमी","–33.33 सेमी","–15 सेमी","–20 सेमी"],"a":1,"e":["लेंस निर्माता सूत्रः 1/f = (n−1)(1/R − 1 1/R )। 2","समतल सतह के लिए R = ∞ होता है, 2 इसलिए 1/R = 0 । 2","1/f = 0.6 × (1/−20) = −0.03, अतः f ≈ −33.3 सेमी बनता है।"]},{"s":"सामान्य विज्ञान","q":"एक उत्तल लेंस आभासी प्रतिबिंब उत्पन्न करता है, जबः","o":["वस्तु अनंत पर हो","वस्तु वक्रता केंद्र पर हो","वस्तु फोकस और अनंत के बीच हो","वस्तु f और लेंस के बीच हो"],"a":3,"e":["उत्तल लेंस में वस्तु को फोकस और प्रकाशिक केंद्र के बीच रखने पर आभासी प्रतिबिंब बनता है।","यह प्रतिबिंब सीधा और सामान्यतः आवर्धित होता है।","वस्तु को f से बाहर रखने पर सामान्यतः वास्तविक प्रतिबिंब बनता है।"]},{"s":"सामान्य विज्ञान","q":"एक परिपथ में वोल्टमीटर दो बिंदुओं के बीच शून्य विभवांतर दर्शाता है, फिर भी उनके बीच धारा प्रवाहित हो रही है। यह किस स्थिति में संभव है?","o":["वे बिंदु शॉर्ट किए गए हैं","परिपथ खुला है","वोल्टमीटर श्रेणीक्रम में है","जोड़ने वाला प्रतिरोध बहुत अधिक है"],"a":0,"e":["शॉर्ट सर्किट (Short Circuit) में दो बिंदुओं को एक आदर्श तार (जिसका प्रतिरोध शून्य हो) से जोड़ दिया जाता है, जिससे उनका विभव लगभग समान होता है।","इसलिए उनके बीच विभवांतर शून्य के निकट हो सकता है।","बहुत कम प्रतिरोध के कारण उस शाखा में बड़ी धारा प्रवाहित हो सकती है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से किस स्थिति में किसी चालक का प्रतिरोध शून्य हो सकता है?","o":["परम शून्य तापमान पर","कक्ष तापमान पर","उच्च तापमान पर","निर्वात में"],"a":0,"e":["अतिचालकता में पदार्थ का विद्युत प्रतिरोध शून्य हो सकता है।","यह स्थिति पदार्थ के व्रफांतिक तापमान से नीचे प्राप्त होती है।","प्रश्न के दिए विकल्पों में परम शून्य सबसे उपयुक्त है, लेकिन वास्तविक अतिचालकता हमेशा ठीक 0 K पर ही नहीं होती।"]},{"s":"सामान्य विज्ञान","q":"खगोलशास्त्र में वायुमंडलीय टिमटिमाहट/ विक्षोभ को सुधारने के लिए कौन-सी तकनीक उपयोगी है?","o":["साधारण लेंस","एडेप्टिव ऑप्टिक्स","प्रिज्म","पोलारिमीटर"],"a":1,"e":["पृथ्वी का वायुमंडल दूरबीन से प्राप्त प्रकाश में विक्षोभ पैदा करता है। 95","एडेप्टिव ऑप्टिक्स दर्पण/ऑप्टिकल प्रणाली को वास्तविक समय में समायोजित कर सकती है।","इससे तारों और अन्य खगोलीय पिंडों की छवि अधिक स्पष्ट होती है।"]},{"s":"सामान्य विज्ञान","q":"रेले प्रकीर्णन गणितीय रूप से किसके अनुपाती होता है?","o":["1/λ","1/λ2","1/λ4","λ2"],"a":2,"e":["रेले प्रकीर्णन में छोटी तरंगदैध्र्य का प्रकाश अधिक प्रकीर्णित होता है।","आदर्श परिस्थितियों में प्रकाश के प्रकीर्णन की तीव्रता (I) लगभग तरंगदैध्र्य की चौथी घात के व्युत्क्रमानुपाती (I × 1/ λ 4) होती है।","इसी कारण नीला प्रकाश लाल प्रकाश की तुलना में अधिक प्रकीर्णित होता है।"]},{"s":"सामान्य विज्ञान","q":"वायुमंडल की अनुपस्थिति में चंद्रमा से देखा गया आकाश किस रंग का दिखाई देगा?","o":["नीला","काला","लाल","सपेफद"],"a":1,"e":["नीला आकाश पृथ्वी के वायुमंडल में सूर्य के प्रकाश के प्रकीर्णन के कारण दिखाई देता है।","चंद्रमा के पास पृथ्वी जैसा घना वायुमंडल नहीं है।","इसलिए प्रकाश का व्यापक वायुमंडलीय प्रकीर्णन नहीं होता।","अतः आकाश काला दिखाई देता है।"]},{"s":"सामान्य विज्ञान","q":"लंबाई L और द्रव्यमान M वाली एक पतली छड़ को इसकी लंबाई के लंबवत अक्ष के चारों ओर और इसके केंद्र से होकर घुमाया जाता है। इसका जड़त्व आघूर्ण क्या है?","o":["1/3 ML2","1/12 ML2","1/2 ML2","ML2"],"a":1,"e":["पतली एकसमान छड़ का जड़त्व आघूर्ण, उसकी लंबाई के लंबवत तथा द्रव्यमान-केंद्र से गुजरने वाले अक्ष के परितः, I = ML2/12 होता है।","यदि वही अक्ष छड़ के एक सिरे से होकर गुजरे तो जड़त्व आघूर्ण I = ML2/3 हो जाता है।","दोनों में समांतर-अक्ष प्रमेय द्वारा संबंध हैः ML2/12 + M(L/2)2 = ML2/3 ।","जड़त्व आघूर्ण द्रव्यमान तथा अक्ष से दूरी के वर्ग के वितरण पर निर्भर करता है, अतः अक्ष बदलने पर इसका मान बदल जाता है।"]},{"s":"सामान्य विज्ञान","q":"विशिष्ट ऊष्मा धारिता की SI इकाई ______ है।","o":["J/K","J/kg·K","N/kg·K","cal/g·K"],"a":1,"e":["विशिष्ट ऊष्मा धारिता किसी पदार्थ के 1 किलोग्राम द्रव्यमान का ताप 1 केल्विन बढ़ाने हेतु आवश्यक ऊष्मा की मात्रा है।","सूत्र Q = mcΔT से c = Q/(mΔT), अतः इसका SI मात्रक जूल प्रति किलोग्राम प्रति केल्विन ( J/kg·K) होता है।","J/K ऊष्मा धारिता ( heat capacity) का मात्रक है, विशिष्ट ऊष्मा धारिता का नहीं।","cal/g·K एक व्यावहारिक CGS मात्रक है ; जल की विशिष्ट ऊष्मा धारिता लगभग 4186 J/kg·K है।"]},{"s":"सामान्य विज्ञान","q":"किसी पदार्थ का तापीय प्रतिरोध हैः","o":["क्षेत्रफल के अनुक्रमानुपाती","मोटाई के व्युत्क्रमानुपाती","मोटाई के अनुक्रमानुपाती","तापीय चालकता से स्वतंत्र"],"a":2,"e":["तापीय प्रतिरोध का सूत्र R = L/(kA) है, जहाँ L मोटाई, k तापीय चालकता तथा A अनुप्रस्थ काट का क्षेत्रफल है।","इस सूत्र से स्पष्ट है कि तापीय प्रतिरोध मोटाई ( L) के अनुक्रमानुपाती होता है।","यह क्षेत्रफल ( A) तथा तापीय चालकता ( k) दोनों के व्युत्क्रमानुपाती होता है, अतः विकल्प 1, 2 और 4 गलत हैं।","इसका SI मात्रक केल्विन प्रति वाट ( K/W) है ; यही कारण है कि मोटी दीवारें बेहतर ऊष्मारोधी सिद्ध होती हैं।"]},{"s":"सामान्य विज्ञान","q":"दो प्रतिरोधक, 3 Ω और 6 Ω, समांतर क्रम में जुड़े हुए हैं। उनका तुल्य प्रतिरोध क्या है?","o":["1 Ω","2 Ω","9 Ω","4.5 Ω"],"a":1,"e":["समांतर क्रम संयोजन में तुल्य प्रतिरोध का सूत्र हैः 1/R = 1/R + 1/R । 1 2","मान रखने पर 1/R = 1/3 + 1/6 = 2/6 + 1/6 = 3/6 = 1/2 ।","अतः तुल्य प्रतिरोध R = 2 ओम प्राप्त होता है।","समांतर संयोजन में तुल्य प्रतिरोध सदैव सबसे छोटे प्रतिरोध (यहाँ 3 Ω) से भी कम होता है, जो इस उत्तर की पुष्टि करता है।"]},{"s":"सामान्य विज्ञान","q":"पृथ्वी के गुरुत्वाकर्षण के कारण चंद्रमा का त्वरण पृथ्वी की सतह पर गुरुत्वाकर्षण के कारण त्वरण से काफी कम क्यों है?","o":["क्योंकि चंद्रमा का कोई द्रव्यमान नहीं है","क्योंकि चंद्रमा की गति से बल कम हो जाता है","क्योंकि गुरुत्वाकर्षण बल दूरी के साथ व्युत्क्रम-वर्ग नियम का पालन करता है","क्योंकि गुरुत्वाकर्षण परिक्रमा करने वाले पिंडों पर कार्य नहीं करता"],"a":2,"e":["न्यूटन के सार्वत्रिक गुरुत्वाकर्षण नियम के अनुसार बल दूरी के वर्ग के व्युत्क्रमानुपाती होता है ( F ∝ 1/r2 )।","चंद्रमा पृथ्वी के केंद्र से लगभग 60 पृथ्वी-त्रिज्या दूर है। 96","इसलिए वहाँ त्वरण लगभग g/3600 अर्थात् केवल 0.0027 m/s2 रह जाता है।","अतः कारण व्युत्क्रम-वर्ग नियम है"]},{"s":"सामान्य विज्ञान","q":"यदि एक तांबे के तार को बींचकर उसकी मूल लंबाई से दोगुना कर दिया जाता है, तो उसका प्रतिरोध ______ हो जाता है।","o":["दोगुना","आधा","चार गुना","एक-चौथाई"],"a":2,"e":["तार खींचने पर उसका आयतन अपरिवर्तित रहता है, अतः लंबाई दोगुनी होने पर अनुप्रस्थ काट (क्षेत्रफल) आधी हो जाती है।","प्रतिरोध R = ρL/A के अनुसार L दोगुना और A आधा होने से R चार गुना हो जाता है।","सामान्य सूत्र के रूप में R ∝ L2 , अर्थात् लंबाई n गुनी करने पर प्रतिरोध n2 गुना।","अतः सही उत्तर विकल्प 3 ( चार गुना) है।"]},{"s":"सामान्य विज्ञान","q":"द्रव में वस्तु के भार में होने वाली आभासी कमी निम्नलिखित के कारण होती हैः","o":["कम गुरुत्वाकर्षण","ऊपर की ओर लगने वाला उत्प्लावन बल","आंतरिक प्रतिरोध","पृष्ठ तनाव"],"a":1,"e":["द्रव में डूबी वस्तु पर ऊपर की ओर उत्प्लावन ( buoyant) बल कार्य करता है।","आर्किमिडी”ा के सिद्धांत के अनुसार यह बल वस्तु द्वारा हटाए गए द्रव के भार के बराबर होता है।","इसी कारण वस्तु का भार कम प्रतीत होता है, यद्यपि उसका वास्तविक द्रव्यमान नहीं बदलता।"]},{"s":"सामान्य विज्ञान","q":"चुंबकीय क्षेत्र के भीतर गतिशील चालक में ईएमएफ (विद्युत वाहक बल) उत्पादन के लिए जिम्मेदार बल का स्रोत क्या है?","o":["छड़ के सिरों के बीच विद्युत क्षेत्र","कूलॉम प्रतिकर्षण","मुक्त आवेशों पर लोरेंत”ा बल","आवेशों पर कार्य करने वाला गुरुत्वाकर्षण बल"],"a":2,"e":["चुंबकीय क्षेत्र में चालक के गतिशील होने पर उसके मुक्त इलेक्ट्रॉन भी उसी वेग से चलते हैं।","इन गतिशील आवेशों पर F = q(v × B) के अनुसार लोरेंत”ा बल कार्य करता है।","यह बल आवेशों को चालक के एक सिरे की ओर धकेलता है, जिससे विभवांतर अर्थात् गति-प्रेरित विद्युत वाहक बल उत्पन्न होता है।"]},{"s":"सामान्य विज्ञान","q":"एक गैस के नमूने को 600 K से 300 K तक ठंडा किया जाता है। इसके अणुओं की औसत गतिज ऊर्जा में क्या परिवर्तन होता है?","o":["दोगुना हो जाता है","आधा","√2 से बढ़ता है","√2 से घटता है"],"a":1,"e":["गैस के अणुओं की औसत गतिज ऊर्जा E = (3/2)kT होती है।","अर्थात् यह परम ताप के सीधे समानुपाती है।","ताप 600 K से घटकर 300 K अर्थात् आधा होने पर औसत गतिज ऊर्जा भी आधी रह जाएगी।","(अणुओं की औसत चाल √2 गुना घटेगी, ऊर्जा नहीं)"]},{"s":"सामान्य विज्ञान","q":"बिंदु द्विध्रुव (डाइपोल) वास्तविक द्विध्रुव (डाइपोल) का एक सीमित मामला है जिसमेंः","o":["q→0 और 2a→∞","q→∞, 2a→0, परंतु p=q·2a परिमित","q→∞ और 2a→∞","q→0, 2a→0, और p=0"],"a":1,"e":["वास्तविक द्विध्रुव में दो विपरीत आवेश रू q व −q एक अल्प दूरी 2a पर होते हैं।","बिंदु द्विध्रुव उसकी वह आदर्श सीमा है जिसमें दूरी 2a शून्य की ओर तथा आवेश q अनंत की ओर जाता है।","इस प्रक्रिया में द्विध्रुव आघूर्ण p = q × 2a का मान परिमित बना रहता है।"]},{"s":"सामान्य विज्ञान","q":"यदि किसी तार में धारा दोगुनी कर ½MR2 वाला मान चक्रिका (डिस्क) के लिए होता है"]},{"s":"सामान्य विज्ञान","q":"यदि समतल शीट का पृष्ठ आवेश घनत्व दोगुना कर दिया जाए, तो उसके निकट विद्युत क्षेत्र पर क्या प्रभाव पड़ेगा?","o":["दोगुना हो जाता है","आधा हो जाता है","वैसा ही रहता है","शून्य हो जाता है"],"a":0,"e":["अनंत समतल आवेशित शीट के निकट विद्युत क्षेत्र E = σ/(2ε ) होता है। 0","विद्युत क्षेत्र पृष्ठ आवेश घनत्व σ के अनुक्रमानुपाती है।","σ को दोगुना करने पर E भी दोगुना हो जाता है।","आदर्श अनंत शीट के लिए यह क्षेत्र दूरी पर निर्भर नहीं करता।"]},{"s":"सामान्य विज्ञान","q":"ध्वनि तरंग में संपीड़न क्षेत्र किससे संबद्ध होता है?","o":["माध्यम के लोच में वृद्धि","कणों का कम घनत्व","उच्च दाब","कणों का कोई विस्थापन नहीं होना"],"a":2,"e":["ध्वनि एक अनुदैघ्र्य यांत्रिक तरंग है।","संपीड़न में माध्यम के कण पास-पास आते हैं।","इससे घनत्व और दाब अधिक हो जाते हैं।","विरलन क्षेत्र में घनत्व और दाब कम होते हैं।"]},{"s":"सामान्य विज्ञान","q":"जब कोई चुम्बक किसी कुंडली के निकट आता है तो लें”ा के नियम के अनुसार कौन-सा बल उत्पन्न होता है?","o":["अभिकेन्द्रीय बल","स्थिरविद्युत आकर्षण","प्रतिकर्षी चुंबकीय बल","गुरुत्वाकर्षण खिंचाव"],"a":2,"e":["लें”ा का नियम कहता है कि प्रेरित धारा अपने उत्पन्न होने के कारण का विरोध करती है।","चुम्बक कुंडली की ओर आने पर कुंडली उसके सम्मुख समान ध्रुव उत्पन्न करती है।","समान ध्रुवों के कारण प्रतिकर्षी चुंबकीय बल उत्पन्न होता है।","यह ऊर्जा संरक्षण के सिद्धांत के अनु:प है।"]},{"s":"सामान्य विज्ञान","q":"निम्नलिखित में से कौन-सा पदार्थ गैर-ओमिय है?","o":["ताँबा","चाँदी","नाइक्रोम","डायोड"],"a":3,"e":["ओमिय पदार्थ स्थिर ताप पर ओम के नियम का पालन करते हैं।","उनके V-I ग्राफ का स्व:प सरल रेखीय होता है।","डायोड का V-I ग्राफ वक्र होता है।","इसलिए डायोड एक गैर-ओमिय युक्ति है।"]},{"s":"सामान्य विज्ञान","q":"कार्य की SI इकाई क्या है?","o":["वाट","न्यूटन","जूल","अर्ग"],"a":2,"e":["कार्य = बल × बल की दिशा में विस्थापन।","SI पद्धति में बल की इकाई न्यूटन और विस्थापन की मीटर है।","एक न्यूटन-मीटर को एक जूल कहा जाता है।","जूल कार्य और ऊर्जा दोनों की SI इकाई है।"]},{"s":"सामान्य विज्ञान","q":"कोई वस्तु ऊपर की ओर पें
